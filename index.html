كان وجد حين غزا أرضَ الهند في سنة سبع وأربع مئة فيما فتح من بلادها في المدينة المعروفة بمتهورة في أحد بيوت أصنامها خمسة أصنام مصوغة من الذهب زِنةُ كلّ واحد منها أحد عشر رطلاً عن قيمة مئة ألف دينار مرصّعة الجوارح في أنواع الجوهر ونفيس الياقوت التي لا قدر لها، من جملتها قطع ياقوتٍ رمّانّي اللون، وأحمر، وزنها ست مئة مثقال .","tags":["الجوهر","الغرائب"],"partial":0,"sp":21,"kind":"prose","spLabel":"ووجد في دار نحرير الأَرغلي… … وكان قد ورد مع غرس الدولة …"},{"id":"b7-83","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨٣","topic":"الغرائب والذخائر","loc":307,"text":"ولما نَهَبَ الملك جلال الدولة أبو طاهر بن بهاءِ الدولة أبي نصر بن عضد الدولة بن أبي شجاع بن ركن الدولة أبي علي الحسن بن بُوَيه الديلمي، الأهواز في سنة إحدى وعشرين وأربع مئة، وَجَدَ بها لابن أخيه الملك أبي كاليجار المرزبان بن سلطان الدولة ابن بهاء الدولة، فصَّ ياقوت أحمر يعرف بالجبل وزنه أربعة عشر درهماً، ونملةً في حلقها سلسلة تأْكل في كل يوم رطلي لحم بالبغدادي، وحماراً عتّابياً خلقة جسده كخلقة العتّابي .وانتقل إلى الخلفاء الفاطميّين بمصر من بني العّباس الفصّ الحافر وهو من ياقوت أحمر وزنه سبعة دراهم .وحدّثني التاجي مولى تاج الدولة أبي الفتوح يوسف بن أبي الحسين ببلبيس أن مولاه تاج الدولة باع من ملة ما سَلِم معه من متاعه، بعدما نُهب بصقلية حين ورد إلى مصر، فصّاً على صفة الجبل من الياقوت الأحمر وزنه سبعة دراهم، كان شراؤه عليه وهو بصقلية أحد عشر ألف دينار. ثم اشتراه الظاهرُ لإِعزاز دين الله بأربعة آلاف دينار .","tags":[],"partial":0,"sp":21,"kind":"prose","spLabel":"ووجد في دار نحرير الأَرغلي… … وكان قد ورد مع غرس الدولة …"},{"id":"b7-84","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨٤","topic":"الغرائب والذخائر","loc":308,"text":"وكان قد ورد مع غرس الدولة الحاكميّة أبي إسحاق بن معزّ الدولة بن بويه درّتان وزنهما ثلاثة دراهم غاية في الحسن، وكان رهنهما عند بعض التّجار المصريين، وطالت المدة عليهما إلى أن ولى علّي بن أحمد الجرجرائي الوزارة في أيام الظاهر لإعزاز دين الله، فأجهد نفسه في طلبهما حتى وجدهما فاشتراهما بستة آلاف دينار .","tags":["مصر","النار"],"partial":0,"sp":21,"kind":"prose","spLabel":"ووجد في دار نحرير الأَرغلي… … وكان قد ورد مع غرس الدولة …"},{"id":"b7-85","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨٥","topic":"الغرائب والذخائر","loc":309,"text":"ولما وقعت الفتنةُ بين عازم الدولة رقيب بن علّي وبين حاج خراسان بمدينة رسول الله صلى الله عليه وسلم في سنة ثلاث عشرة وأربع مئة، وعازم الدولة يومئذ أمير الموسم ومقدّم القافلة المصرية، وكانت الهزيمةُ على الخراسانية فنُهبت أموالهُم، أتي بعضُ النهّابة إلى عزم الدولة بزبدّية فيروزجٍ تسع وَزْنَ رطل بالشامي كأحسن ما يكون من الزبادي. فلما عاد إلى الرملة، وكان من جندها وسديد الدولة أبو الحسن علّي بن أحمد بن الضيف بها، ناظراً في الشام، اتصل به خبرها، فأخذها منه وأُخذت من موجود سديد الدولة حين قُتل وصارت إلى الإمام الظاهر لإعزاز دين الله .","tags":["الجوهر","المجالس","مصر"],"partial":0,"sp":22,"kind":"prose","spLabel":"ولما وقعت الفتنةُ بين عازم… … وأصاب عطيةُ بن صالح بن مرد…"},{"id":"b7-86","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨٦","topic":"الغرائب والذخائر","loc":310,"text":"وأصاب أبي الحسن علّي بن محمّد الملقّب بسيف الإمام المظفّر في الدين نظام أمير المؤمنين المعروف بالصليحي في اليمن، في سنة تسع وأربعين وأربع مئة جوهراً كثيراً من جملته قطع فيروزج، وزن كل قطعة خمسة دراهم، ويواقيتُ تزِن القطعةُ الدرهمين والثلاثة والأربعة والخمسة .ووَجد في غمدان في قصر سيف بن ذي يزن الحميريّ حين فتح صنعاء زِيرَيْن أخضرين صيني كأكبر ما يكون من الأزيار عظماً، ووجد أربع وعشرين سيفاً تبّعيّة لا قيمة لها.","tags":["الجوهر"],"partial":0,"sp":22,"kind":"prose","spLabel":"ولما وقعت الفتنةُ بين عازم… … وأصاب عطيةُ بن صالح بن مرد…"},{"id":"b7-87","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨٧","topic":"الغرائب والذخائر","loc":311,"text":"ووجد معدنا للذهب. وأصاب أيضاً ثلاثة أزيار صيني خضراء بحواملها وأغطيتُها منها، كأكبر ما يكون من الأزيار وأحسنها لوناً وجوهراً، ومائة وستين سيفاً كانت لملوك حِمْيَر عتيقة، على كلّ سيفٍ منها اسم صاحبه من الملوك في أغمدةٍ ذهب فيها ماله حَدّ واحد، وفيها ماله حدّان، وأنه حمل منها في هديته إلى المستنصر بالله مئة سيف في جملة الهديّة، وأنه لا قيمة لها جلالةً ونفاسة .","tags":[],"partial":0,"sp":22,"kind":"prose","spLabel":"ولما وقعت الفتنةُ بين عازم… … وأصاب عطيةُ بن صالح بن مرد…"},{"id":"b7-88","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨٨","topic":"الغرائب والذخائر","loc":312,"text":"وأصاب عطيةُ بن صالح بن مرداس الكلابيّ حين ملك الرحبة في سنة اثنتين وخمسين وأربع مئة وحاز جميع ما كان دخره فيها أبو الحارس رسلان البساسيري من مال وغيره،  - ومما كان أخذه من بغداد من مال الخليفةِ أبي جعفر عبد الله القائم بأمر الله، ومن ذخائر بني العباس حين خلعه ونهب داره في سنة خمسين وأربع مئة  - مائدة فيروزج بحوافّ مكلّلةٍ لا قيمة لها ولا قدراً يُعرف وهي مما انتقل إلى بني العبّاس من خزائن بني أميّة، وانتقلت إلى بني أمية من ذخائر الأكاسرة. وأعلمني مَنْ له خبرة أنّ هذه المائدة في سعة شبر وأوسع قليلا، وأنها تسعَ الجامَ من الحلوى، وأنها كانت لعضد الدولة فناخسروا وانتقلت منه إلى أبي العباس القادر بالله، ووجدها فناخسروا في الري .وَوُجد في دار الخليفة القائم بأمر الله حين نُهبت بغداد في أواخر سنة خمسين وأربع مئة بساطان فنكاً مفروزاً بلؤلؤ، طول كلّ بساط منهما ثلاثون ذراعاً في عرض مثل ذلك .","tags":["الجوهر"],"partial":0,"sp":22,"kind":"prose","spLabel":"ولما وقعت الفتنةُ بين عازم… … وأصاب عطيةُ بن صالح بن مرد…"},{"id":"b7-89","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨٩","topic":"الغرائب والذخائر","loc":313,"text":"ووجد له أيضا مقطّعان منسوجان بأنواع الجوهر وغريبة، طول كلّ واحد منهما ثلاثون ذراعاً في عرض مثل ذلك، لم يُرَ مثلهما قط .ووجد لابن المأمون ولابن المهتدي الخطيبين فروان، أسود وأبيض، من جلود الثعالب البيض والسود قيمة كلّ واحدً منهما خمس مئة دينار .","tags":["الجوهر"],"partial":0,"sp":23,"kind":"prose","spLabel":"ووجد له أيضا مقطّعان منسوج… … كان يستريح في أكثر أوقاته …"},{"id":"b7-90","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩٠","topic":"الغرائب والذخائر","loc":314,"text":"ووجد لبعض طاقات دار الخلافة شُبّاكُ ظُنّ أنه حديدٌ أو نحاسٌ فخرج ذهبا .وحدّثني فتح التاجيّ مولى أمير الأمراء أبي الفتوح يوسف بن أبي الحسين أن مولاه كان قد وقع إليه طِسْتٌ صغيرٌ للفِصَادِ من الزجاج الفرعوني المعروف بقلب سليم منبت النقش، أُذُناه من جسمه، في وسطه مقياسٌ للدم كمغرز السمع، مكتوب فيه مقادير ما يخرج الفاصد من الدم على مثال المقياس، أوله عشرون درهماً وآخره مائتان.","tags":[],"partial":0,"sp":23,"kind":"prose","spLabel":"ووجد له أيضا مقطّعان منسوج… … كان يستريح في أكثر أوقاته …"},{"id":"b7-91","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩١","topic":"الغرائب والذخائر","loc":315,"text":"وقال لي: مكتوب على حافاته اسم هارون الرشيد والسنة التي عُمل فيها أربعة أسطر .ولما صار عماد الدولة بن المحترق في قبضة أمير الجيوش وخوطب على الكتب الموجودة بخطّه إلى أَطْسِزْ وإلى ابن يلد كوش.","tags":["الكتب"],"partial":0,"sp":23,"kind":"prose","spLabel":"ووجد له أيضا مقطّعان منسوج… … كان يستريح في أكثر أوقاته …"},{"id":"b7-92","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩٢","topic":"الغرائب والذخائر","loc":316,"text":"كان يستريح في أكثر أوقاته إلى إدخال يده اليسرى في كمه ويلمس عضده أو يلتمس هناك شيئا فكشف الموكلّون به عن عضده الأيمن الذي كان يحكّه فوجد فيه دملجُ ذهب فيه جوهرةٌ حمراءُ كالبيضة وزنها سبعة عشر مثقالا من أحسن ما يكونُ في الياقوت لونا، فأنفذها أمير الجيوش إلى المستنصر بالله فأعلمه حين رآها أنه مما قُبض من خزائن الجوهر، وأنّ العزيز بالله كان ابتاعه بسبعين ألف دينار .وحدّثني أبو الفضل إبراهيم بن علي الكفرطابي بدمياط عند قدومه من قسطنطينّية في شهور سنة ثلاث وستين وأربع مئة أنه رأى على ارمانوس الديوجانس المتملّك على الروم إذ ذاك، في يوم عيدهم الأكبر، ثوباً تلبسه ملوكهم بمشقّة عظيمة لا يقدرون على حمله ولا يستطيعون الجلوس فيه لثقله وضعف قوّتهم عنه، وأنّ فيه ثلاثين حبّة لؤلؤ، وزن كلّ حبّة منه مثقالٌ واحد، وأنّه لا قيمة له ولا يعرف في الأرض مثله .وحّدثني أنّ عادة الملك أن يلبس في سفره ثياباً يتبذّل فيها مكلّلة بالجواهر والدرّ من سائر أنواعه. قيمةُ الثوب منها مائتا ألف دينار. وفوقها ودونها، وأنّه رأى على ميخائيل الملك شيئا منها يلبسه في عسكره في سفره قي أكثر أوقاته مختلف الأشكال. وأعلمني أيضاً أنّ لملوك الروم تيجاناً تُلبَسُ اختلاف أحوالها وتعلّق عليها، منها التاج الأكبر وهو من ذهبٍ مكلّلٍ بأنواع اليواقيت والجواهر من سائر أصنافه، يعلّق على رأسه في البيت الذي يجلس فيه لأهل مملكته ورسل الملوك، ومنها التاجُ المعروفُ الذي يجعله على رأسه إذا قدم من سفره الذي يظفر فيه بعدّوه، وهو مُرَصّعٌ بالجواهر، له عرفٌ خارج على وجهه من قِطع الياقوت الأحمر، ويقعد على سرير ملكه الذهب المرصّع بالجوهر أو على سلين ذهب مرصّع، ورجلاه أبداً نازلتان عن السرير أو السلين إلى مرفع من الديباج المثقل مشد يُرفعان عليه، وفي رجليه خفّان أحمران، ولا يكمل لباسهما إلا للملك خاصّة. ولمن دونه خف أحمر وخف أسود. وحدّثني أنّه رأى عندهم قطعة عنبرٍ كالجمل العظيم الباركِ في عرض المصطبة الكبيرة .","tags":[],"partial":0,"sp":23,"kind":"prose","spLabel":"ووجد له أيضا مقطّعان منسوج… … كان يستريح في أكثر أوقاته …"},{"id":"b7-93","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩٣","topic":"الغرائب والذخائر","loc":317,"text":"فأما الموجوداًت بعد الوفيات من التّرك الموروثات فإنا نذكر ما ترك الخلفاءُ بعد رسول الله صلى الله عليه وسلم وصحابته وذووهم وعُمّالهم ومن يَتَعَلّقُ بهم .","tags":[],"partial":0,"sp":24,"kind":"prose","spLabel":"فأما الموجوداًت بعد الوفيا… … ووزن كل مّثقال منها درهم و…"},{"id":"b7-94","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩٤","topic":"الغرائب والذخائر","loc":318,"text":"قال المؤرّخون: كان في الجاهلية أربعة نفر من قريشٍ يملكُ كلّ واحد منهم قنطاراً من الذهب وهم: أبو لَهَب، وأُميّةُ بن خلف، وأبو أحَيْحَة، وعبد الله بن جدعان. والقنطار أربعة آلاف أوقية ومائتا أوقية، والأوقية أربعون درهماً، وهي ثمانيةٌ وعشرون مثقالا .ولذلك قال الله تعالى {تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ، مَا أَغْنَى عَنْهُ مَالُهُ وَمَا كَسَبَ} وقال تعالى {زُيِّنَ لِلنَّاسِ حُبُّ الشَّهَوَاتِ مِنَ النِّسَاء وَالْبَنِينَ وَالْقَنَاطِيرِ الْمُقَنطَرَةِ مِنَ الذَّهَبِ وَالْفِضَّةِ وَالْخَيْلِ الْمُسَوَّمَةِ وَالأَنْعَامِ وَالْحَرْثِ }كان قيمة ما ترك طلحت بن عبيد الله رضي الله عنه حين قُتل في يوم الجمل، وفي سنة ستٍ وثلاثين، من العين النقيّ النضّ ثلاثين ألف ألف دينار، وألف ألفاً ومائتي ألف درهم وعروضاً كثيرة.","tags":[],"partial":0,"sp":24,"kind":"prose","spLabel":"فأما الموجوداًت بعد الوفيا… … ووزن كل مّثقال منها درهم و…"},{"id":"b7-95","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩٥","topic":"الغرائب والذخائر","loc":319,"text":"وكان أَوّلَ من زرع القمح على عشرين ناضحاً .وقال آخرون من المؤرخين: ترك طلحة مئة بُهارٍ من ذهب في كل بهار ثلاثة قناطير. والبهار جلد ثور .وبني طلحة في أيّام عثمان دوراً قُوِّمت بمائة ألف دينار، وكانت غلّته في العراق في كل يوم ألفاً ومائة دينار، وغلته بالسراة عشرة آلاف دينار في كل سنة .وبني داره بالجص والساج، وشيّدها، وباع أرضاً له بمائة ألف فتصدّق بها. والبهار بالقبطية أو النبطيّة كل ثلاثة قناطير بالبغداديّ، والقنطار مئة رطل بالرطل الذي وزنه تسعون مثقالا.","tags":["المجالس","العراق"],"partial":0,"sp":24,"kind":"prose","spLabel":"فأما الموجوداًت بعد الوفيا… … ووزن كل مّثقال منها درهم و…"},{"id":"b7-96","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩٦","topic":"الغرائب والذخائر","loc":320,"text":"ووزن كل مّثقال منها درهم وثلاثة أسباع درهم، وكلّ سبعة مثاقيل منها عشرة دراهم، يكون وزن الرطل البغداديّ مئة درهم وثمانية وعشرون درهم ونصف ونصف سبع، ومبلغ القنطار تسعة آلاف مثقال وهو ألفٌ ومائتا أوقية، وزن كل أوقية سبعة مثاقيل ونصف التي هي عشرة وثلث وربع وثُمن وسبعان ونصف من سُدُسِ عشر درهم .","tags":["العراق"],"partial":0,"sp":24,"kind":"prose","spLabel":"فأما الموجوداًت بعد الوفيا… … ووزن كل مّثقال منها درهم و…"});</script>
<script>window.__BOOK__.push({"id":"b7-97","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩٧","topic":"الغرائب والذخائر","loc":321,"text":"وترك الّزبيُر بن العوّام رضي الله عنه حين قتل يوم الجمل اثنتين وخمسين ألف دينار عيناً وثلاثة وخمسين ألف ألف درهم وَرِقا .","tags":["المجالس"],"partial":0,"sp":25,"kind":"prose","spLabel":"وترك الّزبيُر بن العوّام ر… … كان يتصدّق بها. وخلف ألف ف…"},{"id":"b7-98","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩٨","topic":"الغرائب والذخائر","loc":322,"text":"وذكر محمد بن سعد كاتب الواقديّ في كتاب (الطبقات ): أن الزبير خلف أربع حرائر. فأصاب كلّ واحدة منهن بعد إخراج ثلث ماله ألف ألفٍ ومائة ألف .","tags":["النفقات","الكتب"],"partial":0,"sp":25,"kind":"prose","spLabel":"وترك الّزبيُر بن العوّام ر… … كان يتصدّق بها. وخلف ألف ف…"},{"id":"b7-99","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩٩","topic":"الغرائب والذخائر","loc":323,"text":"قال: وكان جميع ماله خمسين ألف ألف ومائتي ألف .وخلف ألف مملوكٍ كلُّهم صانع، يؤدّون الضريبة، لا يدخل بيت ماله منها درهمٌ واحد.","tags":["الرقيق"],"partial":0,"sp":25,"kind":"prose","spLabel":"وترك الّزبيُر بن العوّام ر… … كان يتصدّق بها. وخلف ألف ف…"},{"id":"b7-100","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠٠","topic":"الغرائب والذخائر","loc":324,"text":"كان يتصدّق بها. وخلف ألف فرس. وكان له بمصر خطط، وبالإسكندرية خطط، وبالبصرة والكوفة ضياعٌ وخططٌ ودور، وبالمدينة أعراضٌ. وبني الزّبير داره المشهورة بالبصرة وفيها الأسواق والتجارات في أيام عثمان.","tags":["الخيل","مصر","العراق"],"partial":0,"sp":25,"kind":"prose","spLabel":"وترك الّزبيُر بن العوّام ر… … كان يتصدّق بها. وخلف ألف ف…"},{"id":"b7-101","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠١","topic":"الغرائب والذخائر","loc":325,"text":"وبنى أيضاً بالكوفة داراً، وبنى بمصر داراً. وبنى بالإسكندرية داراً. وبلغ ثمن مال الزبير خمسين ألف دينار .وترك عبد الرحمن بن عوف الزهريّ، رضي الله عنه، لما مات في سنة اثنتين وثلاثين، ألف بعير، وعشرة آلاف شاة، ومائة فرس ترعى بالنقيع.","tags":["الخيل","الرقيق"],"partial":0,"sp":26,"kind":"prose","spLabel":"وبنى أيضاً بالكوفة داراً، … … وكان من مياسير قريش وأصحاب…"},{"id":"b7-102","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠٢","topic":"الغرائب والذخائر","loc":326,"text":"وكان يزرع بالجرف على عشرين ناضحاً بين الجرف والمدينة على ثلاثة أميال .وصالح عثمان بن عفّان تماضر بنت الأصبغ إحدى نسائه الأربع  - وكان طلّقها في مرضه حين اشتدّت علّته  - بعد وفاته على ربع الثمن فأصابها مئة ألف دينار .","tags":["النساء","النار"],"partial":0,"sp":26,"kind":"prose","spLabel":"وبنى أيضاً بالكوفة داراً، … … وكان من مياسير قريش وأصحاب…"},{"id":"b7-103","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠٣","topic":"الغرائب والذخائر","loc":327,"text":"قال الطبري: بلغ ربع الثمن ماله أربعة وثمانين ألف دينار، وأعتق في يوم واحد ثمانين عبدا .وذكر البلاذريّ قي (تاريخه) أنّه ترك ذهباً قطّع بالفؤوس حتى مَجَلَتْ أيدي الرجال منه .","tags":["الرقيق","المجالس"],"partial":0,"sp":26,"kind":"prose","spLabel":"وبنى أيضاً بالكوفة داراً، … … وكان من مياسير قريش وأصحاب…"},{"id":"b7-104","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠٤","topic":"الغرائب والذخائر","loc":328,"text":"وكان من مياسير قريش وأصحاب الأموال، وقسم ميراثه على ستة عشر سهما. وبني في أيام عثمان داره ووسّعها .وقال بعض المؤرخين: خلف عبد الرحمن بن عوف عند وفاته ألف ألفاً وثلاث مئة ألف وعشرين ألف دينار، وكان أوصى من ذلك لمن بقى من أهل بدر لكلّ رجل منهم بأربع مئة دينار، وكانوا يومئذ مئة إنسان منهم عثمان بن عفّان وهو يومئذ خليفة فصار إلى أهل بدر من ماله أربعون ألف دينار، وقسم باقي ماله وهو ألف ألف ومائتان وثمانون وما ورث عنه، على ستة عشر سهما. فبلغ نصيب كل واحدا من ورثته ثمانين ألف دينار، وأعتق في يوم واحد ثمانين عبداً، وأوصى بألف فرس في سبيل الله وبخمسين ألف دينار .","tags":["الخيل"],"partial":0,"sp":26,"kind":"prose","spLabel":"وبنى أيضاً بالكوفة داراً، … … وكان من مياسير قريش وأصحاب…"},{"id":"b7-105","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠٥","topic":"الغرائب والذخائر","loc":329,"text":"وقيل لعبد الرحمن بن عوف: بِمَ أَيسَرْتَ ؟فقال: لم اشتر عيباً ولا رددت من ربح ولم أبع بنسيئة ولم أجبن عن تجارة .وترك عمرو بن العاص يوم مات في سنة ثلاث وأربعين، ثلاث مئة ألف عيناً، وخمسة وعشرين ألف دينار ومن الفضة ألفي ألف درهم وخمس مئة ألف درهم، ومن القراضة مائتي ألف دينار.","tags":["الرقيق"],"partial":0,"sp":27,"kind":"prose","spLabel":"وقيل لعبد الرحمن بن عوف: ب… … وكان قيمة ما تصدّق به في ح…"},{"id":"b7-106","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠٦","topic":"الغرائب والذخائر","loc":330,"text":"وترك بضيعته الوهط بالطائف غلّة عشرة آلاف درهم، في كل سنة. وكان غَرَسَ فيها ألف ألف عمود كرمٍ، سوى ما ترك بمصر من الخطط.","tags":["مصر"],"partial":0,"sp":27,"kind":"prose","spLabel":"وقيل لعبد الرحمن بن عوف: ب… … وكان قيمة ما تصدّق به في ح…"},{"id":"b7-107","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠٧","topic":"الغرائب والذخائر","loc":331,"text":"وكانت غلّته مائتي ألف دينار، منها غلّة ضياعه بمصر مئة ألف دينار .وترك زيد بن ثابت رضي الله عنه يوم مات في سنة خمس وأربعين من الذهب والفضة ما كان يقطع بالفؤوس ومالاً وضياعاً وعيوناً مبلغها مئة ألف دينار .","tags":["المجالس"],"partial":0,"sp":27,"kind":"prose","spLabel":"وقيل لعبد الرحمن بن عوف: ب… … وكان قيمة ما تصدّق به في ح…"},{"id":"b7-108","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠٨","topic":"الغرائب والذخائر","loc":332,"text":"وكان قيمة ما تصدّق به في حياته مئة ألف دينار وسبعين ألف دينار وخمسين ألف وثمان مئة درهم. وقيل رأنّه خلف أربعين ألفاً عينا وسبع مئة ألف درهم .وأرسل سعد بن أبي وقاص بزكاة عين ماله خمسة آلاف دينار وهو ربع العشر عن مائتي ألف دينار وخمسين ألف درهم عن ربع العشر عن ألفي ألف درهم.","tags":["النار"],"partial":0,"sp":27,"kind":"prose","spLabel":"وقيل لعبد الرحمن بن عوف: ب… … وكان قيمة ما تصدّق به في ح…"},{"id":"b7-109","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠٩","topic":"الغرائب والذخائر","loc":333,"text":"وكان عمر رضي الله عنه قد شاطره ماله وقاسمه عليه حين شاطر عمّاله، وكان على الكوفة، وبني في أيام عثمان داره بالعقيق، وشيّدها، وجعل لها شرافات .والعقيق على عشرة أميال من المدينة.","tags":["العراق"],"partial":0,"sp":28,"kind":"prose","spLabel":"وكان عمر رضي الله عنه قد ش… … وكان سعيد بن خالد بن عبد ا…"},{"id":"b7-110","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١٠","topic":"الغرائب والذخائر","loc":334,"text":"مات رضي الله عنه في سنة خمس وخمسين فحمل فدفن بالبقيع. وترك مائتي ألف دينار وخمسين ألف درهم .وترك يَعْلى بن منية التميميّ حين مات خمس مئة ألف دينار، وعقاراً وضياعاً، وديونا بقيمة ثلاث مئة ؟ألف دينار .","tags":["الوفاة"],"partial":0,"sp":28,"kind":"prose","spLabel":"وكان عمر رضي الله عنه قد ش… … وكان سعيد بن خالد بن عبد ا…"},{"id":"b7-111","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١١","topic":"الغرائب والذخائر","loc":335,"text":"وخلف زياد بن أبي سفيان، حين مات بالكوفة سنة ثلاث وخمسين، ستة آلاف ألف درهم. ومائة ألف دينار، سوى ما ترك من الضياع والرّباع بسائر العراق، فأخذ جميع ذلك أخوه معاوية .","tags":["العراق"],"partial":0,"sp":28,"kind":"prose","spLabel":"وكان عمر رضي الله عنه قد ش… … وكان سعيد بن خالد بن عبد ا…"},{"id":"b7-112","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١٢","topic":"الغرائب والذخائر","loc":336,"text":"وكان سعيد بن خالد بن عبد الله المطرّف بن عمرو بن عثمان بن عفّان من أكثر الناس مالاً وأعظمهم حالاُ، وترك لورثته مالاً ضخماّ، وكانت السماء تبرق فيقول: أمطري حيث شئتِ، فلا تمطرين على بلد إلاّ ولي فيه مال .","tags":["الرقيق","المجالس","الشعر"],"partial":0,"sp":28,"kind":"prose","spLabel":"وكان عمر رضي الله عنه قد ش… … وكان سعيد بن خالد بن عبد ا…"},{"id":"b7-113","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١٣","topic":"الغرائب والذخائر","loc":337,"text":"ووجد المختار بن أبي عبيد الثقفي، حين ظهر بالكوفة طالباً بدم الحسين عليه السلام في سنة خمس وستين، في بيت المال بها سبعة آلاف ألف دينار. فبعث إلى أهل البيت البعض وفرّق البعض في أصحابه .","tags":["الرقيق","الشعر"],"partial":0,"sp":29,"kind":"prose","spLabel":"ووجد المختار بن أبي عبيد ا… … وترك الحجاج بن يوسف بعد وف…"},{"id":"b7-114","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١٤","topic":"الغرائب والذخائر","loc":338,"text":"ووجد الحجّاج بن يوسف في بيت مال عبد الله ابن الزبير، حين قتله في سنة ثلاث وسبعين، عشرة آلاف ألف درهم، وكان بخيلا .وأصاب مصعب بن الزبير، في ولايته العراقيين في خمس سنين، ألف ألف وألف ألف وألف ألف، وأعطي الأمان فأبى، ومشى بسيفه حتى مات .","tags":["الخيل","السلاح"],"partial":0,"sp":29,"kind":"prose","spLabel":"ووجد المختار بن أبي عبيد ا… … وترك الحجاج بن يوسف بعد وف…"},{"id":"b7-115","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١٥","topic":"الغرائب والذخائر","loc":339,"text":"ووجد عبد الملك بن مروان لإبراهيم بن الأشتر النخعي حين قتله في سنة اثنتين وسبعين مع طروب جاريته، وهي أم مروان بن محمد، كتاباً فيه تسمية ماله ومواضعه كان مبلغه خمسة آلاف ألف، فتَتَبَعها عبد الملك حتى أخذها جميعها .","tags":["الرقيق","بني أمية"],"partial":0,"sp":29,"kind":"prose","spLabel":"ووجد المختار بن أبي عبيد ا… … وترك الحجاج بن يوسف بعد وف…"},{"id":"b7-116","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١٦","topic":"الغرائب والذخائر","loc":340,"text":"وترك الحجاج بن يوسف بعد وفاته في سنة خمس وتسعين في بيت المال بواسط مئة ألف ألف، وسبعة عشر ألف ألف درهم. وخلف تسع مئة درع حديداً، جعل منها ست مئة محبّسةً موقوفةً معونةً لمن يقاتل منافقي العراق، وثلاث مئة محّبسةً موقوفةً لمن يقاتل الترك .","tags":["السلاح","الشعر"],"partial":0,"sp":29,"kind":"prose","spLabel":"ووجد المختار بن أبي عبيد ا… … وترك الحجاج بن يوسف بعد وف…"},{"id":"b7-117","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١٧","topic":"الغرائب والذخائر","loc":341,"text":"وقال آخرون: ترك الحجاج مائتي ألف ألف درهم فحملها يزيد بن أبي مسلم كاتبه إلى الوليد بن عبد الملك، وحمل إليه من السلاح والمتاع ما ضاقت عليه الخزائن، فقدم بها على الوليد، وهو بدير مُرّان، فوُضعت بين يديه، فتناول الوليد خاتما صغيراً ثم أقبل على ابن أبي مسلم فقال: ويحك! ما كان جرم هذا الغلام الذي هذا خاتمه ؟وبأي حق أخذتموه منه ؟فقال يا أمير المؤمنين. كنا نوجّه البعوث إلى الثغور ونعطيهم أعطياتهم وَرِقاً طيباً فلا يوافون ثغورهم فترجع تلك الأموال فنأخذ منهم ما كان عندهم حتى نستوفي حقوقنا، وكان مما نأخذ الخاتم وغيره إرادة التوسّع عليهم وكراهيةً للتضييق. فقال الوليد: اللهم إنّ يزيد يقولُ ما أنت أعلم به إن كان صادقاً أو كاذبا، اللهم خذه وخُذْ صاحبه بقبيح ما عملا مما خالفنا في أمرنا، فأنت أعلم أني لم آمره بجور قطّ ولا تعدٍّ على أحدٍ من الخلق. وأدخلت تلك الأموال في بيت المال، وأمر بتلك الآنية فأدخلت دار الضرب، وفرّق الرقيق في المساجد وأعمال السلطان .","tags":[],"partial":0,"sp":30,"kind":"prose","spLabel":"وقال آخرون: ترك الحجاج مائ… … ووجد لهشام بن عبد الملك اث…"},{"id":"b7-118","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١٨","topic":"الغرائب والذخائر","loc":342,"text":"وكان عبد الرحمن بن عبد الله بن عثمان بن عبد الله الثقفي، وهو المعروف بابن أم الحكم بنت أبي سفيان، وهو ابن أخت معاوية، كثير المال جداً، وعزل نفقته لمئة سنة، كل يوم مئة دينار. فما مات حتى باع بعض عقده. وإذا كان نفقته في كلّ يوم مئة دينار، كانت في كل شهر ثلاثة آلاف دينار، وفي كل سنة ستة وثلاثين ألف دينار، وفي كل عشر سنين ثلاث مئة وستين ألف دينار، وفي كل مئة سنة ثلاثة آلاف ألف وست مئة ألف دينار .","tags":["الرقيق","المجالس"],"partial":0,"sp":30,"kind":"prose","spLabel":"وقال آخرون: ترك الحجاج مائ… … ووجد لهشام بن عبد الملك اث…"},{"id":"b7-119","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١٩","topic":"الغرائب والذخائر","loc":343,"text":"وخلف عبد الله بن عبد الملك بن مروان لما مات في سنة مئة للهجرة سبعين مدياً من ذهب، والمدي ثلاثة أرداب بالإردابّ المصري، يريد المدي الشامي. والإردب المصري ست ويبات، والويبة ستة عشر قدحا، والقدح على التقريب ملؤه ألف دينار. فالويبة. ستة عشر ألف دينار، والإردب على ذلك مئة ألف دينار، والمدي ثلاث مئة ألف دينار، يكون ذلك إحدى وعشرين ألف ألف دينار. والمدي الحجازي سبعة آصع ونصف، والصاع أربعة أمداد، والمد رطل وثلث بالبغدادي، ووزن الرطل البغداديّ تسعون مثقالاً عنها مئة وثمانية وعشرون درهما ونصف، ونصف سبع، وهو صاع رسول الله صلى الله عليه وسلم الذي وزنه خمسة أرطال وثلث بالبغداديّ .والفَرَقُ بالراء محركة ثلاثة آصع، والوسقُ ستون صاعاً .","tags":[],"partial":0,"sp":30,"kind":"prose","spLabel":"وقال آخرون: ترك الحجاج مائ… … ووجد لهشام بن عبد الملك اث…"},{"id":"b7-120","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢٠","topic":"الغرائب والذخائر","loc":344,"text":"ووجد لهشام بن عبد الملك اثنا عشر ألف قميص كلها قد أثر به. ووجد في خزائنه سبع مئة. ... ووجدوا في خزائنه ست مئة تكة عرض التكة شبران وطولها سبعة أزرع.","tags":["الرقيق","الذخائر"],"partial":0,"sp":30,"kind":"prose","spLabel":"وقال آخرون: ترك الحجاج مائ… … ووجد لهشام بن عبد الملك اث…"},{"id":"b7-121","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢١","topic":"الغرائب والذخائر","loc":345,"text":"وكان يحمل كسوته سبع مئة جمل. وعمل في أيامه الخزّ الرقم وغيره، والوشي والأرمنيّ، وأصناف الثياب. وكان له ستورٌ وكسوة وطراز، ولم يكن لمن قبله. وهو أول من أتخذ الطراز، وإليه ينسب الخزّ الأخضر الهشامي. واتخذ هشام الطراز في سنة ثمان ومائة. وكتب إلى سائر الآفاق في كل صنف من الثياب والفرش والآنية والآلة أن يتخذ له شيء بصفته. فقيل أن كلّ شيء عمل يومئذ له هو أجودُ شيء يراه الناسُ، لم يُعمل قبله ولا بعده ولا مثله.","tags":["المجالس","الكتب"],"partial":0,"sp":31,"kind":"prose","spLabel":"وكان يحمل كسوته سبع مئة جم… … وكان في بيت مال الوليد بن …"},{"id":"b7-122","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢٢","topic":"الغرائب والذخائر","loc":346,"text":"وكان هشام وبنو مروان كلّهم يكسون الناس الخّز إلا الأصفرَ والأحمرَ، ويكسونهم ما سوى ذلك من الألوان ويدّخرون الأحمر والأصفر لأنفسهم.","tags":[],"partial":0,"sp":31,"kind":"prose","spLabel":"وكان يحمل كسوته سبع مئة جم… … وكان في بيت مال الوليد بن …"},{"id":"b7-123","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢٣","topic":"الغرائب والذخائر","loc":347,"text":"وخلف هشام أحد عشر ذكرا وأحد عشر ألف ألف دينار لخاصّته. فخصّ كلّ واحد من ولده ألف ألف ألف دينار. ولم يأت دولة بني العباس إلاّ وجميع ولده لا مال لواحد منهم. وبين الدولة العباسية ووفاته سبع سنين .","tags":["بني العباس","النار"],"partial":0,"sp":31,"kind":"prose","spLabel":"وكان يحمل كسوته سبع مئة جم… … وكان في بيت مال الوليد بن …"},{"id":"b7-124","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢٤","topic":"الغرائب والذخائر","loc":348,"text":"وكان في بيت مال الوليد بن يزيد بن عبد الملك يوم قُتل سبعة وأربعون ألف ألف دينار فرَّقها يزيد الناقص .وكان لمروان بن محمد الجعدّي حين هرب من المسوّدة في سنة اثنتين وثلاثين ومائة عند هشام بن عمرو ابن بسطام التغلبي أمير الموصل، وعامله على خراجها بشر بن حازم أربعة آلاف دينار وسبعون ألف ألف درهم، حُملوا جميعاً إلى عبد الله بن علّي مع ما سوى ذلك ما لا يوصف كثرة .","tags":[],"partial":0,"sp":31,"kind":"prose","spLabel":"وكان يحمل كسوته سبع مئة جم… … وكان في بيت مال الوليد بن …"},{"id":"b7-125","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢٥","topic":"الغرائب والذخائر","loc":349,"text":"ووجد أبو جعفر بواسط في بيت مال يزيد بن عمرو بن هُبَيْرة، حين قتله في سنة اثنتين وثلاثين مئة، ثلاثة آلاف ألف دينار، وخمس مئة ألف دينار، وطعاماً يكفي عشرين ألف رجل سنة واحدة وقيل سنتين .","tags":["الولائم","الشعر"],"partial":0,"sp":32,"kind":"prose","spLabel":"ووجد أبو جعفر بواسط في بيت… … ومات أبو جعفر المنصور وفي …"},{"id":"b7-126","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢٦","topic":"الغرائب والذخائر","loc":350,"text":"وكانت غلّةُ خالد بن عبد الله القَسْري ثلاثة عشر ألف ألف درهم في كل سنة .وكان في خزانة أبي العباس السفاح لما مات: خمسة آلاف ألف دينار، ومائتا ألف ألف درهم، ومائة ألف دابة وبغل. كما ذكر .","tags":["الخيل"],"partial":0,"sp":32,"kind":"prose","spLabel":"ووجد أبو جعفر بواسط في بيت… … ومات أبو جعفر المنصور وفي …"},{"id":"b7-127","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢٧","topic":"الغرائب والذخائر","loc":351,"text":"وقال أبو الجهم عطية: كان في خلافة السفاح في خزانة السلاح خمسون ألف درع، وخمسون ألف سيف، وثلاثون ألف جوشن، ومائتا ألف رمح .","tags":["السلاح","الذخائر","بني العباس"],"partial":0,"sp":32,"kind":"prose","spLabel":"ووجد أبو جعفر بواسط في بيت… … ومات أبو جعفر المنصور وفي …"},{"id":"b7-128","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢٨","topic":"الغرائب والذخائر","loc":352,"text":"ومات أبو جعفر المنصور وفي بيت ماله شيء لم يجمعه خليفةٌ قبله قطست مئة ألف ألف درهم وأربعة عشر ألف ألف دينار وقيل سبع مئة ألف درهم وستون ألف ألف دينار وقيل سبع مئة ألف درهم وستون ألف ألف درهم وكان له أربعون ألف مولىومات المهديُّ وفي بيت ماله سبعة وعشرون ألف ألف درهمومات الرشيد وفي بيت ماله تسع مئة ألف ألف درهم ونيف عن قيمة ثمانية وأربعين ألف ألف دينار. ولم يكن أحد في خلفاء بني العّباس خلف ما خلفه الرشيد، ولا جمع ما جمعهومات المعصمُ بالله وفي بيت ماله ثمانية آلاف ألف دينار، وثمانية آلاف ألف درهم.","tags":[],"partial":0,"sp":32,"kind":"prose","spLabel":"ووجد أبو جعفر بواسط في بيت… … ومات أبو جعفر المنصور وفي …"},{"id":"b7-129","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢٩","topic":"الغرائب والذخائر","loc":353,"text":"وخلف ثلاثة وثلاثين ألف دابة. وكان المرتزقةُ من الموالي في خلافته سبعين ألفاً .خلف المعتضد بالله في بيوت أمواله عشرة آلاف ألف دينار، ومن صنوف الآلات والكسوة والفرش ضعف ذلك، ومن الخيل ثلاثة آلاف رأس، ومن سائر الدواب والبغال والإبل عشرة آلاف رأْس .","tags":["الخيل","النار"],"partial":0,"sp":33,"kind":"prose","spLabel":"وخلف ثلاثة وثلاثين ألف داب… … وخلف من الخدم والجواري أحد…"},{"id":"b7-130","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣٠","topic":"الغرائب والذخائر","loc":354,"text":"قال الفضلُ بن الربيع: لما ولي محمد الأمين الخلافة، بعد أبيه هارون الرشيد، في سنة ثلاث وتسعين ومائة أَمرني أَن أُحصي ما في الخزائن من الكسوة والفرش والآنية والآلة. فأحضرتُ الكتّاب والخزّان وأقمتُ أحصي أربعة أشهر، وأشرفتُ على ما لم أَتوهم أنّ خزائن الخلافة تحويه. ثم أمرتُهم أَن يكون يكتبوا لكل صنف جملة وكان الموجود فيها :أربعة آلاف جبّة وشيوأربعة آلاف جبّة خزّ مبطّنة بسّمور وفنك وسائر الوبروعشرة آلاف قميص وغلالةوعشرة آلاف خفتان .وألفا سراويل من أصناف الثياب .وأربعة آلاف عمامة .وألف طيلسان .وألف رداء من أصناف الثياب .وخمسة آلاف منديل أصناف .وخمس مئة قطيفة .ومائة ألف مثقال مسكٍ .ومائة ألف مثقال عنبر .وألف سفط عود هندي .وألف برنية غالية .وأصناف كثيرة من العطر .وجوهر قَوّمه الجوهريّون بأربعة آلاف ألف دينار .وخمس مئة ألف ديناروألف خاتم جوهر .وألف بساط أرمنيّ .وأربعة آلاف ستر .وخمسة آلاف وسادة .وخمسة آلاف مخدّةوألف وخمس مئة طنفسة خز .ومائة نمط خزّ .وألف وسادة ومخدة خزّ .وثلاث مئة بساط ميساني .وألف بساط درابجردي .وألف وسادة ديباج .وألف وسادة خز رقم .وألف ستر خز .وثلاث مئة ستر ديباج .وخمس مئة بساط طبريّ .وألف وسادة طبريّوألف مرفقة .وألف مخدّة .وألف طست .وألف إبريق .وثلاث مئة كانون .وألف تور للشمع .وألفا قطعة من سائر أصناف النحاس .وألف منطقة .وعشرة آلاف سيف محلّى .وخمسون ألف سيف للشاكرّية والغلمان .ومائة وخمسون ألف رمح .ومائة ألف قوس .وألف درع خاصة .وخمسون ألف درع عامة .وعشرة آلاف بيضةوعشرون ألف جوشن .ومائة وخمسون ألف تُرس .وأربعة آلاف سرج خاصة .وثلاثون ألف سرج عامة .وأربعة آلاف زوج خفافٍ أكثرها مبطّن بالسمّور والفنك وسائر أصناف الوبر في كل خف منها سكين ومنديل .وأربعة آلاف زوج جواربوأربعة آلاف قبة بآلتها .ومائة وخمسون مضربا .","tags":["الجوهر"],"partial":0,"sp":33,"kind":"prose","spLabel":"وخلف ثلاثة وثلاثين ألف داب… … وخلف من الخدم والجواري أحد…"},{"id":"b7-131","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣١","topic":"الغرائب والذخائر","loc":355,"text":"وتوفي الواثقُ وحاصل بيت المال من العين خمسة آلاف ألف دينار، ومن الوَرِق خمسة عشر ألف ألف درهم .وقُتل المتوكلُ على الله وحاصل بيت ماله من العين ألف ألف دينار، ومن الورق خمسون ألف ألف درهم.","tags":[],"partial":0,"sp":33,"kind":"prose","spLabel":"وخلف ثلاثة وثلاثين ألف داب… … وخلف من الخدم والجواري أحد…"},{"id":"b7-132","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣٢","topic":"الغرائب والذخائر","loc":356,"text":"وخلف من الخدم والجواري أحد عشر ألفاً منهم ستة آلاف خادم. وخلف من الغلمان المماليك ثمانية آلاف. فأما نفقاته الخاصة ففي كل سنة ألفا ألف دينار، ومائة ألف دينار، ومن الورق ستة وعشرون ألف ألف درهم وخمس مئة ألف درهم وللسيدة شجاع أُمِّه، ست مئة ألف دينار .ونفقات المطابخ مائتا ألف دينار .والبناء والمرمّة ثلاث مئة ألف دينار .أرزاق الحشم: عشرة آلاف ألف درهم .نفقات ذوات الخاصة: خمسة آلاف ألف درهم .الكسوة: ثلاث مئة ألف دينار .الطيب: مئة ألف دينار .تجديد آلات الخزائن وصياغة الذهب والفضّة: مئة ألف دينار .الخيش والشمع: أَلف ألف ومائتا ألف درهم .الثلج: ألف ألف درهم .الفرش: مئة ألف دينار .خزائن الشراب: ألفا ألف درهم .أرزاق الندماء: خمس مئة ألف درهم .أرزاق الكلابزيين والبازدارية والفهّادين: خمس مئة ألف درهم .نفقات الحراقات وما أشبهها: خمسة آلاف ألف درهم .ما يبتاع من الرقيق: مئة ألف دينار .ما يبتاع من الجوهر: ثلاث مئة ألف دينار .أرزاق الفرّاشين: ثمان مئة ألف دينار .أرزاق الصفاعنة والمضحكين والكبّاشين، والديّاكين، وأصحاب كلاب الهراش، والضّراطين: خمس مئة ألف درهم .وصالح المنتصر إخوته وأخواته من ميراث أبيه من الفرش والرقيق والدواب على أربعة عشر ألف ألف درهم وأشهد عليهم بذلك .","tags":["الجوهر"],"partial":0,"sp":33,"kind":"prose","spLabel":"وخلف ثلاثة وثلاثين ألف داب… … وخلف من الخدم والجواري أحد…"},{"id":"b7-133","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣٣","topic":"الغرائب والذخائر","loc":357,"text":"وقيل إنه صالحهم على ألف ألف دينار .وتوفي المنتصرُ بالله وحاصل بيت ماله ألف ألف درهم جعل العين ورقا، وكانت الدراهم إذ ذاك على عشرين درهماً بدينار .","tags":["الشعر"],"partial":0,"sp":34,"kind":"prose","spLabel":"وقيل إنه صالحهم على ألف أل… … وخلف محمد بن سليمان بن علي…"},{"id":"b7-134","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣٤","topic":"الغرائب والذخائر","loc":358,"text":"وخلف المكتفي بالله ستة عشر ألف ألف دينار، وثلاثين ألف ألف درهم في بيت مال الخاصة. وقيل أربعة عشر ألف ألف دينار، وجوهراً قيمته خمسة عشر ألف ألف دينار، ومن الكراع شيئا كثيراً، وخمسة عشر ألف رأس من الخيل.","tags":["الجوهر"],"partial":0,"sp":34,"kind":"prose","spLabel":"وقيل إنه صالحهم على ألف أل… … وخلف محمد بن سليمان بن علي…"},{"id":"b7-135","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣٥","topic":"الغرائب والذخائر","loc":359,"text":"وخلف في بيت مال المسلمين خمسة عشر ألف ألف دينار، وفي بيت العامة ستّ مئة أَلف ألف دينار، وآنية من كل صنف بعشرة آلاف دينار .","tags":["الشعر","النار"],"partial":0,"sp":34,"kind":"prose","spLabel":"وقيل إنه صالحهم على ألف أل… … وخلف محمد بن سليمان بن علي…"},{"id":"b7-136","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣٦","topic":"الغرائب والذخائر","loc":360,"text":"وخلف محمد بن سليمان بن علي بن عبد الله ابن العباس حين مات وهو والي البصرة والعراقيين في سنة ثلاث وسبعين ومائة مالاً عيناً سوى الضياع والدور والمستغلاّت والرقيق والجوهر والفرش والعطر والكسوة والآنية والدواب  - ثلاثة آلاف ألف دينار.","tags":["الجوهر","الرقيق"],"partial":0,"sp":34,"kind":"prose","spLabel":"وقيل إنه صالحهم على ألف أل… … وخلف محمد بن سليمان بن علي…"},{"id":"b7-137","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣٧","topic":"الغرائب والذخائر","loc":361,"text":"وخلف من ذلك شيئا كثيراً، وكان يغّل كل يوم مئة ألف درهم، ويسمع دعاؤه في المسجد: (أللهم أوسع علّي فإني لا يسعني إلا الكثير ).","tags":["المجالس"],"partial":0,"sp":35,"kind":"prose","spLabel":"وخلف من ذلك شيئا كثيراً، و… … وكان لمسلم بن أبي بكرة الث…"},{"id":"b7-138","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣٨","topic":"الغرائب والذخائر","loc":362,"text":"وقبض الرشيد المال ولم يعرض إلى سواه، ووجد له عند كاتبه حماد بن موسى ستين ألف درهم. وحمل جميع ذلك، فأمر الرشيد أن يدخل جميع ذلك إلى خزائنه، إلاّ المال فإنه أمر فيه برقاع كُتبت للندماء والمغّنين لم يُدر في الدواوين، فأرسلوا وكلائهم إلى السفن فأخذوا المال، وكان جملة ما قبضه الرشيد من أموال محمد بن سليمان عيناً وآلة ورحلاً ورجلاً سوى العقارات والضياع والدور والمُسْتغَلاّت نيفاً وخمسين ألف ألف دينار ودرهم .","tags":[],"partial":0,"sp":35,"kind":"prose","spLabel":"وخلف من ذلك شيئا كثيراً، و… … وكان لمسلم بن أبي بكرة الث…"},{"id":"b7-139","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣٩","topic":"الغرائب والذخائر","loc":363,"text":"وكان محمد بن سليمان يتصدّق كل سنة بخمس مئة ألف دينار، وفي كلّ ليلة ألفاً. وكان له خمسون ألف مولى، منهم اثنا عشر ألف عتاقة. ولمّا ولى البصرة أهدى إلى الخيزران مئة وصيف، بيد كلّ وصيف جام ذهب مملوء مسكاً. فقبلت ذلك منه، واتصل بالمهدي ذلك فغاظه، وكتب إلى محمد بن سليمان :إن المئين التي بعثتَ بها صارتْ شفيعاً في قطع ما تَصِل لا يدفع الأمر من خصصت بها فيك ولا تستطيع ما تسل (كذا) .","tags":["الطيب"],"partial":0,"sp":35,"kind":"prose","spLabel":"وخلف من ذلك شيئا كثيراً، و… … وكان لمسلم بن أبي بكرة الث…"},{"id":"b7-140","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤٠","topic":"الغرائب والذخائر","loc":364,"text":"وكان لمسلم بن أبي بكرة الثقفي بالبصرة حمّام يغل له في كل يوم ألف درهم وكرّ طعام، والكرّ سبعة آلاف رطل ومائتا رطل بالبغدادي .","tags":["الولائم","المجالس"],"partial":0,"sp":35,"kind":"prose","spLabel":"وخلف من ذلك شيئا كثيراً، و… … وكان لمسلم بن أبي بكرة الث…"},{"id":"b7-141","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤١","topic":"الغرائب والذخائر","loc":365,"text":"وكانت غلّة الليث بن سعد، مولى خالد بن ثابت الفهمي، فقيه المصرّيين في كل سنة خمسة آلاف دينار، سوى ما كان يأتيه من إقطاعه، وكان يطعم أصحاب الحديث الفالوذج ويطرح فيه الدنانير.","tags":["مصر"],"partial":0,"sp":36,"kind":"prose","spLabel":"وكانت غلّة الليث بن سعد، م… … تصدقني عما أسألك عنه ؟قال:…"},{"id":"b7-142","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤٢","topic":"الغرائب والذخائر","loc":366,"text":"وكان سريّاً جواداً .وقال منصور بن عمار الفقيه: أتيت الليث بن سعد فأعطاني ألف دينار، وقال لي: صُنْ بهذه الدنانير الحكمة التي آتاك الله .وولاه المنصور الجزيرة بمصر، وكان أمراءُ مصر لا يقطعون أمراً دونه.","tags":["مصر","بني العباس"],"partial":0,"sp":36,"kind":"prose","spLabel":"وكانت غلّة الليث بن سعد، م… … تصدقني عما أسألك عنه ؟قال:…"},{"id":"b7-143","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤٣","topic":"الغرائب والذخائر","loc":367,"text":"ومات في سنة خمس وسبعين ومائة. ولما أعضلت مسألة الرشيد فقهاء الإسلام أشخص الليث بن سعد إليه فأخرجه منها، وذلك أن الرشيد خاصم زوجته أم جعفر زبيدة فقالت له: والله لا رأيت الجنة ولا دخلتها. فقال لها: إن لم أكن من أهل الجنة فأنت طالق ثلاثاً. فأشخص مالك بن أنس من المدينة، وسفيان بن عُيَيْنَة من مكة، وإسماعيل بن عيّاش من حمص والليث بن سعد من مصر وسألهم عن ذلك. فما أفتاه أحدٌ منهم غير الليث بن سعد فإنه قال: يا أمير المؤمنين.","tags":["النساء","مكة"],"partial":0,"sp":36,"kind":"prose","spLabel":"وكانت غلّة الليث بن سعد، م… … تصدقني عما أسألك عنه ؟قال:…"},{"id":"b7-144","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤٤","topic":"الغرائب والذخائر","loc":368,"text":"تصدقني عما أسألك عنه ؟قال: نعم. قال: هل تخاف مقام الله ؟قال: نعم. قال: فليست لك جنة واحدة لك جنتان. قال الله تبارك وتعالى {وَلِمَنْ خَافَ مَقَامَ رَبِّهِ جَنَّتَانِ} راجع زوجتك فلا حنث عليك. فأمر له بعشرة آلاف دينار، وأقطعه ضيعةً بريف مصر تعرف بقرقشندة .","tags":["مصر","النار"],"partial":0,"sp":36,"kind":"prose","spLabel":"وكانت غلّة الليث بن سعد، م… … تصدقني عما أسألك عنه ؟قال:…"},{"id":"b7-145","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤٥","topic":"الغرائب والذخائر","loc":369,"text":"ولما نكب الرشيد البرامكة وقبض على أموالهم وجد ليحيى بن خالد خمسة آلاف دينار، ووجد للفضل ولده أربعين ألف درهم كان قهرمانه استقرضها من بيت المال لأرزاق عياله، ولم يوجد لجعفر بن يحيى شيء.","tags":[],"partial":0,"sp":37,"kind":"prose","spLabel":"ولما نكب الرشيد البرامكة و… … وذكر الحارث بن أبي أسامة ف…"},{"id":"b7-146","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤٦","topic":"الغرائب والذخائر","loc":370,"text":"ووجد لأمّ جعفر بن يحيى أربعة مئة ألف دينار كانت ادخرتها، وكان الرشيد يصلها، وكان يعجب بمسامرتها ومجالستها، وحُسْن عقلها، وثباتها، وموضع ابنها منه.","tags":["البرامكة"],"partial":0,"sp":37,"kind":"prose","spLabel":"ولما نكب الرشيد البرامكة و… … وذكر الحارث بن أبي أسامة ف…"},{"id":"b7-147","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤٧","topic":"الغرائب والذخائر","loc":371,"text":"وكانت صِلاُته لا تغبّها. وكان جميع ما وجد للبرامكة من المال ولأتباعهم سبعة عشر ألف ألف درهم بعد أن بحث الرشيد عن أموالهم وتتبع ذلك، فما وجد لهم شيئاً أكثر منه .","tags":["مكة"],"partial":0,"sp":37,"kind":"prose","spLabel":"ولما نكب الرشيد البرامكة و… … وذكر الحارث بن أبي أسامة ف…"},{"id":"b7-148","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤٨","topic":"الغرائب والذخائر","loc":372,"text":"وذكر الحارث بن أبي أسامة في كتاب (أخبار الخلفاء) أنه وجد لجعفر بن يحيى في بركة من داره أربعة آلاف ألف دينار، في كلّ دينار منها مئة دينار ودينار، على كلّ دينار من أحد من جانبيه.","tags":["البرامكة","الكتب"],"partial":0,"sp":37,"kind":"prose","spLabel":"ولما نكب الرشيد البرامكة و… … وذكر الحارث بن أبي أسامة ف…"},{"id":"b7-149","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤٩","topic":"الغرائب والذخائر","loc":373,"text":"(وأصفر من ضرب دار الملوك ... يلوح على وجهه جعفرا)\n(يزيد على مئة واحداً ... إذا ناله مُعْسِرٌ أيسرا)","tags":[],"partial":0,"sp":38,"kind":"verse","spLabel":"(وأصفر من ضرب دار الملوك .… … ووجد للعّباس بن الحسن الوز…"},{"id":"b7-150","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥٠","topic":"الغرائب والذخائر","loc":374,"text":"وكان مبلغُ غلّة ضياع عجيف بن عَنْبَسة صاحب حرس المعتصم في كل سنة ثمانية آلاف ألف درهم .وخلف يعقوب بن الليث الصفّار لما مات في سنة ستين ومائتين خمسين ألف ألف درهم، وثمان مئة ألف دينار، وألف ألف دينار .","tags":[],"partial":0,"sp":38,"kind":"prose","spLabel":"(وأصفر من ضرب دار الملوك .… … ووجد للعّباس بن الحسن الوز…"},{"id":"b7-151","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥١","topic":"الغرائب والذخائر","loc":375,"text":"وكانت غلّة عبد الله بن الحسن بن علي بن أبي طالب في كلّ سنة مئة ألف دينار .وخلف عمرو بن مَسَعدَة ثمانين ألف ألف درهم. فرفع إلى المأمون بذلك، فوقع في رقعة الرافع: هذا قليل لمن اتّصل بنا، وطالت خدمته لنا، فبارك الله لولده في تركته .","tags":[],"partial":0,"sp":38,"kind":"prose","spLabel":"(وأصفر من ضرب دار الملوك .… … ووجد للعّباس بن الحسن الوز…"},{"id":"b7-152","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥٢","topic":"الغرائب والذخائر","loc":376,"text":"ووجد للعّباس بن الحسن الوزير يوم قُتل مما أعد له من آلة الشراب في بستانه سبع مئة صينيّة من ذهب وفضّة، ووجد له فيما خلف مئة ألف مثقال عنبر .وحين ثار الجند بمصر على عبيد الله بن العّباس بن موسى بن عيسى في سنة تسع وسبعين ومائة،  - وكان قدم إليها نائباً في الولاية عن أبيه العباس بن موسى كاتبه أبو بشر الحسن بن عُبيد الأنصاري  - قتلوا كاتبه ونهبوا خمس مئة ألف دينار كانت في بيت المال .","tags":["الطيب"],"partial":0,"sp":38,"kind":"prose","spLabel":"(وأصفر من ضرب دار الملوك .… … ووجد للعّباس بن الحسن الوز…"},{"id":"b7-153","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥٣","topic":"الغرائب والذخائر","loc":377,"text":"وكانت غلّةُ الحسن بن سهل في كل سنة ثلاثة عشر آلاف ألف درهم .وذكر ابن جدار في (فضائل مصر) أنّه لما أراد الحسن بن عبد العزيز الجروي ولده على الصدور إلى بعض أسفاره قال له أخوه عبد العزيز: يا أخي. خذ معك ما تستعين به على سفرك.","tags":["الرقيق","مصر"],"partial":0,"sp":39,"kind":"prose","spLabel":"وكانت غلّةُ الحسن بن سهل ف… … وخلف من الخيل الميدانّية س…"},{"id":"b7-154","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥٤","topic":"الغرائب والذخائر","loc":378,"text":"وكان مبلغه ألفي ألف دينار فقال: يا أخي. أنا ما أخذت الكثير من ميراث أبيك، فكيف آخذ الحقير .ووجد عبيد بن السري لأخيه أبي نصر، بعد وفاته بمصر في سنة ست ومائتين، ست مئة ألف دينار عيناً سوي الوَرِق والآلات .وحين هرب زيادة الله بن الأغلب صاحب المغرب من القيروان حين دخلها أبو عبد الله داعية المهدي في سنة ست وتسعين ومائتين، متوجّهاً إلى مصر  - خرج معه بألف خادم دفع إلى كل واحد ألف دينار، سوى ما كان في خزائنه من الأموال والجواهر والأثاث المحمول والمتروكِ، وضلّ عنه من ماله ثلاثون حملاً دنانير خالفته إلى ناحية تونس، وانتهبت من أمواله أمثال ما خرج معه .","tags":["الرقيق","الذخائر"],"partial":0,"sp":39,"kind":"prose","spLabel":"وكانت غلّةُ الحسن بن سهل ف… … وخلف من الخيل الميدانّية س…"},{"id":"b7-155","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥٥","topic":"الغرائب والذخائر","loc":379,"text":"ومات أحمد بن طولون وفي بيت ماله عيناً عشرة آلاف دينار. وكان في حاصله ألفاً ألف دينار، وسبع مئة ألف دينار، سوى ما كان مودَعاً عند حُسين الطويل خادم المتوكل، وهو ألف بدرة. وفي بيت مال الخاصة مئة ألف وخمسون ألف دينار سوى ما حمل إلى المعتمد في أربع سنين ألفي ألف دينار، وكان له أربعة وعشرون ألف غلام مملوك، وخمسة وأربعون ألف أسود، وتنطوي جريدته على سبعة آلاف حّر مرتزق من الموالي.","tags":[],"partial":0,"sp":39,"kind":"prose","spLabel":"وكانت غلّةُ الحسن بن سهل ف… … وخلف من الخيل الميدانّية س…"},{"id":"b7-156","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥٦","topic":"الغرائب والذخائر","loc":380,"text":"وخلف من الخيل الميدانّية سبعة آلاف وثلاث مئة وثلاثين فرساً، ومن البغال ست مئة بغل، ومن الجمال ألفي جمل، ومائة مركب حربيّة بآلاتها، ومن الدواب لركابه مائتين وثلاثين دابة. وأنفذ إلى الخليفة المكتفي بالله من ذخائرهم وحليهم وفرشهم ونعمهم أربعة وعشرين ألف جمل، وقيل عيناً ألف ألف دينار وأربعة وعشرين ألف جمل من سائر الأمتعة .","tags":["الخيل"],"partial":0,"sp":39,"kind":"prose","spLabel":"وكانت غلّةُ الحسن بن سهل ف… … وخلف من الخيل الميدانّية س…"},{"id":"b7-157","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥٧","topic":"الغرائب والذخائر","loc":381,"text":"وكان لأحمد بن عبد العزيز بن أبي دُلف أيام ولايته الكرخ إسطبلات تشتمل على أكثر من عشرين ألف دابة. وكان ربّما حمل في اليوم الواحد على أكثر من ألف فرس.","tags":["الخيل","الرقيق","المجالس"],"partial":0,"sp":40,"kind":"prose","spLabel":"وكان لأحمد بن عبد العزيز ب… … ووجد له أربعة آلاف رأس من …"},{"id":"b7-158","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥٨","topic":"الغرائب والذخائر","loc":382,"text":"وكانت له خزانة سروج فيها ستة آلاف سرج وخمس مئة سرج، سوى المخلّع منها والمصاغ الذي لم يركب، وكان في بيت ماله ستة آلاف ألف درهم وخمس مئة ألف دينار في بعض أوقاته، سوى ما عنده من خزائن السلاح والكسوة والطيب والشراب والفُرش والطرائف وغير ذلك مما لا تحدّ قيمته .","tags":["الطيب"],"partial":0,"sp":40,"kind":"prose","spLabel":"وكان لأحمد بن عبد العزيز ب… … ووجد له أربعة آلاف رأس من …"},{"id":"b7-159","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥٩","topic":"الغرائب والذخائر","loc":383,"text":"وقال أبو الفتح المطوّق في كتابه المعروف (بمناقب الوزراء ): قبض لصاعد بن مخلد ولأخيه عبدون بن مخلد، ولولديه. ونافذ غلامه، وزوجته: ألف ألف دينار.","tags":["الرقيق","الكتب"],"partial":0,"sp":40,"kind":"prose","spLabel":"وكان لأحمد بن عبد العزيز ب… … ووجد له أربعة آلاف رأس من …"},{"id":"b7-160","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦٠","topic":"الغرائب والذخائر","loc":384,"text":"ووجد له أربعة آلاف رأس من الدواب والبغال، ونحو أربعة آلاف غلام من الخدم والفحول والأتراك والسودان .وأخذ من القاسم بن عبيد الله بعد وفاته سبع مئة ألف دينار، وخلف مائتي ألف ألف دينار عيناً .","tags":["الرقيق","النار"],"partial":0,"sp":40,"kind":"prose","spLabel":"وكان لأحمد بن عبد العزيز ب… … ووجد له أربعة آلاف رأس من …"},{"id":"b7-161","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦١","topic":"الغرائب والذخائر","loc":385,"text":"وقال أبو الحسن الإسكافي: قرأت في إحصاء ما وُجد للوزير أبي الحسن على ابن محمد ابن الفرات بعد صرفه عن الوزارة الأولى في سنة تسع وتسعين ومائتين: ألف ومائة طيلسان، وألف كساء، وألف ومائتا عمامة، وألف سروال، وألف منديل صغير، وغير ذلك من أصناف الكسي والفُرش والآلات أمراً عظيماً مفرطاً لكثرته.","tags":[],"partial":0,"sp":41,"kind":"prose","spLabel":"وقال أبو الحسن الإسكافي: ق… … وكان له بالنهروان خمسة آلا…"},{"id":"b7-162","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦٢","topic":"الغرائب والذخائر","loc":386,"text":"وكانت ثيابه دبيقيّة كالهواء رقّة، كل ثوب بسبعين ديناراً. وثياب السراويلات بثلاثين ديناراً. وكان يستعمل كل يوم أكثر من عشرة مناديل، يستنثر في المنديل مرة واحدة ثم يرمى ويطلب غيره.","tags":["المجالس","النار"],"partial":0,"sp":41,"kind":"prose","spLabel":"وقال أبو الحسن الإسكافي: ق… … وكان له بالنهروان خمسة آلا…"},{"id":"b7-163","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦٣","topic":"الغرائب والذخائر","loc":387,"text":"وكان مبلغ غلّة أبي الحسن ابن الفرات في كل سنة من ضياعه ألف ألف دينار ومائة ألف دينار .وقال سوسن: وجد لأبي الحسن بن الفرات في مصادرته الأولى في سنة تسع وتسعين ومائتين من الطيب في ودائعه: من العود الأخضر ثمان مئة منّاً، ومن المسك أربع مئة وعشرون منّاً، ومن الكافور نيّف وستون مناًّ، ومن العنبر خمسة وأربعون ألف مثقال، وألفاً ثوب مطوية، هذا غير الجوهر النفيس.","tags":["الجوهر","الطيب"],"partial":0,"sp":41,"kind":"prose","spLabel":"وقال أبو الحسن الإسكافي: ق… … وكان له بالنهروان خمسة آلا…"},{"id":"b7-164","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦٤","topic":"الغرائب والذخائر","loc":388,"text":"وكان له بالنهروان خمسة آلاف كر، ووجد له عيناً خمس مئة ألف دينار .ولما مات أبو الحسن الراسبي أنفذ المقتدر مؤنس (كذا) الخادم لقبض أمواله، فوجد المال الصامت ألف ألف مثقال، وصياغات فضة وذهب، وفرشاً، وكسوة وطيباً بنحو من ذلك .","tags":["الرقيق"],"partial":0,"sp":41,"kind":"prose","spLabel":"وقال أبو الحسن الإسكافي: ق… … وكان له بالنهروان خمسة آلا…"},{"id":"b7-165","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦٥","topic":"الغرائب والذخائر","loc":389,"text":"ولما قتل بجكم في سنة تسع وعشرين وثلاث مئة وجد له من العين ألف ألف دينار ومائتا ألف دينار. وقيل: ألف ألف وأربع مئة ألف دينار، ومن الورق شيء كثير، وأخذ له جوهر وآنية مَصّوغةٌ وفرش شيء عظيم.","tags":["الجوهر","الوفاة"],"partial":0,"sp":42,"kind":"prose","spLabel":"ولما قتل بجكم في سنة تسع و… … ولما نُهب أبو عبد الله أحم…"},{"id":"b7-166","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦٦","topic":"الغرائب والذخائر","loc":390,"text":"ووجد له مائدة ذهب محرقة، وسرير ذهب، وسيوف ومناطق وسلاح كثير، وكسوة وغير ذلك. ووجد له الدّرة اليتيمة، ونصابان أحدهما زمرّد والآخر ياقوت أصفر، وجوهر فاخر، وذو الفقار سيف رسول الله صلى الله عليه وسلم، وقطع بلّور فاخرة .","tags":["الجوهر","السلاح"],"partial":0,"sp":42,"kind":"prose","spLabel":"ولما قتل بجكم في سنة تسع و… … ولما نُهب أبو عبد الله أحم…"},{"id":"b7-167","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦٧","topic":"الغرائب والذخائر","loc":391,"text":"ووجد لبجكم من العين مدفوناً ألف ألف ومائتا ألف دينار، وبذل للحفارين بأن يأخذوا التراب الذي يخرج ويغسلوه ويأخذوا ما يجدون فيه من العين والورق بأجرتهم فامتنعوا، فأطلق لهم ألفي درهم وتقدم بغسل التراب فغسل، فأخرج منه ستة وثلاثون ألف درهم .","tags":["الكنوز"],"partial":0,"sp":42,"kind":"prose","spLabel":"ولما قتل بجكم في سنة تسع و… … ولما نُهب أبو عبد الله أحم…"},{"id":"b7-168","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦٨","topic":"الغرائب والذخائر","loc":392,"text":"ولما نُهب أبو عبد الله أحمد بن محمد اليزيديّ عند وروده من البصرة في سنة تسع وعشرين وثلاث مئة أُخذ له، سوى الأمتعة التي جاءت معه، وسوى الآلات والفرش والبِدَر، ألف ألف دينار.","tags":["الرقيق","العراق"],"partial":0,"sp":42,"kind":"prose","spLabel":"ولما قتل بجكم في سنة تسع و… … ولما نُهب أبو عبد الله أحم…"},{"id":"b7-169","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦٩","topic":"الغرائب والذخائر","loc":393,"text":"وكان صار إليه وإلى أخيه أبي يوسف من الأهواز في مدة يسيرة أربعة آلاف ألف دينار. سوى ما أنفقه على جنده حين خرج من البصرة إلى أن دخل بغداد من العين عشرة آلاف ألف دينار .","tags":["النفقات","العراق"],"partial":0,"sp":43,"kind":"prose","spLabel":"وكان صار إليه وإلى أخيه أب… … ووجد للأستاذ أبي الفتوح بر…"},{"id":"b7-170","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧٠","topic":"الغرائب والذخائر","loc":394,"text":"وأما أبو الحسين جوهر المغربي فإنه لما سيّره مولاه لفتح مصر في سنة ثمان وخمسين وثلاث مئة أصحبه ألفاً وخمس مئة حمل مال لما ينوبه هناك .","tags":["الجوهر","مصر"],"partial":0,"sp":43,"kind":"prose","spLabel":"وكان صار إليه وإلى أخيه أب… … ووجد للأستاذ أبي الفتوح بر…"},{"id":"b7-171","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧١","topic":"الغرائب والذخائر","loc":395,"text":"ولما سار العزيز بالله إلى بلبيس متوجّهاً للغزو في سنة خمس وثمانين وثلاث مئة كان في جملة ما خرج معه من المال خمسة آلاف جمل على كل جمل صندوقان كبيران مملوءان مالاً، وألف وثمان بختَّية وبختّي على كل واحد صندوقان، في كل صندوق منهما مثل ما في الصندوقين المحمولين على الجمال .","tags":[],"partial":0,"sp":43,"kind":"prose","spLabel":"وكان صار إليه وإلى أخيه أب… … ووجد للأستاذ أبي الفتوح بر…"},{"id":"b7-172","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧٢","topic":"الغرائب والذخائر","loc":396,"text":"ووجد للأستاذ أبي الفتوح برجوان العزيزيّ حين قتله الحاكم في سنة تسعين وثلاث مئة، مئة منديل شروب ملّونة معمّمة كلّها على مئة شاشية، وألف سراويل دبيقيّة بألف تكّة حرير، ومن الثياب الصحاح الرفيعة الطائلة والصياغات وآنية الذهب والفضّة ما لا يحصى كثرة، ومن الخيل الجياد مئة وخمسون فرساً، ومن بغال المثقل ثلاث مئة بغل، ومن السروج الثقيلة الحلي مئة وخمسون سرجاً، ومن الكتب المصوّرة وغيرها، وكتب الأغاني شيئاً كثيراً .","tags":["الخيل"],"partial":0,"sp":43,"kind":"prose","spLabel":"وكان صار إليه وإلى أخيه أب… … ووجد للأستاذ أبي الفتوح بر…"},{"id":"b7-173","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧٣","topic":"الغرائب والذخائر","loc":397,"text":"ووجد لقائد القواد الحسين بن جوهر حين قتله الحاكم في سنة تسع وتسعين وثلاث مئة في جملة موجودة سبعة آلاف مبطنة حرير، وتسع مثارد صيني أسود فنصوري مملوءَة حبّ كافور فنصوري، وزن كل حبة ثلاثة مثاقيل .","tags":["الجوهر","الطيب","الوفاة"],"partial":0,"sp":44,"kind":"prose","spLabel":"ووجد لقائد القواد الحسين ب… … وخلفت شجاعُ، والدة المتوكل…"},{"id":"b7-174","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧٤","topic":"الغرائب والذخائر","loc":398,"text":"وخلف بسيل بن أرمانوس ملك الروم حين مات في سنة عشر وأربع مئة من المال العين الصامت ستة آلاف قنطار بالبغدادي عن قيمة أربعة وخمسين ألف ألف دينار .ثم نذكر ما خلّفه أُمهات الخلفاء وذووهنّ :خلفت العباسة بنت المهديّ بالله ضياعاً كانت تبلغ غلّتها في كل سنة أربعة آلاف دينار وماتت في سنة اثنتين وثمانين ومائة وورثها أخواها إبراهيم ومنصور أولاد المهدي .","tags":["النساء"],"partial":0,"sp":44,"kind":"prose","spLabel":"ووجد لقائد القواد الحسين ب… … وخلفت شجاعُ، والدة المتوكل…"},{"id":"b7-175","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧٥","topic":"الغرائب والذخائر","loc":399,"text":"وكانت غلّة الخيزران أمّ الهادي والرشيد في كل سنة مائتي ألف ألف وستين ألف ألف درهم. وماتت في سنة اثنتين وسبعين ومائة. ومشي الرشيد في جنازتها .","tags":["النساء"],"partial":0,"sp":44,"kind":"prose","spLabel":"ووجد لقائد القواد الحسين ب… … وخلفت شجاعُ، والدة المتوكل…"},{"id":"b7-176","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧٦","topic":"الغرائب والذخائر","loc":400,"text":"وخلفت شجاعُ، والدة المتوكل، خمسة آلاف ألف دينار عيناً ووَرِقاً، وجوهراً قيمته ألف ألف دينار، ومن الفرش والرقيق والدواب وغيره بقيمة ألف ألف دينار، وماتت في سنة سبع وأربعين ومائتين قبل مقتل ابنها بستة أشهر، وخلفت أربع عشرة ضيعة مبلغ غلّتها في السنة أربع مئة ألف دينار .","tags":["الجوهر"],"partial":0,"sp":44,"kind":"prose","spLabel":"ووجد لقائد القواد الحسين ب… … وخلفت شجاعُ، والدة المتوكل…"});</script>
<script>window.__BOOK__.push({"id":"b7-177","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧٧","topic":"الغرائب والذخائر","loc":401,"text":"وماتت حبشّية أم المنتصر، في سنة ثلاث وستين ومائتين في خلافة المعتمد وخلفت أموالاً عظيمة وشيئاً كثيراً .وكان المعتزّ بالله قد التمس من أمّه قبيحة خمسين ألف دينار ينفقها في الجند فذكرت أنها لا تصل إلى حبّة، وظهرت بعد قتله في سنة خمس وخمسين ومائتين، فوجد لها في خزانة واحدة ألف ألف دينار، وثلاثة أسفاط في واحد منها مكّوكُ زمرّد لم يُرَ قطٌّ مثله نفاسة، وفي الآخر نصف مكوك حب لؤلؤ لم ير مثله في حسنه واعتداله، وفي الآخر مقدار كيلجة ياقوت أحمر ما رُئي مثله قط. وقّوم ذلك فكانت قيمته ألفي ألف دينار. هذا غير ما وجد لها من الودائع في السنة المقدم ذكرها.","tags":["الجوهر","الغرائب"],"partial":0,"sp":45,"kind":"prose","spLabel":"وماتت حبشّية أم المنتصر، ف… … وكانت وجوهها من ملحم خراسا…"},{"id":"b7-178","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧٨","topic":"الغرائب والذخائر","loc":402,"text":"وكانت غلّة ضياعها في كلّ سنة عشرة آلاف ألف دينار. ووجد لها دواويج كانت تستعملها، فقوّم الدوّاج منها بأكثر من ألف دينار.","tags":["النار"],"partial":0,"sp":45,"kind":"prose","spLabel":"وماتت حبشّية أم المنتصر، ف… … وكانت وجوهها من ملحم خراسا…"},{"id":"b7-179","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧٩","topic":"الغرائب والذخائر","loc":403,"text":"كانت تؤخذ له جلود السمّور فيحلق ما عليها من الوبر، ويرمى بالجلود، فإذا اجتمع ما يكفي الدواج نثر فيه فتيت المسك والعنبر، وجعل بين البطانة والظهارة مكان القطن، وضرب.","tags":["الطيب"],"partial":0,"sp":45,"kind":"prose","spLabel":"وماتت حبشّية أم المنتصر، ف… … وكانت وجوهها من ملحم خراسا…"},{"id":"b7-180","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨٠","topic":"الغرائب والذخائر","loc":404,"text":"وكانت وجوهها من ملحم خراسان أخف شيء وأدفأه .وقال أحمد بن أبي إسرائيل: احتجت ليلةً إلى أن أنام في بعض دور قبيحة لأعمال أرادوها.","tags":["فارس"],"partial":0,"sp":45,"kind":"prose","spLabel":"وماتت حبشّية أم المنتصر، ف… … وكانت وجوهها من ملحم خراسا…"},{"id":"b7-181","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨١","topic":"الغرائب والذخائر","loc":405,"text":"وكان ذلك في كانون، والبردُ أشدّ ما يكون، ففرشت لي فرشٌ طرح عليها دواجٌ واسعٌ إلا أنه خفيف جداً. فلما أردت النوم لم أجد غيره. فقلت في نفسي: سينال البرد مني منالاً، ثم أخذته علي ونمت، فانتبهت وقد عرقت من الكرب، وكأن لا شيء فوقي من خفة الدوّاج. وسألت الجارية التي جاءتني به عنه فقالت: ظهارته وبطانته ملحم خفيف، وبينهما وبر السّمور، يؤخذ عن جلده ويجعل مثل القطن فيلطف ويخفّ. فما رأيت ذلك قبل ليلتي. ثم نفاها المهتدي إلى مكة .","tags":["الرقيق","مكة"],"partial":0,"sp":46,"kind":"prose","spLabel":"وكان ذلك في كانون، والبردُ… … فأما شغب، أم المقتدر، فإن …"},{"id":"b7-182","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨٢","topic":"الغرائب والذخائر","loc":406,"text":"وأخذ المهتدي من (قُرب)، أخت المعتزّ، ثلاث مئة ألف دينار، ونادى من دَلّ على مال لهم فله نصف العشر، فدلّ الناس على أموال لهم كثيرة كانت نحواً من ألف ألف دينار، فوفى لهم المهتدي بنصف العشر .","tags":["النار"],"partial":0,"sp":46,"kind":"prose","spLabel":"وكان ذلك في كانون، والبردُ… … فأما شغب، أم المقتدر، فإن …"},{"id":"b7-183","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨٣","topic":"الغرائب والذخائر","loc":407,"text":"ووجد في بيت مال أمّ المستعين بالله حين خلعه الأتراك وبايعوا المعتز بالله وأخاه المؤيد بالله في سنة إحدى وخمسين ومائتين ألف ألف دينار. وفي بيت مال ابنه العباس ست مئة ألف دينار .","tags":["الشعر","النار"],"partial":0,"sp":46,"kind":"prose","spLabel":"وكان ذلك في كانون، والبردُ… … فأما شغب، أم المقتدر، فإن …"},{"id":"b7-184","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨٤","topic":"الغرائب والذخائر","loc":408,"text":"فأما شغب، أم المقتدر، فإن ولدها كان أقطعها في دفعات ضياعاً وافرة الارتفاع، وابتاعت مدة خلافة ابنها إلى وقت الخلع له في سنة سبع وثلاث مئة في أيام فتنة نازوك أبي الهيجاء، ضياعاً جليلة صار ارتفاع ضياعها، الملك والإقطاع، نحواً من سبع مئة ألف دينار، في كلّ سنة. ثم أخرجت ما ادخرته وجمعته في أوقات الحاجة إليه عند مصير أبي طاهر القرمطي إلى بغداد في سنة ثمان عشرة وثلاث مئة وهو ست مئة ألف دينار، فقتل ابنها وليس عندها مال.","tags":["العراق"],"partial":0,"sp":46,"kind":"prose","spLabel":"وكان ذلك في كانون، والبردُ… … فأما شغب، أم المقتدر، فإن …"},{"id":"b7-185","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨٥","topic":"الغرائب والذخائر","loc":409,"text":"ولما تسلّم القاهر الخلافة صادرها وضربها بيده مئة مقرعة على المواضع الغامضة، وعلقها بفرد رجل، واستقاها (؟) في حبل البرادة، وأسرف في عقوبتها، فأقرّت بصناديق فيها صياغات وثياب وفرش وطيب.","tags":[],"partial":0,"sp":47,"kind":"prose","spLabel":"ولما تسلّم القاهر الخلافة … … وكانت في ناحية أمّ المقتدر…"},{"id":"b7-186","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨٦","topic":"الغرائب والذخائر","loc":410,"text":"كانت قيمة ذلك مئة وثلاثين ألف دينار. وتوفيت في جمادى الآخرة سنة إحدى وعشرين وثلاث مئة. وكانت شغب أولاً جارية أم القاسم بنت محمد بن عبد الله بن طاهر، واسمها إذ ذاك ناعم .","tags":["الرقيق","النساء"],"partial":0,"sp":47,"kind":"prose","spLabel":"ولما تسلّم القاهر الخلافة … … وكانت في ناحية أمّ المقتدر…"},{"id":"b7-187","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨٧","topic":"الغرائب والذخائر","loc":411,"text":"وذكر ثابت في (تاريخه) أن السيدة شغب لم تقصر في الإحسان إلى القاهر والتوسعة عليه حتى كانت تخرجه إلى بساتين ابنها في دار السلطان فتفرّجه فيها وتقربه من مجالس ابنها إذا شرب ليسمع الغناء، وتشرف بنفسها على ما يطبخ له من طعام، وترسل معه جارية تأكل من الطعام قبل أن يأكله، وأهدت إليه جواري يأنس إليهن فكافأها على ذلك بما فعل معها .ومما يُشاكل ذلك ما كان من أمر أم موسى الهاشمية، واسمها سكينة بنت العباس بن محمد بن سليمان بن محمد بن إبراهيم بن محمد بن علي بن عبد الله بن العباس، من ولد إبراهيم الإمام.","tags":["السلاح","الرقيق","الولائم"],"partial":0,"sp":47,"kind":"prose","spLabel":"ولما تسلّم القاهر الخلافة … … وكانت في ناحية أمّ المقتدر…"},{"id":"b7-188","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨٨","topic":"الغرائب والذخائر","loc":412,"text":"وكانت في ناحية أمّ المقتدر قبل تقلده الإمامة، فإنه عَظُمَ أمرها إلى أن غلبت على الملك والوزارة والأمر والنهي، وخرجت لها الإقطاعات العظيمة القدر، وملكت الضياع النفيسة والعقارات، وأجريت لها الأرزاق الوافرة، وولت الولايات السنية، فلما قبض عليها في سنة عشر وثلاث مئة وعلى أختها أم محمد، وجد لها ولأختها ولأخيها وذويها أموال جليلةٌ وذخائر نفيسة ما قيمته ألف ألف دينار. فكان ارتفاع ضياعها وضياع أخيها في كل سنة مئة ألف دينار .","tags":["الغرائب"],"partial":0,"sp":47,"kind":"prose","spLabel":"ولما تسلّم القاهر الخلافة … … وكانت في ناحية أمّ المقتدر…"},{"id":"b7-189","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨٩","topic":"الغرائب والذخائر","loc":413,"text":"وقال ثابت بن سنان في (تاريخه)، وجد لأم موسى وأختها وأخيها جواهر نفيسة وأموال عظيمة، وثياب فاخرة، وكسوة سريّة ما تزيد قيمته على ألف ألف دينار .","tags":["الغرائب","النار"],"partial":0,"sp":48,"kind":"prose","spLabel":"وقال ثابت بن سنان في (تاري… … ووجد لها جوهرٌ نفيس من جمل…"},{"id":"b7-190","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٩٠","topic":"الغرائب والذخائر","loc":414,"text":"وخلفت السيدة ست مصر بنت الحاكم بأمر الله حين ماتت في مستهلّ جمادى الآخرة من سنة خمس وخمسين وأربع مئة مالاً يحصى كثرة، وكان إقطاعها في كل سنة يغلّ خمسين ألف دينار.","tags":["النساء","مصر"],"partial":0,"sp":48,"kind":"prose","spLabel":"وقال ثابت بن سنان في (تاري… … ووجد لها جوهرٌ نفيس من جمل…"},{"id":"b7-191","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٩١","topic":"الغرائب والذخائر","loc":415,"text":"ووجد لها ثمانية آلاف جارية، وكانت سمحة، نبيلة، كريمة الأخلاق والفعل، وكان في جملة موجودها نّيف وثلاثون زيراً صينياً مملوءاً جميعها مسكاً مسحوقاً.","tags":["الطيب","الرقيق"],"partial":0,"sp":48,"kind":"prose","spLabel":"وقال ثابت بن سنان في (تاري… … ووجد لها جوهرٌ نفيس من جمل…"},{"id":"b7-192","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٩٢","topic":"الغرائب والذخائر","loc":416,"text":"ووجد لها جوهرٌ نفيس من جملته قطعة ياقوت فيها عشرة مثاقيل .ووجد للسيدة راشدة بنت المعزّ لدين الله حين ماتت في سنة اثنتين وأربعين وأربع مئة على ما ذكره الحاكي ما قيمته ألف ألف وسبع مئة ألف دينار.","tags":["الجوهر","الغرائب"],"partial":0,"sp":48,"kind":"prose","spLabel":"وقال ثابت بن سنان في (تاري… … ووجد لها جوهرٌ نفيس من جمل…"},{"id":"b7-193","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٩٣","topic":"الغرائب والذخائر","loc":417,"text":"وكان في جملة ما وجد في خزائن كسوتها ثلاثون ألف ثوب خزّ مقطوع، واثنا عشر ألفاً من الثياب المصمتة ألواناً، ومائة قطرميز مملوءة كافوراً فنصورياً، وأنه وجد لها فيما وجد بيت الرشيد الخزّ الأسود الذي مات فيه بطوس .","tags":["الطيب","الذخائر"],"partial":0,"sp":49,"kind":"prose","spLabel":"وكان في جملة ما وجد في خزا… … وكانت أختها راشدة تأكل من …"},{"id":"b7-194","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٩٤","topic":"الغرائب والذخائر","loc":418,"text":"وكان مَنْ ولي من أولاد المعزّ ينتظر وفاتها. فلم يقض ذلك إلا لأمير المؤمنين المستنصر بالله .وماتت أختها عبدة بنت المعز في هذه السنة. وُلدتا في رقادة بظاهر القيروان، وماتتا بالقاهرة في سنة اثنتين وأربعين وأربع مئة، وبين كل واحدة والأخرى ثلاثة أيام. وعمرت كل واحدة منهن نحواً من تسعين سنة. وهما عمتا الحاكم بأمر الله.","tags":["الرقيق","النساء"],"partial":0,"sp":49,"kind":"prose","spLabel":"وكان في جملة ما وجد في خزا… … وكانت أختها راشدة تأكل من …"},{"id":"b7-195","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٩٥","topic":"الغرائب والذخائر","loc":419,"text":"ووجد لعبدة بنت المعز أيضا ما لا يحصى كثرة .وحدثّني بعض خزّان القصر بالقاهرة أن خزائن السيّدة عبدة ومقاصيرها وصناديقها وما يجب أن يختم عليه من موجودها، ذهب من الشمع في خواتيمه على الصحة والمشاهدة أربعون رطلاً بالمصري. وأنّ بطائق المتاع الموجود لها كتبت في ثلاثين رزمة ورقا، وحدثني من له خبرة أنه وجد لعبدة بنت المعزّ لدين الله الكبرى وهي المولودة بجيزة مصر عند ورود أبيها المعزّ إليها في سنة اثنتين وستين وثلاث مئة متاع كثير بطائقه في ثلاثين رزمة ورق في أسفاط وغيرها، وهي ست: قطر وسعود ومفدّي وصفوان ووجد لها ألف وثلاث مئة مينا فضّة محرقة، وزنُ كلّ مينا عشرة آلاف درهم، وأربع مئة سيفٍ محلّى بالذهب وثلاثون ألف شقّة صقلّية، ومن الجواهر مالا يحدّ كثرة، وزمرد كيله أردبّ واحد، وأقامت عمرها لا تأكل إلا الثريد.","tags":["الجوهر"],"partial":0,"sp":49,"kind":"prose","spLabel":"وكان في جملة ما وجد في خزا… … وكانت أختها راشدة تأكل من …"},{"id":"b7-196","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٩٦","topic":"الغرائب والذخائر","loc":420,"text":"وكانت أختها راشدة تأكل من غزلها ولا تتعرض لشيء من مال السلطان تأكله. ووجد لها طشت وإبريق من البلّور، فلما رآهما سيد الوزراء أبو محمد اليازوري فلفرط استحسانه لهما وعظيم قدرهما عنده سأل السلطان فيهما فوهبهما له .","tags":[],"partial":0,"sp":49,"kind":"prose","spLabel":"وكان في جملة ما وجد في خزا… … وكانت أختها راشدة تأكل من …"},{"id":"b7-197","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٩٧","topic":"الغرائب والذخائر","loc":421,"text":"ووجد أيضا لها مدهن ياقوت أحمر وزنه سبعة وعشرون مثقالاً أخذه سّراً من السلطان ووجده السلطان في موجود اليازوري حين قبض عليه في سنة خمسين وأربع مئة، فاستعاده. وأن اليازوري ووجوه الدولة أعظموا ما كان من وجود الطست والإبريق البّلور في تركة السيدة عبدة، فلما أخرج السلطان الذخائر المصونة عنده أيام فتنة ناصر الدولة، وجد له فيما أخرج تسعون طستاً وتسعون إبريقاً من صافي البلّور وجيّده كباراً وصغاراً. فلما رأوها هان عليهم ما كان رأوه وأعظموه .^","tags":["الجوهر","الرقيق","الذخائر"],"partial":0,"sp":50,"kind":"prose","spLabel":"ووجد أيضا لها مدهن ياقوت أ… … ووجد أيضا لها مدهن ياقوت أ…"},{"id":"b8-1","bab":8,"sec":"باب المغانم في الفتوحات — والمقاسم في الغزوات","page":"ج٨ ص١","topic":"المغانم والفتوحات","loc":422,"text":"قال أحمد بن أبي يعقوب: غنم رسول الله صلى الله عليه وسلم في يوم حنين في سنة ثمان من الهجرة من نعم هوازن اثنتي عشر ألف ناقة سوى الأسلاب. وسبى منهم سبياً كثيراً، وبلغ عددهم ألف فارس .","tags":["المجالس","المغانم","فارس"],"partial":0,"sp":1,"kind":"prose","spLabel":"قال أحمد بن أبي يعقوب: غنم… … ولما ولي الربيع بن زياد خر…"},{"id":"b8-2","bab":8,"sec":"باب المغانم في الفتوحات — والمقاسم في الغزوات","page":"ج٨ ص٢","topic":"المغانم والفتوحات","loc":423,"text":"وأصاب المسلمون يوم القادسيّة ست عشرة من الغنائم ما لم يُرَ قطّ مثله كثرةً ونفاسة .وكان كسرى أبرويز قد جمع في بيت ماله مئة أَلف ألف ألفٍ ثلاثاً، ومائتي أَلف ألف مرتين، فأقرّها شيرويه واستأنف الجمع، فمات شيرويه وهي على حالها، وأردشير بن شيرويه وهي على حالها .","tags":["المجالس","الغرائب"],"partial":0,"sp":1,"kind":"prose","spLabel":"قال أحمد بن أبي يعقوب: غنم… … ولما ولي الربيع بن زياد خر…"},{"id":"b8-3","bab":8,"sec":"باب المغانم في الفتوحات — والمقاسم في الغزوات","page":"ج٨ ص٣","topic":"المغانم والفتوحات","loc":424,"text":"وأصاب المسلمون يوم وقعة جلولآء في سنة ست عشرة ثلاثين ألف أَلف مثقال، واثنتي عشرة ألف جارية وغلام، منهم الشعبيّ .وصالح عمرو بن مالك الزهريّ في وقعة جلولآء دهقان بابل مهروذ على أن يفرش له جريب دراهمٍ، ففعل، وصالحه ومضى حتى قدم جلولآء .وصالح جرجير ملك إفريقيا عبد الله بن سعد بن أبي سرح في خلافة عثمان على ألفي ألف وخمس مئة ألف وعشرين ألف دينار، في سنة سبع وعشرين .وصالح الأحنف دهقان مرو الروذ على ستين ألف ألف درهم .وصالح عبد الله بن عامر دهقان هراة على مئة وخمسين بدرة .","tags":[],"partial":0,"sp":1,"kind":"prose","spLabel":"قال أحمد بن أبي يعقوب: غنم… … ولما ولي الربيع بن زياد خر…"},{"id":"b8-4","bab":8,"sec":"باب المغانم في الفتوحات — والمقاسم في الغزوات","page":"ج٨ ص٤","topic":"المغانم والفتوحات","loc":425,"text":"ولما ولي الربيع بن زياد خراسان في سنة اثنتين وثلاثين في خلافة عثمان صار إلى سجستان وافتتح دابق وأسر دهقاناً من دهاقين تلك الناحية فسأله أن يبيعه نفسه وعياله بما يغمر رمحاً مركوزاً من الذهب. ففعل، فجمع الدهقان من أسورة الذهب والخلاخيل ما غمر رمحاً. وانصرف الربيع بن زياد إلى البصرة بأربعين ألف فرس .^","tags":["الخيل","السلاح"],"partial":0,"sp":1,"kind":"prose","spLabel":"قال أحمد بن أبي يعقوب: غنم… … ولما ولي الربيع بن زياد خر…"},{"id":"b9-1","bab":9,"sec":"باب ذكر الكنوز والدفائن والمطالب القديمة — وذكر من وجدها","page":"ج٩ ص١","topic":"الكنوز والدفائن","loc":426,"text":"قال أبو عبيد القاسم بن سلاّم في كتابه المعروف بالأموال: إن عمرو بن العاص لما فتح مصر في سنة عشرين قال لعظماء القبط: من كان عنده مال فليأتنا به. قال: فأُتي بمال كثير. وبعث إلى عظيمِ أهل الصعيد، فقال: ما عندي مال. قال: فسجنه عمرو. وكان يسأل من يدخل إليه: هل تسمعونه يذكر أحداً ؟قالوا: نعم، راهب بالطور. فبعث عمرو إلى السجن فأخذ خاتمه وكتب كتاباً على لسانه بالرومية وختم عليه، ثم بعث به مع رسول من قِبَله إلى الراهب. فأتي بقُلّة من نحاس مختومة برصاص، فإذا فيها كتاب، وإذا فيه: يا بنيّ! إذا أردتم مالكم فاحفروا تحت الفسقية قال: فبعث عمرو الأمناء إلى الفسقية فحفروا فيها فاستخرجوا خمسين إرْدبّاً دنانير. فأخذها وضرب عنق القبطي وصلبه .وكان قيمة الكنز الذي وقع عليه أحمد بن طولون في وادي هُبَيْب ألف ألف دينار. وكان خرج إلى هناك في بعض أمره فساخت يد فرس بعض غلمانه في الرمل، فوقف عليه وأمر بكشفه، فكشف عن كنز من كنوز الأوائل فحازه .^","tags":["الخيل","الرقيق"],"partial":0,"sp":1,"kind":"prose","spLabel":"قال أبو عبيد القاسم بن سلا… … قال أبو عبيد القاسم بن سلا…"},{"id":"b10-1","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١","topic":"النفقات","loc":427,"text":"أنفق أبو عبد الله وأبو الحسين الزيديّان، منذ حصولهما في البصرة إلى وقت ورودهما واسط، عشرة آلاف ألف دينار على الرجال، وكان معهما من الرجال خمسة عشر ألف فارس على الظّهْر، وكان معهما في الماء ألفا جبليّ في الزبازب، وعشرون ألف أسود من مماليكه .وأنفق الأمير ناصر الدولة أبو محمد الحسن بن عبد الله بن حمدان من يوم دخوله مع المتقي إلى بغداد لثلاث عشرة ليلة بقيت من شوال سنة ثلاثين وثلاث مئة، وفي قتاله لأبي الحسين الزيدي بالكيل من أعمال المدائن إلى أن هزمه وفلّ عسكره، وإلى أن عاد إلى بغداد لثلاث عشرة ليلة بقين من ذي الحجة، في مدة شهرين ، ألفي ألف دينار .","tags":["الرقيق","المجالس"],"partial":0,"sp":1,"kind":"prose","spLabel":"أنفق أبو عبد الله وأبو الح… … وكان مما وجد سعد الدولة في…"},{"id":"b10-2","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢","topic":"النفقات","loc":428,"text":"فأما المُخْرَجُ من خزائن قصر أمير المؤمنين المستنصر بالله في سنتي ستين وإحدى وستين وأربع مئة حين تغّلب المارقون على دولته، واستباح المنافقون ما وجد في بت ماله وحوزته واشتدت مطالبتهم بالإيجاب والزيادة في الرسوم والواجبات، واقتسم مقدّموهم دور المكس والجبايات، ولم يبق ارتفاعٌ يعوّل بهم عليه، ولا مال في الظاهر يرجعون إليه. فإنه لم يخرج بمثله فيما تقدم من الدول منذ ظهر الإسلام إلى وقتنا هذا نفاسةً وجلالةً وغرابةً وكثرةً وحسناً وملاحة وجودةً وسناء قيمة وغلّة ثمن. على أنّ الذي أخرج يسير من كثير، وقليل من جليل، ولقد عرفني جماعة أنه نقل منه مياسيُر التجار إلى سائر الأمصار وجميع الأقطار ما صار جمالاً للملوك وذخائر، وزينة لملكهم ومفاخر، سوى ما أخذته النار، وغرق في البحار .وذلك أنه لما امتلأت قياسر مصر وأسواقها من الأمتعة المخرجة من قصر السلطان المبيعة على الناس، المنفق ثمنها في أعطيات الأتراك وغيرهم لسنة ستين وأربع مئة، ثم كثر الخوف والتشليح في الطرقات نهاراً، والخطف والقتل ليلاً، وخاف التجّار من النهب، وعادوا إلى ما في أيديهم مما اشتروا من الخسروانيّ الطميم والقرقوبي، والدبيقيّ الطميم، وغير ذلك مما نسج بالذهب من سائر الأمتعة من الكلل، والستور، والمقاطع، والثياب، والفرش وغير ذلك من المظالّ، والمنجنوقات، والبنود، وأجلة القباب والعمّارياّت، وقصب الفضّة، والآلات المجراة بالمينا والزمرد والفيروزج والدّر، وكلّ ما فيه ذهب وفضّة من منسوج ومصوغ فأحرق جميعه بالنار وسبك ذهبه.","tags":[],"partial":0,"sp":1,"kind":"prose","spLabel":"أنفق أبو عبد الله وأبو الح… … وكان مما وجد سعد الدولة في…"},{"id":"b10-3","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٣","topic":"النفقات","loc":429,"text":"وأحرق من ذلك ما لم يبق من الصنّاع من يقدر على عمل مثله ولا من الآلات الموجودة فيه، وصار كأمس الذاهب .ولما وهب السلطان لسعد الدولة المعروف (بسلام عليك) ما في خزائن البنود من جميع المتاع والآلات وغير ذلك في اليوم السادس من صفر من سنة إحدى وستين وأربع مئة حمل جميعه ليلاً.","tags":["المجالس","الذخائر","النار"],"partial":0,"sp":1,"kind":"prose","spLabel":"أنفق أبو عبد الله وأبو الح… … وكان مما وجد سعد الدولة في…"},{"id":"b10-4","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٤","topic":"النفقات","loc":430,"text":"وكان مما وجد سعد الدولة فيها ألفاً وتسع مئة درقة لمطي إلى ما سوى ذلك من آلات الحرب، وقصب الفضّة والذهب والبنود، وفي خلال ذلك سقط من بعض الفرّاشين مقطّ شمع فصادف هناك أعدال كتان ومتاعاً كثيراً فاحترق جميعه.","tags":["النار"],"partial":0,"sp":1,"kind":"prose","spLabel":"أنفق أبو عبد الله وأبو الح… … وكان مما وجد سعد الدولة في…"},{"id":"b10-5","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٥","topic":"النفقات","loc":431,"text":"وكان لذلك غلبة وخوف شديد فيما يليها من القصر ودور العامة والأسواق .وأعلمني من له خبرةٌ بما في خزانة البنود أن مبلغ ما كان فيها من سائر الآلات والأمتعة والذخائر لا تعرف قيمته عظماً، وأن المنفق عليه في كل سنة من سبعين ألف دينار إلى ثمانين ألف دينار، من وقت دخول القائد جوهر وبناء القصر من سنة ثمان وخمسين وثلاث مئة إلى هذا الوقت زائد عن مئة سنة، وأن جميعه باق على الأيام لم يتغير، وأن سائره احترق ولم يبق منه باقية، وأنه احترق في هذه الليلة من قرايات النفط عشرات ألوف.","tags":["الجوهر","الذخائر"],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان لذلك غلبة وخوف شديد ف… … وكان جالساً هناك فخر العرب…"},{"id":"b10-6","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٦","topic":"النفقات","loc":432,"text":"فأما الدرق، والسيوف، والرماح، والنشاب، فما لا يحصى بوجه ولا سبب، مع ما فيها من قصب القصة وثيابها المذهبات وغيرها، والبنود المخملة، وسروج البنادين ولجمها، وثياب الفرجية المصّبغات، وجميع العلامات والألوية والرايات .وحدّثني من أثق به أن السلطان بعد ذلك بمدة احتاج إلى إخراج شيء من السلاح لبعض مهماته فأخرج من خزانة واحدة مما بقي وسلّم خمسة عشر ألف سيف مجوهرة سوى غيرها .","tags":["الجوهر","السلاح"],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان لذلك غلبة وخوف شديد ف… … وكان جالساً هناك فخر العرب…"},{"id":"b10-7","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٧","topic":"النفقات","loc":433,"text":"وذكر بعض شيوخ دار الجوهر بمصر أنه استدعي يوماً هو وغيره من الجوهريين من أهل الخبرة بقيمة الجوهر، إلى بعض خزائن القصر، فأخرج صندوقٌ كيل منه سبعة أمداد زمرد، ذكر الجوهريّ أن قيمتها على الأقلّ ثلاث مئة ألف دينار.","tags":["الجوهر","المجالس"],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان لذلك غلبة وخوف شديد ف… … وكان جالساً هناك فخر العرب…"},{"id":"b10-8","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٨","topic":"النفقات","loc":434,"text":"وكان جالساً هناك فخر العرب ابن حمدان، وابن سنان، وابن أبي كدينة وبعض المخالفين. فقال بعض من حضر من الوزراء المطلعين للجوهريين: كم قيمة هذا الزمرد ؟فقالوا له: إنما يعرف قيمة الشيء إذا كان مثله موجوداً، ومثل هذا لا قيمة له، فاغتاظ.","tags":["الجوهر"],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان لذلك غلبة وخوف شديد ف… … وكان جالساً هناك فخر العرب…"},{"id":"b10-9","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٩","topic":"النفقات","loc":435,"text":"وقال ابن أبي كدينة: فخر العرب كثير المؤونة، وعليه خرج. فالتفت إلى كتاب الجيش وبيت المال فقال: يحسب عليّ فيه خمس مئة ألف دينار .","tags":["الشعر","الكتب"],"partial":0,"sp":3,"kind":"prose","spLabel":"وقال ابن أبي كدينة: فخر ال… … ووجد فيما وجد عدّة صناديق …"},{"id":"b10-10","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١٠","topic":"النفقات","loc":436,"text":"قال: وأخرج عقد جوهر قيمته على الأقل من ثمانين ألفاً وحواليها، فتحيّرنا فيه. فقال: يكتب بألفي دينار. وأخذ ما كان أنفذه الصليحي في نفيس الدرّ الرفيع الرائع، وكيله على ما ذكر سبع ويبات .وحدّثني من أثق به عن ابن العزيز الأنماطي أنّه قال: قوّمنا مما أخرج من خزائن القصر من سائر ألوان الخسرواني ما يزيد على خمسين ألف قطعة أكثرها مذّهب .وحدّثني بعض غلمان بيت المال أن السلطان لما اشتد أمر الأتراك وقلّ ماله وطالبوه بجراياتهم بعث إلى العميد بن أبي سعد في إحضار جوهرٍ كان عنده، فأحضر إليه منه خريطة ذكر المحدِّثُ أن فّيها نحواً من ويبة، وأنه أحضر الجوهريين وتقدّم إليهم بقيمتها، فذكر جميعهم أن لا قيمة لها ولا مشتري .","tags":["الجوهر","الغرائب"],"partial":0,"sp":3,"kind":"prose","spLabel":"وقال ابن أبي كدينة: فخر ال… … ووجد فيما وجد عدّة صناديق …"},{"id":"b10-11","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١١","topic":"النفقات","loc":437,"text":"ووجد في القصر أكثر من مئة كأس بازهر، ونصب أشباهها. وعلى أكثرها اسم الرشيد وغيره. ووجد فيه من الستور الحرير المنسوجة بالذهب على اختلاف ألوانها وأطوالها عدة مئين تقارب الألف. فيها صور الدول وملوكها، على صورة كل واحد منهم اسمه ومدة أيامه وشرح حاله.","tags":[],"partial":0,"sp":3,"kind":"prose","spLabel":"وقال ابن أبي كدينة: فخر ال… … ووجد فيما وجد عدّة صناديق …"},{"id":"b10-12","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١٢","topic":"النفقات","loc":438,"text":"ووجد فيما وجد عدّة صناديق كثيرة مملوءة سكاكين مذهبة ومفضّضة بنصب مختلفة من سائر الجوهر وألوانه محلّى بغرائب الحليّ. ووجد صناديق كثيرة مملوءة من أنواع الُدوِيّ المربعة والمدورة والصغار والكبار المعمولة من الذهب . والفضّة، والصندل، والعود، والأبنوس الزنجي، والوقواقي، والعاج، والشَوْحَط، والعنّاب وسائر أنواع الخشب، المحلاة بالجوهر والذهب والفضّة وسائر أنواع الحلي الغريبة، والصنعة المعجزة الدقيقة بجميع آلاتها وما فيها، منها ما يساوي الألف دينار والأكثر والأقل سوى ما عليها من الجواهر .","tags":["الجوهر"],"partial":0,"sp":3,"kind":"prose","spLabel":"وقال ابن أبي كدينة: فخر ال… … ووجد فيما وجد عدّة صناديق …"},{"id":"b10-13","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١٣","topic":"النفقات","loc":439,"text":"ووجد صناديق مملوءة أقلاماً مبريّة محنّشة، وغيرها من الفلفل وسائر أنواع القصب. والأقلام من براية أبي علي محمد بن علي بن مقلة وابن البوّاب وغيرهما .","tags":["الخيزرانة"],"partial":0,"sp":4,"kind":"prose","spLabel":"ووجد صناديق مملوءة أقلاماً… … ووجد خزائف مملوءة من سائر …"},{"id":"b10-14","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١٤","topic":"النفقات","loc":440,"text":"ووجد عدة ختمات بخطهما مكتوبة بالذهب المكحّل باللازورد .ووجد أيضاً عدة أزيار صيني كبار مملوءة كافوراً فنصورّياً، وعدة كثيرة من جماجم العنبر الشحريّ، والمعدنيّ، ومن المسك التبّتي وقواريره، وشجر العود الأخضر وقطعه .","tags":["الطيب","الهند والصين"],"partial":0,"sp":4,"kind":"prose","spLabel":"ووجد صناديق مملوءة أقلاماً… … ووجد خزائف مملوءة من سائر …"},{"id":"b10-15","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١٥","topic":"النفقات","loc":441,"text":"ووجد خزائن مملوءة من سائر أنواع الصيني من سائر ما يستعمله الناس، وستة منها في بعضها أجاجين صيني كبار وصغار محمولة على ثلاثة أرجل على صور الوحوش، والسباع. والبهائم، قيمة كلّ قطعة منها ألف دينار معمولة لغسل الثياب .","tags":["الذخائر","الهند والصين"],"partial":0,"sp":4,"kind":"prose","spLabel":"ووجد صناديق مملوءة أقلاماً… … ووجد خزائف مملوءة من سائر …"},{"id":"b10-16","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١٦","topic":"النفقات","loc":442,"text":"ووجد خزائف
