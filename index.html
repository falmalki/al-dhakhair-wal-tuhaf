<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الذخائر والتحف">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>الذخائر والتحف — كشكول رقمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%23fbf7ef'/%3E%3Crect x='14' y='14' width='152' height='152' rx='30' fill='%238a5a2b'/%3E%3Ctext x='90' y='118' font-size='86' text-anchor='middle' fill='%23fffdf8'%3Eذ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf7ef; --card:#fffdf8; --ink:#2c241b; --muted:#6e6154; --accent:#8a5a2b;
  --accent-soft:#f2e6d5; --border:#e6dccb; --ok:#2e6b47; --ok-soft:#e6f3eb;
  --poem-bg:#faf4e8; --poem-border:#eadec9; --note-bg:#f8f2e7; --edit-bg:#f4efe6;
  --hl-color:#fde68a; --font-family:'Readex Pro',sans-serif; --font-size:19px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;max-width:100%;overflow-x:hidden;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-family);font-size:var(--font-size);line-height:1.9;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.container{width:100%;max-width:820px;margin:0 auto;padding:0 12px;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:60;background:rgba(251,247,239,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:calc(6px + env(safe-area-inset-top)) 12px 6px}
.topbar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0;line-height:1.2}
.brand b{display:block;font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--border);background:var(--card);border-radius:12px;min-width:44px;width:44px;height:44px;padding:0 4px;font-size:18px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:70;background:rgba(251,247,239,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:5px 2px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;min-width:0;min-height:64px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);padding:5px 1px;border-radius:12px;line-height:1.2}
.tabbar button .ic{font-size:27px;line-height:1.1}
.tabbar button span:last-child{white-space:nowrap;font-size:12px}
.tabbar button.on{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.tab{display:none}.tab.on{display:block}
.section-title{font-size:15px;font-weight:700;color:var(--accent);margin:16px 2px 8px;display:flex;align-items:center;justify-content:space-between}
.section-title small{font-size:11px;font-weight:400;color:var(--muted)}
.pill-strip{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pill-strip::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 13px;min-height:42px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.banner{background:var(--accent-soft);border:1px solid var(--border);border-radius:14px;padding:9px 12px;margin:6px 0 10px;font-size:12px;color:var(--muted);line-height:1.7}
.banner b{color:var(--accent);font-size:13px}
.histbar{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 2px;scrollbar-width:none}
.histbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 11px;min-height:36px;font-size:12px;color:var(--muted)}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;margin:6px 0 10px}
.ctrl select{flex:1 1 auto;min-width:0;max-width:100%;border:1px solid var(--border);background:var(--card);border-radius:11px;padding:8px 9px;font-size:13px;min-height:44px}
.btn-soft{border:1px solid var(--border);background:var(--card);border-radius:11px;padding:8px 11px;font-size:13px;color:var(--accent);min-height:44px}
.btn-soft:active{background:var(--accent-soft)}
.btn-ok{border:1px solid var(--ok);background:var(--ok-soft);border-radius:11px;padding:8px 11px;font-size:13px;color:var(--ok);font-weight:700;min-height:44px}
.btn-acc{border:1px solid var(--accent);background:var(--accent);border-radius:11px;padding:9px 13px;font-size:13px;color:#fff;font-weight:700;min-height:44px}
.nav-btn{min-width:92px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 8px}
.nav-btn .arrow{font-size:23px;line-height:1;font-weight:700}
.nav-icon{flex:0 0 46px;width:46px;min-width:46px;min-height:44px;padding:0;font-size:22px;display:inline-flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 2px 8px rgba(44,36,27,.03)}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--border);padding-bottom:8px;margin-bottom:10px;direction:rtl}
.chead .sec{font-size:11px;color:var(--muted);line-height:1.6;min-width:0;flex:1}
.locbadge{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;background:none;border:0;padding:0}
.badge{display:inline-block;font-size:10px;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
.badge-edited{background:#e8f0fa;color:#2a5d94}
.badge-partial{background:var(--accent-soft);color:var(--accent)}
.card-text{line-height:1.95;text-align:justify;word-break:break-word;font-size:calc(var(--font-size) - 1px)}
.card-text p{margin:0 0 8px}
.verse-frame{background:var(--poem-bg);border:1px solid var(--poem-border);border-radius:12px;padding:12px 14px;margin:4px 0 10px;text-align:right}
.verse-row{display:flex;gap:14px;line-height:2.05}
.verse-sadr,.verse-ajz{flex:1;min-width:0;text-align:right}
.verse-row+.verse-row{border-top:1px dashed var(--poem-border);margin-top:5px;padding-top:5px}
.attribution{font-size:12px;color:var(--muted);margin-bottom:6px;text-align:right}
.index-list{display:flex;flex-direction:column;gap:2px}
.index-list button{text-align:right;background:none;border:0;border-bottom:1px dashed var(--border);padding:6px 4px;font-size:13px;color:var(--accent);border-radius:6px}
.benefit-strip{background:var(--note-bg);border-right:3px solid var(--accent);border-radius:8px;padding:7px 10px;font-size:12px;margin:8px 0;white-space:pre-wrap;line-height:1.8}
.acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:9px;margin-top:8px}
.acts button{font-size:12px;min-height:42px;padding:7px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted)}
.acts button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.acts button.mem-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.benefit-box{margin-top:8px;background:var(--note-bg);border-radius:10px;padding:8px}
.benefit-box textarea,.edit-box textarea{width:100%;min-height:74px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px;font-size:13px;resize:vertical;line-height:1.8}
.edit-box{background:var(--edit-bg);border-radius:10px;padding:8px;margin-top:8px}
.near{font-size:11px;color:var(--muted);background:var(--note-bg);border-radius:8px;padding:7px 9px;margin-top:8px}
.near a{display:block;color:var(--accent);text-decoration:none;padding:2px 0}
.statsbar{display:flex;flex-wrap:wrap;gap:6px;background:var(--accent-soft);border-radius:12px;padding:8px;margin-top:10px;font-size:11px;color:var(--muted)}
.statsbar span{background:var(--card);border-radius:999px;padding:3px 9px}
.result{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;margin:8px 0;font-size:13px;line-height:1.8}
.result .meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.result a{color:var(--accent);text-decoration:none;font-size:11px;font-weight:700}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.tag{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--accent)}
.tag.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text],input[type=number],input[type=search]{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px;width:100%;font-size:13px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}
.row label{font-size:12px;color:var(--muted)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);padding:0}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.path{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:9px 0}
.path h4{margin:0 0 4px;font-size:14px;color:var(--accent)}
.path p{margin:4px 0;font-size:12px;color:var(--muted);line-height:1.8}
.teaser{background:var(--poem-bg);border:1px solid var(--poem-border);border-radius:10px;padding:9px;font-size:12px;line-height:1.9}
.progress{height:6px;background:var(--border);border-radius:999px;overflow:hidden;margin:7px 0}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(44,36,27,.45);display:none;align-items:flex-end;justify-content:center;padding:10px}
.modal.on{display:flex}
.modal-in{width:100%;max-width:640px;background:var(--card);border-radius:18px;padding:16px;max-height:86vh;overflow:auto}
.modal-in h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
.quote{border-right:3px solid var(--accent);background:var(--poem-bg);padding:8px 10px;border-radius:8px;font-size:13px;margin:8px 0;line-height:1.9}
.fabs{position:fixed;z-index:80;display:none;bottom:calc(104px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 17px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fabs.on{display:block}
#topBtn{position:fixed;z-index:65;bottom:calc(104px + env(safe-area-inset-bottom));right:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--accent);font-size:20px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#topBtn.on{display:block}
#toast{position:fixed;z-index:120;bottom:calc(108px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.focus .acts,.focus .near,.focus .benefit-strip{display:none!important}
@media (max-width:600px){
  .verse-row{display:block}.verse-sadr,.verse-ajz{display:block;width:100%;text-align:right}.verse-row+.verse-row{border-top:1px dashed var(--poem-border);margin-top:6px;padding-top:6px}
  .card{padding:13px}.card-text{font-size:calc(var(--font-size) - 2px)}
  .pill{min-height:44px;padding:9px 14px;font-size:13px}
  .tabbar button{min-height:66px}.tabbar button .ic{font-size:27px}.tabbar button span:last-child{font-size:12px}
  .btn-soft,.btn-acc,.ctrl select{min-height:46px;font-size:13px}
  .nav-btn{min-width:90px;min-height:46px}.nav-btn .arrow{font-size:23px}
  .nav-icon{flex:0 0 46px;width:46px;min-width:46px;min-height:46px;font-size:22px}
  .acts button{min-height:44px;font-size:12px}
  .tag{min-height:38px;padding:6px 11px;font-size:12px}
  .locbadge{font-size:13px}
}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand"><b>الذخائر والتحف</b><small>كشكول رقمي · القاضي الرشيد بن الزبير</small></div>
  <button class="icon-btn" id="aMinus" title="تصغير الخط">A−</button>
  <button class="icon-btn" id="aPlus" title="تكبير الخط">A+</button>
  <button class="icon-btn" id="locTop" title="الموقع">📍</button>
</div></div>

<div class="container">
  <div id="err" style="display:none;background:#fde8e8;border:1px solid #d99;padding:8px;border-radius:10px;font-size:12px"></div>

  <section class="tab on" id="tab-read">
    <div id="histbar" class="histbar"></div>
    <div id="returnBar"></div>
    <div class="pill-strip" id="topics"></div>
    <div class="banner" id="banner"></div>
    <div class="ctrl">
      <button class="btn-soft nav-icon" id="prevTop" aria-label="السابق" title="السابق">←</button>
      <select id="pageSel" aria-label="الصفحة"></select>
      <button class="btn-soft nav-icon" id="locBtn" aria-label="الموقع" title="الموقع">📍</button>
      <button class="btn-soft nav-icon" id="myPos" aria-label="موضعي" title="موضعي">🎯</button>
      <button class="btn-soft nav-icon" id="nextTop" aria-label="التالي" title="التالي">→</button>
    </div>
    <div id="readCards"></div>
    <div class="ctrl" style="justify-content:center">
      <button class="btn-soft nav-btn" id="prevBot"><span class="arrow">←</span> السابق</button>
      <button class="btn-acc" id="markBm">حفظ مكان القراءة</button>
      <button class="btn-soft nav-btn" id="nextBot">التالي <span class="arrow">→</span></button>
    </div>
    <div class="statsbar" id="statsRead"></div>
  </section>

  <section class="tab" id="tab-daily">
    <div class="section-title">أبيات اليوم <small>اختيار يومي ثابت من مختاراتك</small></div>
    <div id="daily"></div>
    <div class="section-title">مسارات القراءة <small>اقتراحات للقراءة فقط — بلا اختبارات</small></div>
    <div id="paths"></div>
  </section>

  <section class="tab" id="tab-fav">
    <div id="collections"></div>
    <div class="statsbar" id="statsFav"></div>
  </section>

  <section class="tab" id="tab-search">
    <div id="searchReturn"></div>
    <div class="section-title">بحث في النص والفوائد</div>
    <input type="search" id="q" placeholder="ابحث بلا تشكيل…">
    <div class="tags" id="tagChips"></div>
    <div class="section-title">دليل الأعلام <small>اضغط للتصفية</small></div>
    <div class="tags" id="authorIdx"></div>
    <div id="results"></div>
  </section>

  <section class="tab" id="tab-settings">
    <div id="settings"></div>
  </section>
</div>

<nav class="tabbar" aria-label="التنقل الرئيسي">
  <button data-tab="read" class="on"><span class="ic">📖</span><span>قراءة</span></button>
  <button data-tab="daily"><span class="ic">🌙</span><span>أبيات اليوم</span></button>
  <button data-tab="fav"><span class="ic">⭐</span><span>مختاراتي</span></button>
  <button data-tab="search"><span class="ic">🔍</span><span>بحث</span></button>
  <button data-tab="settings"><span class="ic">⚙️</span><span>الإعدادات</span></button>
</nav>

<button id="topBtn" title="أعلى">↑</button>
<button class="fabs" id="hlFloat">تظليل المحدد ✎</button>
<div id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-in">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="row"><button class="btn-acc" id="modalOk">حفظ</button><button class="btn-soft" id="modalCancel">إلغاء</button></div>
  </div>
</div>

<script>window.__BOOK__.push({"id":"b2-1","bab":2,"sec":"الذخائر والتحف","page":"ج٢ ص١","topic":"المقدمة","loc":1,"text":"كتاب الذخائر والتحف للقاضي الرشيد بن الزبير فيه ذكر الهدايا والتحف العظيمة الأقدار والنفقات في الولائم والدعوات والإعذارات والحذاقات","tags":["الولائم"],"partial":0,"sp":1,"kind":"prose","spLabel":"كتاب الذخائر والتحف للقاضي… … كتاب الذخائر والتحف للقاضي…"},{"id":"b3-1","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١","topic":"الهدايا","loc":2,"text":"ولنذكر نكتاً من مشاهير الهدايا العظيمة الأقدار، وطرفاً من التحف الجسيمة الأخطار، قبل الإسلام وبعده أما هدايا الملوك والجلّة بعضهم لبعض، ورسائلهم، فقد ذكر جماعة من المؤرخين الثقات ما كان كتب به ملك الصين إلى كسرى أنوشروان حين هادنه وهو :( من ملك الصين صاحب قصر الدر والجوهر، الذي يجري في قصره نهران يسقيان العود والكافور، الذي يوجد رائحته على فرسخين، والذي يخدمه بنات ألف ملك، والذي في مربطه ألف فيل) .","tags":["الجوهر"],"partial":0,"sp":1,"kind":"prose","spLabel":"ولنذكر نكتاً من مشاهير اله… … وأهدى كسرى إبرويز إلى قيصر…"},{"id":"b3-2","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢","topic":"الهدايا","loc":3,"text":"وكانت الهديّة: فارساً بفرسه من درّ منضد. عينا الفارس والفرس من ياقوت أحمر، وقائم سيفه من سَفَنٍ نابت منضَّد، عليه الجوهر. وثوب صينيٌّ حرير (كذا) عُشاري، فيه صورة الملك جالساً في إيوانه، وعليه حلتاه وتاجه، وعلى رأسه الخدم. بأيديهم المذابّ، مصورة منسوجة بالذَّهب الأحمر، وأرض الثوب لازوردي، في سفط مذهّب، تحمله جارية تتلألأ جمالاً .هديّة ملك الهند أيضاً: وأهدى إليه ألف مَنَا من العود الهندي يذوب في النَّار كالشمع، ويختم عليه فتتبين الكتابة. وجام ياقوت أحمر، فتحه شبر في شبر مملوءاً دراً. وعشرة أمنان كافور كالفستق وأكبر .وجاريةً طولها سبعة أذرع، تضرب أشفار عينيها خديها، وكان يتبين لمعان البرق من بياض مبسمها، مقرونة الحواجب، لها ضفائر شعر تجرّرها. وفرشاً من جلود الحيات، ألين من الحرير وأحسن من الوشي. وكتابه كان بالدّرِّ والذَّهب في لحاء شجر الكاذي .وقد كان ملك التبّت أيضاً كتب إليه وأهدى له من معسكره  - وكان ملك التبّت منازلاً لعدو له  - مئة تبّتية مذهبة، وألف مَنَا مسكا .","tags":[],"partial":0,"sp":1,"kind":"prose","spLabel":"ولنذكر نكتاً من مشاهير اله… … وأهدى كسرى إبرويز إلى قيصر…"},{"id":"b3-3","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣","topic":"الهدايا","loc":4,"text":"وكانت هدايا النَّيروز، المحمولة إلى ملوك فارس في كل سنة من دهاقين العراق، عشرة آلاف ألف، وهدايا المهرجان مئة ألف أَلف. ثم حُملت إلى الخلفاء في الإسلام .","tags":["العراق"],"partial":0,"sp":1,"kind":"prose","spLabel":"ولنذكر نكتاً من مشاهير اله… … وأهدى كسرى إبرويز إلى قيصر…"},{"id":"b3-4","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤","topic":"الهدايا","loc":5,"text":"وأهدى كسرى إبرويز إلى قيصر ملك الروم حين زوجه ابنته مريم،  - وهي أم ولده شيرويه بن كسرى، وهو الذي قتل أباه وأخته بوران  - ما قيمته عشرة آلاف بدرة، بعد أن كان قسم فيمن صحبه من الروم من أصحاب قيصر، ألفين وخمس مئة بدرة. من ذلك ألف لبنة من ذهب، زنة كل لبنة منها ألف مثقال. ومن المال الصامت خمس مئة بدرة، وألف لؤلؤة صافية ثمن كل لؤلؤة أربعة آلاف درهم، وألف استبرقة ملينة ملحّمة منسوجة بالذَّهب، قيمة كل استبرقة منها أربعة آلاف درهم، وألف برذون فتيّ، من نتاج الملوك، قيمة كل برذون منها ألفا درهم، وقيل: أربعة آلاف درهم .","tags":[],"partial":0,"sp":1,"kind":"prose","spLabel":"ولنذكر نكتاً من مشاهير اله… … وأهدى كسرى إبرويز إلى قيصر…"},{"id":"b3-5","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥","topic":"الهدايا","loc":6,"text":"وأما هدايا النَّبيّ صلَّى الله عليه وسلَّم التي أهداها لمن أراد من مسلم أو مشرك، فإنه صلى الله عليه وسلم حين أصاب مشركي قريش السَّنَةُ، وزاد عليهم القحط، وذلك في سنة خمس من الهجرة، أرسل إلى أبي سفيان بن حرب وإلى سهيل بن عمرو، وإلى صفوان بن أمية بحمل نوى من ذهب، بينهم أثلاثاً. فقبل أبو سفيان وأبي سهيل وصفوان أن يقبلا .","tags":[],"partial":0,"sp":2,"kind":"prose","spLabel":"وأما هدايا النَّبيّ صلَّى … … وكانتا لهما شأن في القبط ع…"},{"id":"b3-6","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦","topic":"الهدايا","loc":7,"text":"وأهدى أبو سفيان إلى النَّبيّ صلَّى الله عليه وسلَّم سلاحاً فقبله .وذكر العلماء أن النواة: خمسة دراهم .فأما الهدايا في الإسلام التي أهديت إليه صلى الله عليه وسلم وإلى الخلفاء بعده، فإن جريج بن مينا  - وهو المقوقس، عامل قيصر ملك الروم على مصر والإسكندرية وأعمالهما  - لما راسله رسول الله صلى الله عليه وسلم بحاطب بن أبي بلتعة الضبي، في سنة سبع من الهجرة، يدعوه إلى الإسلام، عاد إلى رسول الله صلى الله عليه وسلم في ذي القعدة من السنة المذكورة بجواب رسالته ومعه رسول من قبل جريج.","tags":["مصر"],"partial":0,"sp":2,"kind":"prose","spLabel":"وأما هدايا النَّبيّ صلَّى … … وكانتا لهما شأن في القبط ع…"},{"id":"b3-7","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧","topic":"الهدايا","loc":8,"text":"وأهدى إليه أربع جوار، منهن جاريتان أختان هما مارية وسيرين. وكانت مارية وأختها من ضيعة من عمل أنصنا تعرف بحفن، من صعيد مصر.","tags":["الأعذارات","المجالس"],"partial":0,"sp":2,"kind":"prose","spLabel":"وأما هدايا النَّبيّ صلَّى … … وكانتا لهما شأن في القبط ع…"},{"id":"b3-8","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨","topic":"الهدايا","loc":9,"text":"وكانتا لهما شأن في القبط عظيم. وجمال بارع، لم يكن بمصر أحسن منهما. وخصيّاً مجبوباً يقال له: مابور، ويقال: إنه أخو مارية وسيرين، يخدمهما، ومات بالمدينة. وبغلة شهباء، سماها رسول الله صلى الله عليه وسلم (دلدل) بسرجها ولجامها، وماتت في خلافة معاوية. وحماراً سماه عليه السلام (يعفور)، أشهب، وفرساً سمّاه عليه السلام (لزازاً) وألف مثقال ذهباً، وعشرين ثوباً من قباطي مصر، مع طرف من طرفهم. وعسلاً من عسل بنها  - ضيعة أسفل مصر  - وربعة إسكندرانية، كان بعد ذلك يجعل فيهما جهازه من مكحلةٍ ومشط وما سوى ذلك .","tags":["الخيل","مصر"],"partial":0,"sp":2,"kind":"prose","spLabel":"وأما هدايا النَّبيّ صلَّى … … وكانتا لهما شأن في القبط ع…"},{"id":"b3-9","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩","topic":"الهدايا","loc":10,"text":"ووهب لحاطب بن أبي بلتعة مئة دينار وخمسة أثواب .وخلا به، وساءَله، وأحسن مثواه وضيافته. فقبل صلى الله عليه وسلم جميع ذلك. واتخذ مارية لنفسه، وكان بها معجباً. وحولها إلى ماله بالعالية وأولدها إبراهيم ولده .","tags":["النار"],"partial":0,"sp":3,"kind":"prose","spLabel":"ووهب لحاطب بن أبي بلتعة مئ… … وتصدق بالمال. وأعجبه العسل…"},{"id":"b3-10","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠","topic":"الهدايا","loc":11,"text":"وكان عليه الصلاة والسلام لا يرد هديّة أحد من الناس، ويكافئ عليها. ووهب سيرين أخت مارية، لحسان بن ثابت، فأولدها ولده عبد الرحمن.","tags":["الرقيق"],"partial":0,"sp":3,"kind":"prose","spLabel":"ووهب لحاطب بن أبي بلتعة مئ… … وتصدق بالمال. وأعجبه العسل…"},{"id":"b3-11","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١","topic":"الهدايا","loc":12,"text":"ووهب الثالثة لمحمد بن مسلمة الأنصاري. وقيل: بل وهبها لدحية بن خليفة الكلبي .ووهب الأخرى لجهم بن قيس العدوي، فهي أم زكريا بن الجهم الذي كان خليفة عمرو بن العاص على مصر .","tags":["مصر"],"partial":0,"sp":3,"kind":"prose","spLabel":"ووهب لحاطب بن أبي بلتعة مئ… … وتصدق بالمال. وأعجبه العسل…"},{"id":"b3-12","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٢","topic":"الهدايا","loc":13,"text":"وتصدق بالمال. وأعجبه العسل، فدعا لعسل بنها بالبركة وبقيت تلك الثياب حتى كفن في بعضها صلوات الله عليه .وكانت البغلة والحمار أحب دوابه إليه.","tags":["الخيل"],"partial":0,"sp":3,"kind":"prose","spLabel":"ووهب لحاطب بن أبي بلتعة مئ… … وتصدق بالمال. وأعجبه العسل…"},{"id":"b3-13","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٣","topic":"الهدايا","loc":14,"text":"وكانت مارية وأختها سيرين متساويتين في الجمال والحسن. فلما نظر إليهما صلى الله عليه وسلم، أعجبتاه وكره أن يجمع بينهما .وكانت إحداهما تشبه الأخرى. فقال: اللهم اختر لنبيك. فاختار له مارية. وذلك أنه قال لهما: (قولا: نشهد أن لا إله إلا الله وأن محمداً عبده ورسوله ). فبدرت مارية فتشهدت وآمنت قبل أختها بساعة. ثم تشهدت. فاختارها عليها .وكتب ملك الصين إلى معاوية بن أبي سفيان: من ملك الأملاك الذي تخدمه بنات ألف ملك، والذي بُنيت داره بلبن الذَّهب، والذي في مربطه ألف فيل، والذي له نهران يسقيان العود والكافور، الذي يوجد ريحه من عشرين ميلاً .إلى ملك العرب الذي يتعبد الله ولا يشرك به شيئاً .أما بعد، فإني قد أرسلت إليك هديّة، وليست بهديّة، ولكنها تحفة، فابعث إليّ بما جاء به نبيكم من حرام وحلال، وأبعث إليّ من يبينذه لي. والسلام .","tags":[],"partial":0,"sp":4,"kind":"prose","spLabel":"وكانت مارية وأختها سيرين م… … وأهدى معاوية بن أبي سفيان …"},{"id":"b3-14","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٤","topic":"الهدايا","loc":15,"text":"وكانت الهديّة كتاباً من سرائر علومهم. فيقال إنه صار بعد ذلك إلى خالد بن يزيد بن معاوية. وكان يعمل منه الأعمال العظيمة من الصنعة وغيرها .","tags":["بني أمية","الكتب"],"partial":0,"sp":4,"kind":"prose","spLabel":"وكانت مارية وأختها سيرين م… … وأهدى معاوية بن أبي سفيان …"},{"id":"b3-15","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٥","topic":"الهدايا","loc":16,"text":"ولما هم الوليد ببناء مسجد دمشق في سنة ثمان وثمانين أهدى إليه ملك الروم حينئذ مئة ألف مثقال ذهباً، وأربعين وقراً فسيفساء، وألف فاعل بعثهم إليه .وحين رجع سالم بن زياد من خراسان إلى البصرة في سنة خمس وستين، وكان والياً عليها، دعا كاتبه اصطفانوس، فوزن له اثني عشر ألفَ ألفِ مثقال، وقال له: أحفظه، فما فيه درهم واحد ظلم فيه مسلم ولا معاهد. فقال اصطفانوس بالفارسية: فمن أين هذا كله ؟ففطن له سالم، فقال: من هدايا العمال وأهل الكور والدهاقين .","tags":[],"partial":0,"sp":4,"kind":"prose","spLabel":"وكانت مارية وأختها سيرين م… … وأهدى معاوية بن أبي سفيان …"},{"id":"b3-16","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٦","topic":"الهدايا","loc":17,"text":"وأهدى معاوية بن أبي سفيان إلى عائشة رضي الله عنها حلقاً من ذهب فيه جوهر بمائة ألف درهم. فقسَّمته بين أزواج النَّبيّ صلَّى الله عليه وسلَّم .","tags":[],"partial":0,"sp":4,"kind":"prose","spLabel":"وكانت مارية وأختها سيرين م… … وأهدى معاوية بن أبي سفيان …"},{"id":"b3-17","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٧","topic":"الهدايا","loc":18,"text":"ولما قدم سليمان بن عبد الملك المدينة، حين حج في سنة سبع وتسعين، أهدى إليه خارجةُ ابن زيد بن ثابت ألف عذق موز، وألف قرعة عسل أبيض، وألف شاة .ومائة أوزة، وألف دجاجة، ومائة جزور. فقال سليمان: أجحفت نفسك يا خارجة! ما كنت تصنع بهذا في هذا الموضع ؟فقال: يا أمير المؤمنين! قدمت بلد رسول الله صلى الله عليه وسلم، ونزلت في أهلي بني مالك بن النجار، وأنت ضيف. وإنما هذا قرى. فقال: يغفر الله لك. ثم قال سليمان: هذا وأبيكم السؤدد. رجل أهدى إلي. وسمّى كل ما أهدى من الأصناف له حتى أتى على آخرها. ثم سأله ما عليه من الدين ؟فقال: خمسة وعشرون ألف دينار. فقال: اقضوها عنه.","tags":[],"partial":0,"sp":5,"kind":"prose","spLabel":"ولما قدم سليمان بن عبد الم… … ذكر ابن العريف، أحد خُزَّا…"},{"id":"b3-18","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٨","topic":"الهدايا","loc":19,"text":"وأمر له بعشرة آلاف دينار .وهلك خارجة في السنة التي صدر فيها سليمان من الحج .وأُهدي إلى سليمان بن عبد الملك لؤلؤٌ. فقال للرسول، وقد وافاه وهو في ملحفة حمراء: انثره في هذه الملحفة الحمراء.","tags":["الجوهر"],"partial":0,"sp":5,"kind":"prose","spLabel":"ولما قدم سليمان بن عبد الم… … ذكر ابن العريف، أحد خُزَّا…"},{"id":"b3-19","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٩","topic":"الهدايا","loc":20,"text":"قال الرسول: فنثرته. فما رأيت شيئاً قط أحسن من بياض اللؤلؤ على الملحفة الحمراء. وجارية قائمة على رأسه فقالت: أعطني يا أمير المؤمنين! فحثا لها بيده. فوضعته. ثم قالت: زدني. فأعطاها أكثر من ثلثيه. ثم قالت له: ما تصنع بهذا الباقي ؟فدفعه إليها .فقلت: قد جُمع هذا وظُلم فيه الناس، ثم أخذته هذه .ومثل ذلك من فعل سليمان بن عبد الملك، ما فعله أبو المنصور نزار بن معد العزيز بالله بن المعزّ، في الدولة العلوية.","tags":["الجوهر"],"partial":0,"sp":5,"kind":"prose","spLabel":"ولما قدم سليمان بن عبد الم… … ذكر ابن العريف، أحد خُزَّا…"},{"id":"b3-20","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢٠","topic":"الهدايا","loc":21,"text":"ذكر ابن العريف، أحد خُزَّان بيت المال في أيام المستنصر بالله، قال: قال لي جدي: كنت مع المعز لدين الله في جملة خُزّانه بالمغرب. فلما صار إلى مصر، واستقرت به الدار، سألني عن صندوق صغير محدد كان معه في مضربه لا يفارقه إلى أن صار بمصر، وجعله في خزانة الجوهر. فبحثت عنه، وأمرت الخزان بالتفتيش عليه، فلم يجدوه. وكنت عنده موثقاً، فأعلمته، فغفل عنه. ومضت الأيام وتوفي المعز لدين الله، وانتقل الأمر إلى ولده العزيز بالله. فإني ذات يوم جالس بالخزانة، وبعض الخزان يكنسها، إذ انكشف لي صندوق صغير قد جعل عتبةً لبابها وارتكبه التراب وغاب فيه. فأمرت بكشفه واستخرجته من التراب، فإذا هو الصندوق الذي التمسه مني المعز لدين الله فلم أجده.","tags":["الجوهر","المجالس"],"partial":0,"sp":5,"kind":"prose","spLabel":"ولما قدم سليمان بن عبد الم… … ذكر ابن العريف، أحد خُزَّا…"},{"id":"b3-21","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢١","topic":"الهدايا","loc":22,"text":"فتحيلت في الوصول إلى العزيز بالله وأعلمته به، وحدثته الحديث على جهته. فقال لي: أذكرني به حتى آمرك بما تفعل فيه. فأذكرته، فأمرني بإفراغه على بساط بسطه في الخزانة، وأن أعلمه بذلك، وأن لا أقيم فيها إذا علمت قربه منها. ففعلت ما أمرني به، وأفرغته على البساط، فرأيت منه ما هالني وأفرغني حسناً وجلالة وعظم قدر. ورأيت من حب الجوهر الكبار ما لم أر قط مثله. وأقمت عنده أحفظه إلى أن قرب من الخزانة فتنحيت عنه ناحية واختفيت في مكان بحيث أرى وأسمع. فدخل ومعه من لا أحصيه من خواص الجواري والخدم، ومعه السيدة دُرّزان، وكل ملهية في القصر، فارتجت الخزانة بالمغاني بسائر أنواع الملاهي. وأحضر له شراب فشرب وسقاهن. فلما قارب الانصراف، وازداد سروره، أمرهن بنهبه جميعاً، ولم يبق منه حبة واحدة .وانصرف وهن معه.","tags":["الجوهر","الذخائر","النساء"],"partial":0,"sp":6,"kind":"prose","spLabel":"فتحيلت في الوصول إلى العزي… … وأهدى حسان القبطي إلى هشام…"},{"id":"b3-22","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢٢","topic":"الهدايا","loc":23,"text":"وخرجت لحفظ الخزانة، وقد لحقني على ذلك الجوهر من الحسرة والكآبة والأسف على أن لا أكون فزت منه بشيءٍ، ما يعلم الله كنهه .","tags":["الجوهر","الذخائر"],"partial":0,"sp":6,"kind":"prose","spLabel":"فتحيلت في الوصول إلى العزي… … وأهدى حسان القبطي إلى هشام…"},{"id":"b3-23","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢٣","topic":"الهدايا","loc":24,"text":"وذكر المدائني أن ملك الهند أهدى إلى الجنيد بن عبد الرحمن أيام ولايته السند، في خلافة هشام بن عبد الملك، ناقة مرصعة بالجوهر قد ملئت أخلافها لؤلؤاً، ونحرها ياقوتاً أحمر، على عجل من فضة. إذا تركت على الأرض تحركت العجل فمشت الناقة. فبعث بها الجنيد إلى هشام، فاستحسنها. ثم إن الذي جاء بها بزل أخلافها، فانتثر اللؤلؤ في علبة ذهب كانت معه. وفك عنقها، فسال الياقوت منه كأنه الدم. فأعجب بها هشام وجميع من كان في مجلسه. ولم تزل في خزائن بني أمية حتى صارت إلى بني العباس .","tags":[],"partial":0,"sp":6,"kind":"prose","spLabel":"فتحيلت في الوصول إلى العزي… … وأهدى حسان القبطي إلى هشام…"},{"id":"b3-24","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢٤","topic":"الهدايا","loc":25,"text":"وأهدى حسان القبطي إلى هشام بن عبد الملك كساً وعطراً وألطافاً لولده ونسائه وأمهات أولاده من طرائف العراق ما قيمتها مئة ألف دينار .","tags":[],"partial":0,"sp":6,"kind":"prose","spLabel":"فتحيلت في الوصول إلى العزي… … وأهدى حسان القبطي إلى هشام…"},{"id":"b3-25","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢٥","topic":"الهدايا","loc":26,"text":"وكان في جملة ما قدم به عبيدة بن عبد الرحمن القيسي والي إفريقية وسائر المغرب إلى هشام بن عبد الملك من هداياه في سنة أربع عشرة ومائة، عشرون ألف عبد وأَمة، ومن صفايا الجواري المتخيرة سبع مئة جارية. ومثل ذلك من الخصيان، ومن الخيل والدواب والذَّهب والفضة والآنية ما لا يحصى كثرة .","tags":[],"partial":0,"sp":7,"kind":"prose","spLabel":"وكان في جملة ما قدم به عبي… … (وكنا إذا عزّ الخضاب بأرضن…"},{"id":"b3-26","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢٦","topic":"الهدايا","loc":27,"text":"وذكر العلايي في كتاب (الأجواد)، أن صبيحاً الكاتب قال: بعث عمر بن يوسف الثقفي إلى هشام بن عبد الملك بياقوتة حمراء يخرج طرفاها من كفه، وحبة لؤلؤ أعظم ما يكون من الحب. فدخل الرسول إليه. فلم ير وجه هشام من طول السرير وكثرة الفرش. فتناول الحجر والحبة منه وقال: أَكَتَبَ معك بوزنهما ؟فقال: ومن أين يوجد مثلهما.","tags":["الجوهر","الرقيق"],"partial":0,"sp":7,"kind":"prose","spLabel":"وكان في جملة ما قدم به عبي… … (وكنا إذا عزّ الخضاب بأرضن…"},{"id":"b3-27","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢٧","topic":"الهدايا","loc":28,"text":"وكانت الياقوتة للرائقة جارية خالد بن عبد الله القسري، اشترتها بثلاثة وسبعين ألف دينار .وكتب أبو جعفر المنصور بالله إلى معن بن زائدة حين كان ولاّه اليمن في سنة اثنتين وأربعين ومائة يستهديه عطراً، فوجه إليه مئة جراب خِطْراً في كل جراب كيس فيه ألف دينار. وكتب إليه: (يا أمير المؤمنين! تقدم بحفظ نخالة هذا الخِطر) فلما وصل إلى المنصور، ووقف على ما في الجراب، قال :","tags":["الجوهر"],"partial":0,"sp":7,"kind":"prose","spLabel":"وكان في جملة ما قدم به عبي… … (وكنا إذا عزّ الخضاب بأرضن…"},{"id":"b3-28","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢٨","topic":"الهدايا","loc":29,"text":"(وكنا إذا عزّ الخضاب بأرضنا ... بعثنا إلى معنٍ فأهدى لنا خطراً)\n(وأهدى دنانيراً وأهدى دراهماً ... وأهدى لنا بزّاً وأهدى لنا عطراً)\n(وما الناس إلا سيّدان فواحدٌ ... قريشٌ وشيبان التي قرعت بَكراً)","tags":[],"partial":0,"sp":7,"kind":"verse","spLabel":"وكان في جملة ما قدم به عبي… … (وكنا إذا عزّ الخضاب بأرضن…"},{"id":"b3-29","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٢٩","topic":"الهدايا","loc":30,"text":"فما سمع بخليفة امتدح أحداً غير المنصور .ولما ولي محمد بن سليمان بن علي بن عبد الله بن العباس البصرة في سنة ستين ومائة في خلافة أبي عبد الله المهدي بالله، أهدى إلى الخيزران مئة وصيف. بيد كل وصيف جام ذهب مملوءاً مسكاً. فقبلت ذلك منه، وكتبت إليه :( عافاك الله وأحسن ثوابك! إن كان ما وصل إلينا منك عن رأينا فيك، فقد بخستنا في القيمة، وإن كان دون ميلك إلينا، فقد طلبنا بك فوقه. فاقطع عنا ما يَرْزَأُك في برنا بحفظ رأيك في حياطتنا وكد نفسك في مناصحتنا إن شاء الله )واتصل بالمهدي بالله ذلك، فغاظه، وكتب إلى محمد بن سليمان:","tags":[],"partial":0,"sp":8,"kind":"prose","spLabel":"فما سمع بخليفة امتدح أحداً… … وكان بينها وبين متيم في حي…"},{"id":"b3-30","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣٠","topic":"الهدايا","loc":31,"text":"(إن المئين الذي بعثتَ بها ... صارت شفيعاً في قطعِ ما تصلُ)\n(لا يدفع الأمر من خصصت بها ... فيك ولا تستطيع ما تسلُ)\n(فاعرف لأهل المعروف قدرهم ... واشكر لأهل البلاء ما فعلوا)","tags":[],"partial":0,"sp":8,"kind":"verse","spLabel":"فما سمع بخليفة امتدح أحداً… … وكان بينها وبين متيم في حي…"},{"id":"b3-31","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣١","topic":"الهدايا","loc":32,"text":"وافتصدت الخيزران في يوم من أيام خلافة المهدي بالله، فأهدى إليها ألف وصيفة، مع كل وصيفة منهن جام ذهب، في وسطه ألف درهم. وألف وصيف، مع كل وصيف جام فضة، فيه ألف دينار. ثم دخل إليها ليأكل طعامه عندها، فما انقضى المجلس بينهما حتى قالت له في بعض ما جرى: وأيّ خير رأيتُ منك !وأهدت مؤنسة، جارية المأمون بالله إلى متيم جارية علي بن هشام وقد افتصدتْ.","tags":[],"partial":0,"sp":8,"kind":"prose","spLabel":"فما سمع بخليفة امتدح أحداً… … وكان بينها وبين متيم في حي…"},{"id":"b3-32","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣٢","topic":"الهدايا","loc":33,"text":"وكان بينها وبين متيم في حياة علي بن هشام مكاتبة ومواصلة، لمعرفةٍ كانت بينهما قبل مصير كل واحدة منهما إلى صاحبيهما .فأهدت إليها بعلم المأمون مخنقة واسطتها درَّةٌ مثل بيضة العصفور، ودحارس (كذا) قيمتها عشرة آلاف دينار، وأربعة أحجار ياقوت أحمر، وأربعة أحجار زمرد عن يمينها وشمالها بين فرائد ذهب، وباقي المخنقة بلح مضّمخ بغالية فاستظرفت متيم البلح المضمخ بالغالية واستطابته وما أكثرت فرحاً بالباقي من الجوهر .وأهدت فضل الشاعرة إلى سعيد بن حميد، وكان يهواها، في يوم فصاده هديّة كان من جملتها ألف جدي، وألف حمل وألف دجاجة فائقة، وألف طبق فاكهة، وريحان، وشراب وطيب كثير، ونخب حسان .","tags":[],"partial":0,"sp":8,"kind":"prose","spLabel":"فما سمع بخليفة امتدح أحداً… … وكان بينها وبين متيم في حي…"},{"id":"b3-33","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣٣","topic":"الهدايا","loc":34,"text":"وأهدى ابن المقفع إلى الزرقاء، جارية عبد الملك، وقد افتصدت، ألف دراجة في قفاص .وأهدى علي بن عيسى بن ماهان إلى الرشيد في سنة تسع وثمانين ومائة وهو والي خراسان، هدايا ثمنها ثلاثون أَلف ألف دينار، والرشيد يومئذ بالريّ حين خرج إليها .","tags":[],"partial":0,"sp":9,"kind":"prose","spLabel":"وأهدى ابن المقفع إلى الزرق… … وزن الذَّهب ألف مثقال، ووز…"},{"id":"b3-34","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣٤","topic":"الهدايا","loc":35,"text":"وأهدى أحمد بن أبي سلمة إلى المأمون بالله خواناً من جزع أحسن ما يكون وأملحه. وعليه ميل من ذهب. وكتب إليه: وقد أهديت إلى أمير المؤمنين خواناً من جزع ميلاً في ميل. فقال المأمون: أَوَ قُبضتْ هديته ؟فقيل: بلى يا أمير المؤمنين. فقال: هي في داري، أم داري فيها ؟فقيل: بل هي في منديل. وأُحضرت، فاستحسنها واستحسن ما كتب به مهديها .","tags":[],"partial":0,"sp":9,"kind":"prose","spLabel":"وأهدى ابن المقفع إلى الزرق… … وزن الذَّهب ألف مثقال، ووز…"},{"id":"b3-35","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣٥","topic":"الهدايا","loc":36,"text":"وأهدى الحسن بن وهب إلى نبات، جارية محمد بن حماد كاتب راشدة المعزيّة، وكان يهواها، في يوم نيروز، صينيتين إحداهما ذهب والأخرى فضة.","tags":[],"partial":0,"sp":9,"kind":"prose","spLabel":"وأهدى ابن المقفع إلى الزرق… … وزن الذَّهب ألف مثقال، ووز…"},{"id":"b3-36","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣٦","topic":"الهدايا","loc":37,"text":"وزن الذَّهب ألف مثقال، ووزن الفضة ألف درهم، في الصينية الفضة ألف دينار مسيفة، وزن كل دينار درهم واحد. وفي الصينية الذَّهب ألف درهم مسيفة، وزن كل درهم مثقال .","tags":["السلاح"],"partial":0,"sp":9,"kind":"prose","spLabel":"وأهدى ابن المقفع إلى الزرق… … وزن الذَّهب ألف مثقال، ووز…"},{"id":"b3-37","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣٧","topic":"الهدايا","loc":38,"text":"وأهدى بعض ملوك الهند إلى الرشيد بالله هدايا جليلة، في جملتها قضيب زمرد أطول من الذراع، وعلى رأسه تمثال طائر من ياقوت أحمر، لا قدر له من النفاسة. فوهبه لأم جعفر زبيدة بنت جعفر زوجته. وانتقل منها إلى الأمين بالله، ثم إلى أخيه المأمون، ثم صار إلى المعتصم بالله بعدهما .وجلس المعتصم بالله يوماً، فشرب وعنده ندماؤه، فطرح إليهم قضيب زمرد كان في يده، طوله أكثر من ذراع، وقال: هل فيكم من يعرف هذا القضيب ؟فكل نظر إليه، وقال: لا أعرفه. حتى صار إلى عبد الله بن محمد المخلوع فقال: نعم يا أمير المؤمنين! هذا قضيب أهداه ملك الهند إلى الرشيد في جملة هدايا أنفذها إليه، فوهبه الرشيد لزبيدة، ووهبته زبيدة لأبي وهو صبي فكان يلعب به، وكان على رأسه طائر ياقوت أحمر قيمته مئة ألف دينار، ولست أراه. فأمر المعتصم بطلبه، وتوعد الخُزّان بالقتل إن لم يحضروه من ساعته. فطُلب، وركِّب على القضيب من ساعته.","tags":[],"partial":0,"sp":10,"kind":"prose","spLabel":"وأهدى بعض ملوك الهند إلى ا… … ونحن نسألك أيّها الأخ أن ت…"},{"id":"b3-38","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣٨","topic":"الهدايا","loc":39,"text":"وجاءوا به إليه .وكتب دهمى ملك الهند إلى عبد الله المأمون بالله مع هديّة أهداها إليه: (بسم الله الرحمن الرحيم. من دهمي ملك الهند، وعظيم أركان الشرق، وصاحب بيت الذَّهب وأركان الياقوت، وفرش الدر، الذي قصره مبني من العود الرطب الذي إذا ختم عليه قبل الصورة قبول الشمع، والذي توجد رائحة قصره من عشرة فراسخ، والذي في خزانته ألف تاج من الجوهر لألف أب كانوا له ذهبوا، والذي يسجد له أمام البدّ الأكبر، الذي وزنه أَلف ألف مثقال من الذَّهب وعليه ألف حجر من الياقوت الأحمر والدر الأبيض، والذي يركب في يوم السعادة وعلى رأسه التاج في ألف موكب، كل موكب له دابة مكللة بالدّرِّ وتحتها ألف فارس معلَمين بالحرير والذَّهب، والذي في مربطه ألف فيل أبيض خزائمها أعنّة الذَّهب، والذي يأكل في صحائف الجوهر على موائد الدَر المنضود، والذي يستحيي من الله أن يراه خائناً له في رعيته بعد أن استكفاه الأمانة عليهم والرئاسة على أهل مملكته .أما بعد. فإنَه لم يذهب علينا أنَّ ما تقدم من ذكرنا أيها الأخ في انْتَسَبْنا إليه من الشرف وعَلوِّ الحال غير طائل لزواله. وأنَّه كان الأولى بنا أن نبتدي بذكر الله تعالى جلَّ اسمه، غير أنَّا أَجْلَلْناه عن أن نبتدي بذكره إلا في مواضع المناجاة له عابدين، وأخبارك ترد علينا بفضيلة لك في العلم لم نجدها لغيرك من أشكالك. ونحن شركاؤك في الرغبة والمحبة. وقد افتتحنا باب المكاتبة وطلب الفائدة بأن أهدينا إليك كتاباً ترجمته (صفوة الأذهان) والتصفَّح له يشهد على صواب التسمية. وبعثنا إليك لطفاً بقدر ما وقع منا موقع الاستحسان له، وإن كان دون قدرك. ونحن نسألك أيَها الأخ أن توسع أخاك عذراً في التقصير، إن شاء الله) .ورأيت في مكان آخر: إلى عبد الله ذي الشرف والرئاسة على أهل مملكته .( أما بعد فإن الذي تقدّم ذكرنا له، أيها الأخ، من الملك والشرف والثروة مما له خطر مما ترتحل به الأوقات وتتخرّمه الساعات ذهاباً وزوالاً، والخطر الذي يجب على المستودعين من الله فضيلة العقل الاعتداد به والمكاثرة له. ولكنا جربنا على ما جرت به سنّة الملوك قبلنا، ولم نجهل أن الله له الشرف الذي يفوت الألسن ذكره. فإن الابتداء بتحميده من أفضل الاعتداد، ولكنّا أَجْلَلْناه عن الافتتاح بذكره إلاّ في مواقف المناجاة له، عابدين. وأخبارك ترد علينا بفضيلة لك في العلم لم نجدها لغيرك .ونحن شركاؤك في المحبة والرغبة. وإنّ في أفئدتنا من ذلك ما لم نزل به لله في الفضل ذاكرين. وقد افتتحنا استهداءك بأن وجّهنا إليك كتاباً ترجمته (صفوة الأذهان) والتصفّح له يشهد على صواب التسمية. وبعثنا إليك لطفاً بقدر ما وقع منا موضع الاستحسان له، وإن كان دون قدرك.","tags":[],"partial":0,"sp":10,"kind":"prose","spLabel":"وأهدى بعض ملوك الهند إلى ا… … ونحن نسألك أيّها الأخ أن ت…"},{"id":"b3-39","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٣٩","topic":"الهدايا","loc":40,"text":"ونحن نسألك أيّها الأخ أن تنعم في ذلك بالقبول، وتوسع عذراً في التقصير، إن شاء الله )وكانت الهديّة جام ياقوت أحمر فتحه شبر في غلظ الأصبع، مملوء درّاً، وزن كل درّة مثقال، والعدّة مئة درّة. وفرشاً في جلد حيّة تكون في وادي المهراج تبتلع الفيل، ووشي جيدها داراتٌ سودٌ على قدر الدرهم، وفي وسطها نقطٌ بيضٌ، مغروزةٌ بالدرّ، لا يتخوّف من جلس عليها السلّ، ومن كان به السلّ وجلس عليها سبعة أيام، ذهب عنه. ومصلّيَات ثلاثة بوسائدها من ريش طائر يقال له السمندل، إذا طرحت في النَّار لم تحترق. وفراوزها درٌّ وياقوت أحمر.","tags":[],"partial":0,"sp":10,"kind":"prose","spLabel":"وأهدى بعض ملوك الهند إلى ا… … ونحن نسألك أيّها الأخ أن ت…"},{"id":"b3-40","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤٠","topic":"الهدايا","loc":41,"text":"ووزن مئة ألف مثقال عوداً رطباً، إذا ختم عليه قبل الصورة. وثلاثة وثلاثين منا كافوراً محبباً، كل حبَة منه مثل الفستقة، وأكبر من اللوزة، مع جارية سندية، طولها سبعة أذرع تسحب شعرها، حسنة البشرة. لها أربع ضفائر تعقد ضفيرتين على رأسها تاجاً، وضفيرتان تبلغان الأرض من خلفها، وطول كل شفر من أشفار عينيها إصبع، يبلغ إذا أطرقت إلى نصف خدَها، وكأنَ بين شفتيها لمعان البرق من بياض أسنانها. لها نهدان وثماني عُكَن .","tags":["الطيب","الرقيق","الشعر"],"partial":0,"sp":11,"kind":"prose","spLabel":"ووزن مئة ألف مثقال عوداً ر… … وأهدى بعض ملوك الروم إلى ا…"},{"id":"b3-41","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤١","topic":"الهدايا","loc":42,"text":"وكان الكتاب في لحاء شجرة تنبت بالهند يقال لها الكاذيَ، أحسن من الكاغد والقرطاس، لونه إلى الصفرة، والخط لازورديَ مفتح بالذَّهب .فأجابه عبد الله المأمون :بسم الله الرحمن الرحيممن عبد الله المأمون بالله أمير المؤمنين الذي وهب الله له ولآبائه الشرف بابن عمَه النبي المرسل صلى الله عليه وسلم وعلى آله، والتصديق بالكتاب المنزل، إلى دهمي ملك الهند وعظيم من تحت يده من أراكنة الهند، وأركان المشرق .سلام عليك! فإني أحمد إليك الله الذي لا اله إلا هو، وأسأله أن يصلّي على محمد عبده ورسوله صلى الله عليه وسلم .وصل كتابك فسررت لك بالنعمة التي ذكرت. ووقع إتحافك إيَّانا الموقع الذي أملّتَ من قبول ذلك. وكنت على ما ابتدأت به من البر محموداً، موجباً ذلك إلى الشكر عليه وحسن الذكر له. ولولا أن السنة جارية، بترك تقديم من لم يكن لنا على الشريعة موالياً، وبها آخذاً ما تركنا ما يحسن من مبرتك بالتقديم والاعتذار بما ذكرناه أحد التقديمين. وأنت له منّا أهلٌ. وقد أهدينا إليك مودّتنا لك. وهي أوفر حظ المتواصلين. واْهدينا إليك كتاباً ترجمته (ديوان الألباب وبستان نوادر العقول) ومطالعتك ترجمته تحقِّق عندك فضيلة النعمة، ومشاهدتك له تحقِّق عندك ما أسميناه به، وجعلنا لذلك عنواناً من الهدية. وهو لطفٌ استقللنا قدرها لك. ولو كانت الملوك تتهادى على أقدارها لما اْتسعت لذلك خزائنها، وإنما يجري ذلك بينها على قدر ما يدلُّ على حسن النية وجميل الطوية. وبالله التوفيق .","tags":[],"partial":0,"sp":11,"kind":"prose","spLabel":"ووزن مئة ألف مثقال عوداً ر… … وأهدى بعض ملوك الروم إلى ا…"},{"id":"b3-42","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤٢","topic":"الهدايا","loc":43,"text":"وكانت الهدية فارساً بفرسه وجميع آلاته من عقيق، وقيل: بل فارساً بفرسه من عنبر شحريّ أشهب، ومائدة جزع أرضها بيضاء وفيها خطوطٌ سودٌ وحمر وخضر، سعتها ثلاثة أشبار، وغلظها إصبعان، وأرجلها ذهب، مما أخذ من خزانة مروان بن محمد الجعديّ، وخمسة أصناف من الكسوة، من كل صنف مئة ثوب من بياض مصر، وخزّ السّوس، ووشي اليمن، والإسكندرية، وملحم خراسان، وديباج خراساني، وفرش قرمز، وفرشٍ طبريّ، وفرش سوسنجرديّ، ومائة طنفسة حيرية بوسائدها كل ذلك خزّ، وفرش خَزّسوسيّ، وجام زجاج فرعوني غلظه إصبع وفتحه شبر ونصف، في وسطه صورة أسد نابت، وأمامه رجل برك على ركبتيه وقد أعرق السهم في القوس نحو الأسد. والجام والمائدة مما أخذ من خزانة مروان بن محمد، والكتاب في طومار ذي وجهين. وغلظ الخط إصبع .","tags":["الطيب"],"partial":0,"sp":11,"kind":"prose","spLabel":"ووزن مئة ألف مثقال عوداً ر… … وأهدى بعض ملوك الروم إلى ا…"},{"id":"b3-43","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤٣","topic":"الهدايا","loc":44,"text":"وأهدى بعض ملوك الروم إلى المأمون بالله هديّة. فقال المأمون: أهدوا له ما يكون مئة ضعف لها، ليعلم عزّ الإسلام ونعمة الله علينا به. ففعل ذلك. فقال  - وقد كملت الهديّة -: ما أعزّ الأشياء عندهم ؟قالوا: المسك والسمّور. فقال المأمون: زيدوهم مايتي رطل مسكاً ومايتي جلد سمّوراً .","tags":[],"partial":0,"sp":11,"kind":"prose","spLabel":"ووزن مئة ألف مثقال عوداً ر… … وأهدى بعض ملوك الروم إلى ا…"},{"id":"b3-44","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤٤","topic":"الهدايا","loc":45,"text":"وأهدى أبو دلف القاسم بن عيسى العجلىّ إلى المأمون في يوم مهرجان، مئة حمل زعفران، في شبك إبريسم، على مئة أتان شهباء وحشية مربّاة .فجاءت الهديّة والمأمون عند الحرم فقيل له: قد وجه القاسم بن عيسى مئة حمل زعفران على مئة حمار .فأحبَ المأمون أن ينظر إليها على حالها، وكره أن يكون من الحمير شيء لا يصلح للنساء أن ينظرن إليه. فسأل سؤال مستثبت عن الحمر: أهي أُتُنٌ أم ذكور ؟فقيل: بل أتن وحشية مربّاة، وليس فيها ذكر. فسر بذلك، وقال: قد علمت أن الرجل أعقل من أن يوجه بها غير أُتُن .وشبيهٌ بذلك ما كان من شجر جارية المتوكِّل على الله، وكان يميل إليها ميلاً عظيماً تاماً، ويفضلها على سائر حظاياه. فلما كان يوم المهرجان، أَهْدَيْنَ إليه هدايا نفيسة، واحتفلن في ذلك، وجاءت هدية شجر. وهي عشرون غزالاً مربّاة، بعشرين سرجاً صينياً، على كل غزال خرج صغير من الذَّهب، مشبك فيه المسك والعنبر وأنواع الطيب المرتفعة، ومع كل غزال وصيفة بمنطقة ذهب، وفي يدها قضيب ذهب في رأسه جوهرة: ياقوت أو زمرد أو غيرها من الجواهر الجليلة القدر. فقال المتوكِّل لحظاياه وقد استملح ذلك: من كان منكن تحسن مثل هذا أو تقدر عليه ؟فحسدنها وعملن في قتلها بشيء سقينها إيَّاه. فماتت .","tags":[],"partial":0,"sp":12,"kind":"prose","spLabel":"وأهدى أبو دلف القاسم بن عي… … قال أحمد بن أبي طاهر في كت…"},{"id":"b3-45","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤٥","topic":"الهدايا","loc":46,"text":"وأهدى سلمة بن سعيد النصرانيّ، كاتب شجاع، أمِّ المتوكِّل، إلى المتوكِّل على الله. في أيام صيام النصارى من طعامهم جوناً، كان فيها غضارٌ صيني ملوَّنٌ، وجامات بلَّور. وحلاها بالذَّهب والفضة. وبعث فيها ما تنغصه له من طعام صيامهم. وبلغت نفقته عليها ثلاثة آلاف دينار .وحدَّثت ندمان، جاريةُ قبيحة، قالت: ولدت قبيحة المعتزَّ للمتوكل في آخر أيام الواثق أخيه. فلما وُلِّي الخلافة بعده، ولدت له أم عبد الله. فقال لها: لئن كان فاتني بلوغ محبتي لك في أبي عبد الله، فلا يفوتني في أم عبد الله. فعمل لها خمس مئة جمل وخمس مئة بغل وفرس وحمار. صياغة من خمس مئة ألف درهم فضة. وحمل على كلِّ واحد خرجاً فيه خمس مئة دينار.","tags":[],"partial":0,"sp":12,"kind":"prose","spLabel":"وأهدى أبو دلف القاسم بن عي… … قال أحمد بن أبي طاهر في كت…"},{"id":"b3-46","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤٦","topic":"الهدايا","loc":47,"text":"وأهدى ذلك إليها .ولمَا رجع المتوكِّل على الله من دمشق، قافلاً إلى سُرَّ مَنْ رأى في سنة أربع وأربعين ومايتين، اجتاز برحبة مالك بن طوق. فأهدى إليه مايتي ناقة بفصلانها، ومايتي بقرة بعجاجيلها، وألف شاة، وعشرين رمكة بمهاريها، وعشرين فرساً عتاقاً مربّاة، ومايتين وخمسين درّاجة، ومايتي طيرٍ، وألفي شدّة من أنواع الفاكهة .","tags":["الخيل"],"partial":0,"sp":12,"kind":"prose","spLabel":"وأهدى أبو دلف القاسم بن عي… … قال أحمد بن أبي طاهر في كت…"},{"id":"b3-47","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤٧","topic":"الهدايا","loc":48,"text":"قال أحمد بن أبي طاهر في كتابه المعروف (بكتاب بغداد ): لما صار المتوكِّل على الله. بالأنبار، قافلاً من دمشق، تلقاه شنيف خادم أمِّه بهدايا إليه أوردها من عند السيدة قبيحة أمِّ المعتز، وقيمتها أربع مئة ألف دينار. فعرضت عليه وجلساؤه حضورٌ معه.","tags":[],"partial":0,"sp":12,"kind":"prose","spLabel":"وأهدى أبو دلف القاسم بن عي… … قال أحمد بن أبي طاهر في كت…"},{"id":"b3-48","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤٨","topic":"الهدايا","loc":49,"text":"قال يزيد بن المهلبيّ: فإذا عشرة أفراسٍ بسروجِ ذهب ولجم ذهب .وعشر شهاريّ، بمثل ذلك فضة .وعشر نجائب عليها قباب محلاّة بذهب .وعشرة أبغل عليها قبابٌ محلاّة بفضة .ومائة تخت عليها ألف ثوب من أصناف الثياب، من كل صنف مئة ثوب .وعشرة غلمان .وعشرة خدم في المناطق الذهب .ومائة صينيّة ذهباً وزن كلَ صينيّة ألف دينار، وفيها ألف درهم مسيّفة .ومائة صينيّة فضة وزن كلَ صينيّة ألف درهم، في كل صينية ألف دينار مسيّفة .وسفط فيه جوهر .ومسبّحة حبّ جوهر لا يعرف لها قيمة .وعشر جوار بأصناف الحلي، معهن عشرون وصيفة، إلاَ أنهن لم يعرضن بحضرة الحاضرين معه .وثلاثون جلداً سموراً .","tags":["الجوهر"],"partial":0,"sp":13,"kind":"prose","spLabel":"قال يزيد بن المهلبيّ: فإذا… … وكان المتوكِّل قد احتجم في…"},{"id":"b3-49","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٤٩","topic":"الهدايا","loc":50,"text":"قال المهلبيّ: فحلفت أنه ما أُهدي إلى عربيّ ولا عجميّ مثل هذه الهديّة .وأهدى بعض ملوك الهند إلى الحسن بن سهل في زفاف ابنته بوران على المأمون بالله، في سنة عشر ومايتين، هدايا من جملتها سفطٌ فيه عود هندي لم يُرَ مثله .","tags":[],"partial":0,"sp":13,"kind":"prose","spLabel":"قال يزيد بن المهلبيّ: فإذا… … وكان المتوكِّل قد احتجم في…"},{"id":"b3-50","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥٠","topic":"الهدايا","loc":51,"text":"قال علي بن المنجَم: كنَا ليلة بين يدي المتوكِّل على الله، ومعنا عبيد الله بن الحسن بن سهل، وكان أديباً ظريفاً قد عاشر الناس وشاهد سرواتهم.","tags":["الرقيق"],"partial":0,"sp":13,"kind":"prose","spLabel":"قال يزيد بن المهلبيّ: فإذا… … وكان المتوكِّل قد احتجم في…"},{"id":"b3-51","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥١","topic":"الهدايا","loc":52,"text":"وكان المتوكِّل قد احتجم في ذلك اليوم، فناله ضعف، فأشار عليه الأطباء أن يتبخَّر بعود نيّ جيّد، ففعل ذلك. فحلف كلُّ من كان حاضراً في المجلس أنَّه ما شمَّ مثل ذلك العود قط .فقال عبيد الله بن الحسن بن سهل: هذا من العود الذي أهداه ملك الهند إلى أبي لزفاف أختي بوران على المأمون .فكذّبه المتوكِّل ودعا بالسفط الذي أخرجت القطعة منه. فوجدت من ذلك العود أقلَ من أوقية واحدة، ورقعة فيها مكتوب: (هذا العود هديّة ملك الهند إلى الحسن بن سهل لزفاف بوران إلى المأمون ). فاستحى المتوكِّل من تكذيبه، وأمر له بصلة. ودعا عبيد الله بن يحيى بن خاقان، وزيره، وقال: اطلب الساعة رجلاً من أصحابك، ثقةٍ، وادفع إليه ألف دينار لنفقته، واحمل معه ما لا يوجد ببلاد الهند من الهدايا بقيمة عشرة آلاف دينار، وقل للرسول يعلم ملك الهند: إننا لا نريد منه مكافأة إلا بما عنده من هذا العود. فنفذ الرسول لذلك، ورجع إلى سُرَّ من رأى في الليلة التي قتل فيها المتوكِّل على الله. فشدَ يده على ما جاء به من العود، إلى أن جلس المعتمد على الله، وأمر بردِّ عبيد الله بن يحيى إلى وزارته.","tags":[],"partial":0,"sp":13,"kind":"prose","spLabel":"قال يزيد بن المهلبيّ: فإذا… … وكان المتوكِّل قد احتجم في…"},{"id":"b3-52","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥٢","topic":"الهدايا","loc":53,"text":"قال الرجل: فلما عاد إلى الوزارة، دخلت إليه، فلما نظر إليَّ قال: أنت رسولنا إلى ملك الهند ؟قلت: نعم، مضيت من سرّ من رأى لما أمرتني به، فدخلت إلى بغداد، وقد حملت معي من قطربّل ثلاث مئة خماسية، من شرابها. فلما ملح عليّ الماء في البحر، جعلت أمزجه بذلك الشراب. فوصلت إلى بلد الهند، وقد شربت مئة خماسية، فدخلت إلى الملك وسلّمت الهديّة إليه فسُرّ بها. وعرفته ما جئت فيه من أمر العود. فقال: ذلك شيء بعث به أبي، ولا والله ما في خزائني منه إلا مئة منا، فخذ نصفها ودع نصفها. فلم أزل أرفق به حتى سمح لي بمائة وخمسين رطلاً. وأحضرني يوماً طعامه. فلما أكلنا، جاؤوا بنبيذ النارجيل. فقلت له: أنا لا أشرب هذا. وأحضرت من القطربلّي الذي كنت حملته، فلما رآه وشمّه وذاقه، قال: أي شيء هو هذا ؟قلت: ماء العنب، قال: أفتموتون إذا شربتموه ؟قلت: نعم.","tags":["الولائم"],"partial":0,"sp":14,"kind":"prose","spLabel":"قال الرجل: فلما عاد إلى ال… … وأهدى المعتصم بالله إلى ال…"},{"id":"b3-53","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥٣","topic":"الهدايا","loc":54,"text":"قال: لأنكم تقلّون مزجه وتسهرون عليه. قال: فدفعت إليه مئة خماسية، فأمر لي بمائة ألف درهم وثياب وطيب وغير ذلك بمثلها. وانصرفت من عنده، فشربت الذي بقي معي في الطريق، ووافيت سُرَّ من رأى، وقد كان من أمر المتوكِّل ما كان، وهو ذا العود عندي محتفظ به. فقال له عبيد الله: كلَ ما أخذته فمبارك لك فيه إلا العود. فاحمله بهيئته. ففعل وأخذه عبيد الله بأسره. فكان النَاس يتواصفون طيب رائحته. وإنما كانت من ذلك العود الذي كان يتبخر به، ولا يستعمل غيره .ولمَا دخل عبد الله بن طاهر إلى مصر في سنة إحدى عشرة ومايتين بعث إليه عبيد بن السريّ  - لما مانعه من دخول مصر وعلم أنه مأخوذ  - ألف وصيف ووصيفة، مع كل وصيف صينية فضة وزنها ألف درهم، وفيها ألف دينار في كيس حرير، ومع كل وصيفة صينية ذهب وزنها ألف مثقال، وفيها ألف درهم .وبعث بهم ليلاً. فردَ ذلك عبد الله بن طاهر إليه، وكتب إليه: لو قبلت هديتك ليلا، لقبلتها نهاراً. {أَتُمِدُّونَنِ بِمَالٍ فَمَا آتَانِيَ اللَّهُ خَيْرٌ مِّمَّا آتَاكُم بَلْ أَنتُم بِهَدِيَّتِكُمْ تَفْرَحُونَ، ارْجِعْ إِلَيْهِمْ فَلَنَأْتِيَنَّهُمْ بِجُنُودٍ لَّا قِبَلَ لَهُم بِهَا وَلَنُخْرِجَنَّهُم مِّنْهَا أَذِلَّةً وَهُمْ صَاغِرُونَ} فحينئذ طلب ابن السريّ الأمان. فآمنه وخرج إليه.","tags":[],"partial":0,"sp":14,"kind":"prose","spLabel":"قال الرجل: فلما عاد إلى ال… … وأهدى المعتصم بالله إلى ال…"},{"id":"b3-54","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥٤","topic":"الهدايا","loc":55,"text":"ودخل عبد الله مصر .وقيل: بل بعث إليه ألف وصيف ووصيفة مع كل واحد منهم ألف دينار في صينية ذهب فيها ألف دينار .فلما كتب إليه عبد الله بن طاهر بالأمان وصالحه على الشرائط التي اشترطها عبيد بن السريّ، وصار الأمان إليه. أقبل عبيد حتى صار إلى مضرب عبد الله بن طاهر فدخل راكباً على دابته. ثم نزل، فسلَم على عبد الله بن طاهر بالأمر، فلما قرب، قام إليه عبد الله، فعانقه وأجلسه .واشترط عبيد أن تصير له جباية الصعيد شهرين. فوفي له بذلك. فجبى أموال الصعيد شهرين بعد خروجه إلى عبد الله بن طاهر. وأرسل عبيد بن السريَ إلى عبد الله بن طاهر بهدايا كثيرة بقيمة مئة ألف دينار. وحمل إليه مايتي ألف دينار عينا. فردَ ذلك كله إلا حماراً أسود، وخاتم فضة زمرد، فأخذهما لئلاّ يوحشه .","tags":[],"partial":0,"sp":14,"kind":"prose","spLabel":"قال الرجل: فلما عاد إلى ال… … وأهدى المعتصم بالله إلى ال…"},{"id":"b3-55","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥٥","topic":"الهدايا","loc":56,"text":"وأهدى المعتصم بالله إلى الكعبة قفلاً من ذهب فيه ألف مثقال .وأهدى الحسن بن سهل إلى المعتصم بالله في سنة سبع عشرة ومايتين، في خلافة أخيه المأمون بالله، ألف طبق خزريّة، وكيماكيّة، وتغزغزية، وعدَة حبات ختو عجيبة، وسكاكين ختو نبيلة، وسكاكين بازهر طائلة .وأرسل أحمد بن طولون إلى المعتمد على الله حين ظهر علويُّ البصرة وقوي أمره، مع نحرير خادم المعتمد، من خراج مصر ألف أَلف دينار ومايتي ألف دينار، سوى الرقيق والكراع وطرائف مصر .","tags":[],"partial":0,"sp":14,"kind":"prose","spLabel":"قال الرجل: فلما عاد إلى ال… … وأهدى المعتصم بالله إلى ال…"},{"id":"b3-56","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥٦","topic":"الهدايا","loc":57,"text":"وأهدى موسى بن عمر بن عبد العزيز الهباريّ صاحب السند، إلى المعتمد على الله في سنة إحدى وسبعين ومايتين هدية كان في جملتها فيلٌ عظيم الخلقة لم ير قطَ أعظم منه خلقة، وجمال موالح، وأصنام ثلاثة من فضة، ومسك، وعنبر، وحرير، وظباءٌ كانت كمثل البقر ألوانها إلى السواد، وسرير عود، وأشياء سوى ذلك .","tags":["الطيب"],"partial":0,"sp":15,"kind":"prose","spLabel":"وأهدى موسى بن عمر بن عبد ا… … وكان قد اعتدّ لذلك دراهم ب…"},{"id":"b3-57","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥٧","topic":"الهدايا","loc":58,"text":"وأهدى عمرو بن الليث إلى أبي أحمد الموفّق بالله في سنة خمس وسبعين ومايتين، خمسين حملاً دراهم، ومائة فرس رائقة من عتاق الخيل، وجماعة غلمان، وطرفاً من هدايا خراسان .وأهدت قطر الندى بنت أبي الجيش خمارويه إلى المعتضد بالله في يوم نيروز من سنة اثنتين وثمانين ومايتين هدية كان فيها عشرون صينية ذهباً، في عشر منها عشر مشامّ عنبراً.","tags":["الطيب"],"partial":0,"sp":15,"kind":"prose","spLabel":"وأهدى موسى بن عمر بن عبد ا… … وكان قد اعتدّ لذلك دراهم ب…"},{"id":"b3-58","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥٨","topic":"الهدايا","loc":59,"text":"وزنها اْربعة وثلاثون رطلاً، وفي عشر منها عشر مشامّ ندّ معجون وزنها أربعة وثلاثون رطلاً. وعشرون صينية فضذة في عشر منها عشر مشام صندلاً، وزنها خمسون رطلاً مخرماً، وفي العشر الأخرى عشر مشام زعفران، وزنها خمسون رطلاً. وعشرون صينية ذهباً مجري بزجاج، في عشر منها عشر مشامّ مسكاً، وزنها نيف وثلاثون رطلاً. وخمس خلع وشياً، قيمتها خمسة آلاف دينار. وعملت سماجات ليوم النيروز بلغت النفقة عليها ثلاثة عشر ألف دينار .وأخرج من القصر ثلاثون وصيفة يرقصون مع الفراعنة، وكان مما عمل للمعتضد قبة أبنوس، ارتفاعها عشرة أذرع. وتحتها سرير أبنوس، إلى ثلثيها مضبب بالذَّهب، يصعد إليه بدرج. وجعل خلالها ثياب رقاق ليرى منها ما مضى عليه من الدراهم.","tags":["الطيب","الرقيق"],"partial":0,"sp":15,"kind":"prose","spLabel":"وأهدى موسى بن عمر بن عبد ا… … وكان قد اعتدّ لذلك دراهم ب…"},{"id":"b3-59","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٥٩","topic":"الهدايا","loc":60,"text":"وكان قد اعتدّ لذلك دراهم بقية ثلاثة عشر ألف دينار، في كل درهم ثلاثة دراهم. وكان فيما أهدت إليه بنت أبي الجيش في هذا اليوم بيت رشيديّ، وبيت طبريّ مذهب، فاستحسنهما. ووجّه المعتضد إلى أبي الجيش وإخوته بخلع قيمتها ثلاثة وخمسون ألف دينار .","tags":["المجالس"],"partial":0,"sp":15,"kind":"prose","spLabel":"وأهدى موسى بن عمر بن عبد ا… … وكان قد اعتدّ لذلك دراهم ب…"},{"id":"b3-60","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦٠","topic":"الهدايا","loc":61,"text":"وأهدى يعقوب بن الليث الصفّار إلى المعتمد على الله في بعض السنين هدية من جملتها عشرة بزاة، منها بازيّ أبلق لم ير مثله، ومائة شهريّ، وعشرون صندوقاً على عشرة أبغل، فيها طرائف الصين وغرائبه، ومسجد فضة بزرافين يصلّي فيه خمسة عشر إنساناً، ومائة مناً مسكاً، ومائة منا عوداً هندياً، وأربعة آلاف ألف درهم .","tags":["الطيب"],"partial":0,"sp":16,"kind":"prose","spLabel":"وأهدى يعقوب بن الليث الصفّ… … وأهدى إليه في سنة ست وثمان…"},{"id":"b3-61","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦١","topic":"الهدايا","loc":62,"text":"وأهدى عمرو بن الليث الصفار إلى المعتضد بالله في سنة إحدى وثمانين ومايتين، مع رسوله بلبل، مالاً وهدايا مبلغها أربعة آلاف ألف، وهدايا مثلها، ومائة شهري بسروجها ولجمها، منها عشرة بسروج ذهب، وبزاة كثيرة. فخلع المعتضد على بلبل وعلى ثلاثين قائداً معه .","tags":[],"partial":0,"sp":16,"kind":"prose","spLabel":"وأهدى يعقوب بن الليث الصفّ… … وأهدى إليه في سنة ست وثمان…"},{"id":"b3-62","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦٢","topic":"الهدايا","loc":63,"text":"وأهدى إليه أيضاً في سنة ثلاث وثمانين ومايتين، مع صاحبه فتح، هديّة حسنة كان فيها مئة واثنتان وستون حمارة، على كل واحدة منها صندوقان مملوءان ثياباً وكسوة، وشهريّان عظيما الخلق، سرجاهما ذهب مرصع بجوهر، وعدَة شهاري.. .بسروج ولجم، ومائة وخمسون دوابّ، عليها أجلّة ديباج ملونة، وعشرون بازياً، ومائتا جمل، عليها صناديق من كل ما يستطرف عنده ويستحسن، وصنمٌ عظيمٌ على عجلة، عليه تاج تجرّه حمارتان، وعدة أصنام صغار، وأربعة آلاف ألف درهم، وتلقّى وصيف وطاهر غلام بدر الهدية. وعمل الصفار بَدَنَةً وتاجاً بلغت قيمتهما ثلاثة عشر ألف دينار .","tags":[],"partial":0,"sp":16,"kind":"prose","spLabel":"وأهدى يعقوب بن الليث الصفّ… … وأهدى إليه في سنة ست وثمان…"},{"id":"b3-63","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦٣","topic":"الهدايا","loc":64,"text":"وأهدى إليه في سنة ست وثمانين ومايتين مئة وخمسين فرساً بأجلّة مشهورة، وبزاة كثيرة، وكسوة وطيب .وأهدى عمرو بن الليث إلى المعتضد بالله في أول خلافته سنة تسع وسبعين ومايتين هديّة. من جملتها مئة وخمسون دابّة، وخمسون بغلاً عليها صناديق المال، ومائة وخمسون ناقة قد ألبست البزيون الروميّ، وفَرَسَان بسرجَيْ ذهب، بلجمها ومقاودها، وعشر شهاريّ بسروج فضة .","tags":[],"partial":0,"sp":16,"kind":"prose","spLabel":"وأهدى يعقوب بن الليث الصفّ… … وأهدى إليه في سنة ست وثمان…"},{"id":"b3-64","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦٤","topic":"الهدايا","loc":65,"text":"وأهدى إليه أبو الجيش خمارويه بن أحمد بن طولون في السنة بعينها مع أبي عبد الله الحسين بن أحمد الجوهريّ المعروف بابن الجصاص عشرين جملاً محملة مالاً، وعشرة خدم بدوابهم وحلاهم، وصندوقين مملوءين دقا، وعشرين حمارة محلاّة، وخمسة أفراس بسروج ذهب، واثني عشر فرساً بسروج فضة، وسبعة وثلاثين دابة بجلال ديباج وبراقع ديباج، وخمسة أبغل مصرية بسروجها ولجُمها .","tags":[],"partial":0,"sp":17,"kind":"prose","spLabel":"وأهدى إليه أبو الجيش خمارو… … وأهدى إليه عمرو بن الليث ا…"},{"id":"b3-65","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦٥","topic":"الهدايا","loc":66,"text":"وأهدى إليه في سنة ثمانين ومايتين من فارس مع داود بن سليمان خمسون غلاماً بدوابّهم وسلاحهم، وعشرون بعيراً بمحامل في كل مَحْمِل غلامان، وسبعون دابة قود بجلال ديباج، وعشر حمارات بآلاتها، وثلاثون صندوقاً فيها مال وكسوة وألطاف .","tags":["الرقيق","فارس"],"partial":0,"sp":17,"kind":"prose","spLabel":"وأهدى إليه أبو الجيش خمارو… … وأهدى إليه عمرو بن الليث ا…"},{"id":"b3-66","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦٦","topic":"الهدايا","loc":67,"text":"وأهدى إليه إسماعيل بن أحمد الساماني صاحب ما وراء النهر في هذه السنة بعينها تسعة وأربعين جملاً، عليها محامل فيها غلمان مرد أتراكٌ، وخزر، بأقبية سمّور وقلانس سمور، واثنين وخمسين غلاماً أتراكاً وخزراً بدوابّهم وسلاحهم، واثنين وثلاثين بازياً، منها أحد عشر بازياً أبيض، وثلاثة فهود، وعشرين دابة شهاريّ بجلال وبراقع ديباج .وأنفذ إليه عمرو بن الليث في سنة إحدى وثمانين ومايتين هدية مبلغها أَلف ألف درهم، وألف ثوب، وسبعة ستور، وعشرين منا مسكاً، ومائة منا عوداً، وألف مثقال عنبراً، ومائة شهري، ومركبين محلّيين بالذَّهب، وسبعة عشر مركباً محلاّة بالفضة ومن الإبل  - بجلالها وبراقعها  - مئة وعشرين، ومن الفوالج فالجين، وفسطاطاً واحداً، وخمسة عشر بازياً .وحمل إليه أبو الجيش خمارويه بن أحمد في سنة اثنتين وثمانين ومايتين مع أبي عبد الله بن الجصاص، وأبي الكراديس بن أحمد بن طولون أخيه  - من المال ثلاث مئة ألف وخمسة وستين ألفاً عيناً، وهدايا بقريب من قيمة المال .","tags":[],"partial":0,"sp":17,"kind":"prose","spLabel":"وأهدى إليه أبو الجيش خمارو… … وأهدى إليه عمرو بن الليث ا…"},{"id":"b3-67","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦٧","topic":"الهدايا","loc":68,"text":"وأهدى إليه عمرو بن الليث الصفار في سنة اثنتين وثمانين ومايتين مع بلبل غلامه، أربعة آلاف ألف درهم ورقاً، ومن المسك ثلاثة آلاف مثقال، ومن العنبر ألف مثقال، ومن العود خمسين منا، ومن الثياب الديباج الرومي ألف ثوب، ومن المراكب المحلاَة بالذَّهب مركبين، ومن الجعاب المحلاة بالذَّهب جعبتين، ومن الجعاب المحلاَة بالفضة بضعة عشر، ومن نعال الفضَة اثني عشر زوجاً، ومن البزاة ثلاثين بازياً، ومن الدواب مئة وخمسة أرؤس، ومن الفوالج واحداً، ومن الإبل بجلال مئة وثلاثين بعيراً .","tags":[],"partial":0,"sp":17,"kind":"prose","spLabel":"وأهدى إليه أبو الجيش خمارو… … وأهدى إليه عمرو بن الليث ا…"},{"id":"b3-68","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦٨","topic":"الهدايا","loc":69,"text":"وأهدى إليه ابن الأغلب في هذه السنة بعينها خمسين جارية، ومائة خادم، ومائة واحد عشر فرساً، منها خمسون بجلال وبراقع ديباج، وخمسين بغلاً للثقل، وحمل طيب، وحملاً من دق قماش مصر .","tags":["الخيل","الرقيق"],"partial":0,"sp":18,"kind":"prose","spLabel":"وأهدى إليه ابن الأغلب في ه… … كان أصحاب عمرو ظفروا بها ب…"},{"id":"b3-69","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٦٩","topic":"الهدايا","loc":70,"text":"وأهدى إليه خمارويه بن أحمد في سنة سبع وثمانين ومايتين مع عبد الله بن الفتح صاحبه  - سبعة أبغل عليها شمع وقراطيس وستور، ونيفاً وخمسين دابة عليها الغلمان السود، منها خمسة بسروجها ولجمها، وبعضها مسرجة ملجمة بالذَّهب، وبعضها بالفضة، وعلى باقي الدواب جلال الديباج وبراقيع الديباج، وكان معه واحد وعشرون بغلاً عليها ثلاث مئة ألف دينار .","tags":[],"partial":0,"sp":18,"kind":"prose","spLabel":"وأهدى إليه ابن الأغلب في ه… … كان أصحاب عمرو ظفروا بها ب…"},{"id":"b3-70","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧٠","topic":"الهدايا","loc":71,"text":"قال أبو بكر الصولي: أهدى عمر بن الليث إلى المعتضد بالله في سنة ثلاث وثمانين ومايتين هدايا. وفيها صنم من صفر على مثال امرأة لها أربع أيد، وعليها وشاحان مرصعان بالجوهر، ومعها أصنام صغار لها أيد ووجوه عليها جواهر.","tags":["الجوهر","النساء"],"partial":0,"sp":18,"kind":"prose","spLabel":"وأهدى إليه ابن الأغلب في ه… … كان أصحاب عمرو ظفروا بها ب…"},{"id":"b3-71","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧١","topic":"الهدايا","loc":72,"text":"كان أصحاب عمرو ظفروا بها ببعض مدن البحر فأخذوها، فبعث بها إليه بعد أن شهرت بالبصرة ونصبت على مجلس الشرطة ببغداد أياماً ليراها الناس، ولقَبت شغلاً لاشتغال الناس بالنظر إليها .","tags":["المجالس","العراق","الماء"],"partial":0,"sp":18,"kind":"prose","spLabel":"وأهدى إليه ابن الأغلب في ه… … كان أصحاب عمرو ظفروا بها ب…"},{"id":"b3-72","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧٢","topic":"الهدايا","loc":73,"text":"وأهدى المعتضد بالله إلى عمرو بن الليث الصفار في سنة اثنتين وثمانين ومايتين بدنة وتاجاً بلغت قيمتها ثلاثة عشر ألف دينار .","tags":["النار"],"partial":0,"sp":19,"kind":"prose","spLabel":"وأهدى المعتضد بالله إلى عم… … وأهدى الراضي بالله في بعض …"},{"id":"b3-73","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧٣","topic":"الهدايا","loc":74,"text":"وأهدى أبو عبد الله محمد بن أبي الساج إلى المعتضد بالله ثياب ديباج فرفر رومَي احدث فيها نسجاً بالذَّهب، قيمة كل ثوب منها ألفا دينار. من ثياب متملَك الروم يومئذ، ومنطقة رومية على زنَار أسود عريض، حليتها ذهب من ألفي مثقال مجرى بمينا، قيمة المنفق عليها عشرة آلاف دينار، وكان متملَك الروم أهداها إلى ابن أبي الساج .","tags":[],"partial":0,"sp":19,"kind":"prose","spLabel":"وأهدى المعتضد بالله إلى عم… … وأهدى الراضي بالله في بعض …"},{"id":"b3-74","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧٤","topic":"الهدايا","loc":75,"text":"وكان ابن أبي الساج أهدى للمعتضد بالله في عدة دفعات هدايا متفرقة، فيها الفرش الأرمنيَ، والديباج الروميَ، والبزيون، والسقلاطون، والمقارم الملكية، والسكاكين الرومية، والشهاري، وبغال المكاب (؟)، وبغال السروج، والبزاة مما له خطرٌ وقيمة .ووجه إليه بانيد وصالحه على أذربيجان وأرمينية  - في كل سنة خمسين ألف دينار .","tags":[],"partial":0,"sp":19,"kind":"prose","spLabel":"وأهدى المعتضد بالله إلى عم… … وأهدى الراضي بالله في بعض …"},{"id":"b3-75","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧٥","topic":"الهدايا","loc":76,"text":"وأهدى الراضي بالله في بعض نزهة في سنة ثمان وعشرين وثلاث مئة إلى أبي الحسن بحكم ما تنغَص له به مما كان بين يديه من فاكهة وما شاكل ذلك  - ألف دنَ من الشراب العتيق مع راغب الخادم، وجلة من الوشي المثقل بالذهب، ومعممَة عليها جوهر نفيس، وكيساً فيه سبعة آلاف دينار مسيَفة، وصينيتين من ذهب فيها تماثيل من عنبر وندَ، وصينية أخرى فيها خماسية بَلور، وقدح من بلَور، وقال لراغب: اعتذر إليه عنيَ .","tags":["الجوهر"],"partial":0,"sp":19,"kind":"prose","spLabel":"وأهدى المعتضد بالله إلى عم… … وأهدى الراضي بالله في بعض …"},{"id":"b3-76","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧٦","topic":"الهدايا","loc":77,"text":"وأهدى بجكم إلى زوجته ابنة أبي عبد الله اليزيدي في السنة بعينها مائدة فضة وآلتها، قيمتها خمس مئة ألف دينار، ودرجاً فيها حب لؤلؤ كبار، وياقوت أحمر وازرق يبهر الناظرين لا قيمة له نفاسةً .","tags":[],"partial":0,"sp":20,"kind":"prose","spLabel":"وأهدى بجكم إلى زوجته ابنة … … وفي الجانب الآخر: (يا سائر…"},{"id":"b3-77","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧٧","topic":"الهدايا","loc":78,"text":"وأهدى أبو عبد الله اليزيدي إلى سليمان بن الحسن القرمطيَ حين ولد له في سنة احدي وثلاثين وثلاث مئة هدايا جليلة عظيمة القدر. من جملتها مهدٌ من ذهب مرصعَ بجوهر نفيس .","tags":["الجوهر"],"partial":0,"sp":20,"kind":"prose","spLabel":"وأهدى بجكم إلى زوجته ابنة … … وفي الجانب الآخر: (يا سائر…"},{"id":"b3-78","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧٨","topic":"الهدايا","loc":79,"text":"وقال على بن الفتح المعروف بالمطوَق: أهدى زيادة الله بن عبد الله بن الأغلب صاحب المغرب إلى المكتفي بالله في سنة إحدى وتسعين ومايتين هدايا لها قدر جليل. فيها مئة خادم، ومائة جارية، ومائة فرس، ومائتا لبد مغربيَة، وتركش، وطيب، وزرافة، وبقر وحشية، ومائة ألف دينار، كل دينار عشرة دنانير، قال علي بن الفتح: فقرأت ديناراً من تلك الدنانير فإذا عليه مكتوب في الجانب الأول:","tags":["الخيل"],"partial":0,"sp":20,"kind":"prose","spLabel":"وأهدى بجكم إلى زوجته ابنة … … وفي الجانب الآخر: (يا سائر…"},{"id":"b3-79","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٧٩","topic":"الهدايا","loc":80,"text":"وفي الجانب الآخر:\n(يا سائراً نحو الخليفة قل له ... أن قد كفاك الله أمرك كلَه)\n(بزيادة الله ابن عبد الله سي ... ف الله من دون الخليفة سلَه)\n(ما إن يرى لك بالخلاف منافق ... إلا استباح حريمه وأذلَه)\n(من لا يرى لك طاعة فالله قد ... أعماه من طرق الهدى وأضلَه)","tags":["الرقيق","الأغالبة"],"partial":0,"sp":20,"kind":"verse","spLabel":"وأهدى بجكم إلى زوجته ابنة … … وفي الجانب الآخر: (يا سائر…"});</script>
<script>window.__BOOK__.push({"id":"b3-80","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨٠","topic":"الهدايا","loc":81,"text":"وكان تحت هذا البيت ثلاثة أحرف لم أقف عليها .وقال أبو محمد الفرغاني في كتابه التاريخ المعروف بالذيل: كان في الكتابة على الدنانير في الجانب الواحد:","tags":["الشعر","الكتب"],"partial":0,"sp":21,"kind":"prose","spLabel":"وكان تحت هذا البيت ثلاثة أ… … وكان الكتاب في حرير أبيض، …"},{"id":"b3-81","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨١","topic":"الهدايا","loc":82,"text":"وعلى الجانب الأخر:\n(يا سائراً نحو الخليفة قل له ... أن قد كفاك الله أمرك كله)\n(بزيادة الله بن عبد الله سي ... ف الله من دون البريَة سلَه)\n(ما إن يرى لك في الشقاق منافق ... إلا استباح حريمه وأذلَه)\n(وأبى وأمى أى طودٍ ماثلٍ ... إن لم يكن هو للإمام فمن له)\n(يهنا الخليفة أن الله أيَده ... بناصر الدين والقرآن والسنن)\n(سيف الخلافة يحميها ويحفظها ... وخصها من صروف الدهر وألفن)\n(الله أبقى به الدنيا وبهجتها ... والله يحرسه فيها من المحن)\n(زيادة الله يا ابن الصيد من مضرٍ ... لولاك لم تخلق الدنيا ولم تكن)","tags":["السلاح","الرقيق"],"partial":0,"sp":21,"kind":"verse","spLabel":"وكان تحت هذا البيت ثلاثة أ… … وكان الكتاب في حرير أبيض، …"},{"id":"b3-82","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨٢","topic":"الهدايا","loc":83,"text":"وأهدت برتا بنت الأوتاري ملكة الإفرنجة وما والاها إلى المكتفي بالله، مع علىَ الخادم، أحد خدم زيادة الله بن الأغلب سنة ثلاث وتسعين ومايتين: خمسين سيفاً، وخمسين ترساً، وخمسين رمحاً فرنجيَة، وعشرين ثوباً منسوجة بالذَّهب، وعشرين خادماً صقلبَياً، وعشرين جارية صقلبيَة، حساناً لطافاً، وعشرة أكلب كباراً، لا يطيقها السبع ولا غيره، وسبعة بزاة، وسبعة صقورة، ومضرب حرير بجميع آلته، وعشرين ثوباً معمولةً من صوف يكون في صدف يخرج من قصر البحر هناك، يتلوَن بجميع الألوان كقوس قزح، يتلوَن لوناً في كل ساعة من ساعات النهار وثلاثة أطيار تكون ببلاد فرنجة، إذا نظرت إلى الطعام والشراب المسموم صاحت صياحاً منكراً وصفَقت بأجنحتها حتى يعلم ذلك، وخرزاً تجذب النصول والازجة بعد بناء اللحم عليها بغير وجع .وقدم علىَ الخادم بالهديّة من ملكة إفرنجية وبكتابها إلى المكتفي بالله، وبرسالة منها لم يضمنها الكتاب لئلا يقف عليها أحدٌ سوى الخليفة.","tags":[],"partial":0,"sp":21,"kind":"prose","spLabel":"وكان تحت هذا البيت ثلاثة أ… … وكان الكتاب في حرير أبيض، …"},{"id":"b3-83","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨٣","topic":"الهدايا","loc":84,"text":"وكان الكتاب في حرير أبيض، والخطَ يشبه الخطَ الروميَ أحسن استواءً منه. وكانت الرسالة طلب التزويج بالمكتفي ومودته .وكان سبب مصير هذا الخادم إلى ملكة أفرنجة انه كان من جملة خدام ابن الأغلب، صاحب افريقية، وأغزاه في مراكبه التي يغزو فيها بلاد أفرنجة ونواحي الروم. فوقع الخادم أسيراً لها، فاصطفته لنفسها واصطنعته. وأقام عندها سنين. ثم أرسلت به إلى المكتفي بالله، وكتبت معه كتاباً بالفرنيجة، فوصل إلى المكتفي بالله وهو في متصيَده بناحية سرّ من رأى .","tags":["الرقيق","الروم"],"partial":0,"sp":21,"kind":"prose","spLabel":"وكان تحت هذا البيت ثلاثة أ… … وكان الكتاب في حرير أبيض، …"},{"id":"b3-84","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨٤","topic":"الهدايا","loc":85,"text":"قال أبو عبد الله محمد بن عبد الله الأصبهاني، كاتب أبي ليلى الحارث بن عبد العزيز: كنت في المعسكر مع المكتفي بالله قد شخصت لشخوص الوزير العَباس بن الحسن. فطلب السلطان من يترجم الكتاب.","tags":["الرقيق","الكتب"],"partial":0,"sp":22,"kind":"prose","spLabel":"قال أبو عبد الله محمد بن ع… … وذكرت الهدية بكمالها على م…"},{"id":"b3-85","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨٥","topic":"الهدايا","loc":86,"text":"وكان في خزانة الكسوة، مع بشر الخادم، فرنجيَ يقرأ كتابة أهلها، فأحضره ذلك الخادم. فقرأ الكتاب وترجمه بكتابة الرومية. واحضر إسحاق بن حنين فترجمته بالعربية من الرومية. فإذا فيه. (بسم الله الرحمن الرحيم. حفظك الله بسلطانه أيها الملك، الجيد العهد، القوي السلطان، من كل أعدائك، وثبَت لك ملكك، وأدام سلامتك، في بدنك ونفسك منذ الآن إلى الأبد. أنا برتا بنت الأوتاري، الملكة على جميع الفرنجيين، أقرأ، يا سيدي الملك، عليك السَلام .إنه جرت بيني وبين الملك افريقية صداقة لأنَي لم أكن أتوهم أن ملكاً يكون فوقه يملك الأرض إلى هذه الغاية. إنَ مراكبي كانت خرجت، فأخذت مراكب ملك افريقية، وكان رئيسها خادماً له، يقال له علىَ، فأسرته ومائة وخمسين رجلاً كانوا معه في ثلاثة مراكب. وبقوا في ملكي سبع سنين، ووجدته عاقلاً فهماً. فأعلمني انك ملكٌ على جميع الملوك، وقد كان صار إلى مملكتي خلقٌ كثير. فلم يصدقني منهم عنك إلا هذا الخادم الذي يحمل إليك كتابي هذا. وقد بعثت معه هدايا ممَا في بلدي، وجعلتها تكرمه لك واستجلاباً لمودَتك. وهي: خمسون سيفاً، وخمسون ترساً، وخمسون رمحاً فرنجية، وعشرون ثوباً منسوجة بالذهب، وعشرون خادماً، وعشرون جاريةً، وعشرة أكلب كبار لا تطيقها السباع، وسبعة بزاة، وسبعة صقورة، ومضرب حرير بجميع آلاته، وعشرون ثوباً معمولة من صوف يخرج من قعر البحر يتلون لوناً في كل ساعة من ساعات النهار، وثلاثة أطيار تكون ببلاد فرنجة إذا نظرت إلى الطعام أو الشراب المسموم صاحت صياحاً منكراً وصفقَت بأجنحتها حتى يعلم ذلك، وخرزٌ تجتذب النصول والازجَة بعد بناء اللحم عليها بغير وجع .وعرفَني أنَ بينك وبين ملك الروم المقيم بالقسطنطينية، صداقة، وأنا أوسع منه سلطاناً وأكثر جنوداً، لان سلطاني على أربع وعشرين مملكة، كل مملكة لسانها مخالفٌ للسان المملكة التي تليها. وفي مملكتي مدينة رومية العظمى .والحمد الله، وقال لي فيك قولاً حسناً ملأ به قلبي مما أنت عليه في أمورك، وأنا أسأل الله العون على مصادقتك والصلَح بيننا ما أحببت من السنين. فإنَ الأمر في ذلك إليك. والصلح شيءٌ لم يطلبه أحد من أهل بيتي ولا قراباتي ولا جنسي قط. ولم يكن أحدٌ يخبرني عن جيوشك وكراماتك التي أنت فيها على ما اخبرني به الآن هذا الخادم الذي أرسلت به إليك.","tags":[],"partial":0,"sp":22,"kind":"prose","spLabel":"قال أبو عبد الله محمد بن ع… … وذكرت الهدية بكمالها على م…"},{"id":"b3-86","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨٦","topic":"الهدايا","loc":87,"text":"فعليك يا سيدي في محبة الله أكثر السلام. واكتب إلىَ بصحَتك وفي جميع حوائجك في مملكتي وبلدي مع علَي هذا الخادم، ولا تحبسه قبلك ليجيبني عنك، فإني متوقعةٌ لموافاته. وقد حمَلته سرَاً يقوله لك إذا رأى وجهك وسمع كلامك، ليكون هذا السَر بيننا، لا أحبَ أن يقف عليه أحدٌ غيرك وغيري وغير هذا الخادم. وعليك أكثر سلام الله وعلى جميع من معك، وكبت الله عدوك وجعله وطء قدمك. والسلام) .ورأيت في كتاب سيرة المكتفي بالله الذي ألفه عبد الله ابن أحمد بن أبي طاهر تماماً لكتاب أبيه أبي الفضل أحمد ابن أبي طاهر، المعروف بكتاب بغداد ما يدل أن الهدية المذكورة لم تنفذ إلى المكتفي وان كان في كتاب برتا بنت الأوتاري أن أرسل معه هدية.","tags":["الرقيق"],"partial":0,"sp":22,"kind":"prose","spLabel":"قال أبو عبد الله محمد بن ع… … وذكرت الهدية بكمالها على م…"},{"id":"b3-87","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨٧","topic":"الهدايا","loc":88,"text":"وذكرت الهدية بكمالها على ما تقدم شرحه: وجمعت ذلك كله ليأخذه فقال انه يخاف أن يتصل خبره بصاحب افريقية، مولاه فيجيء هو ويأخذ ذلك. ورجوتُ أن يكون الأمر كما ذكر أن شاء الله، وان يرد علىَ بجواب كتابي هذا إليك، فقد استحلفته على ذلك بالإيمان والعهود التي تأخذها أنت عليه، ليكون رسولاً بيننا، وجميع ما يخطر بقلبك مما تحتاج إليه من مملكتي، فهو لك، وما احتاج أنا أيضاً إليه مما في مملكتك، سألتك إيَّاه. هذا الكلام لم تتهيأ ترجمته. ويكون بيننا عهد، وأرسل إليك بجميع من قد حويناه من أسرى المسلمين) .ثم اتصل الكلام بما في الأول .","tags":["الكتب"],"partial":0,"sp":22,"kind":"prose","spLabel":"قال أبو عبد الله محمد بن ع… … وذكرت الهدية بكمالها على م…"},{"id":"b3-88","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨٨","topic":"الهدايا","loc":89,"text":"قال أبو الحسن الأصبهانيّ: فدعاني الوزير العباس بن الحسن، وقد كان ذكرني من ديوان الرسائل في أيام علَة ابن فرات. فألقى إلى الكتاب عن هذه الملكة إلى المكتفي، وقال لي: تجيب عن هذا الكتاب، لأقف على مذهبك في الصناعة .فأجبت بجواب كان فيه بعض الخشونة. فأمرني بملاينتها وعمل كتاب ثان. فعملته وعرضته عليه، فاستحسنه. ووصل الخادم بمال. وأنفذ الكتاب معه فمات في الطريق .وهذه نسخة الجواب الثاني :بسم الله الرحمن الرحيم، أمَا بعد فإن الله المتوحَد بملكه، اللطيف بعبادة، قاسم شيم الفضل بينهم، وباسط يد الطَول والإنعام عليهم، قسم لأمير المؤمنين، مع ما اختصَه به من خلافته، وأصار إليه من وراثة سلطانه، اشرف أخلاق المكارم وأبسق منازلها، وجعل العدل والفضل يكتنفانه في كلَ سبيل يلتحقها.","tags":[],"partial":0,"sp":23,"kind":"prose","spLabel":"قال أبو الحسن الأصبهانيّ: … … وعادة اللين والمخشنة معهود…"},{"id":"b3-89","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٨٩","topic":"الهدايا","loc":90,"text":"وعادة اللين والمخشنة معهودة منه في حالتي وجوبها ليحتوي على الشرف الأعلى عادلاً وفاضلاً، ويشتمل على الكرم الأذكى مانعاً وباذلاً، ويفوز بالحق الأنقى قابضاً وباسطاً. والله حميد مجيد .وانه أنهى إلى أمير المؤمنين أن خادماً يسمَي عليَاً ورد باب أمير المؤمنين ووصف أنه وافد عنك بكتاب تذكرين فيه أن أحوالاً جرت بينك وبين الملك على افريقية في التجاذب والتحارب صار في خلالها هذا الخادم ومائة وخمسون رجلاً، كانوا معه في ثلاثة مراكب خرجت إليك من قبله، أسرى في يديك، فبقوا في ملكك سبع سنين وأفرجت تلك الأحوال عن صداقة بينك وبينه .وانك لم تتوهمي أنه يكون فوقه ملك أعلى منه حتى أعلمك هذا الخادم أن أمير المؤمنين ملك ملوك الأرض، وعرفَك من أنحاء فضله ما بعثك على إنفاذه إلى أمير المؤمنين .وانك أردت أن تُنفذي معه هدية من أصناف الأسلحة والأمتعة والخدم والجواري الصقالبة والجوارح المعلَمة .فكره الخادم حمل ذلك إشفاقاً من أن يتصل خبره بالملك على افريقية فيعترضه في الطريق ويسلبه إيَّاه، فأخرت الأمر في إنفاذه وقدَمت التوجيه بالخادم ليعود إليك بجواب الكتاب ويكون رسولاً بين أمير المؤمنين وبينك يحمل إليك ما يخطر بقلب أمير المؤمنين مما يحتاج إليه من مملكتك، ويؤدَي عنك ما تسألين أمير المؤمنين تصدرين معه إلى أمير المؤمنين ما تحويه مملكتك من أسرى المسلمين .وانه عرَفك إلى ذلك أن بين أمير المؤمنين وبين عظيم الروم المقيم بقسطنطينَية صداقة وانك منيفة الخطر عليه، إذ كان سلطانك يشمل على أربع وعشرين مملكة، لكل واحدة منها لغة تخالف لغة الأخرى، وفيها مدينة رومية العظمى .وتعرضين في فحوى خطابك بصلح يوقعه أمير المؤمنين لك وبسلم يعقده بينه وبينك، وتصلين ذلك بذكر ما أوعزت إلى الخادم فيه بما يسرهَ إلى أمير المؤمنين على جميع ما تضمنه هذا الكتاب، وفهمه .وأمير المؤمنين يفتتح قوله بحمد الله وشكره على ما أعطاه من النعمة النفيسة في أخلاقه وأعرافه، ومنحه من الفضائل المقصورة في مناقبه ومفاخره، وظاهر له من الكرامة في نشر ما افرده بخصائصه، وأسعده بجزيل المواهبة فيه من شيم التطوَل والتفضَل في أطراف الأرض وأقطارِها، وتمكين ذلك في أنفس الأملاك المتفاوتة المنازل في أكنافها وأطرافها، فكلٌَ على اختلاف محلَهم وتباين مذاهبهم وتقاذف مطارحهم ينزع إلى اقتناء مرتبة إليه في لطفة يجتبيها منه، أو عطفة يبذلها له، أو حال من البسط والإيناس يوجبها فيه، متغايرين على ذلك، متنافسين فيه، مستشعرين لباس الرغبة والرهبة له، ليتم الله على أمير المؤمنين نعمته ويزيده من فضله. والله ذو فضل عظيم .ويعلمك أمير المؤمنين أن الذي أنبأت عنه وأوفدت هذا الخادم فيه وأحببت إيقاعك إيَّاه.","tags":[],"partial":0,"sp":23,"kind":"prose","spLabel":"قال أبو الحسن الأصبهانيّ: … … وعادة اللين والمخشنة معهود…"},{"id":"b3-90","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩٠","topic":"الهدايا","loc":91,"text":"من حال تسهيل المواصلة والملاطفة بين أمير المؤمنين وبينك واقع لك عند أمير المؤمنين الموقع الذي ترجينه وتناهت أمنيتك إليه. .. ... من المكاتبة، واستدعيت من المراسلة ورغبت إلى أمير المؤمنين فيه من أسباب المهاداة والملاطفة ومقابلته بما أومأت إليه من إصدار أسرى المسلمين واوجب ذمة الإسلام بمالهم. فإن التمستيه على هذه السبيل وجدتِ أمير المؤمنين سمحاً بذلك على أشرف أحواله وأوكد شرائطه، إيجاباً لحقك ورعاية لزمام رغبتك. وبالله التوفيق .وأمَا الذي وصفت من أن الخادم عرفَك إيَّاه من صداقة بين أمير المؤمنين وبين عظيم الروم المقيمين بقسطنطينية، وذكرتِ من إشراف خطرك عليه، وان ممالكك أوسع من ممالكه فما كان ليعزب عن أمير المؤمنين مقدار كل عظيم من عظماء الأمم ممن يروس من أمته ويتسع فيه من أرضه على عدد ما بين منازلها، وتفاوت ما بين ممالكها، ومراعاة لذلك بغير إشرافه واعتنائه بحق سياسته وتدبيره، وليس ما بين أمير المؤمنين وبين هذه الفئة من مراسلة وملاطفة أمر يحضره اسم على ما يبتدرونه من المكاتبة ويرغبون إليه فيه من المراسلة، فإذا استوجب هذه المسألة أمير المؤمنين. اسم لصداقة (؟) ولكنه إيناس يوجبه أمير المؤمنين لهم على المنزلة من أمير المؤمنين، كنت الأرة فيهم على حسب تقدمك في شرف الحال والنعمة، فأعلمي ذلك واعملي في مكاتبة أمير المؤمنين ومراسلته والانبساط إليه على حسبه أن شاء الله. وقد أدى إلى الخادم السرَ الذي ذكرت إيداعك إيَّاه. ويحمل في جوابه ما يؤديَه بإذن الله. والسلام على من اتبع الهدى .","tags":["الرقيق","الروم"],"partial":0,"sp":24,"kind":"prose","spLabel":"من حال تسهيل المواصلة والم… … وأهدى أبو الحسن علّي بن مح…"},{"id":"b3-91","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩١","topic":"الهدايا","loc":92,"text":"وأهدى إسماعيل بن احمد، صاحب خراسان، إلى جعفر المقتدر بالله في سنة ثمان وتسعين ومايتين هدايا جليلة، قدم بها رسوله إليه. منها مئة وعشرون غلاماً بسيوفهم ومناطقهم ودوابَهم وسروجها ولجُمُها
