وآلاتها. ومن الثياب ما لا يحصى. وخمسة بيوت فرش طبريَ مذهب ببسطها وآلتها، وخمس براني فضة، فيها خمسون مناً مسكا. وألف ومائة جلد سمور وَفَنك وثعلب. وخمسون بازياً. وعشرون حبة ختو، وثلاث مئة حمارة تهالى، وثلاثون فرساً جليلة مفضضة، وثلاثون رمحاً مفضضة .","tags":[],"partial":0,"sp":24,"kind":"prose","spLabel":"من حال تسهيل المواصلة والم… … وأهدى أبو الحسن علّي بن مح…"},{"id":"b3-92","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩٢","topic":"الهدايا","loc":93,"text":"وأهدى الوزير حامد بن العباس في سنة ثمان وثلاث مئة إلى المقتدر بالله البستان المعروف بالناعورة ببغداد، وكان بناه له وانفق على بنائه من ماله مئة ألف دينار، وعّلق على المجالس التي فيه الستائر، وفرشه باللبود الخراسانية .","tags":["العراق"],"partial":0,"sp":24,"kind":"prose","spLabel":"من حال تسهيل المواصلة والم… … وأهدى أبو الحسن علّي بن مح…"},{"id":"b3-93","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩٣","topic":"الهدايا","loc":94,"text":"وأهدى أبو الحسن علّي بن محمد بن الفرات في وزارته الثالثة في سنة ثلاث مئة قبل القبض عليه، إلى مؤنس المظفر حين قدم من مصر والمغرب فيها، وإلى بشري، وبليق، ونازوك، وغيره من الغلمان والخدم وقد حضر النيروز، هدايا اشتملت قيمتها على سبع مئة ألف درهم. وقدّر أن يستكفيهم بذلك عنه. فلم يقع الموقع الذي قدّره .","tags":["مصر"],"partial":0,"sp":24,"kind":"prose","spLabel":"من حال تسهيل المواصلة والم… … وأهدى أبو الحسن علّي بن مح…"},{"id":"b3-94","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩٤","topic":"الهدايا","loc":95,"text":"وأهدى رومانس ملك الروم، وقسطنطين واسطاوانوس رؤساء الروم إلى الرضي بالله في سنة ست وعشرين وثلاث مئة في شهر رمضان منها هدية نفيسة. ومعها كتاب من ملك الروم كانت الكتابة فيه الرومية بالذَّهب والترجمة العربية بالفضة وعنوانه على ما ترجم: (بالحضرة رومانس، وأسطاوانس، وقسطنطين المؤمنون بالله، عظماء الروم، إلى الشريف البهي صاحب سلطان المسلمين) .يقول في آخر الكتاب بعد ذكر ما رغب فيه من المسألة، والصلح والفداء وعقد الهدنة، ولما نحن عليه من استحكام المودّة، وخلوصِ الميل إلى اخوتك وجّهنا إلى شريف حسبك شيئاً من الألطاف تبين عن ذَلك. وهو ثلاثة أقداح من ذهب مجرى فيه الجوهر، وفلسقيتان من بلّور مرّبط بفضّة مذهبٍ منقوش مرصّع بالجوهر واللؤلؤ. وفوق غطائه أسد بِلّور. وفلسقيتان أخريان من بلور مربّط بفضّة، مذهبة في الناحية الواحدة، مشبكة بجواهر، وفي وسطها درات، وفي الناحية الأخرى أربع قصبات فضة مطلية بالذَّهب، وكرنيب وكوز فضة مطليّان بالذَّهب مجرى فيهما الجوهر. وجرة قدسة مذهبة مجرى فيها الجوهر، مرصّع بالجوهر واللؤلؤ مكتوب على فمها (صوت الله على الحياة) وجرة أخرى فضة، لها أذنان، مذهبة مرصعة باللؤلؤ وألوان الجوهر. على غطائها تمثال طاووس صغير. وقدس فضة مذهب مجرى فيه الجوهر، مرصع باللؤلؤ والجوهر. وقدس آخر مذهّب مرصع بالجوهر، وجريدة فضة مذهّبة، لها ثلاث آذان، مجرى فيها الجوهر، منقوشة بعصافير، ونرجس، مكتوب على فمها، وصندوق صغير فضة ذو ثمانية أركان، مذهبة مجرى فيه الجوهر، وغطاؤه مستطيل مرصع بالجوهر واللؤلؤ. وفي جوفه ثلاثُ مساد كنان بالذَّهب، ووردات كبار بذهب، وثلاث مشاد كنان منقوشة بالذَّهب، ووردات صغار. وثلاث عمائم قزّ، منقوشة الأطراف بالذَّهب، وغلاف لعدة أقداح فضة مجرى فيه الجوهر، مكتوب على فيه (اللهم اعزز رومانس الملك) وجريدة فضة مذهبة، بأذنين صغيرتين مرصعتين بالجوهر واللؤلؤ. وعلى أذنها وفمها ثلاثة طواويس. وغلاف فيه سكّينان نصبهما بأزهر، مربط بالذهب مجرى فيه الجوهر. وعلى رؤوس النصب زمرد مغرق الحلية، منقوش بالذهب، وسكّينان أخريان نصبهما جوهر. مغرفة باللؤلؤ والجوهر، وغلافهما مرصع بزمرد وياقوت ولؤلؤ وسواد، والقراب ذهب مغرق باللؤلؤ. وطبرزين ثقيل الفم، فضة مذهب مجرى فيه الجوهر، مرصع باللؤلؤ. وفي قصبته فضة مشبكة مغرقة بفضة مذهبة. وثلاث سكّينات، إحداهما مغرقة بالذَهب، والاثنتان فضة، وباب إحداهما مذهبة. وسبع سُفر ديباج، نقش احدها عقبان بلونين. والآخر (كذا) مورد بثلاثة ألوان. والآخر (كذا) أحمر مشجّر ملّون آخر (كذا) نقشه أشجار ببياض، واثنان بشكر بدارة وبياض. واثنان أسُد باركة بصفرة. واثنان عقبان بدارات. وعشرة أثواب حمر سقلاطون وعشرة أثواب آخر بنفسجية.","tags":[],"partial":0,"sp":25,"kind":"prose","spLabel":"وأهدى رومانس ملك الروم، وق… … وخمسة أثواب سقلاطون ملونة،…"},{"id":"b3-95","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩٥","topic":"الهدايا","loc":96,"text":"وخمسة أثواب سقلاطون ملونة، وخمسة أثواب بياض سقلاطون. وعشرون ثوباً مخططاً. وأربع فري الواحدة تسمي كبك، والأخرى ثعلب أبيض، والآخر يسمي بالس، والآخر يسمي بكس (كذا ). ومن اللحف اثنان مخملة نقشها عقاب بدارة، وأرضها بنفسجي. وفي أعلاهما فرسان، واثنان آخران على نقشهما بغير خمل، وآخر نقشة نخلة وأرضه خضراءُ. وعشرة أثواب سندس. نقش احدها صورةُ ملك فارس، وفي يده علم، والآخر طير بأجنحة قد ضربت على أسد. واثنان وحش بأجنحة، وآخر عقاب بدارة قابض على حمار وحش .وآخر بقر وحش ذو قرن واحد. وتيوس برية بستّ دارات. وآخر عليه خمس عشرة دائرة ببياض، وآخر نقشه بقر وحش قابض على نمر. وآخر دابة بأجنحة، وفي أربعة أركانه عقبان صغار، ومن القُطف الكبار عشرة، إحداهما سقلاطون زمرد، في رقمه فيلة، والأخرى في أعلامها وردات، وفي الورد بطّ وغيرها من الطيور، والأخرى سِقلاطون في أعلامها طيور، والأخرى سقلاطون وفي أعلامها وحش ذو قرن واحد. والأخرى في أعلامها أسد منقوش بصفرة، والأخرى في أعلامها رؤوس الأُسُد فاغرة الأفواه، وفي وسطها شجرة، والأخرى سقلاطون، وفي أعلامها تماثيل ملوك فرسان، ووحش ذو قرن واحد وفي دارتها دابة بأجنحة. وعشرة أثواب ملّونة بأعلام على عمل البارمانية. وعشرة سدوسات بأعلام. وعشرة أرؤس من الدواب، وعشرة مناديل بأعلام. والترجمان يسأل بسط العذر في صفة الهدايا، فإني لم انظر إليها فأكتبها على صفتها. والسّلام على الخليفة أطال الله بقاه وأيده .","tags":[],"partial":0,"sp":25,"kind":"prose","spLabel":"وأهدى رومانس ملك الروم، وق… … وخمسة أثواب سقلاطون ملونة،…"},{"id":"b3-96","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩٦","topic":"الهدايا","loc":97,"text":"وكان الجواب: (من عبد الله أبي العباس الراضي بالله أمير المؤمنين إلى رومانس وقسطنطين وأسطفإنوس رؤساء الروم ). كذلك العنوان .وفيه بعد ذكر ما أجيبوا عنه: (وقد أسعفكم أمير المؤمنين بما أحببتم في هديتكم. وزوّد الرسل ما سنح من مبرتكم، صيانة لكم عن الاحتشام، وترفّعاً عندكم عن الاغتنام، وثبت ذلك يقرن بهذا الكتاب إن شاء الله .وكتب الفضل بن جعفر في يوم الاثنين لليلة بقيت من رمضان سنة ست وعشرين وثلاث منه) .","tags":["الرقيق","المجالس"],"partial":0,"sp":26,"kind":"prose","spLabel":"وكان الجواب: (من عبد الله … … وأهدى القائد أبو الحسين جو…"},{"id":"b3-97","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩٧","topic":"الهدايا","loc":98,"text":"وأهدى الأمير عز الدولة بختيار بن معز الدولة أبي الحسن أحمد بن بويه الديلمي، إلى أبي المقلّد حمدان بن ناصر الدولة أبي الحسن محمد بن عبد الله بن حمدان، في سنة ثمان وخمسين وثلاث مئة، هديّة جملتها ثلاث مئة ألف درهم، وست مئة ثوب من الخز، والديباج، والعتّابي، والقصب، والدبيقي، والملحم، والمصمت. ونيف وعشرون كساءً طبريّة. ومائة مطرف خز. وخمسة آلاف قطعة نّد، وعشرون فرساً. وعشرون بغلا، إلى ما سوى ذلك .وعشرون مركباً ذهباً وفضّة. ومن الفرش دستا ديباج تستريّ مذهب .","tags":[],"partial":0,"sp":26,"kind":"prose","spLabel":"وكان الجواب: (من عبد الله … … وأهدى القائد أبو الحسين جو…"},{"id":"b3-98","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩٨","topic":"الهدايا","loc":99,"text":"وأهدى إسحاق بن زياد صاحب اليمن، إلى عز الدولة أبي منصور، في سنة تسع وخمسين وثلاث مئة، هدية من جملتها دقلٌ من عود قماريّ طوله بالكبير عشرة اذرع، ووزنه ثلاثون منا. وقشرةُ بيضة حية، تسع وخمسون عشر رطلاً بالبغدادي، وببغاءُ بيضاء كبيرة، سوداء المنقار والرجلين، وعلى رأسها ذؤابة فستقية، وغنم كثير لها غَبَب، وحمارة كبيرة وحشيّة عظيمة الخلق في قدر البغل مدورة الكَفَل، وآذانها تشبه آذان البغل، وهي مخطّطة أحسن شيء وأعجبه، وكان التخطيط عامّاً بجميع خلقها، وقيل إنها من بلد من بلدان الحبشة تملكه امرأة، وبينه وبين بغداد ألف وثمان مئة فرسخ .","tags":["الخيل"],"partial":0,"sp":26,"kind":"prose","spLabel":"وكان الجواب: (من عبد الله … … وأهدى القائد أبو الحسين جو…"},{"id":"b3-99","bab":3,"sec":"باب الهدايا","page":"ج٣ ص٩٩","topic":"الهدايا","loc":100,"text":"وأهدى القائد أبو الحسين جوهر إلى المعزّ لدين الله بعد ما ملك مصر، في سنة تسع وخمسين وثلاث مئة، هدية فيها تسع وتسعون نجيبة، وإحدى وعشرون قبة، بأجلّة الديباج المنسوجة بالذَّهب، ومناطق الذَّهب المكلّلة بالجوهر، ومائة وعشرون ناقة بالديباج والبزيون والأعنّة المحلاة بالفضة، وخمس مئة جمل عراب، وستة وخمسون جلاّ، وثمانية وأربعون دابّة. منها بغلة واحدة، وسبعة وأربعون فرساً، عليها أجّلة الديباج المنقوش والسروج، على جميعها أصناف الحلية من الذَّهب، ومنها ما هو بالفضة، مموّه بالذَّهب. ولجمها، منها ما هو بالذَّهب، ومنها ما هو بالفضة. وعودان عظيمان من عود كأطولِ ما يكون من الصواري جدّا، فردان من جلب نحرير الارغلي.","tags":[],"partial":0,"sp":26,"kind":"prose","spLabel":"وكان الجواب: (من عبد الله … … وأهدى القائد أبو الحسين جو…"},{"id":"b3-100","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠٠","topic":"الهدايا","loc":101,"text":"وكان نحرير أخذهما من ورثة الأعور الفارسي لشركة كانت بينهما مع جماعة من قوّاد الإخشيدية والكافوريّة، الذين أنفذهم جعفر بن فلاح من الشام، في هذه السنة، منهم الحسن بن عبيد الله بن طغج ابن أخي أبي بكر الإخشيد. ومن غزوان صاحب القرامطة، وفاتك الهنكري، وابن الرياحي كاتب ابن عبيد الله، ونحرير شويران، ومفلح الوهباني، ودرّي الخازن، وقرقيل، وسلع التركي الكافوري، وأبو منجل الأخشيدي، وفرج البجمكي، ولؤلؤ الطويل، وفنك الخادم. وحملهم جوهر في المركب إلى الإسكندرية، وحملوا منها إلى مدينة القيروان في البّر .وأهدت السّيدة الشريفة ست الملوك أُخت الحاكم بأمر الله، إلى أخيها، في يوم الثلاثاء، التاسع من شعبان سنة سبع وثمانين وثلاث مئة، هدايا من جملتها ثلاثون فرساً بمراكبها ذهباً. منها مركب واحد مرصّع. ومركب من حجر البلّور. منها مركب واحد مرصّع. ومركب من حجر البّلور. وعشرون بغلة بسروجها ولُجُمها. وخمسون خادماً. منهم عشرة صقالبة. ومائة تخت من أنواع الثياب وفاخرها، وتاج مرصع بنفيس الجوهر، وشاشية مرصعة، وأسفاطٌ كثيرةٌ من طيب، من سائر أنواعه. وبستان من الفضّة مزروع من أنواع الشجر .","tags":[],"partial":0,"sp":27,"kind":"prose","spLabel":"وكان نحرير أخذهما من ورثة … … وذكر أَبو محمد الحسن بن رش…"},{"id":"b3-101","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠١","topic":"الهدايا","loc":102,"text":"وأهدى المعزّ بن باديس بن المنصور بن بلكين بن زيري بن مَناد صاحب المغرب إلى الظاهر لإعزاز دين الله، في سنة عشرين وأربع مئة، هدايا جليلة، من جملتها عشرون جارية، لم يُر أحسن قدوداً ووجودهاً وألواناً وأجساماً منهن. ومعهن جاريةٌ تفوقهنّ مفردة حسناً وكمالاً. وعلى نهودهن حِقاقُ فضّة. وثلاثة أرؤس من جياد الخيل الثمينة. منها كُمَيت بسرج ذهب صياغة المغرب، وزن ذهبه قنطار. وأشقر سرجُه لؤلؤ، وادهم سرجه فضّة بياض وزن مئة قنطار. وثلاثة آلاف منَا زعفران وخمسون دَرَقة موكّبية مغشاة بديباج. واثنا عشر صقلبّياً بيضٌ صبيانٌ حسانُ الوجوه والقدود. وعشرون خادماً من ملاح السودان صبياناً. وألف وخمس مئة ثوب من سائر ألوان الخزّ المغربيّ الملّين. وأربع مئة غفارة من رفيع الطالقان. ومن الرماح الزان ما لا يُعد كثرة. ومن الصناديق والأقفاص المملوءَة سيوفاً، وغيرها مثل ذلك. ومن الثياب الصِقليّ، والثياب السوسيّ، والفرخات والعمائم الصِقلّي عدة أُلوف. وفي جملة الهديّة ألف قنطار شمعاً. وجلس الظاهر لرسوله في إيوان قصره على السرير الكبير الذَّهب. وقرئ كتابه وعرضت عليه هديته في يوم الأحد لثمان خلون من شوال من السنة المذكورة.","tags":[],"partial":0,"sp":27,"kind":"prose","spLabel":"وكان نحرير أخذهما من ورثة … … وذكر أَبو محمد الحسن بن رش…"},{"id":"b3-102","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠٢","topic":"الهدايا","loc":103,"text":"وكان يوماً حسناً .وأنفذ إليه الظاهر لإِعزاز دين الله هدية جليلة المقدار فيها من غرائب طُرف بلاد الهند والصين وبلاد خرسان من سائر أَنواع الطيب والجوهر وغير ذلك، ما لا يحد. ومن دق تنّيس ودمياط وتونة وأعمالها من الملابس والفرش والتعاليق والأَعلام والمنجنوقات والبنود والأَلوية على القصب الفضة المجراة بالذهب من سائر الصور كل بديعة وغريبة قدرها وتمنع وجود مثلها. وحمل إليه زرافة مليحة الصورة رائعة بجلالها وحليّها. وعدة من البخت الخراسانية تحمل سائر أَنواع العماريات والقباب والمحامل المعمولة من العاج والأبنوس والصندل المضّبب بالذَهب والفضة، التي عليها أهلّةُ الذَّهب، المجلّلة بفاخر الأجلّة، من الخسرواني الأحمر المذهب، والمخمل المذهب، والدبيقي المذهب. وغيره من سائر أنواعه وألوانه. فيهن حسان الجواري المغنيات المحسنات والراقصات المفتِنات. ومن الخدم الروقة، والحسان الوجوه والقدود والملابس عدةٌ وافرة. ومن الخيل العرابِ ذوات الأَثمان الغالية والصفات البديعة شيٌء كثير. على أكثرهاَ سروج الذَّهب والفضة والجوهر والعنبر والكافور، الغريب الصنعة المعدوم المثل. ومن الدروع والخوذ والجواشن المذهبة، والسيوف المجوهرة ما يعزّ وجود مثله إلى ما سِوىَ ذلك .","tags":[],"partial":0,"sp":27,"kind":"prose","spLabel":"وكان نحرير أخذهما من ورثة … … وذكر أَبو محمد الحسن بن رش…"},{"id":"b3-103","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠٣","topic":"الهدايا","loc":104,"text":"وذكر أَبو محمد الحسن بن رشيق، شاعر المغرب، هذه الهدية في قصيدته التي مدح بها المعز بن باديس وهنّأَه بعقد الإمارة لولده الأمير أبي منصور نزار، في سنة اثنتين وعشرين وأَربع مئة، التي أوّلُها:","tags":["الأغالبة"],"partial":0,"sp":27,"kind":"prose","spLabel":"وكان نحرير أخذهما من ورثة … … وذكر أَبو محمد الحسن بن رش…"},{"id":"b3-104","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠٤","topic":"الهدايا","loc":105,"text":"يقول فيها، وأَحسن في صفة الزرافة:\n(عن مثل فضلك تنطق الشعراء ... وبمثل فخرك تفخر الأمراء)\n(وأرى الثّرى والماء نحوك حّملاً ... ما لا يقوم له الثرى والماء)\n(لم يبق من طرف العراق وغيرهِ ... شيء يروقُ العين منه رواء)\n(حتى كأن الشرقَ أعمل فكره ... في أن حوته يميُنك البيضاء)\n(وأتتك من كسب الملوك زرافةٌ ... شتّى الصفات لكونها أنباء)\n(جمعت محاسنَ ما حكت فتنافست ... في خَلقها وتنافت الأعضاء)\n(تحتثها بين الحواني مشيةٌ ... بادٍ عليها الكبرُ والغلواء)\n(وتمدّ جيداً في الهواء يزينُها ... فكأنه تحت اللواء لِِِِِواء)\n(حطت من آخرها وشرّف صدرها ... حتى كأن وقوفها إقعاء)\n(وكأن فهر الطيب ما رجمت به ... وجه الثرى لو لمّت الأجزاء)\n(وتخيرت دون الملابس حلةً ... عنيت بصنعة مثلها صنعاء)\n(لوناً كلون الدبل إلا انه ... حلىٌ وجزّع بعضه الحلاء)\n(أو كالسحاب المكفهرّة خيطت ... فيها البروق وشقها إيماء)\n(أو مثل ما صديت صفايح جوشنٍٍ ... وجرى على حافتهن جلاء)\n(نعم التجانيف التي أدّرعت به ... من جلدها لو كان فيه وقاء)\n(وسوابق مثل البروق لواحق ... بل عندها أن البروق بطاء)\n(جردلٌ يقعن على الصفا فيثرنه ... وكأنهن على الثرى أنداء)\n(مكسوة الصهوات كلّ مكللٍِ ... لا ينتهيه بقيمة إحصاء)\n(يلمعن من أكنافهن كأنجمٍ ... زهرٍ تولت صقلها الأنواء)\n(والمذهبات من الخوافق بعضها ... ليثٌ أزل ولبوةٌ فيحاء)\n(عذبٌ كألسنة البروق تلمظت ... ليلاً بهن الديمة الوطفاء)\n(كادت ينالُ بها السماء تطاولاً ... قصب النظار ولن ينال سماء)\n(والبخت موقرةُ الظهور لبعضها ... تحت القباب تخمّطٌ ورغاء)\n(من كلّ واحدةٍِ ترف بهودج ... كادت تقبل رأسها الجوزاء)\n(كسيت جلاليت النسيج كأنما ... نشرت عليها روضةٌ زهراء)\n(فيهن أمثال الظباء أوانس ... ومن الأنيس جآذرٌ وظباء)\n(بيض يباشرن الحرير بمثله ... وله على أبشارهنّ حناء)\n(فيها القيانُ الملهياتُ كأنما ... ألحانهن على المعزّ ثناء)\n(يصيحك من سكر المدام سماعها ... وبه تصرّع لبّها الندماء)\n(لو غنت الصّمان وهو كلفظه ... جبل اصم بداله إصغاء)\n(ورواقص هيف الخصور كأنما ... حركاتهن على الغناء غناء)\n(لو أنّ موطئهنّ مقلة أرمدٍِ ... لم يشك أن نعالهن خفاء)\n(ومدببات لو لبسن لدى الوغى ... ما كان فيها للحديد مضاء)\n(يتلهب الإبريز فيها حيث لا ... يخشى لماءٍ فرندها إطفاء)\n(ومن القوابض كل أبيض صارم ... لا يُستمال بمثله الأعداء)\n(سبق الدماء إلى النفوس ففاتها ... ومضى وليس بشفرتيه دماء)\n(مما تخيره للسبك تبع واحق ... من روث الأبَ الأبناء (كذا ))\n(متقلداً منهن كل مجوهر ... نصلاً وغمداً حليتاه سواء)\n(وكأنما ضحكت ثغورٌ أو بكت ... فيها عيونُ دمعهنّ رواء)","tags":["الجوهر"],"partial":0,"sp":28,"kind":"verse","spLabel":"يقول فيها، وأَحسن في صفة ا… … يقول فيها، وأَحسن في صفة ا…"},{"id":"b3-105","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠٥","topic":"الهدايا","loc":106,"text":"وأهدى إليه المعزُّ بن باديس أيضاً في سنة أربع وعشرين وأَربع مئة هديّة جليلة المقدار أيضاً كان فيها :أربعة سباع أَعظم ما يكون منها وأَهولها، وعشرون كلباً سلوقية، وعدة نمورة، وشمع كثير، ومتاع جمّ من ثياب خزّ، وسوسيّ وصقلّي، وزعفران، وعبيد من خدم بيض وسود، ورقيق رائع. وغير ذلك .وأَهدى قسطنطين ملك الروم إلى المستنصر بالله في سنة سبع وثلاثين وأَربع مئة والوزير يومئذ أبو نصر صدقة بن يوسف الفلاحي، ومدبّر الدولة أَبو سعد إبراهيم بن سهل التستري اليهودي حين أرسله بتجديد عقد الهدنة لمدة عشر سنين، آخرها سنة سبع وأربعين وأربع مئة  - هديّة لم يسبقه أحدٌ من ملوك الروم بمهاداة مثلها إلى مَن تَقَدّم من خلفاء الإسلام منذ سالف الزمان وإلى الآن، لسعة نفسه وكبير مروءته. واشتملت قيمتها على ثلاثين قنطاراً من الذَّهب، الذي كلُّ قنطار منها سبعة آلاف دينار ومايتا دينار رومية، وعشرة آلاف دينار عربية. يكون قيمة ذلك مايتي أَلف وستة عشر أَلف دينار رومية، وثلاث مئة أَلف دينار عربيّة، وكانت الهديّة مئة وخمسين رأساً من البغلات المستحسنة، والخيل المنتخبة يجلّل كلّ واحد منها ثوبُ ديباج. وخمسين بغلاً يتبعها تحمل خمسين زوجاً من الصناديق، يغطيها خمسون سندسية ابريسم. ويقود الجميع مايتا رجل ممن كان في الحبوس من أَسرى المسلمين، وكان فيما تحويه الصناديق من أصناف الآنية الذَّهب المجراة بالمينة مئة قطعة. ومن أنواع الديباج ألف ثوب، ومن السنادس الفايقة، والمناطق الحمر الروميّة المعلّمة بالذَّهب، والعمايم الطلي المرتفعة المطرزة بالذَّهب، والستور، والمناديل الديباج التي تلفّ الثياب  - ثلاث مئة قطعة .","tags":[],"partial":0,"sp":29,"kind":"prose","spLabel":"وأهدى إليه المعزُّ بن بادي… … وأهدى ميخائيل ملك الروم أي…"},{"id":"b3-106","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠٦","topic":"الهدايا","loc":107,"text":"وأهدى إليه ابن مجاهد، صاحب الأَندلس، في سنة اثنتين وخمسين وأربع مئة هديّة قوّمت بمئة ألف دينار. من جملتها عقدُ جوهر قُوّم بعشرة آلاف دينار.","tags":["الجوهر"],"partial":0,"sp":29,"kind":"prose","spLabel":"وأهدى إليه المعزُّ بن بادي… … وأهدى ميخائيل ملك الروم أي…"},{"id":"b3-107","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠٧","topic":"الهدايا","loc":108,"text":"وكان فيها ثياب خزّ مذهبات نهاية في الحسن والغرابة .ومات الرسولُ المنفذُ بها في السنة بعينها .وأَهدى إليه المعزّ بن باديس، صاحب القيروان، أيضاً في التاريخ هديّة قوّمت بأربعين ألف دينار. من جملتها ورقةٌ مكلّلةٌ بالجوهر كانت للمهدي بالله بالمغرب .","tags":["الجوهر"],"partial":0,"sp":29,"kind":"prose","spLabel":"وأهدى إليه المعزُّ بن بادي… … وأهدى ميخائيل ملك الروم أي…"},{"id":"b3-108","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠٨","topic":"الهدايا","loc":109,"text":"وأهدى ميخائيل ملك الروم أيضاً إلى المستنصر بالله في وزارة الحسن بن عبد الرحمن اليازوري في سنة أربع وأربعين وأربع مئة، مع رسول له ورد في البحر إلى تّنيس، هدايا جليلة، شاهدت جميعها بتنيس. من جملتها غلمان أتراك متقاربوا الأعمار، وجوار أَتراك، وحجل بيض، وطواويس بيض، وكراكي بيض، وبوقيرات بيض، وغربان بيض، وزرازير بيض، ودباب عظامٌ تلعب بالملاهي، وكلابٌ سلوقية وذبيبية، وما سوى ذلك من أَشباهه من جميع ما تقع عليه العين، سوى ما لا يُرى في الصناديق والتخوت.","tags":[],"partial":0,"sp":29,"kind":"prose","spLabel":"وأهدى إليه المعزُّ بن بادي… … وأهدى ميخائيل ملك الروم أي…"},{"id":"b3-109","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٠٩","topic":"الهدايا","loc":110,"text":"وكان في جملة ما ورد معه من هديته أَلف وسبع مئة مجريس لُطفاً مما يسرّ به الملك، ويستعمل بخزانته، مختومة بالرصاص، وذكر أن قيمة كل واحد منها في بلاد الروم سبعة دنانير، فسيّر جمال الدولة صبح جميع ذلك إليه في شلندي ورد فيه الرسول ودرمون لحمل ثقيل الهديّة، ولم يحمل اللطف واستأذن عليه فأذن له في حمله. فحمل بعد ذلك إلى بعض الجهات .","tags":["الروم"],"partial":0,"sp":30,"kind":"prose","spLabel":"وكان في جملة ما ورد معه من… … ولما طلع الملك المعظم شاهن…"},{"id":"b3-110","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١٠","topic":"الهدايا","loc":111,"text":"وعاد رسول متملك الروم في هذه السنة إلى تنّيس من الحضرة في شلنديه الذي ورد فيه، وسّير معه من بحرية الشام من يوصله إلى يافا، ليصلّي في كنيسة بيت المقدس. ويوصل هديّة أنفذها معه متملك الروم إلى الكنيسة المعروفة بالقمامة ببيت المقدس. ففعل ذلك وأوصل الهديّة.","tags":["الشعر"],"partial":0,"sp":30,"kind":"prose","spLabel":"وكان في جملة ما ورد معه من… … ولما طلع الملك المعظم شاهن…"},{"id":"b3-111","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١١","topic":"الهدايا","loc":112,"text":"وكان من جملتها بدنة من الذَّهب مرصعة بأنواع الجوهر النفيس الفاخر، وصليبان من الذَّهب طولُ كل واحد منهما ثلاثة اذرع ونصف في عرض مثلها، وزنُهما قنطار، مكلّلان بأنواع الياقوت والجوهر. وصواني (كذا) كثيرة من الذَّهب مكلّلة أيضاً بغرائب الجوهر .وكأسان من الذَّهب، ملء كل واحد منهما عشرون رطلاً خمراً بالبغدادي، مكلّلان بأنواع الياقوت والجوهر .وثريّاتٌ عدة من الذَّهب بسلاسلها من الذَّهب، في أوساطها فراخ من البّلور، مكلّلة بالجوهر، وستورٌ طوال كثيرة. من الديباج الطميم المغرق بالذَّهب، المكلّل بالجوهر. وأشباه ذلك من الآلات التي في الكنائس، وأَظهر جميعه يوم الفِصح الأكبر للناس من برموده من سنة تسع وستين وسبع مئة لدقلطيانوس القبطي .","tags":["الجوهر","المجالس"],"partial":0,"sp":30,"kind":"prose","spLabel":"وكان في جملة ما ورد معه من… … ولما طلع الملك المعظم شاهن…"},{"id":"b3-112","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١٢","topic":"الهدايا","loc":113,"text":"ولما طلع الملك المعظم شاهنشاه سلطان دين الله وملك عباد الله وعضد خليفة الله أَبو كاليجار بن سلطان الدولة بن بهاء الدولة بن عضد الدولة بن ركن الدولة بن بويه قلعة اصطخر، وكان صحبته ولده الملك أبو علي، وابن الحكم اليهودي، ولم يكن طلع معه سواهما في ذلك الوقت، فأَما ابن الحكم فاحتج عليه في طلوعه إليها بأَن يعمل فيه شيئاً يذكر به. فإذا فيها بركة نُقَر ثمانية أَذرع في ثمانية أَذرع في ثمانية أَذرع. فأَقلب (؟)، فيها فضة إلى علوها .وأَما ولده، فدخل معه إلى البيوت، وهو يقلب الجواهر التي فيها. فأَخذ قطعة ياقوت كانت رأس عنقاءَ، الوزن ثمانية وعشرون مثقالاً، وتركها في حزَة سراويله. ثم حملها إلى والدته.","tags":[],"partial":0,"sp":30,"kind":"prose","spLabel":"وكان في جملة ما ورد معه من… … ولما طلع الملك المعظم شاهن…"},{"id":"b3-113","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١٣","topic":"الهدايا","loc":114,"text":"وكانت مخبأة عندها إلى وقت دخوله إلى طغريلبك. فأَهداها إليه، ولم يكن معه سواها ولا ما يتقرب به اليه غيرها .وحمل إليه أَيضاً تاج الملوك هزار كسرى بن بنكير بن عياض الكردي الصلاري ببغداد في سنة تسع وأَربعين وأَربع مئة ثلاث زبادي فيروزج .وحمل إليه شهاب الدين والدولة منصور بن أبي الحسين الآمدي، عند وروده إلى بغداد قطعة فيروزج وزنها ثلاثة وعشرون مثقالاً .وحملت إليه السيدة بنت العرموم، زوجة الوزير أَبي القاسم ابن المغربي مذاف أَحمر بهرمان رمّاني، ما يعرف قيمته .وحمل طغريلبك إلى ملك الروم، في سنة ثمان وأَربعين وأربع مئة، صحبة الأَمير قطب الدولة رسوله، والشريف ناجية بن إسماعيل الحسني، صُدورة لؤلؤ فيها خاتم سليمان. في صدرها ياقوتٌ أحمر، الوزنُ خمسةٌ وأربعون مثقالاً، وأيضاً مئة قطعة أَتوار فضة بشمع موكبيّ كبار. ومائة وخمسين صحناً صينيٍّاً مشمشيٍّاً. ومائة ثوب ملا ممزج (كذا)، ومايتي ثوب سقلاطون، ومايتين عتّابي، وعشر طبلات كافور وعود. قوَم بأَلفين وأربع مئة دينار. ونُقد خمسين ألف دينار .وأُخذ من مال البساسيري زيران من ذهب بأَغطية مرصّعة، لم تقع عليها قيمة .وحمل إليه الخليفة القائمُ يوم لقياه له خلعةً، وطوقَ ذهب مرصّع بدرّتين، وزنُ كلّ درّة ثلاثةُ مثاقيل إِلا دانقاً.","tags":[],"partial":0,"sp":31,"kind":"prose","spLabel":"وكانت مخبأة عندها إلى وقت … … وكانت هذه الخيمة .وأَخبرني…"},{"id":"b3-114","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١٤","topic":"الهدايا","loc":115,"text":"وكانتا متساويتين، لا تتميزّ الواحدة عن الأُخرى .وكان لبهاءِ الدولة أَبي نصر خسرو فيروز شاه بن عضد الدولة بن ركن الدولة بن بويه الديلمي خيمة خسرواني تَسَعُ خمس مئة رجل .","tags":[],"partial":0,"sp":31,"kind":"prose","spLabel":"وكانت مخبأة عندها إلى وقت … … وكانت هذه الخيمة .وأَخبرني…"},{"id":"b3-115","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١٥","topic":"الهدايا","loc":116,"text":"وكان لسيف الدولة أَبي الحسن عليّ بن عبد الله بن حمدان خيمةُ ديباج تَسَعُ خمس مئة رجل. وكان هادَن ملك الروم على أَن يَدخل إِلى بلاده بخيمة.","tags":["السلاح","الرقيق"],"partial":0,"sp":31,"kind":"prose","spLabel":"وكانت مخبأة عندها إلى وقت … … وكانت هذه الخيمة .وأَخبرني…"},{"id":"b3-116","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١٦","topic":"الهدايا","loc":117,"text":"وكانت هذه الخيمة .وأَخبرني خطيرُ الملك وأمينُه ذو الرياستين محمد بن سيد الوزراء أَبي محمد الحسن بن عبد الرحمن اليازوري عند وروده إلى تنيس من الشام، في ذي القعدة من سنة اثنتين وستين وأربع مئة أَنّ إقبال الدولة عليّ بن مجاهد، أَحد ملوك الأَندلس.","tags":["الرقيق"],"partial":0,"sp":31,"kind":"prose","spLabel":"وكانت مخبأة عندها إلى وقت … … وكانت هذه الخيمة .وأَخبرني…"},{"id":"b3-117","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١٧","topic":"الهدايا","loc":118,"text":"أهدى إلى المستنصر بالله، هديّة حسنة جليلة المقدار من فرش تلك البلاد، وثيابها، وخزّها، ورقيقها، وخدمها، وما سوى ذلك مما له نفاسة وقدر. وأَنه أَهدى له في جملة ذلك ثلاثين قضيباً مرجاناً. معتدلة الأَجسام. غليظة كالسهام أو الأقلام، لم ير مثلها فيما تقدّم .واخبرني فيما تقدّم أن ميخائيل متملّك الروم أهدى إلى السيدة والدة الإمام المستنصر بالله حمسة دسوت حليا، مجرىً بزجاج من خمسة أَلوان أحمر قان، وأَبيض ناصع، وأَسود حالك، وأَزرق صاف، وآسمانجوني مشبع، كأَحسن ما يكون من الصياغة، والنقشُ فيها مجرى بأَحسن ما يكون من الصنعة .وأَخبرني أَنه أَنفذ إلى ابنها ثلاثة سروج مينا ثقيلة مُجراة بالذهب.","tags":[],"partial":0,"sp":32,"kind":"prose","spLabel":"أهدى إلى المستنصر بالله، ه… … وحدثني خطيرُ الملك أيضاً أ…"},{"id":"b3-118","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١٨","topic":"الهدايا","loc":119,"text":"ذكر أَنها من مراكب الإسكندر بن فيلبس اليوناني .وحدثني مَن أثقُ به من وزراء المستنصر بالله في سنة إحدى وستين وأَربع مئة ما يقارب ذلك أَنه وُجد في بعض خزائن القصر، في جملة ما أُخرجَ منها لبياعَ في أعطيات الرجال، قفصٌ مقفل. وأَنه فُتح بين يديه فوجد فيه أَربعة سروج، أحدها معمول بديباج أَسود، ودفّتاه وركاباه من ذهبٍ مصبوب، مرصّع جميعه بقطعٍ من الشيب الأَبيض، المليح الجوهر، وسيوره من جلود سودٍ ناعمة كالحرير، ولجامُهُ جميعه مكان الحديد منه ذهبً مرصّع باليشب أَيضاً، وسيوره سودانية كأَحسن ما يكون. وعليه رقعة مكتوب فيها بخط المعز لدين الله :( أَهدى متملك الروم إِلينا هذا السرج واللجام بعد دخولنا إِلى مصر.","tags":[],"partial":0,"sp":32,"kind":"prose","spLabel":"أهدى إلى المستنصر بالله، ه… … وحدثني خطيرُ الملك أيضاً أ…"},{"id":"b3-119","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١١٩","topic":"الهدايا","loc":120,"text":"وذكر أَنه من جملة ستة سروج كانت لذي القرنين، انتقلت منه إلى خزائنهم، وانه بقّاه، ولم يحدث فيه حادثة، وطالع به .وأَخبرني أَن هذه الثلاثة سروج الباقية في هذا القفص محشوةٌ عنبراً مصاغة ذهباً مما كان للظاهر لإعزاز دين الله، وأَن في كل سرج منها اثني عشر ألف دينار ذهباً .","tags":["الطيب","الخيل"],"partial":0,"sp":32,"kind":"prose","spLabel":"أهدى إلى المستنصر بالله، ه… … وحدثني خطيرُ الملك أيضاً أ…"},{"id":"b3-120","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٢٠","topic":"الهدايا","loc":121,"text":"وحدثني خطيرُ الملك أيضاً أن جدته والدة أبيه سيدة الوزراء، كانت أَهدت إلى والدة المستنصر بالله حجراً أبيض معمولاً كالخرزة. وإذا شُدّ ليلاً على سرّة صاحب الاستسقاءِ المائي، وترُك إِلى الصباح وجُعل في الشمس، قطرت منه قطرات ماء إِلى أَن لا يبقي فيه شيء. ثمّ يُعاد ويُشَدُّ على سرتّه ويُعاد إلى الشمس. ويكون منه مثل ذلك دفعات، وبطنُ المستسقي يتناقص ورمه وما فيه، حتّى لا يبقى منه شيء، ويعافى من مرضه ويصح، هذا قول أَرسطوا في كتاب الأَحجار: إِذا ربط حجر ليلاً على بطن صاحب الاستسقاء نشف الماء الذي في بطنه. وذلك أَنه يوزن قبل أَن يربط عليه، ثم يوزن بعد ربطه، فيوجد زائداً على وزنه الأول. وهو الحجر المذكور في التوراة .","tags":["الكتب"],"partial":0,"sp":32,"kind":"prose","spLabel":"أهدى إلى المستنصر بالله، ه… … وحدثني خطيرُ الملك أيضاً أ…"},{"id":"b3-121","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٢١","topic":"الهدايا","loc":122,"text":"وحدثني فتح التاجّي مولى أَمير الأُمراءِ تاج الدولة أَبي الفتوح يوسف بن أَبي الحسن، والي جزيرة صقلية  - كان في ذي الحجة سنة أربع وخمسين وأربع مئة أن بسيل متملك الروم كان أَهدى مولاه تاج الدولة هدايا نفيسة جليلة القدر كان في جملتها سفطٌ صغير فيه حجرٌ متوسط القدر، أَغبر اللون، مثلّثُ الشكل ينفع من داءِ الاستسقاء المائي. وأنّه كان يُجعل على من به هذا الداءُ فيبرأُ منه بإذن الله تعالى.","tags":["الغرائب"],"partial":0,"sp":33,"kind":"prose","spLabel":"وحدثني فتح التاجّي مولى أَ… … حدثني بجميع هذا رسوله بها …"},{"id":"b3-122","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٢٢","topic":"الهدايا","loc":123,"text":"قال: ولم يزل هذا الحجر عند تاج الدولة بصقيلة إلى أن نُهب في جملة ما نُهب من ماله عند هروبه إلى مصر .وحدّثني أيضاً أن بعضٍَ المطالبين وجد في أَيامه في بعض كنائس سرقوسة القديمة حُقّاً من نحاس .فيه حقّ من زجاج، فيه فصٌّ أسودُ من حجر عليه صورة قرد مُنغِط. فكل من امسكه أَنغط ما دام في يده أو فمه .فإذا أَلقاه إلى الأَرض عاد إِلى حاله. وأَنه سلّمه إلى بعض خدمه لينتفع به غلمانه ومَنّ أَحبّ من أَصحابه. وأَن الخادم أَنف من حمله فكسره، وبَطُلَ عملُه .","tags":["الطيب","السلاح","الرقيق"],"partial":0,"sp":33,"kind":"prose","spLabel":"وحدثني فتح التاجّي مولى أَ… … حدثني بجميع هذا رسوله بها …"},{"id":"b3-123","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٢٣","topic":"الهدايا","loc":124,"text":"وحدثّني خطيُر الملك أَنه رأَى خاتماً فيه فصٌّ عند من لم يُسَمِّه لي، إِذا لبسه أَنعظ وقويت عليه شهوة النكاح، فلا يزالُ يُجامع ما دام لابسه. فإِذا خلعه سكن ورجع إلى حاله .وحدّثني خطيُر الملك محمد بن اليازوري أَنه رأَى عند أَبيه سيد الوزراء خاتماً عليه فصّ من العقيق، فيه صورة عقرب، وأَنّ عقرباً ضربَته فجُعِلَ على مكان الضربة فسكن وعوفي .وأَهدى الأميرُ ناصر الدولة أَبو عليّ الحسنُ بن حمدان، في سنة ثلاثٍ وستين وأَربع مئة، إِلى أَرمانوس متملِّكِ الروم المعروف بالديوجانس هديّة جليلة المقدار تساوي نحواً من أربعين ألف دينار. من جملتها دقلان من عود هنديّ أَحدُهما طوله اثنا عشر شبراً، في فتح ثلاثة أَشبار، وزنه ثمانون منّا. والآخر طوله سبعة أَشبار في عرض ثلاثة أَشبار، وزنه أَربعون منّا، ومن غرائب الأَواني خمس قطع بلّور جليلة القدر لا مثيل لها ولا قيمة، منها باطية مجرودة تحمل ستة أرطال بالبغدادي، وقناطُر ميزان، احدهما مجرود والآخر منبت، يسع كل واحد منها ثمانية أَرطال بالمصري. وقادوس يسع اثني عشر رطلاً جروبا، وعدة ثياب ديباج من جملتها ثوبٌ أَرضه بياض مدفون فيه عقبان خمري، وزنه أَربعة آلاف مثقال. مُقَوّم على أقل قيمة بألف دينار. ومن الُمثقَل الطميم وغيره من سائر أَنواع غرائب الأَمتعة: الوشي، والخزّ، وغيرهما. ومراتب، وستور خسرواني أَحمر مذهب، وطميم من دبيقي، وغيره من سائر الأَنواع، وصياغات وآلات من ذهب وغيره، غريبة مليحة الصنعة جدّاً.","tags":[],"partial":0,"sp":33,"kind":"prose","spLabel":"وحدثني فتح التاجّي مولى أَ… … حدثني بجميع هذا رسوله بها …"},{"id":"b3-124","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٢٤","topic":"الهدايا","loc":125,"text":"حدثني بجميع هذا رسوله بها إِلى متملّك الروم تاج الرئاسة أَبو منصور عبد الله بن نصر الرحبي، المعروف بابن الخلاّل، عند رجوعه بهديّة ملك الروم إِلى ناصر الدولة مع رسوله بدمياط، في ذي الحجة سنة ثلاث وستين وأَربع مئة، وَردّ إليه من متملك الروم هديّة مثلها مع رسول من جهته شيخ عاقل، وَرَدَ مع رسوله إِلى دمياط. من جملتها ثوبُ ديباج طميم يحمله بغل واحد، لا يقدر أَن يحمل معه شيئاً .","tags":["الخيل"],"partial":0,"sp":33,"kind":"prose","spLabel":"وحدثني فتح التاجّي مولى أَ… … حدثني بجميع هذا رسوله بها …"},{"id":"b3-125","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٢٥","topic":"الهدايا","loc":126,"text":"وحدثني مَن أثقُ به من الحلبيّين أَن أَمير الجيوش أَبا منصور نشتِكين، المعروف بالدزبري، لما فتح حلب في سنة تسع وعشرين وأَربع مئة ودخلها، أَهدت إليه نفيسة العوراءُ بنت ابن وثّاب النميري مائدة من الفضة تنقسم على أَربع قطع وتجتمعُ بزرافين، حسنة الصنعة، وزنها بالرطل الشامي مئة وثلاثون رطلاً .وأَهدت إليه لبّادَ أَرمانوس ملك الروم المأخوذَ منه على حلب في سنة اثنتين وعشرين وأربع مئة وكانت ذيوله وأكمامه وتفاريجه مكلّلةً بحب لؤلؤ، وزنُ كلِّ لؤلؤةٍ منها مثقالان، كأَحسن ما يكون قدراً ولوناً وتلويناً، وكان في ظهره وصدره صلبان الذهب مكلّلة بقطعٍٍ من كبار الياقوت الأحمر في أَطرافها ووسطها، لا قيمة لها، ولا لما فيها من الجوهر .وأَهدت إليه خمسين غلاماً أرمنياً حسانَ الخلق والوجوه، بأَحسن ما يكون من الزيّ والآلة، على خمسين فرساً بسروجها ولجمها وسائر آلاتها.","tags":[],"partial":0,"sp":34,"kind":"prose","spLabel":"وحدثني مَن أثقُ به من الحل… … وكان في جملة ما دخل به ألف…"},{"id":"b3-126","bab":3,"sec":"باب الهدايا","page":"ج٣ ص١٢٦","topic":"الهدايا","loc":127,"text":"وكان في جملة ما دخل به ألف بوقيّ وست مئة قصبة فضة، وثلاث مئة بوق فضة صغار، وثلاث مئة جنيبة. منها ثلاثون عليها سروج الذَّهب، والكافور، والزمرد، والعنبر .^","tags":["الجوهر"],"partial":0,"sp":34,"kind":"prose","spLabel":"وحدثني مَن أثقُ به من الحل… … وكان في جملة ما دخل به ألف…"},{"id":"b4-1","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١","topic":"الولائم والدعوات","loc":128,"text":"لما صالح عمرو بن العاص جُريجَ بن مينا المقوقسَ، والقبطَ معه، على فتح الحصن المعروف بقصر الشمع من فسطاط مصر، وقرّر معهم على ذلك ما قررّه، وفرض عليهم لكل رجل من أصحابه ديناراً واحداً، وجبة وبرنساً وعمامة وخفّين  - سألوه أَن يأذنَ لهم أَن يصنعوا له ولأصحابه صنيعاً، ففعل وفعلوا. فلما فرغوا من ذلك سأَلهم عمرو: كم أَنفقتم في صنيعكم هذا ؟فقالوا: عشرين أَلف دينار. فقال: لا حاجة لنا بصنيعكم فيما بعد، وأَدّوا إِلينا عشرين ألف دينار .ولمّا دخل عمر بن عبد العزيز بفاطمة بنت عبد الملك بن مروان عمّه أوقد في مسارجها تلك الليلة الغالية .وفي ولاية عبد الله بن عبد الملك بن مروان مصر، في سنة تسعين، سأَله صاحب (وسيم)  - ضيعةٍٍ بالجيزة من مصر، وكانت لرجل من القبط  - أَن يأتيه إِلى منزله ويحمل له مئة أَلف دينار. فخرج إِليه. وأَتاه عزلهُ وولايةُ قُرّة بن شريك العبسي من قبل الوليد أخيه .ومثله ما ذكره ابن عُفَير، قال: خرج عبد العزيز بن مروان إلى الإسكندرية في سنة أَربع وسبعين. فاعترضه في طريقه صاحب بِلهيب فطلب إِليه أَن ينزل عنده. فقال له عبد العزيز: ويحك إن معي جماعة، وتلحقك في هذا مؤونة. فقال: إن هذا الأَمر لا يعظم عندي، ولولا احتمالي لك ولجميع مَن معك ما طلبتُ إليك في هذا. فلم يزل حتى نزل به.","tags":["الطيب"],"partial":0,"sp":1,"kind":"prose","spLabel":"لما صالح عمرو بن العاص جُر… … ولما دخل الرشيدُ بالله بزو…"},{"id":"b4-2","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢","topic":"الولائم والدعوات","loc":129,"text":"وكان عبد العزيز في أَلف رجل من خواصه. مع كل رجل منهم اثنان وثلاثة .فأَقاموا عنده ثلاثة أَيام، يقدم إليهم الأطعمة والطرائف في كل يوم ثلاث مرات .ثم أَذن عبد العزيز لأصحابه في المسير. فما راعهم إلا أربعة من القبط يحملون قفٍّةً عظيمة تسعُ ثلاثة أَرادب، في أُذنيها خشبة عظيمة، يحملها اثنان أمامها واثنان خلفها وعليها منديل.","tags":["الرقيق","المجالس","الخيزرانة"],"partial":0,"sp":1,"kind":"prose","spLabel":"لما صالح عمرو بن العاص جُر… … ولما دخل الرشيدُ بالله بزو…"},{"id":"b4-3","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٣","topic":"الولائم والدعوات","loc":130,"text":"وجاءَ صاحب بلهيب فقال: (يا سيدي مُر بهذا فليقسم بين أَصحابك! ثم كشف عنها فإذا هي مملوءَة دنانير، فأَبى عبد العزيز أن يقبلها، وقال: اجعل هذا فيما ينوبك من خراجك. وبلغ ذلك أُم الِبلهيبيّ، وكانت عجوزاً ضعيفة كبيرة، فأقبلت إِلى عبد العزيز فقالت: أَيها الأمير! ما أَدري أَجئتَنا لتسرّنا وتسرّ صديقنا وتسيء عدونا بنزولك عندنا، أَم جئتنا لتشمت عدونا وتغيظنا ؟فقال: بل جئت لأسركم واسرَّ صديقكم، قالت: فَلِمَ تردّ هديتّنا علينا ؟قال: إِنّا كرهنا أَن نحملكم مؤونة، قالت: والله ما يضرنا هذا أن أخذتَه ولا ينفعنا أن تركتَه. وإِنّ عندنا لما يعنينا عنه .فعزمتُ عليك إلاّ ما أَمرت به فيقسم بين أَصحابك فأمر به فقسم بينهم حفنا. فعمّهم أَجمعين .","tags":["الرقيق","النفقات"],"partial":0,"sp":1,"kind":"prose","spLabel":"لما صالح عمرو بن العاص جُر… … ولما دخل الرشيدُ بالله بزو…"},{"id":"b4-4","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٤","topic":"الولائم والدعوات","loc":131,"text":"ولما دخل الرشيدُ بالله بزوجته زُبَيدة أُم جعفر ابنة جعفر بن أبي جعفر المنصور بالله، في قصره المعروف بالخُلد ببغداد، في سنة خمس وستين ومائة وكان أَبوه المهدي بالله زوّجه بها، وهي ابنة أَخيه، وبنت عمّ هارون الرشيد، استعد لها ما لم يستعدّ لامرأَة قبلها من الآلة، وأصناف الجوهر. والحليّ. والتيجان والأكاليل، وقباب الفضة والذَّهب، والطيب، والكسوة، والخدم، والصوائف. وأعطاها بدنة عبدة ابنة عبد الله بن معاوية امرأَة هشام بن عبد الملك. ولم يُرَ في الِإسلام مثُلها ومثلُ الحبّ الذي كان فيها. ولا يعرف قيمتها عظما، وكان في ظهرها وصدرها خطان من ياقوت أَحمر، وباقيها من الدر الكبار الذي ليس مثله. وحشر الناس من الآفاق .وفرّق فيهم من الأموال أمراً عظيماً، وكانت الدنانير ونوافج المسك، وجماجم العنبر والغالية في بواطي الزجاج. ويفرّق ذلك على الناس، ويخلع عليهم خلع الوشي، المنسوجة بالذَّهب. وأوقد بين يديه في تلك الليلة شمع العنبر في أَتوار الذَّهب. وأَحضر نساءَ بني هاشم جميعاً.","tags":[],"partial":0,"sp":1,"kind":"prose","spLabel":"لما صالح عمرو بن العاص جُر… … ولما دخل الرشيدُ بالله بزو…"},{"id":"b4-5","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٥","topic":"الولائم والدعوات","loc":132,"text":"وكان يُدفع إلى كلّ واحدة منهن كيسٌ فيه دنانيُر وكيسٌ فيه دراهم، وصينيةٌ كبيرة فضة فيها طيب، ويُخلع عليها خلعةُ وشيٍ مثقَلَة. فلم يُر في الإسلام مثله. وبلغت النفقةُ في هذا العرس من بيت مال الخاصة، سوى ما أَنفق هارون من ماله، خمسين ألف ألف دينار.","tags":["الولائم"],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان يُدفع إلى كلّ واحدة م… … وكانت منسوجةً من حبّ. وفي …"},{"id":"b4-6","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٦","topic":"الولائم والدعوات","loc":133,"text":"وقيل دخل بها في دار محمد بن سليمان، التي صارت للعباسة. وانتقلت البدنة، المقدّم ذكرها إلى عبد الله بن عليّ حين ظفر ببني أُمية، ثم إلى بني العباس، ثم إلى بني طاهر .قصة عبدة: حكى بعضهم: قال: حدثنا أبو العباس أحمد بن محمد بن الفرات قال: مات عبد الله بن يزيد بن معاوية، وخلف ابنتين له يقال لإحداهما عبده، والأخرى عُثامة. فكفلتهما عاتكةُ بنت يزيد بن معاوية، عمتّهما، وكانت تحت عبد الملك بن مروان. فلما ماتت عاتكة، أوصت قبل ذلك لهما بتركتها. فقسم عبدُ الملك تركتها بينهما، وتزوّج عثامة. وتزوج عبدة هشام بن عبد الملك. فرآها هشام يوماً، وفي نحرها خال، فقال: أنك لأنت هي. فقالت: وما معنى هذا القول منك ؟قال: إنا نرى أن امرأة منّا، من أولاد الخلافة وامرأة خليفة في نحرها خال، تُذبح .فقالت: (لئن كان الأمُر كذلك فما لي حيلة في ردَّ القضاء وإن لم يكن فما معنى التعجيل بالغمّ ؟) .","tags":["الرقيق"],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان يُدفع إلى كلّ واحدة م… … وكانت منسوجةً من حبّ. وفي …"},{"id":"b4-7","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٧","topic":"الولائم والدعوات","loc":134,"text":"قال: فلّما قتل عبد الله بن عليّ بني أُمية، وبعث بجوهر الخلافة إلى أبي العباس، عرضه على أم سلمة بنت يعقوب المخزومية، امرأَته، وكانت قبل ذلك عندَ مسلمة بن هشام بن عبد الملك، فقالت: فما لي لا أرى بدنة عبدة فيه ؟قال: فكتب إلى عبد الله بن عليّ في سنة خمس وثلاثين ومائة في البعثة إليها بها. فبعث إليه ببدنة، وكتب إنها هي. فعرضها على أم سلمة قالت: كلا، وكتب إنها هي. فعرضها على أُم مسلمة قالت: كلا، ما هي بدنة عبدة. هذه بدنة الرائقة جارية هشام ابن عبد الملك، وان حبة من الحب الذي في بدنة عبدة خيٌر من هذه كلها، ولقد كانت تلبسُها في الليل فيعرف بها موضعها من حسنها.","tags":["الجوهر"],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان يُدفع إلى كلّ واحدة م… … وكانت منسوجةً من حبّ. وفي …"},{"id":"b4-8","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٨","topic":"الولائم والدعوات","loc":135,"text":"وكانت منسوجةً من حبّ. وفي وسطها مثل الخط من ياقوت أحمر من أولها إلى آخرها .قال: فكتب أبو العباس إلى عبد الله بن علي يُقسم عليه في البعثة بها. فقالت أُم سلمة: أُكتب إليه فليبعث بعبدة. فكره عبد الله أن يبعث بها فتقرّبها. فبعث بعبدة، ودس إليها بعض جنده، وقال لهم: إذا صارت في بعض الطريق، اقتلوها. فلما صارت إلى موضع بالشام. يعرف بجُب عبدة أرادوا قتلها فقالت: (إن كنتم عزمتم على قتلي فدعوني أستتر (. فتركوها. فلفت على بدنها ورجليها ثوبها، وأبدت عن حلقها. فذبحوها. وكتب عبدُ الله أَنه كان بعث بها، وأَن بعض الإعراب عرضوا لها فقتلوها. فلما أَوقَعَ أبو جعفر، بعد أبي العباس، بعبد الله بن علي، اخذ البدنة منه. فكانت في خزائن الخلافة، إلى أن بعث بها المتوكِّل إلى بنت طاهر بن عبد الله بن طاهر التي زوّجها من المعتز ولده .","tags":["الجوهر","الرقيق"],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان يُدفع إلى كلّ واحدة م… … وكانت منسوجةً من حبّ. وفي …"},{"id":"b4-9","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٩","topic":"الولائم والدعوات","loc":136,"text":"ولما عهد الرشيد إلى أولاده، محمد الأمين، وعبد الله المأمون، والقاسم المؤتمن، وجدّد البيعة لنفسه ولهم، وزوجهم، أولَمَ بالرقّة في سنة تسعين ومائة وليمة أنفق فيها ما لا يحصى كثرة.","tags":["الرقيق","الولائم"],"partial":0,"sp":3,"kind":"prose","spLabel":"ولما عهد الرشيد إلى أولاده… … وارتفع الصوتُ، فمضى أبو سل…"},{"id":"b4-10","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١٠","topic":"الولائم والدعوات","loc":137,"text":"وقال لفرج الخادم: (يا أبا سُليم! ما أَقبح ما نحن فيه، نحن بين ظهراني هؤلاء القوم. وإن كانوا فيما كانوا فيه، فهم بنو عمنّا، ولنا مثل هذا الصنيع. وقد أَحببتُ أن أَجمعهم  - يعني بني أمية  - رجالهم ونساءَهم، فقال له أبو سُليم: ويرون نعمتك يا أمير المؤمنين ؟قال: فأحِصهم ووجّه إليهم. فوجهّ إلى بالس، وإلى الزيتونة، والرصافة، وحصن مَسلمة، وما حوله من منازل بني أمية فجُمعوا أمر بهم فضّيفوا. فقال هارون: يا فرج! ويلك ما أقبح هذا ذكرت انك صيّرت للأُمويات لهنّ مجلس (كذا)، والهاشميات لهن مجلس. (كذا) فيقلن (كذا) الأُمويات: لم يخلطننا بأَنفسهنّ، وقصَّرنَ بنا. ولكن اجمعهنّ وأكرم مثواهنّ وأَظهر من تطيبيهنّ ما يلحقن فيه بنات عمهن )قال: فجمعهنّ. وحصّلن. فلم يوجد فيهّن أحسن وجهاً، لا في الهاشميات ولا في الأمويات، ولا أجمل جمالاً ولا أتم كمالاً من زينب بنت أحمد بن محمد بن سعيد ابن هشام بن عبد الملك بن مروان. وهي من أهل الزيتونة .فجلست. وجلست إلى جانبها فتاةٌ من ولد سليمان بن صالح ابن عبد الله بن العباس، يقال لها زينب بنت سليمان. فلما أَن أَكَلنَ وشربنَ حَسَدنَ الأُمويّةَ. فالتفتت الهاشميةُ إليها، فقالت: تنحّي عنّي، فقد آذيتني بريحك .فقالت: أَلمثلي يقال هذا ؟أنا والله أطيب رائحة منكِ! والله ما حجبني الخصيان، ولا قعدتُ مع القيان، ولكنّي سّيدة، عشت في البريّة فحُسنَ وجهي، وطاب ريحي، ولولا أَنا من كنتِ أنتِ ؟ولقد قال الشاعر فينا:","tags":["الرقيق"],"partial":0,"sp":3,"kind":"prose","spLabel":"ولما عهد الرشيد إلى أولاده… … وارتفع الصوتُ، فمضى أبو سل…"},{"id":"b4-11","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١١","topic":"الولائم والدعوات","loc":138,"text":"(عبدُ شمس أبي فإن كنتِ غضبى ... فاملئي وجهكِ المليحَ خمُوشا)\n(نحن كنا أربابها من قريش ... وبنا سُمّيت قريشٌ قريشا)","tags":["الرقيق"],"partial":0,"sp":3,"kind":"verse","spLabel":"ولما عهد الرشيد إلى أولاده… … وارتفع الصوتُ، فمضى أبو سل…"},{"id":"b4-12","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١٢","topic":"الولائم والدعوات","loc":139,"text":"وارتفع الصوتُ، فمضى أبو سليم إلى الرشيد، فضحك حتّى امسك على بطنه. ثم قال: هذه والله عربدةٌ لطيفة، وهدأ القوم، وأمر لها وحباها، وحبا أباها وأخواتها، وأَقطعها الزيتونة .","tags":["الطيب"],"partial":0,"sp":3,"kind":"prose","spLabel":"ولما عهد الرشيد إلى أولاده… … وارتفع الصوتُ، فمضى أبو سل…"},{"id":"b4-13","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١٣","topic":"الولائم والدعوات","loc":140,"text":"وقال فرج بن عمر بن فرج الرخّجي: دعا محمد بن يحيى بن خالد، الرشيد بالله إلى منزله. وكان مُبَخّلاً. فأنفق عليه ستة عشر ألف ألفٍ. وإن جارية البرامكة، دنانير، أشارت عليه بأن بنثر المسك على كل شيء في الدار، حتى ريحان البستان، لئلا تقع يد الرشيد إلاّ على شيء مطّيب، ولا يشمّ إلا طيباً، بسبب الباصور الذي كان بالرشيد.","tags":["الطيب","الرقيق"],"partial":0,"sp":4,"kind":"prose","spLabel":"وقال فرج بن عمر بن فرج الر… … وكان يجري في كل يوم في جمل…"},{"id":"b4-14","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١٤","topic":"الولائم والدعوات","loc":141,"text":"قال فسحق له أربعة آلاف مثقال مسكاً، وطيّب به هذه المواضع .ولما دخل الرشيد بالله البصرة، في سنة ست وسبعين ومائة، زار جعفر بن سليمان بن علي، وهو إذا ذاك واليها، فأحضر جعفر على مائدته كل حاّر وقار وأَحضر أَلبان الظباء وزبدها، وسلاها ولباها. فاستطاب الرشيد جميع طعومها. فسأَله عن ذلك فغمز بعض الغلمان فأطلق عن الظباء ومعها خشفانها، وعليها شملها، حتى مرّت في عرصة الدار تجاه عين الرشيد. فلّما رآها على تلك الحال وهي مفرطة مخضبة، استخفّه الفرح لذلك والتعجب، حتى قال له جعفر: (يا أمير المؤمنين! هذه الألبانُ والأسمانُ واللبا والرايب والزبد الذي بين أيدينا من حلب هذه الظباء، ألّفت وهي خشفات فتلاقحت وتلاحقت .","tags":["الطيب","العراق"],"partial":0,"sp":4,"kind":"prose","spLabel":"وقال فرج بن عمر بن فرج الر… … وكان يجري في كل يوم في جمل…"},{"id":"b4-15","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١٥","topic":"الولائم والدعوات","loc":142,"text":"وكان من دخول عبد الله المأمون ببوران بنت الحسن بن سهل، والنفقة في أملاكها وعرسها ما أَعاد عظيم ذلك حقيراً. قال ابن عبدوس: وكان نفقة المأمون بالله حين دخل بخديجة بنت الحسن بن سهل، المعروفة ببوران، في فم الصلح، في سنة عشر ومائتين، ثمانية وثلاثين ألف ألف درهم.","tags":["الرقيق"],"partial":0,"sp":4,"kind":"prose","spLabel":"وقال فرج بن عمر بن فرج الر… … وكان يجري في كل يوم في جمل…"},{"id":"b4-16","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١٦","topic":"الولائم والدعوات","loc":143,"text":"وكان يجري في كل يوم في جملة الجرايات على ستة وثلاثين ألف ملاح. ووصل المأمون أباها بعشرة آلاف ألف درهم. وقيل ألف ألف دينار. ففّرقها في قوّاد المأمون وحشمة، وقيل وَهَبَها لشاعر مدحه.","tags":[],"partial":0,"sp":4,"kind":"prose","spLabel":"وقال فرج بن عمر بن فرج الر… … وكان يجري في كل يوم في جمل…"},{"id":"b4-17","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١٧","topic":"الولائم والدعوات","loc":144,"text":"ووهب لأخيها ألف ألف درهم، واقطعه فم الصلح، وكانت قيمته ثمانين ألف دينار. وكانت نفقة الحسن بن سهل إليها في هذه الوليمة أَربعين ألف ألف درهم، وقيل أربعة آلاف دينار .","tags":["الولائم"],"partial":0,"sp":5,"kind":"prose","spLabel":"ووهب لأخيها ألف ألف درهم، … … ونثرت أُم الحسن بن سهل، جد…"},{"id":"b4-18","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١٨","topic":"الولائم والدعوات","loc":145,"text":"وقال محمد بن داود: بلغت نفقة الحسن بن سهل على قواد المأمون وحملهم وصلتهم والخلعِ عليهم خاصة خمسين أَلف أَلف درهم، سوى ما أنفقه على تجهيز بوران بنت الحسن بن سهل سبعة وثلاثين ألف درهم. وجُليت بوران على المأمون، وقد فرش لها حصيٌر من ذهب، وجاءت جدة بوران بمكتل من ذهب مرصّع بجوهر كبار، نُثر على من حضر من النساءِ، وفيهم أم جعفر زبيدة، وحمدونة بنت الرشيد وغيرهما. فما مسّ من حضر من الدّر شيئاً. فقال المأمون: (شَرَّفنَ بنت أبي محمد وأَكرِمنَها فمدت كل واحدة منهن يدها، فأَخذت درّة. فقال المأمون: لله درّ الحسن بن هانئ، كأنه رأَى هذا حيث يقول:","tags":[],"partial":0,"sp":5,"kind":"prose","spLabel":"ووهب لأخيها ألف ألف درهم، … … ونثرت أُم الحسن بن سهل، جد…"},{"id":"b4-19","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص١٩","topic":"الولائم والدعوات","loc":146,"text":"(كأن صُغرى وكُبرى من فقاقعها ... حصباء دُرّ على أرض من الذَّهب)","tags":[],"partial":1,"sp":5,"kind":"verse","spLabel":"ووهب لأخيها ألف ألف درهم، … … ونثرت أُم الحسن بن سهل، جد…","partialRef":null},{"id":"b4-20","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢٠","topic":"الولائم والدعوات","loc":147,"text":"ونثرت أُم الحسن بن سهل، جدةُ بوران، عليها يوم دخل بها المأمون ألف درة في صينية ذهب. وأوقد على المأمون في تلك الليلة شمعة عنبر وزنها أربعون منّا.","tags":["الطيب"],"partial":0,"sp":5,"kind":"prose","spLabel":"ووهب لأخيها ألف ألف درهم، … … ونثرت أُم الحسن بن سهل، جد…"},{"id":"b4-21","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢١","topic":"الولائم والدعوات","loc":148,"text":"ونثر في يوم إملاكها كل شيء له قدر يجري على مثله ملك، من الكراع، والرقيق، والبزاة، والكساء، والصياغات، والطيب، والضياع، والعقار، والجوهر، والدنانير، والدراهم، وكان جميع ذكر هذه الأصناف مثبتاً في رقاع. فكان من التقط رقعة بصنف، صار إلى خازن ذلك الصنف فقبضه منه.","tags":["الجوهر","الطيب"],"partial":0,"sp":6,"kind":"prose","spLabel":"ونثر في يوم إملاكها كل شيء… … قال الريان بن سيد، ابن خال…"},{"id":"b4-22","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢٢","topic":"الولائم والدعوات","loc":149,"text":"ونثر الحسنُ يوم أملاكها بنادق عنبر، فيها رقاعٌ بذكر هذه الأصناف أيضاً. فمن التقط بندقية وكسرها، قبض ما وجده مذكوراً فيها من ذلك الصنف.","tags":["الطيب","المجالس"],"partial":0,"sp":6,"kind":"prose","spLabel":"ونثر في يوم إملاكها كل شيء… … قال الريان بن سيد، ابن خال…"},{"id":"b4-23","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢٣","topic":"الولائم والدعوات","loc":150,"text":"وكان للحسن أربعون بغلاً مرتبة لحمل الخشب، يضرب في كل يوم عدة مرات، ينقله سنة كاملة. ولم يكف الوليمة. واضطرهم الأَمر إلى أن قطعوا سعف النخل رطباً وصبوا عليه الدهن والزيت وأوقدوه .أَنفق جعفر بن يحيى على عرس المأمون بأم موسى بنت عيسى الهادي من ماله خمسة عشر ألف ألف درهم، سوى ما انفق المأمون وذلك في سنة ثمان وثمانين ومائة .","tags":["الخيل"],"partial":0,"sp":6,"kind":"prose","spLabel":"ونثر في يوم إملاكها كل شيء… … قال الريان بن سيد، ابن خال…"},{"id":"b4-24","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢٤","topic":"الولائم والدعوات","loc":151,"text":"قال الريان بن سيد، ابن خال المعتصم ،: لما أراد عبد الله المأمون بالله أن يزوّج ابنته أُم الفضل بأبي جعفر محمد بن عليّ الرضا، سلام الله عليهما، اجتمع إليه أهل بيته وعليه الناس، فعقد بينهما النكاح، وأولم عليها المأمون وليمة عظيمة وذلك في سنة اثنتين ومايتين. وجلس الناس على مراتبهم الخاص والعام .","tags":["الرقيق","الولائم"],"partial":0,"sp":6,"kind":"prose","spLabel":"ونثر في يوم إملاكها كل شيء… … قال الريان بن سيد، ابن خال…"},{"id":"b4-25","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢٥","topic":"الولائم والدعوات","loc":152,"text":"قال الريان: فإِني لذلك إذا سمعتُ كلاماً كأنه من كلام الملاّحين في مجاوبتهم، فإذا بالخدم يُجرون سفينة من فضة فيها قلوس من ابراسيم مملوءَة غالية. فخضبوا لِحى أهل الخاصة بها. ثم مدّوا الزورق إلى أهل العامة فطيبوهم .وحدّثني من أثق به، عن ابن مهّنأ أحد عمّال الريف: قال: رُدّ النظر إِليَّ في الضياع الجوانّية، من كورة دميس، في أيام المستنصر بالله. فنزلتُ يوماً الضيعة المعروفة بطاءٍ النمل. فرأيت فيها آثار بناء قديم كأحكم ما يكون من الأبنية وأتقنها. فسأَلتُ ما روت الضيعة عنه، ولمن كان. فقال لي: أنا آتيك بمن يعرّفك به وبأربابه. فجاءَني بشيخ من القبط، قد جاوز المئة سنة بعدة سنين، صحيحِ العقل والحديث. فسألتُه عن البناء فقال: قال لي أبي، وعمره قريب من عمري، وقد سألته عن هذه الآثار وهي أبين ممّا رأيت وأجدّ: (لمن كان هذا البناء ؟) فقال: (لما روت من القبط عاملُته وشاهدته، وكان ذا يسار، وقدر، وهمّة عالية. من أهل هذه الضيعة، وله والدة تضاهيه في القدرة والمروءة، تدعى مارية. ولقد رأيتها أيام ورد المأمونُ إلى مصر في سنة ثماني عشرة ومايتين، وانحدر إلى بلد اليحموم.","tags":["المجالس"],"partial":0,"sp":7,"kind":"prose","spLabel":"قال الريان: فإِني لذلك إذا… … وكان يبنى له في كل ضيعة دك…"},{"id":"b4-26","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢٦","topic":"الولائم والدعوات","loc":153,"text":"وكان يبنى له في كل ضيعة دكّة ويجعل عليها تركية (؟)، فإذا ورد الضيعة جلس في التركية، ونزل العسكر والقوّاد والوجوه بجوانبها. وقد عنّ له أن لا ينزل في طاءِ النمل .واتصل الخبر بمارية المذكورة. فخرجت إليه. وتوصلت إلى خطابه، وكان بحضرة المأمون تراجمة يعرفون الرومية، والقبطية والنبطية، وسائر اللغات، لا يفارقون عسكره في كل أسفاره. فسمع الترجمان ما قالت، فقال: (تقول، يا أمير المؤمنين إنك قد نزلتَ في كل مكان بنيت لك فيه دكة، ومتى لم تنزل عندنا، بقيت وصمة ذلك علينا وعلى ولدنا من بعدنا ما بقي الزمان، وافتضحنا بين مواريت القبط، فإذا نزلت أكسبتنا فخراً يبقى على الأعقاب) .فاستحسن كلامها، وأعجبه عقلها، وعدل برأس دابته إلى التركية فنزل فيها، ونزل جميع العسكر حوله، ورجعت إلى ولدها فأخبرته بما جري بينها وبين المأمون، فسُرَّ بذلك وأحضر إليه وكلاء مطبخ المأمون وطباخيه وسألهم عن قوانين مطبخه في كلِِّ يوم من الحيوان والدجاج والجداء والخراف والفراريج، والإوز، وما يحتاج إليه من التوابل، ورسمه في الحلاوات والطيب والشمع، وسائر ما جرت به عادتُه من صغير وكبير، واستدعى كتّاب جيش العسكر، وقرر معهم ما يحتاج إليه الرجال من الوطاء والأبقار والتعليف.","tags":["الطيب","المجالس"],"partial":0,"sp":7,"kind":"prose","spLabel":"قال الريان: فإِني لذلك إذا… … وكان يبنى له في كل ضيعة دك…"},{"id":"b4-27","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢٧","topic":"الولائم والدعوات","loc":154,"text":"واستدعى وكيل كلِّ رئيس كان مع المأمون. كان معه ابنه وأخوه وأولاده أخيه: الواثق والمتوكِّل، واحمد بن أبي دآود، ويحيى بن أكثم وغيرهم من وجوه العراق، ووجوه القوّاد كالأفيشين وأمثاله، وَوجوه مصر، وقرَّر لهم ولأتباعهم مثل ذلك، وَوَسع عليهم. وَلم يمض النّهار إلاّ وجميع ذلك محمول إليهم. فذكر انه كان في جملة ما حمله إلى مطبخ المأمون خاصّة ثلاثة آلاف دجاجة فائقة سوى ما سوّاه في كل يوم. فاستعظم المأمون ذلك وَاستكثره. فلما أصبح، وَهّم بالارتحال، خرجت إليه مارية وَسأَلته الاستضافة لها ثلاثة أيام، ففعل. فلما عوّلَ على الرحيل خرجت ومعها عشرُ وَصائف، ومعهن عشر صواني مغطاة بمناديل ديباج. فقال لمن حضره: (قد أهدت إلينا القبطّيةُ طرائف الريف من الكعك والخبز والصّر ). فأتت به. فلما كشفت بين يديه، وجد في كل صينية منها كيسين، في كل كيس ألفُ دينار، في العشر صواني عشرون ألف دينار، جميعها من نقد واحد .فاستعظم المأمون ذلك واستكثره لأجل النقد، وقال للترجمان: قل لها: أَوَجدتِ كنزاً ؟فإن هذا النقد المفرد في مثل هذا الحال لا يكون مجتمعاً إلا في كنز أو مال لا يعرف مقدارُه. فإن كان من كنز فإنّ على أمير المؤمنين مؤناً كثيرة ومغارم. فضحكت وقالت بعد أن أخذت بيدها قطعة طين: قل لأمير المؤمنين، هذا من هذا الطّين ومن عدلك! وعندنا منه شيء كثير. فإن شئت في ذلك فأعجبه ذلك، وتقدّم بإقطاعها عدّة ضياع، فامتنعت ولم تجب. فكتب لها إقطاعاً بزراعة مايتي فدّان زرعا بطآء النمل. فقبلت ذلك، وبنت على الأرض التي أقطعها قنطرةً هي معروفة إلى اليوم باسمها مما قبض في الصوافي في أيم المقتدر وعادت إلى السلطان، معروفة بأرض مارية. وانصرف .وما أشبه هذا الخبر بما ذكره ابن جدار المصري، في كتابه المعروف (بطبقات الشعراء) وهو حديث عبد العزيز بن مروان مع صاحب بلهيب وقد تقدم ذكره .وعمل أحمد بن طولون بمصر في ولايته إيَّاها صنيعاً فاخراً، اطعم الناس فيه أياماً، أوّلُها يوم الثلاثاء لاثنتي عشرة ليلة بقيت من شهر ربيع الأخر، من سنة ستين ومائتين، أطعم القوّاد يوماً، والجند يوماً، وأهل المسجد والّتجار يوماً، ولسائر الناس يومين. ذبح فيه ألف كبش، وثلاثين ثوراً، وَخمسة عشر برذوناً، وَأَلف خروف، وألف جدي، وألف أوزّة، وعشرة آلاف دجاجة، وعشرين ألف فرخ حمام. ثم صنع صنيعاً ثانياً لقوّاده وخاصته في يوم الثلاثاء لتسع خلون من جمادى الأولى منها. فأطعم على سبع وعشرين مائدة، أسرى وأفضل وأكثر من الطعام الأول .ثم اطعم أيضاً في يوم الاثنين لثمان ليال بقين من جمادى الأولى منها أربعة آلاف مسكين. وأعطى كلَّ واحد منهم بعد فراغهم من الطعام رغيفاً أصبهانيّاً.","tags":["الطيب"],"partial":0,"sp":8,"kind":"prose","spLabel":"واستدعى وكيل كلِّ رئيس كان… … وكان العباس بن الحسن مليح …"},{"id":"b4-28","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢٨","topic":"الولائم والدعوات","loc":155,"text":"وعرق لحم، وَدرهماً: ثم انه في يوم الخميس أيضاً لثلاث خلون من شهر رمضان من السنة المذكورة اطعم ألفي رجل من المساكين وأعطى كل مسكين عُراقَ لحم، ورغيفاً ودرهماً بعد ما أكلوا وحملوا من الطعام ما أحبّوا .وحدَّثني من أثق به أن عطية بن صالح بن مرداس طبخ في بعض ولائمه تسع مئة خروف مضيرة، سوي ما طُبخ في سائر الألوان .","tags":["الطيب","الولائم"],"partial":0,"sp":8,"kind":"prose","spLabel":"واستدعى وكيل كلِّ رئيس كان… … وكان العباس بن الحسن مليح …"},{"id":"b4-29","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٢٩","topic":"الولائم والدعوات","loc":156,"text":"وكان في بستان العباس بن الحسن الوزير، مما أُعِدّ له من آلة الشرب، يوم قتل في سنة ست وتسعين ومايتين، سبع مئة صينية من ذهب وفضة، ووجد له، فيما خلف، مئة ألف مثقال عنبراً .وَذُكر أنّ عليّ بن أحمد الجرجرائي الوزير وُجد له مثل ذلك .","tags":["الطيب"],"partial":0,"sp":8,"kind":"prose","spLabel":"واستدعى وكيل كلِّ رئيس كان… … وكان العباس بن الحسن مليح …"},{"id":"b4-30","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٣٠","topic":"الولائم والدعوات","loc":157,"text":"وكان العباس بن الحسن مليح الصوت على الطنبور. حكي نحرير غلام علي بن عيسى الوزير، أَنه اشترى طنبور العباس بن الحسن بعد قتله بخمس مئة دينار .ودعا مفلح، الأسود الخادم، المقتدر بالله إلى بستانه في جمادى الآخرة من سنة اثنتي عشرة وثلاث مئة. فسكر أنهاره، ورصّص بعضها، وطرح فيها خمسين ألف رطل ثلج. واجري فيها الماءَ والشراب، وَجعل على حافات الأنهار جُوَن الطعام المزيّنة. وعلّق في أشجار البستان كلها الحملان والدجاج والفراخ والفراريج الكسكرية وَالدرّاج والحجل وسائر الطيور، ونُصبت السمط والموائد، وعبئت المجالس بالفواكه والزهر وأنواع الطيب من العود وَالمسك والكافور والندّ والعنبر والزعفران، وآلات البلّور، والمحكم. وَوسّع على الحاشية وسائر الّناس.","tags":["الطيب","الرقيق"],"partial":0,"sp":8,"kind":"prose","spLabel":"واستدعى وكيل كلِّ رئيس كان… … وكان العباس بن الحسن مليح …"},{"id":"b4-31","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٣١","topic":"الولائم والدعوات","loc":158,"text":"وكان يوماً مشهوداً حُسناً وجلالة. وتأَخّر عن حضور الدعوة نصر القشوري. فزلّ له المقتدر بالله زلّة. منها صينية ذهب مملوءة ندّاً، وباطية بلّور وطبقٌ عليها، مملوءةٌ غالية، وجماجم كثيرة عنبراً ومسكاً كثيراً، وثلاثة آلاف دينار على زاغات، وخمسة آلاف درهم مسيّفة .","tags":["الطيب"],"partial":0,"sp":9,"kind":"prose","spLabel":"وكان يوماً مشهوداً حُسناً … … وحدثني مَن أثق به من صحابة…"},{"id":"b4-32","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٣٢","topic":"الولائم والدعوات","loc":159,"text":"ولما دعا غريبُ الخال المقتدر بالله إلى النجميّ، اظهر له كل حسن من الآلة. وبسط له بساط خزّ حسن، مع مرتبة له لم يُر مثلها. فلما صار المقتدر بالله إلى الدكّة التي بسط له فيها المرتبة، قعد في أولها، وقال لغلمانه وخاصّته: ولله إلاجلست إلا في موضعي لئلا يبتذل هذا البساط وَيُدَنس. وقام إلى الخلاء، فوجده على نهاية الحسن من الطيب والزينة. فجلس فيه ونام، فبني غريب الخال في موضعه قّبة مفضّضة إكراماً له وإجلالاً .فأَمّا أبو الفضل العباس الشيرازي، وزير معز الدولة، في يوم الثلاثاء لثلاث عشرة ليلة خلت من شهر ربيع الأول، من سنة ثلاث وخمسين وثلاث مئة وصار إليه، وأقام إلى آخر نهار اليوم المذكور، لزمه في هذا اليوم مع الهدايا خمس مئة ألف درهم .وسمعتُ عن واحد من ثقات الحلبيّين يذكر أن شبل الدولة محمود بن صالح بن مرادس الكلابي، قال له دغفل ومسيّب القيسي: (نحبّ نأكل في غد مضيرة بألبان الخراف ). فتقدم إلى وزيره الأنباري بعمل طعام يكون في جملته مضيرة على الضفة الملتمسة منهم. فعمل ذلك. وقدّم نجازه، ونادى في سائر بني كلاب والقيسيّين ومن حضر من سائر قبائل العرب من جميع ظاهر حلب وقراها. فلما اجتمعوا نصبت الأسمطة، وقدم من سائر ألوان الطعام والحلوى. وأكلوا وانصرفوا، بعد أن قال لهم: (لكم مثل ذلك في كل وقت ). وسأل الأنباري عن عدّة ما ذبح من الضأن خاصة. فقال: أُلوف من سمانها. ومما عمل مضيرة تسع مئة رأس من كبارها .فقال له شبل الدولة: والله لو قلت لي إنها ألف. لوهبت لك ألف دينار. فقال: لم أجد بحلب ولا بقراها القريبة، فاضلاً عن العدة لاستعجالك إيّاي .وصنع مثل ذلك لبني عمه بني كلاب عدة دفعات .وصنع ناصر الجيوش أبو الملوك تركان شاه ابن سلطان الجيوش يلدكوش التركي للأكراد بالقاهرة طعاماً أحضرهم إليه في سنة. ... (بياض في الأَصل ).","tags":[],"partial":0,"sp":9,"kind":"prose","spLabel":"وكان يوماً مشهوداً حُسناً … … وحدثني مَن أثق به من صحابة…"},{"id":"b4-33","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٣٣","topic":"الولائم والدعوات","loc":160,"text":"كان في جملته بركة مُلِئت قطائف محشوٍّاً مسقى بالشراب الكثير الطيب والدهن. ذكر أنه أنفق في ملء البركة ثلاثة آلاف دينار .","tags":["الطيب","النفقات"],"partial":0,"sp":9,"kind":"prose","spLabel":"وكان يوماً مشهوداً حُسناً … … وحدثني مَن أثق به من صحابة…"});</script>
<script>window.__BOOK__.push({"id":"b4-34","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٣٤","topic":"الولائم والدعوات","loc":161,"text":"وحدثني مَن أثق به من صحابة أمير الجيوش سيف الإسلام بدر المستنصري أن السُّكر عزّ بعكّا وجميع الشام في سنة اثنتين وستين وأربع مئة وطُلب فلم يوجد .وبيع القنطار الشامي منه بخمسين ديناراً.","tags":["السلاح"],"partial":0,"sp":9,"kind":"prose","spLabel":"وكان يوماً مشهوداً حُسناً … … وحدثني مَن أثق به من صحابة…"},{"id":"b4-35","bab":4,"sec":"باب النفقات في الولائم المشهورة — والدعوات المذكورة","page":"ج٤ ص٣٥","topic":"الولائم والدعوات","loc":162,"text":"وكان في خزائنه منه ثلاث مئة قنطار بالشامي. ودخلت شهور الصيام، واستؤذن على بيعه أو بيع بعضه. فامتنع من ذلك، وقال: نحن نحتاج إليه في هذه الشّهور. يريد رجب وشعبان ورمضان. فاستعملت في مطابخه، وسمحت نفسه بما ثمنه خمسة عشر ألف دينار .^","tags":["الذخائر","النار"],"partial":0,"sp":10,"kind":"prose","spLabel":"وكان في خزائنه منه ثلاث مئ… … وكان في خزائنه منه ثلاث مئ…"},{"id":"b5-1","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١","topic":"الأعذارات والحذاقات","loc":163,"text":"كان علّي بن أبي طالب كرم الله وجهه، وطَلحَةُ، والّزبيرُ وسعد إعذارهم عام واحد .وقال عبد الله بن عامر لامرأته أُمامة بنت الحكم ابن المنذر بن الجارود: إن ولدت لي غلاماً فلك حُكَمكِ .فقالت: ألا استثنيته قليلاً ؟قال: قد قلتُ. فولدت غلاماً أحول. فاغتمّ بذاك ابن عامر، قالت: أفتراك تجيز حكمي ؟قال: نعم.","tags":["الرقيق","الأعذارات","النساء"],"partial":0,"sp":1,"kind":"prose","spLabel":"كان علّي بن أبي طالب كرم ا… … ووهب موسى الهادي لأخيه إبر…"},{"id":"b5-2","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢","topic":"الأعذارات والحذاقات","loc":164,"text":"قالت: فإني أحكم أن تُطعم في كل يوم على ألف خوان فالوذجاً سبعة أيام. ففعل. وكان الناس يعدون هذا من الخزاعية ؟فلما كان اليوم السابع عَقّ عنه بألف شاة.","tags":["المجالس"],"partial":0,"sp":1,"kind":"prose","spLabel":"كان علّي بن أبي طالب كرم ا… … ووهب موسى الهادي لأخيه إبر…"},{"id":"b5-3","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٣","topic":"الأعذارات والحذاقات","loc":165,"text":"وكان ابن عامر أول من فعل هذا .وتصدّق أبو عبد الله المهديُّ بالله عن ولده إبراهيم المعروف بابن شكلة حين بلغ في القراءة إلى {لَا أُقْسِمُ بِهَذَا الْبَلَدِ} وعمره يومئذ خمس سنين، بمئة ألف درهم، واعتق عنه خمس مئة عبد، وذلك في سنة سبع وستين ومائة .","tags":["الرقيق","المجالس"],"partial":0,"sp":1,"kind":"prose","spLabel":"كان علّي بن أبي طالب كرم ا… … ووهب موسى الهادي لأخيه إبر…"},{"id":"b5-4","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٤","topic":"الأعذارات والحذاقات","loc":166,"text":"ووهب موسى الهادي لأخيه إبراهيم بن المهدي في خلافته، وعمره يومئذ سبع سنين وأشهر، ألف ألف درهم .وَوَهب له أيضاً حين زوّجه وعقد نكاحه على ابنة عمّه أُمِّ محمد بنت صالح بن المنصور خمس مئة ألف درهم .","tags":["المجالس","النساء"],"partial":0,"sp":1,"kind":"prose","spLabel":"كان علّي بن أبي طالب كرم ا… … ووهب موسى الهادي لأخيه إبر…"},{"id":"b5-5","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٥","topic":"الأعذارات والحذاقات","loc":167,"text":"قال غير واحد من المؤرخين: لما فرغ المتوكِّل على الله من بناء قصره بقادسَّية سرّ مَن رأى بركوارا، وبينه وبين سرّ من رأى أربعةُ فراسخ، وهبه لابنه أبي عبد الله المعتزّ وجعل إعذاره فيه.","tags":["الرقيق","الأعذارات"],"partial":0,"sp":2,"kind":"prose","spLabel":"قال غير واحد من المؤرخين: … … وكان في صحن الدار بين يدي …"},{"id":"b5-6","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٦","topic":"الأعذارات والحذاقات","loc":168,"text":"وكان من أحسن أبنية المتوكِّل وأَجلّها، وبلغت النفقةُ عليه خاصةً عشرين ألف ألف درهم .ولما صح عزمُه على إعذار أبي عبد الله المعتز بالله أمر الفتح بن خاقان بالتأهُُب له لذلك، وأن يلتمس في خزائن الفرش بساطاً للإيوان في طوله وعرضه، وكان طوله مئة ذراع وعرضه خمسين ذراعاً، فلم يوجد إلاّ فيما قُبض عن بني أميّة، فإنه وجد في أمتعة هشام بن عبد الملك على طول الإيوان وعرضه.","tags":[],"partial":0,"sp":2,"kind":"prose","spLabel":"قال غير واحد من المؤرخين: … … وكان في صحن الدار بين يدي …"},{"id":"b5-7","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٧","topic":"الأعذارات والحذاقات","loc":169,"text":"وكان بساطاً لم ير لأحد مثله. ابريسمّي غَرز مذهب مفروز مبطّن، فلما رآه المتوكِّل استحسنه وأراد أن يعرف قيمته. فجمع عليه التجار، فذكروا أنهم ما رأوا مثله في قديم ولا حديث وقوّموه على أَوسَطِ القيم بعشرة آلاف دينار .فبُسط في الإيوان، وبسط للخليفة في صدر الإيوان سرير، ومُدَّ بين يديه أربعة آلاف مرفع ذهب، مرصّعة بالجوهر، فيها تماثيل العنبر والّند والكافور والمسك المعجون على أمثلة جميع الصُّور. منها ما قد وضع بالجوهر مفرداً، ومنها ما عليه ذهبٌ وجوهر. وجعلت بساطاً ممدوداً، وقعد المتوكِّل، والناس جلوس، وهو على السرير. وحضر الأمراء والقوّاد والندماء وأصحاب المراتب فأجلسوا على مراتبهم، وَوُضعت بين أيديهم صواني الذَّهب مرصّعةً بأصناف الجوهر، فيها شرابهم. وجعل بين صوانيهم من الجانبين والسّماط فُرجة وجاء الفرّاشون بزُبُل قد غشيت بأدم مملوءة دنانير ودراهم نصفين وصبّت في تلك الفرج حتى ارتفعت على الصواني، وقام الغلمان فوقها وأمروا الناس عن الخليفة بالشرب وأن ينقل كلّ من شرب من تلك الدنانير والدراهم ثلاث حفناتٌ بمقدار ما حملت يداه من ذلك المال، وكلما تفّرغ موضع صُبَّ عليه من الزُبُل حتّى يُرَدَّ إلى حالته. ووقف غلمانٌ في آخر المجلس فصاحوا أنّ أمير المؤمنين يقول لكم: ليأخذ من شاء ما شاء. فمدّ الناس أيديهم إلى المال فأخذوه. فكان إذا أثقل الواحد منهم ما اجتمع في كمّه أخرجه إلى غلمانه فدفعه إليهم وعاد فجلس في مجلسه .وخُلع على سائر من حضر ثلاث خلع، بعد أن صُلّيت الظهر، خلعاً حساناً، على مراتبهم، وكذلك بعد أن صُلّيت العصر والمغرب. وحملوا عند انصرافهم على الأفراس والشهاري بسروجها، وأعتق المتوكِّل عن المعتز بالله ألف عبد ولكلّ واحدٍ منهم مئة درهم وثلاثة أثواب.","tags":[],"partial":0,"sp":2,"kind":"prose","spLabel":"قال غير واحد من المؤرخين: … … وكان في صحن الدار بين يدي …"},{"id":"b5-8","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٨","topic":"الأعذارات والحذاقات","loc":170,"text":"وكان في صحن الدار بين يدي الإيوان أربع مئة بلّية عليهنّ أنواع الثياب، وبين أيديهن ألف نبيجة خيازر، فيها الفاكهة من الأترجّ، والنارنج على قلّته كان في ذلك الوقت، والتّفاح الشاميّ، والليمون. وخمسة آلاف باقة نرجس، وعشرة آلاف باقة بنفسج. وتقدم إلى الفتح بأن ينثر على البلّيات وخدم الدار والحاشية ما كان أعدّ لهم. وهو ألف ألف درهم. فلم يقدم واحدٌ على التقاط شيء فأخذ الفتح درهماً فأكّبت الجماعة على المال فانتهبوه .","tags":["النار"],"partial":0,"sp":2,"kind":"prose","spLabel":"قال غير واحد من المؤرخين: … … وكان في صحن الدار بين يدي …"},{"id":"b5-9","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٩","topic":"الأعذارات والحذاقات","loc":171,"text":"قال ابن المعتزّ: لما نثرت الدراهم على المعتزّ بالله يوم بركوارا التقط منها الفتح لئلا يحتشم أحدٌ بعده، ولم يلتقط مروان بن أبي السمط. فأنكر المتوكِّل ذلك وقال: أما ترى الفتح ؟فقال: كيف أولّيك ظهري ؟فقال: لك أسوةٌ به. فقال مروان بن أبي السمط","tags":["المجالس"],"partial":0,"sp":3,"kind":"prose","spLabel":"قال ابن المعتزّ: لما نثرت … … وكان ممن حضر المجلس في ذلك…"},{"id":"b5-10","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١٠","topic":"الأعذارات والحذاقات","loc":172,"text":"(هذه سماء تمطر الدراهما ... عند إمام يعمر المكارما)\n(خليفة قد وَلد الضراغما ... جاء بهم خلائفاً أكارما)\n(لا زال ملك الأرض فيهم دائما)","tags":[],"partial":0,"sp":3,"kind":"verse","spLabel":"قال ابن المعتزّ: لما نثرت … … وكان ممن حضر المجلس في ذلك…"},{"id":"b5-11","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١١","topic":"الأعذارات والحذاقات","loc":173,"text":"فشتمه علّي بن الجهم. فقال له المتوكِّل: إنما يشتمك غيظاً عليك لأنه لا يحسن أن يقول بديهاً كما تقول .وكانت قبيحة أمّ المعتز قد تقدّمت بضرب دراهم عليها مكتوب: (بركة من الله لإعذار أبي عبد الله المعتزّ بالله ). فضرب بها ألف ألف درهم، فنثرت على المزيّن، ومن في حَيّزِه، والغلمان والشاكريّة، وقهارمة الدار، والخدم الخاصّة من البيضان والسودان .","tags":["الرقيق"],"partial":0,"sp":3,"kind":"prose","spLabel":"قال ابن المعتزّ: لما نثرت … … وكان ممن حضر المجلس في ذلك…"},{"id":"b5-12","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١٢","topic":"الأعذارات والحذاقات","loc":174,"text":"وكان ممن حضر المجلس في ذلك اليوم ممن أثبت اسمه: محمد المنتصر بالله، موسى بن المأمون، أبو أحمد وأبو سليمان ابنا الرشيد، واحمد والعباس ابنا المعتصم بالله، ابنا حمدون النديم، أحمد بن أبي مريم. الحسين بن الضحّاك، علّي بن الجهم، علّي بن يحيى بن المنجم، أحمد أخوه، الفتح بن خاقان، سليمان بن القاسم بن الرشيد، علّي بن المعتصم، محمد بن عمرو الرومي، عبد الله بن عمر البازيار، حمدون بن إسماعيل، الجنوب، علي بن رَبّن الكاتب، عيسى بن إبراهيم بن أحمد بن حمدون، عبدون بن سعد، مروان بن أبي نوح، بهلول بن العباس، عافية البصري، يزيد بن محمد المهلبّي، يعقوب بن إسحاق القرشي، أحمد بن يحيى بن جابر البلاذري، البحتري الشاعر، يعقوب بن السكيت، كلّ هؤلاء نادم المتوكِّل في ذلك اليوم .ومن المغنّين: عمرو بن بانة، أحمد بن أبي العلاء، ابن الحفصي، ابن المكي، سلمك الرازي، عثعث، نمرة، سليمان الطّبال، ابن القصّار، صالح الدفّاف، زنام الزامر، بنان رأس البغل، حردنة (؟) الحائك، يدكوا (؟) .ومن المغنيات عريب المأمونية، بدعة وجاريتها سراب، شارية، وجواريها، ندمان، منعم، نجلة، تركّية، فريدة، وافد، عرفان، حدائق .","tags":["الخيل","الرقيق"],"partial":0,"sp":3,"kind":"prose","spLabel":"قال ابن المعتزّ: لما نثرت … … وكان ممن حضر المجلس في ذلك…"},{"id":"b5-13","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١٣","topic":"الأعذارات والحذاقات","loc":175,"text":"وقال إبراهيم بن المدبر: لما طُهّر المعتزّ بالله جمع مشايخ الكّتاب وَوُجوههم بين يدي المتوكِّل على الله. وكان فيهم يحيى بن خاقان، وابنه عبيد الله إذ ذاك الوزير، وهو واقف موقف الخدم بقباء ومنطقة.","tags":["الرقيق","الكتب"],"partial":0,"sp":4,"kind":"prose","spLabel":"وقال إبراهيم بن المدبر: لم… … وقال إبراهيم بن العباس الص…"},{"id":"b5-14","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١٤","topic":"الأعذارات والحذاقات","loc":176,"text":"وكان يحيى لا يشرب النبيذ. فقال المتوكِّل لعبيد الله: خذ قدحاً من تلك الأقداح، واصبب فيه نبيذاً وصَيّر على كتفك منديلاً، وامض إلى أبيك يحيى فضعة في كفه، قال: ففعل، فرفع يحيى رأسه إلى ابنه، فقال المتوكِّل: يا يحيى! لا تردّه، قال: لا يا أمير المؤمنين، وشربه .","tags":["الرقيق"],"partial":0,"sp":4,"kind":"prose","spLabel":"وقال إبراهيم بن المدبر: لم… … وقال إبراهيم بن العباس الص…"},{"id":"b5-15","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١٥","topic":"الأعذارات والحذاقات","loc":177,"text":"قال: قد جلّت نعمتك عندنا يا أمير المؤمنين، فهنأك الله بالنعمة، ولا سلبنا ما انعم به علينا منك. قال: يا يحيى! إنما أردت أن يخدمك وزيٌر، بين يدي خليفة، في طهور ولّي عهد .","tags":["الأعذارات"],"partial":0,"sp":4,"kind":"prose","spLabel":"وقال إبراهيم بن المدبر: لم… … وقال إبراهيم بن العباس الص…"},{"id":"b5-16","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١٦","topic":"الأعذارات والحذاقات","loc":178,"text":"وقال إبراهيم بن العباس الصولّي: سألت أبا حرملة المزّين في هذا اليوم: كم صار إليك إلى أن وضع الطعام ؟فقال: نيف وثمانون ألف دينار، سوى الصياغات والخواتم والرهون والعدات .فأقام المتوكِّل ببركوار ثلاثة أيام. ثم أصعد إلى قصره الجعفريّ. وتقدم بإحضار إبراهيم بن العباس وأمره أن يعمل عملاً بما أنفق في هذا الإعذار ويعرضه عليه. ففعل، فاشتمل العمل على ستة وثمانين ألف ألف درهم ونيف.","tags":[],"partial":0,"sp":4,"kind":"prose","spLabel":"وقال إبراهيم بن المدبر: لم… … وقال إبراهيم بن العباس الص…"},{"id":"b5-17","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١٧","topic":"الأعذارات والحذاقات","loc":179,"text":"وكان الناس يستعظمون ما انفق الحسن بن سهل في عرس ابنته بوران مع عبد الله المأمون، حتى أرخ ذلك في الكتب، وسمّيت دعوة الإسلام، فأتى من دعوة المتوكِّل في إعذار ولده ما أنسى ذلك .والدعوات المشهورة في الإسلام ثلاث: منها إعذاُر المعتزّ المتقدّم ذكره، وعرس زبيدة مع الرشيد، وعرس المأمون ببوران .","tags":["الرقيق","الولائم"],"partial":0,"sp":5,"kind":"prose","spLabel":"وكان الناس يستعظمون ما انف… … وقال شفيع لابن حباب: اجعل …"},{"id":"b5-18","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١٨","topic":"الأعذارات والحذاقات","loc":180,"text":"ولما حَذَقَ المعتّز بالله القرآن دعا المتوكِّل على الله شفيعاً خادمه فقال: قد عزمت على تحذيق أبي عبد الله في يوم كذا. وتكون خطبته وحذقته ببركوارا، فأخرج من خزانة الجوهر جوهراً بقيمة مئة ألف دينار في عشر صواني فضة للنثار على من يقرب منّي من القواد الأكابر مثل محمد بن عبد الله بن طاهر، وبُغا، ووصيف، وجعفر الخياط، ورجاء الحضاري  - ونحوهم. وأخرِج مئة ألف دينار للنثار على القوّاد الذين هم دون هؤلاء. وأخرج ألف ألف درهم صحاحاً بيضاً للنثار على من بالصحن من خلفاء القوّاد والنقباء وبقية وجوه الناس .","tags":[],"partial":0,"sp":5,"kind":"prose","spLabel":"وكان الناس يستعظمون ما انف… … وقال شفيع لابن حباب: اجعل …"},{"id":"b5-19","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص١٩","topic":"الأعذارات والحذاقات","loc":181,"text":"قال شفيع: فوجّهنا إلى أحمد بن حباب الجوهريّ فأقمنا معه أياماً حتى صنّفنا جوهراً في عشر صواني فضة. في كل صينّية من الجوهر الأحمر ومن الزمرّد الأخضر والحبَّ اللؤلؤ بقيمة مئة ألف دينار.","tags":["الجوهر"],"partial":0,"sp":5,"kind":"prose","spLabel":"وكان الناس يستعظمون ما انف… … وقال شفيع لابن حباب: اجعل …"},{"id":"b5-20","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢٠","topic":"الأعذارات والحذاقات","loc":182,"text":"وقال شفيع لابن حباب: اجعل في بعض الصواني جوهراً تكون قيمته خمسة عشر ألف دينار. وأنقص الزيادة من جميع الصواني، فإنّ المتوكِّل قد أمر أن تدفع هذه الصينّية إلى محمد بن عمر المؤدب للمعتز إذا فرغ من خطبته. وشَدّ كلّ صينيّة في منديل وختمه. وتقدم شفيع إلى الخدم بأنه إذا فرغ المعتز من الخطبة أن ينثروا الجوهر وان يدفعوا إلى المؤدّب الصينية. وتقدم إلى من معه المال بأن ينثره .","tags":["الجوهر"],"partial":0,"sp":5,"kind":"prose","spLabel":"وكان الناس يستعظمون ما انف… … وقال شفيع لابن حباب: اجعل …"},{"id":"b5-21","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢١","topic":"الأعذارات والحذاقات","loc":183,"text":"قال: وتقدم المتوكِّل إلى القواد الأكابر والأصاغر ووجوه الموالي في حضور بركوار يوم كذا ليشهدوا خطبة المعتز، وكتب إلى محمد بن عبد الله بن طاهر وهو بمدينة السلام في القدوم إلى سرّ من رأى ليحضر حذافته .","tags":["الرقيق","المجالس"],"partial":0,"sp":6,"kind":"prose","spLabel":"قال: وتقدم المتوكِّل إلى ا… … قال: بلى. ادعوا لي عبيد ال…"},{"id":"b5-22","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢٢","topic":"الأعذارات والحذاقات","loc":184,"text":"قال: فتوافى الناس براكوارا قبل ذلك بثلاثة أيام، وضربوا المضارب، وانحدر المتوكِّل غداة ذلك اليوم ومعه قبيحة ومن اختصّ به واختصّته من الحشم، إلى بركوارا، وجلس في إيوان على منصّة، وأخرج 29 ألف منبرٌ أبنوس مضبب بذهب فنصب وسط الإيوان، والمتوكِّل ينظر إليه. ثم أمر بأن يدخل محمد بن عبد الله بن طاهر، وادخل محمد بن عمر المؤدب حتى قرب من المنبر، ثم أمره بالجلوس، وخرج المعتز من باب الإيوان حتى صعد المنبر فخطب، فلما فرغ من خطبته، دفعت الصينيّة إلى المؤدب ونثر الخدم ما كان معهم من الصواني وغيرها، فالتقط الناس. وأقام المتوكِّل ببركوارا فرحاً مسروراً أيّاماً مع قبيحة، وكان يوماً لم يُرَ مثله.","tags":["الرقيق"],"partial":0,"sp":6,"kind":"prose","spLabel":"قال: وتقدم المتوكِّل إلى ا… … قال: بلى. ادعوا لي عبيد ال…"},{"id":"b5-23","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢٣","topic":"الأعذارات والحذاقات","loc":185,"text":"وكان مؤدّباً محمد المعتز: محمد بن عمر وأبا بكر أحمد بن محمد أبي سعيد الورّاق .وشرب المتوكِّل أيضاً يوماً في بركوارا. فقال لندمائه إن لم تكن أيام الورد لا نعمل نحن شاذكلاه ؟قالوا: يا أمير المؤمنين الشاذكلاه لا تكون إلاّ بالورد.","tags":["المجالس"],"partial":0,"sp":6,"kind":"prose","spLabel":"قال: وتقدم المتوكِّل إلى ا… … قال: بلى. ادعوا لي عبيد ال…"},{"id":"b5-24","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢٤","topic":"الأعذارات والحذاقات","loc":186,"text":"قال: بلى. ادعوا لي عبيد الله بن يحيى، فدُعي به فقال: تقدم بأن تضرب لي دراهم، في كل درهم حبّتان، قال: وكم المقدار يا أمير المؤمنين ؟قال: خمسة آلاف ألف درهم. فتقدّم عبيد الله في ضربها، فضربت .وعرفة الخبر، فقال: اصبغ منها بالحمرة والصفرة والسواد، واترك بعضها على حالها. ففعل، ثم تقدّم إلى الخدم والحاشية، وكانوا سبع مئة، أن يُعِدّ كلّ واحد قباءً جديداً، وقلنسوة، على خلاف لون لون القباء والقلنسوة التي على الآخر، ففعلوا، ثم عمد إلى يوم تحركت فيه الريح فنصبت له قبةٌ لها أربعون باباً، فاصطبح فيها والندماء، ولبس الجند الكسوة التي أعدّوها، وأمر بنثر الدراهم كما ينثر الورد يوم الشاذكلاه، فنثرت أولاً أولاً، فكانت الريح تحمل الدراهم فتقف بين السماء والأرض كما يقف الورد. فكان من أحسن أيام المتوكِّل .","tags":["الرقيق"],"partial":0,"sp":6,"kind":"prose","spLabel":"قال: وتقدم المتوكِّل إلى ا… … قال: بلى. ادعوا لي عبيد ال…"},{"id":"b5-25","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢٥","topic":"الأعذارات والحذاقات","loc":187,"text":"ولما اعذر المكتفي بالله ابنه أبا أحمد في سنة أربع وتسعين ومايتين سأله وزيره العباس بن الحسن أن يجعل جَمعَ الناس وإطعامهم عنده. فأجابه إلى ذلك. فجلس العباس في داره على دجلة بالقرب من باب البستان في وجه الزاهر.","tags":["الولائم"],"partial":0,"sp":7,"kind":"prose","spLabel":"ولما اعذر المكتفي بالله اب… … (لفضل بن سهيل يدٌ ... تقاص…"},{"id":"b5-26","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢٦","topic":"الأعذارات والحذاقات","loc":188,"text":"وكان جلوسه في سادلاّ بين صحنين. وأحضر من الورد ما لم ير الناس قط مثله مجتمعاً، فمُدّ في السادلا وفي الصحن إلى آخره، فكان ارتفاعه دون الذراع قليلاً في عرض أربعة اذرع في طول تسعين ذرعاً، وجميع القواد وغلمان المكتفي بالله مع الجلساء كلهم والمغنين بأجمعهم .وجعلت الخِلعُ تجيء إلى الناس من الثريا ينفذها المكتفي بالله لواحدٍ واحدٍ برقاع في جيوبها: لكل إنسان غلالة قصب وجبة فوقها، ودّراعة، فوق ذلك، على أقدارهم في المنزلة، منها المنسوج بالذَّهب، من الوشي والديباج. إلى غير ذلك، ولم يبق في المجلس أحدٌ إلا ناوله العباس من يده تحيّة من الورد معمولة فيأخذها من يده ويقبلها .","tags":["المجالس","الخيزرانة"],"partial":0,"sp":7,"kind":"prose","spLabel":"ولما اعذر المكتفي بالله اب… … (لفضل بن سهيل يدٌ ... تقاص…"},{"id":"b5-27","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢٧","topic":"الأعذارات والحذاقات","loc":189,"text":"قال أبو بكر بن يحيى الصولّي: حضرت هذا الإعذار. فلما ناوَلني العباس التحيّة قبلت يده، وقلت: أقول ما قال عمي إبراهيم بن العباس الصوليّ:","tags":["الأعذارات"],"partial":0,"sp":7,"kind":"prose","spLabel":"ولما اعذر المكتفي بالله اب… … (لفضل بن سهيل يدٌ ... تقاص…"},{"id":"b5-28","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢٨","topic":"الأعذارات والحذاقات","loc":190,"text":"(لفضل بن سهيل يدٌ ... تقاصر عنها الأملْ)\n(فَبَسْطَتُها للغنى ... وسطوتها للأجل)\n(وباطنها للندى ... وظاهرها للقبل)","tags":[],"partial":0,"sp":7,"kind":"verse","spLabel":"ولما اعذر المكتفي بالله اب… … (لفضل بن سهيل يدٌ ... تقاص…"},{"id":"b5-29","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٢٩","topic":"الأعذارات والحذاقات","loc":191,"text":"فقال لي: أولى الّناس بأن ينشد هذا أنت، فقلت له: والوزير أولى الناس أن ينشد فيه هذا الشعر .واعذر المقتدر بالله أولاده الخمسة وهم: محمد، وهارون، وعباس، وإبراهيم، وإسحاق، وطهّرهم في يوم واحد، وهو يوم السبت لإحدى عشر ليلة خَلَت من جمادى الأولى من سنة اثنتين وثلاث مئة. فنثر عليهم خمسة آلاف دينار عيناً، ومائة ألف درهم ورقاً وقبل ذلك طهر جماعة من الأيتام وفرق فيهم دراهم وكسوة وأحسن إليهم، وبلغت النفقة على هذا الطُّهر ست مئة ألف .ثم كان من إعذار المعزّ لدين الأمراء بنيه: عبد الله، ونزار، وعقيل، ما غادر عظيم ما ذكرناه صغيراً، وجسيمه حقيراً، وكثيره يسيراً. وذلك انه حين عزم على طهورهم كاتب عمّاله وولاته من لدن برقة وأعمالها إلى أقاصي سجلماسة وحدودها وما بين ذلك. وما حوته مملكته إلى جزيرة صقلّية وما والاها من حضر وَبَدو، وبحرٍ وبرٍ، وسهل وجبل، بطهور من وجد من أولاد سائر الخلق غير مطّهر. حرَّهم وعبدهم، وأبيضهم وأسودهم، وديّنهم وشريفهم، ومّليهم وذِّميهم، الذين حوتهم المملكة لمدة شهر واحد. وتوعّد على كراهية ذلك، وأمرهم بالقيام بجميع نفقاتهم وكسواتهم، وما يُصلح أحوالهم من مطعم ومَشرَب وملبسٍ وطيب وغير ذلك، بمقدار رتبهم وأحوالهم.","tags":[],"partial":0,"sp":8,"kind":"prose","spLabel":"فقال لي: أولى الّناس بأن ي… … وقال عبد الله بن النديم ال…"},{"id":"b5-30","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٣٠","topic":"الأعذارات والحذاقات","loc":192,"text":"وكان من جملة المنفق في ذلك ما حمل إلى جزيرة صقلية وحدها من المال سوى الخِلع والثياب خمسون حملاً من الدنانير  - والحمل عشرة آلاف دينار. ومثل ذلك إلى كل عامل من عمّال مملكته ليفرّقه على أهل عمله.","tags":["النار"],"partial":0,"sp":8,"kind":"prose","spLabel":"فقال لي: أولى الّناس بأن ي… … وقال عبد الله بن النديم ال…"},{"id":"b5-31","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٣١","topic":"الأعذارات والحذاقات","loc":193,"text":"وكان المعزُّ ربما طهر في اليوم الواحد من أيام الشهر بحضرته اثني عشر ألف صبي، وفوقها ودونها. وكان ذلك في سنة إحدى وخمسين وثلاث مئة .","tags":["المجالس"],"partial":0,"sp":8,"kind":"prose","spLabel":"فقال لي: أولى الّناس بأن ي… … وقال عبد الله بن النديم ال…"},{"id":"b5-32","bab":5,"sec":"باب الأعذارات الموصوفة والحذاقات المعروفة","page":"ج٥ ص٣٢","topic":"الأعذارات والحذاقات","loc":194,"text":"وقال عبد الله بن النديم القيرواني مؤلف (السيرة في الدولة العلوية ): كان وزن خرق الأكياس المفرغة فيما انفق في هذا الإعذار مئة وسبعين قنطاراً بالبغدادي .^","tags":["الرقيق","الأعذارات","العراق"],"partial":0,"sp":8,"kind":"prose","spLabel":"فقال لي: أولى الّناس بأن ي… … وقال عبد الله بن النديم ال…"},{"id":"b6-1","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١","topic":"الأيام والاجتماعات","loc":195,"text":"كانت الأكاسرة إذا ورد عليها رُسُلُ ملوك العرب والروم أمرت بتعبئة الجيش في عشر كتائب، كل كتيبة عشرة آلاف فارس، بالجواشن المذهبة، والحراب اللامعة، والدروع المفرغة، والأعلام المذهبة، من ساباط المدائن إلى الإيوان. ثم يُمَرّ بالرسل على كتيبة كتيبة. حتى إذا اشرفوا على باب الإيوان رفع لهم عنه.","tags":["فارس"],"partial":0,"sp":1,"kind":"prose","spLabel":"كانت الأكاسرة إذا ورد عليه… … وكان الملك يقيم عن يمينه م…"},{"id":"b6-2","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢","topic":"الأيام والاجتماعات","loc":196,"text":"وكانا إيوانين متقابلين بينهما فسيح من الأرض، وفي وسط ذلك قبةٌ من الأرجوان ارتفاعها عشرون ذراعاً مغشّاة بأجلّة الديباج المنسوج بالذَّهب الأحمر، وفيها جاماتٌ من البلور الأحمر والأبيض، وأنواع الأصباغ وفي وسطها سلسلةٌ من الذَّهب، معلّقٌ في طرف تلك السلسلة القنقل، وكان تاجاً كعمامة الرجل مُرَصّعة بالدّرِّ والجوهر والياقوت الأحمر .","tags":
