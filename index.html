["الجوهر","الوفاة"],"partial":0,"sp":1,"kind":"prose","spLabel":"كانت الأكاسرة إذا ورد عليه… … وكان الملك يقيم عن يمينه م…"},{"id":"b6-3","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٣","topic":"الأيام والاجتماعات","loc":197,"text":"وكان الملك يجلس تحت تلك القبة والتاج معلق على جبينه، وفي طرف السلسلة من الذَّهب سلسلةٌ من النحاس مطروحةٌ خارج الإيوان، فإذا أتى المتظلّمُ يأتي إلى السلسلة النحاس فيحركها، فيتحرك التاج المعلّق على رأسه، فيعلم كسرى أن متظّلماً ببابه، فيأمر الحجّاب فيأتون به فيوقفونه بين يديه فينصفه مّمن ظلمه.","tags":[],"partial":0,"sp":1,"kind":"prose","spLabel":"كانت الأكاسرة إذا ورد عليه… … وكان الملك يقيم عن يمينه م…"},{"id":"b6-4","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٤","topic":"الأيام والاجتماعات","loc":198,"text":"وكان الملك يقيم عن يمينه مئة غلام من أولاد الملوك قد ألبسهم الديباج الملّون من الثياب والقراطق. وفي أوساطهم مناطق الذَّهب الأحمر مرصّعةٌ بأنواع الجواهر، وعن شماله أولاد المرازبة عليهم القراطق، وفي أوساطهم المناطق، بأيديهم أعمدة الحديد المذهبة.","tags":["الرقيق"],"partial":0,"sp":1,"kind":"prose","spLabel":"كانت الأكاسرة إذا ورد عليه… … وكان الملك يقيم عن يمينه م…"},{"id":"b6-5","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٥","topic":"الأيام والاجتماعات","loc":199,"text":"وكان الملك يُقعد أربعين جارية مختارات عشرين عن يمينه وعشرين عن شماله، بأيديهنّ الملاهي في أحسن زينة وأكمل زيّ، والتراجمةُ بين يدي الملك .فإذا وقفت الرسل بين يدي الملك أُمرت بالجلوس فتبادرت إليهم الحجّابُ بكراسي الذَّهب والفضّة فيجلسون عليها ويؤّدون الرسالة وينصرفون .","tags":[],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان الملك يُقعد أربعين جا… … فتطّير المعتصم وتغامز النا…"},{"id":"b6-6","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٦","topic":"الأيام والاجتماعات","loc":200,"text":"قال أبو بكر محمد بن يحيى الصولي في كتابه المعروف (بالأوراق ): لما فرغ المعتصم من بناء قصره بالميدان الذي كان للعّباسة أخت الرشيد بالله، جلس فيه هو وجميع أهل بيته وأصحابه، وأمر أن يلبس الناس كلّهم الديباج، وجعل سريرَه في الإيوان المنقوش بالفسيفساء الذي كان في صدر صورة عنقاء مَغرِب. فجلس على سرير مرصّع بالجوهر أنواعه وألوانه. ووضع على رأسه التاج الذي فيه الدرّة اليتميمة، وفي الإيوان أسِرَّةُ أبنوس عن يمينه ويساره، من أمام السرير الذي عليه المعتصم بالله إلى باب الإيوان. وكلّما دخل رجل رتب هو نفسه إلى الموضع الذي يراه، فما رأى الناس أحسن من ذلك اليوم .فاستأذنه إسحاق بن إبراهيم الموصلي في الإنشاد فأذن له. فأنشده شعراً ما سمع الناس أحسن منه في صفته وصفة المجالس. إلا أنّ أوله تشبيب بالديار القديمة وتعفية آثارها.\nوكان أول بيت من القصيدة:","tags":["الجوهر","السلاح"],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان الملك يُقعد أربعين جا… … فتطّير المعتصم وتغامز النا…"},{"id":"b6-7","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٧","topic":"الأيام والاجتماعات","loc":201,"text":"(يا دار غيّركِ البلى فمحاك ... يا ليت شعري ما الذي أبلاك)","tags":["الشعر"],"partial":1,"sp":2,"kind":"verse","spLabel":"وكان الملك يُقعد أربعين جا… … فتطّير المعتصم وتغامز النا…","partialRef":null},{"id":"b6-8","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٨","topic":"الأيام والاجتماعات","loc":202,"text":"فتطّير المعتصم وتغامز الناس وعجبوا كيف ذهب هذا على إسحاق مع فهمه وعلمه وطول خدمته للملوك. وأقام المعتصم يومه وانصرف، فما عاد أحدٌ إلى ذلك المجلس، وخرج المعتصم إلى سرّ من رأى، وخرب القصر .ومن الأيام المشهورة والأوقات المعروفة يوم ورد رسولاً ملك الروم إلى المقتدر بالله في سنة خمس وثلاث مئة لطلب الفداء، ويلتمسان منه الهدنة ويرغبان في إيقاعها، والوزير يومئذ أبو الحسن علي بن محمد بن الفرات في وزارته الثالثة. فوردا من بلاد الروم يريدان مدينة السلام على طريق الفرات، ومعهما هدايا عظيمة .فأقيما بها مدة وحجباً فيها إلى أن يستأذن لهما، ثم إذن لهما فدخلا بغداد في يوم الاثنين لليلتين خَلَتَا من محرّم سنة خمس وثلاث مئة فأنزلا في الدار المعروفة بصاعد. وتقدم ابن الفرات بأن يفرش لهما ويُعَدّ فيها كلّ ما يحتاجان إليه من سائر الآلات والأواني، وان يقام لهما في كل يوم الإنزال الواسعة حتى لا يلزمها لأنفسهما ولا لغيرهما شيء. فجري الأمر على (31 ألف) ذلك منذ دخلا إلى أن خرجا، وإنمّا الوصول إلى المقتدر بالله ليبلّغا الرسالة التي معهما. فأعلما أنّ ذلك صعبٌ متعذِّر، ولا يجوز إلاّ بعد لقاء وزيره ومخاطبته فيما قصدا له، وتقرير الأمر معه، والرغبة إليه في تسهيل الإذن على الخليفة، والمشورة عليه بالإجابة إلى ما التمسه صاحبهما .فسأل أبو عمير عديّ بن عبد الباقي الترجمان الوارد معهما من الثغر ابن الفرات الإِذن لهما في الوصول إليه، فوعده بذلك في يوم ذكره، وتقدّم بأن يكون الجيش مصطّفاً من دار صاعد إلى الدار التي يسكُنها ابن الفرات في المخرّم، وان يكون غلمانُه وجُنُده وخلفاء الحجّاب المرسومين بداره منتظمين من باب الدار إلى موضع مجلسه وبسط له في مجلس عظيم مذهب السقوف، في دار منها تعرف بدار البستان، بالفرش الفاخر العجيب، وعُلّقت الستور الحسنة  - واستزاد في الفرش والستور والبسُط بما بلغ ثمنه ثلاثين ألف دينار، ولم يبق شيءٌ مما تُجَمّلُ به الدار ويُفخَمُ به الأمرُ إلاّ فَعل. وجلس ابن الفرات على مصلّى عظيمٍ ومن ورائه مسندٌ عالٍ، والخدم من بين يديه وخلفه وعن يمينه وشماله، والقوّادُ والأولياء ملء الصحن .","tags":[],"partial":0,"sp":2,"kind":"prose","spLabel":"وكان الملك يُقعد أربعين جا… … فتطّير المعتصم وتغامز النا…"},{"id":"b6-9","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٩","topic":"الأيام والاجتماعات","loc":203,"text":"ودخل إليه هذان الرسولان واحدهما شيخ تقديره أن يكون نيف على الستين سنة، والآخر شاب تقديره أن يكون له أربعون سنة. وكان الشيخ الترجمان والشاب الرسول.","tags":[],"partial":0,"sp":3,"kind":"prose","spLabel":"ودخل إليه هذان الرسولان وا… … وأخذ بهما في غير الطريق ال…"},{"id":"b6-10","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١٠","topic":"الأيام والاجتماعات","loc":204,"text":"وكان ملك الروم عهد للشيخ أن حدث بالشاب حدث موتٍ فدخلا، وقد شاهدا من الجيش في طريقهما، وكثرة الجمع ما هالهما. ولما دخلا دار العامّة أجلسهما الحاجب في رواقها. والرجال ملء الدار، ثم اخذ بهما في ممّرٍ طويل من وراء الرواق حتى أخرجهما إلى صحن البستان، ثم عدل بهما إلى المجلس الذي كان الوزير فيه جالساً، فعاينا من بهاء المجلس وكثرة الجمع منظراً عجيباً جليلاً، وكان معهما أبو عمير بن عبد الباقي يترجم عنهما ولهما. وحضر صاحب الشرطة في جميع رجاله، فأقيما بين يدي الوزير أبي الحسن ابن الفرات على بعد، فسلما، وترجم ابن عبد الباقي عنهما ما قلا، فأجابهما بما ترجم لهما. ورغبا إليه في إيقاع الهدنة والفداء ومسألة المقتدر بالله الإجابة لهما. فأعلمهما أنه يحتاج إلى مخاطبته فيما ذكراه ثم العمل بما يرسمُه. فالتمسا منه إيصالهما إليه فوعدهما به، وأخرجا من بين يدي ابن الفرات.","tags":["الرقيق","المجالس"],"partial":0,"sp":3,"kind":"prose","spLabel":"ودخل إليه هذان الرسولان وا… … وأخذ بهما في غير الطريق ال…"},{"id":"b6-11","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١١","topic":"الأيام والاجتماعات","loc":205,"text":"وأخذ بهما في غير الطريق الذي دخلا منه. وعادا إلى دار صاعد والجيش منتظم طول الطريق بأحسن زيّ وأكمل هيئة. وكان عليهما في اليوم الذي دخلا فيه إلى بغداد دراريع ديباج ووقايات، وفوق الوقايات قلانسُ ديباج محدّدة الرؤوس .وخاطب الوزير أبو الحسن بن الفرات المقتدر بالله في إيصالهما إليه ووافقه على ما يجيبُهما به، وتقدم إلى سائر الأولياء والقوّاد وأصناف سائر الجيش بالبكور إلى دار المقتدر. وأن يكونوا منتظمين على الظهر من دار السلطان إلى دار صاعد، فركبوا ووقفوا على الطريق على هذا الترتيب في الزيّ الحسن والسلاح التامّ. وتقدم بأن تشحن رحاب الدار والدهاليز والممرات بالرجال والسلاح التام، وأن يُفرش سائر القصور بالفرش وتزيّن الدور .ولم يزل يُراعي جميع ذلك بنفسه حتى فرغ منه. فكان الذي عُلّق من الستور  - مما وقف عليه من عملٍٍ عمله علىُّ ابن محمد الحواري صاحب خزانة الفرش  - ثمانية وثلاثين ألف ستر، منها من الستور الديباج المذهبة بجامات مخلية بخيولٍ وجمالٍ وأفلية وسباع. وطرزٍ طرزها الذَّهب بكتابة جليلة اثنا عشر ألفاً وخمس مئة. ومن الستور الكبار الصينيّنة والأرمنيّة والواسطّية والمنقوشة، والستور الدبيقيّة المطرّزة وغير ذلك من أصنافها خمسة وعشرون ألفاً وخمس مئة، مما وجد عمله وطرازه باسم المأمون والمعتصم، والواثق، والمتوكِّل، والمكتفي، منها ثمانية آلاف ستر والباقي باسم غيرهم. والذي بُسط وفُرش اثنان وعشرون ألف قطعة من البسط والنخاخ الجمرمية والأرمنية والدورقية مما بُسط جميعه في المّمرات والصحون، ووطئه القوّاد ورسل الطاغية من باب العامة الجديد إلى موضع الوصول إلى المقتدر بالله، سوى ما في المقاصير والمجالس. وفُرش مئة مرقد بمراتب ديباج مثقلة ببُسُطها تجري في جميعها الأنهار، وأُظهرت آلات الخزائن المستطرفة من الذَّهب والفضة والجوهر والحبوب وآلات الساج وطرائفها .وركب رسولا الطاغية ومعهما ابن عبد الباقي الترجمان على الظهر في يوم الخميس لست بقين من المحرم. وأُدخلا من دهليز باب العامة الأعظم إلى الدار المعروفة بخان الخيل، وهي دارٌ أكثرُها أروقةٌ بأساطين رخام. فكان فيها من جانبٍ خمس مئة فرس عليها خمس مئة مركب من فضة وذهب أنواع. بغير أغشية، ومن الجانب الآخر خمس مئة فرس عليها خمس مئة جلّ ديباج ببراقع  - كل فرس بيد رجل من الشاكريّة. ثم أدخلوا من هذه الدار إلى الممرات والدهاليز المتّصلة بحير الوحش. فكان في الدار من أصناف الوحش المستأنسة قطعان تقرب من الناس وتشُّمهم، وتأكل من أيديهم، ثم أخرجوا إلى دار فيها أربعة فيلة مع كل فيل ثمانية نفر، وزرافتان. فهال الرسول أمرُهما. ثم اخرجوا منها إلى دار فيها مئة سَبُع خمسون يمنة وخمسون يسرة كل سبع منها في يد سبّاعٍ في أعناقها السلاسل الحديد.","tags":[],"partial":0,"sp":3,"kind":"prose","spLabel":"ودخل إليه هذان الرسولان وا… … وأخذ بهما في غير الطريق ال…"},{"id":"b6-12","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١٢","topic":"الأيام والاجتماعات","loc":206,"text":"ثم اخرجوا إلى الجوسقِ المحدث. وهو دارٌ بيْن بساتين، في وسطها بركة رصاص قلعي أحسن من الفضّة المجلوة، طول البركة ثلاثون ذراعاً، ويقابل هذا البستان بُستان فيه أربع مئة نخلة في قدٍ واحد ملّبسٌ جميعها من أصولها إلى حدّ الجمار السّاج نجارة، وجميع هذا النخل حامل غرائب البسر أكثره .وحول البستان أُترُج كباٌر حامل جميعه. ثم ادخلوا القصر المعروف بالفردوس، وكان فيه من الآلات والوشي ما لا يحصى ولا يعرف مقداره كثرةً، وفي دهاليز الفردوس خمسة آلاف جوشن مذهب معلّق. ثم اخرجوا إلى ممّرٍٍ طويل طوله ثلاث مئة ذراع، قد عُلّق فيه من الجانبين زهاء عشرة آلاف درقة، وخوذة، وبيضة، ودرع، وزرديّات، وجعبات محلاة، وقسي، وقد أقيم الخدم السودان يمنة ويسرة مقدار ألفي خادم. ثم اخرجوا بعد أن طيف بهم ثلاثة عشر قصراً إلى صحن التسعيني، وكان فيه من الغلمان الحُجرية بأتم السلاح وأحسن الزيّ، وفي أيديهم من الأعمدة والطبرزينات عددٌ جمّ .ثم مروا بمصافّ عليهم السود من خلفاء الرّجالة والجند وخلفاء الحجاب، ثم ادخلوا دار السلام وفيها خلقٌ كثيرٌ من الجند الصقالبة، وفي سائر القصور كانوا يسقون الناس الماء المبرّد بالثلج، والأشربة والفقّاع.","tags":["السلاح"],"partial":0,"sp":4,"kind":"prose","spLabel":"ثم اخرجوا إلى الجوسقِ المح… … وفتحت الفوّارات التي تفور …"},{"id":"b6-13","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١٣","topic":"الأيام والاجتماعات","loc":207,"text":"وكان قد وكل بالرسل من الموضع الذي مشوا فيه خدمُ معهم الأشربة بالثلج. فقعدوا في سبعة مواضع واستراحوا وشربوا، فلما نظروا إلى جميع ما في الصحون والممرات والمجالس والخزائن أدهشتهم وحارت له عقولُهم، وشاهدوا في طريقهم من كثرة الجيش وحسن زيّه وتكامل عدّته أمراً عظيماً.","tags":["الذخائر","السفر"],"partial":0,"sp":4,"kind":"prose","spLabel":"ثم اخرجوا إلى الجوسقِ المح… … وفتحت الفوّارات التي تفور …"},{"id":"b6-14","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١٤","topic":"الأيام والاجتماعات","loc":208,"text":"ولما وصلا، هما وابن عبد الباقي إلى الناحية التي فيها الخليفة أُخذ بهما في ممرّ يُفضي إلى صحن من تلك الصحون. ثم عُدل بهما إلى ممرّ آخر ثم اخرجا إلى صحن أوسع من الأول. ولم يزل الحجابُ يخترقون بهما في الصحون والممرات حتى كَلُّوا من المشي وانبهروا، وجميع تلك الصحون والممرات محشوّة بالغلمان والخدم، إلى أن قربا من المجلس الذي فيه المقتدر بالله، ومعهما ابن عبد الباقي الترجمان. ثم ادخلوا إلى المقتدر بالله، وكان جلوسُه في التاج مما يلي دجلة، وقد لبس سائر أنواع الدبيقي المطرّز بالذَّهب، وهو على سرير مفروش بالدبيقي، وعليه السوادُ، وعلى رأسه الطويلة، وعن يمنة السرير تسعة عقود معلّقة مثل السُّبح، وعن يسرته تسعة عقود من أكبر الجوهر، وأعظمه يغلب ضوؤه ضوء الشمس والنهار. والأولياء على مراتبهم، والوزير أبو الحسن بن الفرات واقفٌ بين يديه بالقرب منه، ومؤنس الخادم ومن دونه من الخدم وقوف عن يمينه وشماله. فلما دخلا قّبلاً الأرض وسلّما ووقفا بحيث استوقفهما نصر الحاجب، وأمر المقتدر بفتح القبة وإصلاح الشجرة التي تخرج من الأرض وفيها أنواع الحركات حتى تملأ القبة.","tags":["الجوهر"],"partial":0,"sp":4,"kind":"prose","spLabel":"ثم اخرجوا إلى الجوسقِ المح… … وفتحت الفوّارات التي تفور …"},{"id":"b6-15","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١٥","topic":"الأيام والاجتماعات","loc":209,"text":"وفتحت الفوّارات التي تفور بماء الورد والمسك، وصَفّرت تماثيل الطيور في الشجرة، وأقيما من حيث يريانه من نحو المائة ذراع، فكان الترجمان يخاطب عنهما الوزير، والوزير ابن الفرات يخاطب المقتدر بالله. وأدّيا الرسالة له في الفداء، ورغبا إليه في إيقاعه. فأجابهما عنه بأنه يفعل ذلك رحمةً للمسلمين ورغبةً في فكّهم وإيثاراً لطاعة الله عزّ وجلّ وخلاصهم. وأنّه ينفذ مؤنساً لحضور ذلك.","tags":["الطيب"],"partial":0,"sp":4,"kind":"prose","spLabel":"ثم اخرجوا إلى الجوسقِ المح… … وفتحت الفوّارات التي تفور …"},{"id":"b6-16","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١٦","topic":"الأيام والاجتماعات","loc":210,"text":"وأخذ الكتاب من الرسول منهما وقرئ على المقتدر بالله .فأجابه إلى الفداءِ، وناوله المقتدر بالله جوابه إلى ملك الروم. وكان ضخماً، فتناوله وقبّله إعظاماً له .ثم أُخرجا من باب الخاصة إلى دجلة من دار الشطّ. فأخرجا وأقعد ومن معهما في شذّاء من باب الخاصّة، وأُصعدا إلى دار صاعد، وخلع عليهما خِلعاً مثقلة ثياباً وطيالسةً ومطارف خزّ مذهبة وعمائم خزّ. وخلع على ابن عبد الباقي الترجمان أيضاً. وجُعل بين يدي كل واحدٍ منهما بدرتان. وحمل إليهما خمسون بدرة، كل بدرة خمسة آلاف درهم .","tags":[],"partial":0,"sp":5,"kind":"prose","spLabel":"وأخذ الكتاب من الرسول منهم… … وعاد إلى مدينة السلام، وكا…"},{"id":"b6-17","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١٧","topic":"الأيام والاجتماعات","loc":211,"text":"وقيل بل انصرفوا على الظُّهر، والجيش على حاله منتظم، طول طريقهما الفيلة والزرافتان والسباع والنمورة وطرائف الوحش. وتقدّم بأن يطلق لمؤنس وللقواد معه من بيت المال مئة ألف دينار وسبعون ألف دينار. وكتب إلى العمّال في طريقه بإزاحة أعذاره فيما يلتمسه. وحمل إلى كل واحد من الرسولين عشرين ألف درهم صلة له.","tags":["الأعذارات"],"partial":0,"sp":5,"kind":"prose","spLabel":"وأخذ الكتاب من الرسول منهم… … وعاد إلى مدينة السلام، وكا…"},{"id":"b6-18","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١٨","topic":"الأيام والاجتماعات","loc":212,"text":"وخرجا مع مؤنس في مدينة السلام يوم السبت لثلاث خلون من صفر في السنة المذكورة. وكان الفداء في شهر ربيع الآخر على يد مؤنس.","tags":["المجالس"],"partial":0,"sp":5,"kind":"prose","spLabel":"وأخذ الكتاب من الرسول منهم… … وعاد إلى مدينة السلام، وكا…"},{"id":"b6-19","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص١٩","topic":"الأيام والاجتماعات","loc":213,"text":"وعاد إلى مدينة السلام، وكان مبلغُ ما فودي به ألفاً وخمس مئة وستة وثمانين نفساً .ومما يُشاكل ذلك ما كان من نصر بن أحمد ابن نوح بن أسد حين راسله ملك الصين في سنة سبع وعشرين وثلاث مئة يُطالبه سبع وعشرين سنة، وإقامة الدعوة له في أعماله. ويتهدّدُه إن لم يفعل ذلك سيّر العساكر نحوه لمحاربته.","tags":["الولائم","الهند والصين"],"partial":0,"sp":5,"kind":"prose","spLabel":"وأخذ الكتاب من الرسول منهم… … وعاد إلى مدينة السلام، وكا…"},{"id":"b6-20","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢٠","topic":"الأيام والاجتماعات","loc":214,"text":"وكان السبب في ذلك أن رجلاً من الدهرية من أهل نيسابور كان رُفع إلى نصر بن أحمد فيه أنّه يُناظر على الإلحاد والتعطيل، فقبض عليه، وحبسه. وسأله في التثبيت عليه أبو حفص أحمد بن محمد بن أحمد بن حفص بن الزبرقان فقيه بخارى ومشيرُ المملكة إلى أن يكتشف أمره. فأنزله داراً، ووكّل به من يحفظه، فاحتال في بعضِ الّليلِ وهرب ودخل الصين. ونفذت حيلتُه على ملك الصين فاستوزره وفتح له هذا الباب، وذكر له أنّ أمر الإسلام ضعيف، وأنّه لو خرج نفرٌ يسير لأخذوا المملكة، وكلام نحو هذا .فلما وافت رسلُُ ملك الصين إلى فرغانة، وهم أربعة مشايخ من مشايخ الصّين من ذوي الرأي فيهم والعقل والمعرفة، ومعهم أربعون فارساً، وكتب ملك الصين إلى نصر بن أحمد كتاباً يتضّمنُ مطالبته بخراج سبع وعشرين سنة، وإقامة الدعوة له، وإلاّ جرّد له من العساكر ما يكون أوله ما وراء النهر وآخره بالصين. وأنّه لم يكتف بذلك حتى يكون له نجدة على أخذ العراق وإزالة الخلافة، وذكر فيه من هذه الخرافات شيئاً كثيراً .وكتب مالكُ صاحب فرغانة إلى نصر بن أحمد بأمرهم وصفة حالهم وإنزالهم عنده. فلما وصل كتاب مالك إلى نصر بن أحمد كتب إلى مالك بأن يُكرمهم ويحمل كل واحد منهم على دابة ويجعل بخدمتهم غلاماً غلاماً لهؤلاء الأربعة، ويجمع جيوش فرغانة والمطّوّعة، ويركب معهم إلى شاطئ النهر ويعبر بهم إلى خُنجَندَة كذلك، وإلى صاحب أشروسنة كذلك، وإلى صاحب سمرقند كذلك. وكتب إلى الشّاش، وأسبيجاب، وصغد، وفاراب، وسمرقند أن يحمل كل غلام مملوك صغير وكبير إلى بخاري.","tags":["الرقيق"],"partial":0,"sp":6,"kind":"prose","spLabel":"وكان السبب في ذلك أن رجلاً… … وكان السبب في ذلك أن رجلاً…"},{"id":"b6-21","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢١","topic":"الأيام والاجتماعات","loc":215,"text":"وأمر فُفرشت الدور، كل دارٍ بلون، وجمعت الصاغة حتى وضعوا سريره والمائدة، وعمل تاجاً عظيماً، وأمر حتى عملوا أربعين قصبة من الذهب والفضة ملوّنة، وأمر حتى فُرش مجلسُه بفرش مُثقَل بالذَّهب من أوله إلى أخره، وجعل مجلسه في صفة الفيروزجة، وأمر حتى جمعوا ما قدروا عليه من الجوانش والتجافيف المذهبة، والسواعد المذهبة. وعرض الجيش، وأُمر لصاحب جيش المطّوّعة أن يأخذ من خزانة السلاح ما احتاج، ومن الدواب حاجته، وأمر بإحضار الدواب من كلّ مكان. فلما ورد كتابُ صاحب سمرقند بأنه قد خرج من سمرقند أمر نصر بن أحمد أن يُخرج المطوعة إلى دبوسية. فستقبلهم. فخرج من المطوعة أربعون ألفاً عنان كلهم بجواشن، فلما صاروا ما بين دبوسية وكرمانية بقرية يقال لها أشروفنس وهي آخر ولاية بخارى، وأول ولاية سهل استقبلهم جيش الصُّغد ومعهم الرسل. فنظر الرسل لمّا صعدوا الرابية وأشرفوا على برية أشروفنس كأنّ الدنيا كلّها تشتعل ببريق الحديد، وقد وقعت الشمس على تلك الجواشن والخوذ، فطاشت عقولُهم ونظروا إلى منظر عظيم. وسلّم المطّوّعة بعضهم على بعض، وسلموا إلى أبي أحمد بن عبد الواحد صاحب جيش مطّوّعة بخاري فتسلمهم منهم. فلما صاروا إلى كرمانية أخرجت البنود، فتحيّروا، وهالهم ما رأوا، وخرج الرجالة من كرمانية وسوادها بالسلاح، ولم يبق موضعٌ من تلك الصحراء إلا أسودّ كله بالسلاح والبنود والأعلام، فقال الرسل للترجمان: سل صاحب الجيش أنى لسلطانكم هذا ؟من أين هذا المال الذي يقبض هؤلاء ؟فاخبر الترجمان أحمد بن عبد الواحد. فقال له: هؤلاء أصحاب الإقطاعات الذين اقطعوا ضياعاً تكون مؤونتهم ومؤونة دوابّهم وسلاحهم وعيالهم ومن نزل عليهم منها، ويفضل لكل واحد منهم من تلك الضيعة ما يكون لتجاراتهم وصدقاتهم إلى الفقراء، ولم يصلوا بعد إلى الأولياء الذين هم ببغداد المرتزقة، فقالوا: لصاحبكم جيش مثل هذا ؟فقالوا: نعم له جيوش مثل هذا الجيش، الذي معي. جيشه مَثَل الرعاء عند الغنم، فكأن أصحابي بعدد الرعاء وجيش السلطان بعدد الغنم. فقالوا: والله لقد غرّنا الفاعل الذي جاء منكم، ولو علم صاحبنا أن للإسلام كلّه مثل هذا الجيش الذي معك ما جسر أن يذكر الإسلام أبداً، ولكن غرّنا الفاعل الذي منكم .فنزلوا بكرمانية، ونظروا إلى الغنم والبقر ملء الدنيا قد ذُبحت، ونصبت القدور، ونظروا إلى أحمالِ الخبز الذي يخرج، والفاكهة، فقالوا: لولا أنَ الرسل لا بد لهم من أداء الرسالة وتبليغها، أخذِ الجواب لكان رجوعنا من هاهنا أصلح، فإنّا نخشي أن يستقبلنا ما هو أعظم من هذا. فلما رحلوا من الغد من كرمانية إلى طواويس استقبلهم رجّالةُ طواويس ونواحيها تحت السلاح، معهم البنود والأعلام. فنسوا أمر كرمانية عند طواويس.","tags":["الجوهر"],"partial":0,"sp":7,"kind":"prose","spLabel":"وأمر فُفرشت الدور، كل دارٍ… … وأمر فُفرشت الدور، كل دارٍ…"},{"id":"b6-22","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢٢","topic":"الأيام والاجتماعات","loc":216,"text":"فنزلوا بها وقد وافى الجيش ونزل منها على فرسخ، ولم يعلم الرسل، فلما أصبحوا ركبوا وخرجوا من طواويس، فإذا بالمصافّ من جانبي الطريق، وإذا فرسان وبين أيديهم رجالة كلّهم بجواشن مذهبة وخوذ مذهبة، والرجالة على تلك الحال، فوقفت عليهم والقوّادُ يستقبلونهم بين المصاف بتجافيف مذهبة ودروع تبتّية وزرد ملونة، كل قائد وغلمانه على ذلك السبيل، وأصحاب المصاف قيام لا يبرحون. فورد على الرسل أمرٌ تحيّروا فيه. ونسوا ملوك الصين المتقدمين، ولا رأوا مثل ذلك ولا سمعوا قط بمثله. فساروا سبعة فراسخ من طواويس إلى باب بخارى على هذه الصفة. ثم أنزلوا على باب المدينة على شاطئ النهر حين أدركهم المساء. فلما أصبحوا نظروا فإذا الدنيا تموج ضجة وجلبة، وقد أُخرجت بنود بخارى، ولبخارى ألف وسبع مئة بند، ويخرج مع كل بند من العّيارين ما بين مائتي رجل إلى ألف رجل، عيّارين خاصةً، سوى أعلام الغزاة. فنظروا إلى البنود مصاف قد أخذت الدنيا ما يبّين من البنود فارس ولا راجل، فاستركبوهم وقد تقدّموا في زينة البلد، فزينت المدينة من أولها إلى آخرها بقبابٍ سَرَقٍٍ حرير ملبّسةٍٍ بأنواع الثياب الفاخرة، وقد خرج الرجال والنساء للنظر. فلما وصلوا إلى باب المدينة أنزلوا، ومشى بهم طول البلد كله حتى بلغوا إلى السهلة إلى نهر الموالي على تلك الحال. وقد أقام نصر بن أحمد أربعين حاجباً، بين يدي كلّ حاجب ألف غلام تركي بخفاتين ديباج وقلانس سمّور، وبين يدي كل حاجب عشرة غلمان بسيوفٍ ومناطق ذهبٍٍ، بأيديهم أعمدة مذهبة كأنها ذهب. وأقام مما يليه عشرة حجاب بين حجبة السباع. وربط خمسين سبعاً، ما بين كل عشرة حجاب، خمسة من السباع من ذا الجانب، وخمسة من ذا الجانب، والممرّ ما بينهم، والسّباعون قيام بلّبادات سود، وحاجبان جالسان على الكراسي ما بين كل عشرة من السباع وعشرة من الحجاب قيام، ومائة غلام تركي عن يمينه ومائة غلام تركي عن شماله بسيوف ومناطق ذهب. ثم المشايخ مئة شيخ عن يمينه ومائة شيخ عن يساره، عليهم السواد، وسيوفٌ ومناطقُ فضّةٍ بيضاء، ثم عشرة شيوخ جلوس عن يمينه بدرايع بيض، وعشرة عن يساره أيضاً. ثم السرير المذهب المرصع بالجوهر، والتاج موضوع على السرير، وهو جالس في صدر أسفل السرير مع المشايخ، وعليه دواجٌ من أصداغ التدرج، بظاهرة خزّ أسود مُثقَل، وقد ادخل تحت الدُوّاج سبعين وأخرج رأسيهما، وكانا معلَّمَين يضع كلّ واحد منهما رأسه على فخده، وقد استعدّ تراباً تحت البساط الذي هو عليه.","tags":[],"partial":0,"sp":8,"kind":"prose","spLabel":"فنزلوا بها وقد وافى الجيش … … وأمر السّباعين إذا وصلت ال…"},{"id":"b6-23","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢٣","topic":"الأيام والاجتماعات","loc":217,"text":"وأمر السّباعين إذا وصلت الرسل إليهم ونفذوا حجبةً واحدةً حُرَّكت السباع ورائهم. فلما وردوا الحجبة الأولى وبعّدوا الغلمان ونظروا الحاجب توهموا انه الأمير، فسلّموا عليه بالإمارة، فقام ووضع خده على الأرض وقال: هو عبد لبعض عبيد الأمير السيد. وأنفذهم إلى الجانب الآخر كذلك، حتى نفذوا أربعين حاجباً، ثم بلغوا حجبة السباع، فنظروا إلى السباع بتلك القلائد الذَّهب والسلاسل الذَّهب، والسبّاعون قيامٌ، فطاشت عقولهم، فأخذهم الحجّاب.","tags":["الرقيق"],"partial":0,"sp":8,"kind":"prose","spLabel":"فنزلوا بها وقد وافى الجيش … … وأمر السّباعين إذا وصلت ال…"},{"id":"b6-24","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢٤","topic":"الأيام والاجتماعات","loc":218,"text":"وقالوا للترجمان: قُل لهم لا عليكم، إنها معلّمة، فنفذوا إلى أول حجبة وقد خرجت بعض أرواحهم، فلما صاروا إلى الحجّاب قبلوا الأرض وسلموا عليهم بالملك، فخضع كل واحد منهم ومَرّغوا خدودهم ووجوههم وقالوا: هم كلاب عبيد الأمير السيد .ثم أخذوا سواعدهم إلى أن يذهبوا بهم إلى الحجبة الثانية، فحرك السّباعون السباع من ورائهم فغشى عليهم وأحدثوا، وجاؤوهم بماء الورد والكافو رفرشّوا على وجوههم، وأشمّوهم الكافور، فلّما أفاقوا قالوا: ردّونا فإنّا ما ننتفع اليوم بأنفسنا، وقد طاشت عقولنا فلا يتهيأ لنا أن نؤدّي الرسالة ولا نسمع الجواب. فردّوهم، وأنزلوا في دار الرسل وقد أصلح لهم من الإنزال فوق الوصف فمكثوا بها أربعين يوماً، ثم جاؤوا، فلما بلغوا حجبة السباع طاشت عقولُهم ولم يتهيأ لهم الدخول، فكانوا على هذا سبع مرات، ثم أمر نصر أن يمسكوا عن السباع حتى يصيروا إليه .فلمّا كان في اليوم الذي وصلوا فيه إلى نصر ابن أحمد نظروا إلى رجل جالس وعليه دُوُاج وسبعان تحت الدُواج معه، وقد وضعا رأسيهما على فخذيه، فهالهما أمره وتحّيروا. فسلموا عليه بالخلافة وقالوا ما بينهم، ما يكون للإسلام ملكٌ اجلُّ من هذا. فلما عّبر الترجمان عنهم تسليم الخلافة قام نصر وحوّل وجهه إلى القبلة وسجد وادخل يده تحت البساط واخذ من التراب الذي استعدّه وحثا على رأسه وقال: وحق الله الذي خلقني وخلق العالمين إن الخليفة ما رآني ولا يعرفني إلاّ بالاسم كما يعرف بعض عبيده، وإني لا أعرف له عبداً قلّده أمر المسلمين اقلّ مني، ولا جيشاً اضعف من جيشي .فقال الرسل: لو علم صاحبنا أنّ للإسلام كله عشر عشير هذا الجيش الذي رأينا نحن ما جسر أن يذكر هذا بينه وبين نفسه، ولكن حمله على هذا واستجرأه على مثله رجلٌ منكم  - وقبل وبعد، ما تملك من عقولنا ما نؤدي رسالة صاحبنا الذي حمّلنا، ولا نقدر أن نسمع منكم، ولكن هذه الكتب، اقرءوا واجيبوا عما فيها وردّونا ولا تكلّفونا معاودة هذا المجلس. فأخذوا كتبهم منهم وقرئت على نصر بن أحمد وأمر أن يكتب على ظهورها الجواب .( اعلم يا هذا إني ما تغافلت عنك ولا عن مثلك مهابةً لك، ولا ضعفاً، ولا عجزاً من قلة الرجال والعدّة، ولكن لم يأمرني السلطان الأعظم فلم يسعني في ديني أن ابسط يدي إلى ما لم يأمرني به. ولكن الآن اكتب إليه واعرّفه ما كان منك. وأستأذنه في ذلك، وأن أُوافيك إلى باب دارك ولا أُحوجُك إلى تجهيز جيش إلى ما قبلي والسلام على من اتبع الهدى) .وأدرجوا كتبهم ودفعوها إليهم وأمروا أن توضع لهم مائدة، فاخرجوا من حجبة السباع وأدخلوا داراً وقُدّم إليهم منديل مثقل، ومائدة من ذهب مرصّعة، وجميع قصاعها وسكرجاتها ومشاربها كذلك. وقُدّم إليهم أربعون لوناً من الحار والبارد، وعشرة ألوان من الحلوى.","tags":[],"partial":0,"sp":9,"kind":"prose","spLabel":"وقالوا للترجمان: قُل لهم ل… … قالوا: لم لا يوجّه إلينا ب…"},{"id":"b6-25","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢٥","topic":"الأيام والاجتماعات","loc":219,"text":"فلما فرغوا من الطعام وغسلوا أيديهم أخذوهم إلى مجلس الشراب. فنظروا إلى المجلس من أوله إلى آخره: أطباقه، ومراكبه، وقنانيه، وكيزانه، ومغاسله، وشرابيّاته، وكراسيه .وجميع ما فيه مذهب مرصعّ، فتحيّروا، وشربوا ثلاثة ثلاثة واستأذنوا في الانصراف فأتوا بالخلع وحملوا على الدواب، وردّوهم مكرمين .فلما خرجوا إلى دار الرسل جلسوا أياماً ينتظرون الخفير أن يخفرهم حتى يخرجوا فلم يروا لذلك أثراً .فقالوا للموكّلين بهم: أليس أُذِن لنا بالانصراف ؟قالوا: نعم.","tags":["الولائم","المجالس"],"partial":0,"sp":9,"kind":"prose","spLabel":"وقالوا للترجمان: قُل لهم ل… … قالوا: لم لا يوجّه إلينا ب…"},{"id":"b6-26","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢٦","topic":"الأيام والاجتماعات","loc":220,"text":"قالوا: لم لا يوجّه إلينا بخفير يخفرنا، كيف نخرج ؟فقالوا لهم: في ولاية الأمير السيد لا يحتاج إلى خفير، ولو كان معكم أحمالُ مالٍ صامت! قالوا :فننصرف إذن ؟قالوا: ذاك إليكم، أن جلستم أبداً فهذه الجراية لكم، وان خرجتم حيثما نزلتم يقام بنزلكم إلى أن تخرجوا من ولاية الإسلام. فخرجوا، ومعهم العدد الموكل بهم، حتى خرجوا من فرغانه. فكان هذا سبب إسلام ملك الصين .","tags":["الهند والصين"],"partial":0,"sp":9,"kind":"prose","spLabel":"وقالوا للترجمان: قُل لهم ل… … قالوا: لم لا يوجّه إلينا ب…"},{"id":"b6-27","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢٧","topic":"الأيام والاجتماعات","loc":221,"text":"ولما ورد رسول بسيل متملك الروم إلى مصر أراد الحاكم بأمر الله أن يفرش إيوان القصر بفرش غريب ويعلّق فيه تعاليق غريبة. فأمر بتفتيش خزائن الفرش فوجدوا واحداً وعشرين عدلاً، ذكرت السيدةُ راشدة إنها كانت في قطار الفرش المحمولة من القيروان إلى مصر حين دخل إليها أبوها المعزّ لدين الله، في سنة اثنتين وستين وثلاث مئة، في جملة أعدال. وأن كّتاب خزائن الفرش وجدوا في بعضها مكتوباً: (الحادي والثلاثون وثلاث مئة من عمل العبيد: ديباج غرز بذهب) ففرش منه جميع الإيوان وسُتر جميع حيطانه بالتعاليق.","tags":["الرقيق"],"partial":0,"sp":10,"kind":"prose","spLabel":"ولما ورد رسول بسيل متملك ا… … وكان محصناً. فتقدّم برجمه …"},{"id":"b6-28","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢٨","topic":"الأيام والاجتماعات","loc":222,"text":"وكان جميعه: أرضه وحيطانه، ذهباً يتلألأُ. وعلّقت في صدر الإيوان العسجدة، وهي ورقة من ذهب مكلّلة بفاخر قطع الجوهر النفيس من كل أصنافه، يضيء لها ما حولها، إذا وقعت عليها الشمس لا تقدر العيون تأملها كلالاً وحيرة .","tags":["الجوهر","الغرائب"],"partial":0,"sp":10,"kind":"prose","spLabel":"ولما ورد رسول بسيل متملك ا… … وكان محصناً. فتقدّم برجمه …"},{"id":"b6-29","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٢٩","topic":"الأيام والاجتماعات","loc":223,"text":"قال أبو العباس الطوسي: كان القادر بالله أنفذني إلى غزنة في رسالة إلى محمود بن سُبُكِتكين لإقامة دعوة ولي العهد الغالب بالله في سنة. .. .. .. .. ... .فلما وصلتُ إلى المدينة التي كان فيها لقيتُ له عدّةً كثيرةً من العساكر تتجاوز حدّاً ما رأيت مثله قط بأحسن زي وأُهبة، وأكمل عُدّةٍ وآلة، ثم دخلت المدينة والجيش على تعبئته، حتى وصلت إلى عدة عظيمة من الفيلة محيط بها على ما قيل ثلاثون ألف رجل من رجال الهند .ثم تجاوزتُهم فرأيت من الغلمان الأتراك الصبيان الذين برسم الحُجَر عدة عظيمة في العدد والسلاح ذكر لي إنها بضعة عشر ألفاً، فلما وصلت إلى الباب وجدت على مصراعيه تنّينَين عظيمين كأعظم ما يكون من أجناسها مربوطين بسلاسل الحديد. ثم دخلت فوجدت الدهاليز مملوءةً سباعاً متقابلة مربوطة في السلاسل. وتجاوزتُها فرأيت الفهود على حالها. ثم تجاوزتها فرأيت نمورة على مثل حالها كثيرة جداً. ثم إني وصلت إلى محمود فوجدته في مجلس عظيم كثير التجمل والآلة، ظاهر حسن الهيئة. وهو جالس على سرير، ورؤساءُ مملكته بين يديه قيام سمَاطين في أحسن زِيّ وأجمله: فأدّيتُ إليه رسالة القادر بالله. ونهض للركوب إلى حيث يقيم فيه الدعوة. فأمرني بالمسير معه. وقدّم له فرسه إلى باب مجلسه، فركب، فلما توسّط تلك الوحوش صاح جميعها وعفّرت وجوهها في الأرض سُجّداً له. واضطرب التنيّنان وصاح الرجال وسجدت الفيلة وصهلت الخيل. فكأن القيامة إذ ذاك قد قامت، وأحسَستُ بالأرض قد زُلزلت، وسار وأنا معه. وقد انقسم الجيش موكبين احدهما أمامه والآخر خلفه، وبينه وبين كل منهما أكثر من غلوَة سهم، وهو يسير منفرداً عن خواصه. وأنا وحدي أُسايره. فلما حصل في بعض طريقه اعترضَته امرأةٌ مستغيثةٌ إليه. فوقف عليها وسألها عن حالها، فأخبرته أنها بنتُ بعض مستوري رعّيته، وإنّها خرجت لبعض شأنها فاعترضها أحد رجال دولته وغلبها على نفسها وارتكب الفاحشة منها. فوقف على حاله واستدعى الرجل المذكور وسأله عما ادّعته المرأة فاعترف بصحته .","tags":["الخيل","الولائم"],"partial":0,"sp":10,"kind":"prose","spLabel":"ولما ورد رسول بسيل متملك ا… … وكان محصناً. فتقدّم برجمه …"},{"id":"b6-30","bab":6,"sec":"باب الأيام المشهودة والاجتماعات — في الأوقات المعهودة والمحافل المحشودة","page":"ج٦ ص٣٠","topic":"الأيام والاجتماعات","loc":224,"text":"وكان محصناً. فتقدّم برجمه وإحراقه. ووقف حتى رُجم وأُحرق. وتقدّم ببيع ما يملكه وتسليمه إلى المرأة بحق ما ارتكبه منها. فلما فعل جميع ذلك سار .^","tags":["النار"],"partial":0,"sp":10,"kind":"prose","spLabel":"ولما ورد رسول بسيل متملك ا… … وكان محصناً. فتقدّم برجمه …"},{"id":"b7-1","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١","topic":"الغرائب والذخائر","loc":225,"text":"قال أبو الوليد الأزرقيّ في كتابه المعروف بأخبار مكة: إن رسول الله صلى الله عليه وسلّم حين فتح مكة عام الفتح في سنة ثمان من الهجرة وجد في الجبّ الذي كان في الكعبة سبعين ألف أوقية من ذهب، مما كان يُهدي إلى البيت، قيمتها ألف ألف وتسع مئة ألف وتسعون ألف دينار. فقال علّي بن أبي طالب: يا رسول الله لو استعنت بهذا المال على حربك! فلم يحركه. ثم ذكر لأبي بكر في ولايته فلم يحركه .","tags":["الشعر","مكة"],"partial":0,"sp":1,"kind":"prose","spLabel":"قال أبو الوليد الأزرقيّ في… … وقيل استظلّ رستم في هذا ال…"},{"id":"b7-2","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢","topic":"الغرائب والذخائر","loc":226,"text":"وذكر محمد بن يحيى عن بعض الحجبة أن هذا المال بعينه باقٍ في الكعبة إلى سنة ثمان وثمانين ومائة .فلما كان فتنَةُ الحسين بن الحسن بن علّي بن علّي بن الحسين بن علّي بن أبي طالب المعروف بالأفطس، حين غلب على مكّة في سنة مائتين، في خلافة المأمون، عمد إلى الكعبة لما ملك الطالبّيون مكة. فاخذ ما في خزائنها. فنُقل إليه مال عظيم. فحازه وقال: ما تصنع الكعبة بهذا المال موضوعاً فيها لا يُنتفع به. نحن أحقُّ به نستعين به على حربنا .","tags":["الذخائر"],"partial":0,"sp":1,"kind":"prose","spLabel":"قال أبو الوليد الأزرقيّ في… … وقيل استظلّ رستم في هذا ال…"},{"id":"b7-3","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣","topic":"الغرائب والذخائر","loc":227,"text":"ولما قَتَلَ هِلال بن عُلّقَة يوم القادسية في سنة خمس عشرة وقيل أربعة عشرة رستم صاحب جيش الفرس باع سلبه بتسعين ألف دينار.","tags":["الخيل","المجالس"],"partial":0,"sp":1,"kind":"prose","spLabel":"قال أبو الوليد الأزرقيّ في… … وقيل استظلّ رستم في هذا ال…"},{"id":"b7-4","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤","topic":"الغرائب والذخائر","loc":228,"text":"وقيل استظلّ رستم في هذا اليوم بفيل عليه جوالقات فيها دنانيُر، فسقط عليه واحد منها فمات. فأخذ هلال سَلبه. وكانت قيمة قلنسوته مئة ألف دينار لو ظفر بها .","tags":["المجالس","الوفاة"],"partial":0,"sp":1,"kind":"prose","spLabel":"قال أبو الوليد الأزرقيّ في… … وقيل استظلّ رستم في هذا ال…"},{"id":"b7-5","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥","topic":"الغرائب والذخائر","loc":229,"text":"وباع زهرة بن حَوْنَة التميمي في يوم القادسيّة منطقة جالينوس حين قتله بثمانين ألف دينار .وأصاب رجل من النَّخَع أيضاً في يوم القادسيّة راية الفرس، وهي المعروفة بدرفش كاويان، وكانت مزمولة باللؤلؤ والياقوت. فقُوّمت بألفي ألف دينار. فأخذ المال عمر ودفع إليه ثلاثين ألف درهم .","tags":["الجوهر"],"partial":0,"sp":2,"kind":"prose","spLabel":"وباع زهرة بن حَوْنَة التمي… … ولما فتح سعد بن أبي وقاص م…"},{"id":"b7-6","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦","topic":"الغرائب والذخائر","loc":230,"text":"ووجدتُ في (كتاب الفتوح) أنّ ضرار بن الخطاب أخذ درفش كاويان راية كسرى يوم القادسّية بعد مقتل رستم. فعوض منها ثلاثين ألف دينار.","tags":["المجالس"],"partial":0,"sp":2,"kind":"prose","spLabel":"وباع زهرة بن حَوْنَة التمي… … ولما فتح سعد بن أبي وقاص م…"},{"id":"b7-7","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧","topic":"الغرائب والذخائر","loc":231,"text":"وكانت قيمتها ألف ألف دينار ومائتين ألوف .وأصاب المسلمون يوم القادسّية في الغنائم ما لم يُرَ مثله قط كثرةً ونفاسة. ووجد المِسْوَرُ يوم القادسية إِبريق ذهب عليه الياقوت والزبرجد. فلم يَدْرِ ما هو .ولقيه رجل من الفرس، فقال: آخذه بعشرة آلاف. فعرف أن له قيمة. فذهب به إلى سعد بن أبي وقاص وأَخبره، فأعطاه إِيّاه. فقال: لا تبعْه إياه بعشرة آلاف. فباعه له سعد بمائة ألف ونفلة إِيّاه .","tags":["الجوهر","الخيل"],"partial":0,"sp":2,"kind":"prose","spLabel":"وباع زهرة بن حَوْنَة التمي… … ولما فتح سعد بن أبي وقاص م…"},{"id":"b7-8","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨","topic":"الغرائب والذخائر","loc":232,"text":"ولما فتح سعد بن أبي وقاص مدائن كسرى في سنة. .. .. .. .. وجدوا قباباً تركيّة مملوءَة بسلال مختّمة بالرصاص. فظنوا إنها طعام، فإذا هي آنية الذهب والفضة فقُسمت بين المسلمين.","tags":[],"partial":0,"sp":2,"kind":"prose","spLabel":"وباع زهرة بن حَوْنَة التمي… … ولما فتح سعد بن أبي وقاص م…"},{"id":"b7-9","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٩","topic":"الغرائب والذخائر","loc":233,"text":"وكان الرجل يوم دخل المسلمون المدائن يطوف ويقول: من معه بيضاء بصفراء .ووجدوا كافوراً كثيراً فظّنوه ملحاً، فعجنوا به، فوجدوا مرارته في الخبز .","tags":["الطيب","المجالس","الشعر"],"partial":0,"sp":3,"kind":"prose","spLabel":"وكان الرجل يوم دخل المسلمو… … ووجد القَعْقاعُ بن عمرو ال…"},{"id":"b7-10","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٠","topic":"الغرائب والذخائر","loc":234,"text":"وأصاب المسلمون بالمدائن مالاً عظيماً وسَبْياً كثيراً: أُخذ من المدائن وما حولها مئة ألف رأس .ووقع بغلٌ من بغال مَنْ هَرَبَ من الفرس من جسر النّهْرَوان. فكَلِبَ الفُرْسُ عليه وصبروا للسيوف. فاحتمله المسلمون وأخرجوه من الماء.","tags":["الخيل","الماء"],"partial":0,"sp":3,"kind":"prose","spLabel":"وكان الرجل يوم دخل المسلمو… … ووجد القَعْقاعُ بن عمرو ال…"},{"id":"b7-11","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١١","topic":"الغرائب والذخائر","loc":235,"text":"وكان محمّلاً، فوجدوا عليه حلية كسرى، ووشاحه، ودرعه التي كان فيها الجوهر، وكان يجلس فيها للمباهاة فسُلّم لصاحب اقباض الخمس .وظفر بعض المسلمين ببغلين محمّلين. فقُتل من معهما وأتي بهما إلى صاحب الاقباض. فإذا عليها أربعة أَسفاط في اثنين منهما تاج كسرى. والاثنان الآخران فيهما ثيابُه التي كان يلبس من الديباج المنسوج بالذهب المنظوم بالجوهر وغير الديباج منسوجاً منظوماً .","tags":["الجوهر"],"partial":0,"sp":3,"kind":"prose","spLabel":"وكان الرجل يوم دخل المسلمو… … ووجد القَعْقاعُ بن عمرو ال…"},{"id":"b7-12","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٢","topic":"الغرائب والذخائر","loc":236,"text":"ووجد القَعْقاعُ بن عمرو التميميّ مع بعض من قتل من فرسان الفرس جنيبة عليها عَيْبَتَان وغلافان في احدهما خمسة أَسياف، وفي الآخر ستة أسياف. وفي العَيْبَتْين أدراع. فإذا هي دروع كسرى ومغافره وساقاه وساعداه، ودرع ملك الروم، ودرع خاقان، ودرع داهر، ودرع بهرام شوبين، ودرع الملك سياوخس، ودرع النعمان.","tags":["الخيل","السلاح"],"partial":0,"sp":3,"kind":"prose","spLabel":"وكان الرجل يوم دخل المسلمو… … ووجد القَعْقاعُ بن عمرو ال…"},{"id":"b7-13","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٣","topic":"الغرائب والذخائر","loc":237,"text":"وكانوا استلبوا ما لم يَرِثوا، استلبوها أيام غزاهم خاقان وهرقل وداهر. فأمّا النعمان وبهرام، فحين هربا وخالفا كسرى، وأما أحد الغلافين ففيه سيف كسرى وهرمز وقباذ وفيروز. وفي الآخر سيف هرقل وخاقان وداهر، وبهرام، وسياوخس، والنعمان فجيء بهذا إلى سعد. فقال للقعقاع بن عمرو: اختر من هذه السيوف. فاختار سيف هرقل وأعطاه درع بهرام. وبعث سعد بسيف كسرى والنعمان إلى عمر لتسمع بذلك العرب لمعرفتهم بهما. وحبسوهما في الأَخماس، ونفّل الباقي. وبعث بحليّ كسرى وتاجه وثيابه إلى عمر ليراه المسلمون، ولتسمع بذلك العرب .وعلى ذلك سلب خالد بن سعيد بن العاص عمراً بن معدي كَرِب سيفه الصّمصامة في الردّة، والقوم يستحبّون ذلك .","tags":["السلاح","المجالس"],"partial":0,"sp":4,"kind":"prose","spLabel":"وكانوا استلبوا ما لم يَرِث… … وقال: إن قوماً أدّوا هذا ل…"},{"id":"b7-14","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٤","topic":"الغرائب والذخائر","loc":238,"text":"ولما قدم بسيف كسرى ومنطقته وزبرجه على عمر قال: إن قوماً أدّوا هذا لذوو أمانة. فقال له عليّ رضوانُ الله عليه: إنك عَفَفْت فعفّت الرعيّة .","tags":["السلاح"],"partial":0,"sp":4,"kind":"prose","spLabel":"وكانوا استلبوا ما لم يَرِث… … وقال: إن قوماً أدّوا هذا ل…"},{"id":"b7-15","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٥","topic":"الغرائب والذخائر","loc":239,"text":"ولما أُتي عمرُ بحلي كسرى وزيّه في المباهاة وزيّه في غير ذلك، وكانت له عدة أزياء، في كل حالة زيّ، فقال: عَلَّي بُمَحلّم بن. ..، وكان أحسن عربّي يومئذ بأرض المدينة جسماً. فأُلبس تاج كسرى على عمودين خشب، وصب عليه أوشحتُه وقلائدُه وثيابُه .فأُجلس للناس فنظر إليه عمر، ونظر إليه الناس، فرأوا أمراً عظيماً من أمور الدنيا وفتنها، ثم قام عن ذلك فأُلبس زيَّه الذي يليه، فنظروا إليه في مثل ذلك في غير نوع حتى أتى عليها كلّها. ثم البسه سلاحه وقلّده سيفه، فنظروا إليه في ذلك، ثم وضعه.","tags":["السلاح","المجالس"],"partial":0,"sp":4,"kind":"prose","spLabel":"وكانوا استلبوا ما لم يَرِث… … وقال: إن قوماً أدّوا هذا ل…"},{"id":"b7-16","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٦","topic":"الغرائب والذخائر","loc":240,"text":"وقال: إن قوماً أدّوا هذا لذوو أمانة. ونفّل سيف كسرى محلّماً .ووجد عصمة بن الحارث الضبيّ يومئذ حمارين محمّلين، فأتى بهما صاحب الأقباض، فنظر فيما على احدهما. فإذا سِفطان في احدهما فرسٌ من ذهب مسرج بسرج من فضة على ثغره ولبته الياقوت والزمرد، منظوم على الفضّة ولجامه كذلك. وفارس من فضّة مكللٌ بالجوهر. وإذا في الآخر ناقة من فضّة عليها شليلٌ من ذهب. وبطان من ذهب ولها شِناقٌ أوزمام من ذهب، وكلُّ ذلك منظوم بالياقوت، وإذا عليها رجلُ من ذهب مكلّل بالجوهر، كان كسرى يضعهما إلى اسطوانتيْ التاج .","tags":[],"partial":0,"sp":4,"kind":"prose","spLabel":"وكانوا استلبوا ما لم يَرِث… … وقال: إن قوماً أدّوا هذا ل…"});</script>
<script>window.__BOOK__.push({"id":"b7-17","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٧","topic":"الغرائب والذخائر","loc":241,"text":"ووجد عامر بن عبد قيس يوم المدائن أيضاً حُقّاً فيه جوهر نفيسٌ لا تُعرف قيمته، له شأْن، فسلّمه إلى صاحب الأقباض .ووجد محفن بن. .. بالمدائن تمثالاً عليه جوهر لا تعرف قيمة نفاسه .","tags":["الجوهر","الرقيق","المجالس"],"partial":0,"sp":5,"kind":"prose","spLabel":"ووجد عامر بن عبد قيس يوم ا… … وأصاب خارجة بن الصّلْت يوم…"},{"id":"b7-18","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٨","topic":"الغرائب والذخائر","loc":242,"text":"ووجد سعد في المدائن القطف. وكان طوله ستين ذراعاً بساطاً واحداً مقدار جريب، فيه طُرُقٌ كالقصور وفصوص كالأَنهار. وخلال ذلك كالدير. وفي حافاته كالأرض المزروعة والأرض المقبلة بالنبات في الربيع، من الحرير على قضبان الذهب. ونوّاره بالذهب والفضة وأشباه ذلك وكانت أرضه بذهب ووشُية بفصوص، وثمرة بجوهر، وورقه بحرير، وماء ذهب، وكانت الفرس تسميه بهار كسرى، والعربُ تسميه القطف .","tags":[],"partial":0,"sp":5,"kind":"prose","spLabel":"ووجد عامر بن عبد قيس يوم ا… … وأصاب خارجة بن الصّلْت يوم…"},{"id":"b7-19","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص١٩","topic":"الغرائب والذخائر","loc":243,"text":"وكانوا يعدّونه للشتاء إذا ذهبت الرياحين. وإذا أرادوا الشرب شربوا عليه. فكأَنهم في رياض .وفصل سعد بن أبي وقاص بعد القسم بين الناس وإخراج الخمس مما في المدائن القطف وأَنفذه إلى عمر بالمدينة. فقسمه بين المسلمين. فأصاب عليّاً عليه السلام قطعة منه، فباعها بعشرين ألف دينار، وما هي بأجود القطع .","tags":["النفقات","النار"],"partial":0,"sp":5,"kind":"prose","spLabel":"ووجد عامر بن عبد قيس يوم ا… … وأصاب خارجة بن الصّلْت يوم…"},{"id":"b7-20","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢٠","topic":"الغرائب والذخائر","loc":244,"text":"وأصاب خارجة بن الصّلْت يوم وقعة جلولاء في سنة ست عشرة ناقة من ذهب موشحة بالدّر والياقوت مثل الجفرة. إذا وضعت على الأرض. وإذا عليها رجل من ذهب موشح كذلك. فجاء بها وبه حتى أدّاهما إلى صاحب الأَقباض .","tags":["الجوهر","المجالس"],"partial":0,"sp":5,"kind":"prose","spLabel":"ووجد عامر بن عبد قيس يوم ا… … وأصاب خارجة بن الصّلْت يوم…"},{"id":"b7-21","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢١","topic":"الغرائب والذخائر","loc":245,"text":"وكان الذي أصاب المسلمون بجلولاء أفضل مما أصابوا بالقادسية. أصابوا بجلولاء ثلاثين ألف ألف دينار. وكان خمسها ستة آلاف ألف دينار، بعث بها سعد إلى عمر. فقسمها بين المسلمين.","tags":["النار"],"partial":0,"sp":6,"kind":"prose","spLabel":"وكان الذي أصاب المسلمون بج… … قال السائب: فخرجتُ بذلك حت…"},{"id":"b7-22","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢٢","topic":"الغرائب والذخائر","loc":246,"text":"وذكره يأْتي في باب المغانم .قال السائب: لما فتح الله على المسلمين نهاوند وظفروا بعدوّهم، جلستُ تُجمعُ إلىّ غنائمُهم. فجاء رجل فقال: هذا شيء ها هنا لم تعلموا به ولم يكن فيما خرجتم له. وهو خالصٌ لأمير المؤمنين. فماذا لي ؟أتومنني أنا وأهلي إن دللتُك عليه ؟فقلت: نعم. فقال: اعدد لي فتياناً ومعاول ودابة وخُرجاً.","tags":["المغانم"],"partial":0,"sp":6,"kind":"prose","spLabel":"وكان الذي أصاب المسلمون بج… … قال السائب: فخرجتُ بذلك حت…"},{"id":"b7-23","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢٣","topic":"الغرائب والذخائر","loc":247,"text":"قال: فأعددُته له. ثم ذهبت معه حتى انتهى إلى رأس جبل. فقال: احتفروا ها هنا. فحفروا، فأخرجوا سفطين فيهما ياقوت احمر وزبرجد ولؤلؤ وحلية فقال هذا كنزٌ لخيرخان قال: وكان من أصحاب كسرى، وكانت له زوجة حسّانة فذكرت لكسرى فأرسل إليها. فبلغ ذلك زوجها فاعتزلها. فقال له كسرى ذات يوم: ألم يبلغني أن لك عيناً عذبة لا تشرب منها. فقال له: أيها الملك إني وجدتُ اثر السبع عندها، فاعتزلُتها. فشكر ذلك له كسرى وأعطاه تاجه. فهو هذا .","tags":["الجوهر"],"partial":0,"sp":6,"kind":"prose","spLabel":"وكان الذي أصاب المسلمون بج… … قال السائب: فخرجتُ بذلك حت…"},{"id":"b7-24","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢٤","topic":"الغرائب والذخائر","loc":248,"text":"قال السائب: فخرجتُ بذلك حتى أتيتُ به عمرو بن الخطاب. وكان منهما ما هو مشهور معروف .وأصاب السائبُ بن الأقرع الثقفي كنزاً لنخيرخان بنهاوند في سنة إحدى وعشرين وهو سفطان فيهما تاج ذهب مكلل بالجوهر ألفاًخر. وخواتم، وقلائد، وقرطه، ونظم، وياقوت، ودرّ، وزبرجد لم يُرَ مثله .فأمر عمر ببيعها فاشتراها عمرو بن حُرَيث بعطاء الذرية والمقاتلة، وقيل بأعطية المصريين. فباع احدهما من أهل الحيرة بذلك واستفضل الآخر، وهو أول مال اعتقده .","tags":["الجوهر","الكنوز"],"partial":0,"sp":6,"kind":"prose","spLabel":"وكان الذي أصاب المسلمون بج… … قال السائب: فخرجتُ بذلك حت…"},{"id":"b7-25","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢٥","topic":"الغرائب والذخائر","loc":249,"text":"وقال الطبري: اشتراهما عمرو بن حريث المخزومي بلفي ألف، وخرج بهما إلى ارض الأعاجم فباعهما بأربعة آلاف ألف درهم. فما زال أكثر أهل الكوفة مالاً يُعَدُّ .","tags":["العراق"],"partial":0,"sp":7,"kind":"prose","spLabel":"وقال الطبري: اشتراهما عمرو… … وذكر الواقدي في أخبار فتوح…"},{"id":"b7-26","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢٦","topic":"الغرائب والذخائر","loc":250,"text":"وقال غير واحد من المؤّرخين: لما وجّه أبو موسى الأشعري السائب بن الأقرع إلى مهرجان قُذَق وفَتَحَها، دخل هو وقوم معه دار الهرمزان. فرأى في مجلسه تمثال ظبي مصوّر في الحائط يشير بيده إلى الأرض. فأمر أن يحفر حيال يده. فأفضوا إلى حوض رخام فيه سفط فيه جوهر فاخر فأخذه السائب فخرج به إلى عمر .","tags":["الجوهر","المجالس","الشعر"],"partial":0,"sp":7,"kind":"prose","spLabel":"وقال الطبري: اشتراهما عمرو… … وذكر الواقدي في أخبار فتوح…"},{"id":"b7-27","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢٧","topic":"الغرائب والذخائر","loc":251,"text":"وذكر الشعبيُّ أن السائب لما فتح مِهِرجان ودخل منزل الهرمزان وفي داره ألف بيت فطاف فيها. فإذا ظبيٌ من جصٍ في بيت منها مادٌّ يده. فقال: أقسم بالله إنّ هذا الظبي ليشير إلى شيء. انظروا. فنظروا فاستخرجوا كنز الهرمزان في سفط. فإذا فيه ياقوت وزبرجد. فكتب فيه السائبُ إلى عمر واخذ منه فصٍّاً أخضر لا قيمة له، وكتب :إن رأي أمير المؤمنين أن يهبه لي فليفعل. فلما عرض السفط على الهرمزان قال: فأين الفص الصغير ؟قال عمر: سألنيه صاحبنا فوهبته له. فقال الهرمزان: إنّ صاحبك بالجوهر لعالم .","tags":["الجوهر","الكنوز"],"partial":0,"sp":7,"kind":"prose","spLabel":"وقال الطبري: اشتراهما عمرو… … وذكر الواقدي في أخبار فتوح…"},{"id":"b7-28","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢٨","topic":"الغرائب والذخائر","loc":252,"text":"وذكر الواقدي في أخبار فتوح بلد السند أن عبد الله بن سَوّار العبدي كان عاملاً لمعاوية بن أبي سفيان على السند وأنه غزا بلد القيقان فأصاب منه غنائم، وأنّ ملك القيقان تفادى منه بأداء الجزية وحمل إليه من الهدايا وطرائف ما في بلد السند والهند ما لم يُرَ مثله.","tags":["الرقيق"],"partial":0,"sp":7,"kind":"prose","spLabel":"وقال الطبري: اشتراهما عمرو… … وذكر الواقدي في أخبار فتوح…"},{"id":"b7-29","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٢٩","topic":"الغرائب والذخائر","loc":253,"text":"وكان في الهديّة قطعةٌ من مرآةٍٍ يذكُر أهل العلم أن الله عز وجل أنزلها على آدم لما كثر ولده وانتشروا في الأرض. وكان ينظرُ فيها فيرى من يريده منهم على الحال التي هو عليها من خير وشرّ. فأنفذها عبد الله بن سوّار إلى معاوية. فلم تزل عنده مدة حياته، ثم صارت إلى ملوك بني أمية، وكانت في خزائنهم إلى أيام بني العباس. فأخذوها فيما أخذوا من أموالهم .","tags":["الرقيق"],"partial":0,"sp":8,"kind":"prose","spLabel":"وكان في الهديّة قطعةٌ من م… … قال: ومن يهدم تلك الأركان …"},{"id":"b7-30","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣٠","topic":"الغرائب والذخائر","loc":254,"text":"وذكر عمر بن شّبة النميري في هذه المرآة قريباً مما ذكر الواقدي. قال عمر بن شبة حدثني عيسى بن عبد الله قال: حدثني عمي عبد الله بن عمر أن علياً عليه السلام قال: لما هبط آدمُ من الجنة رفعه الله على أبي قبيس ورفع له الأرض جميعاً حتى رآها.","tags":["الرقيق"],"partial":0,"sp":8,"kind":"prose","spLabel":"وكان في الهديّة قطعةٌ من م… … قال: ومن يهدم تلك الأركان …"},{"id":"b7-31","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣١","topic":"الغرائب والذخائر","loc":255,"text":"وقال: هذه كلُّها لك ولولدك، وقال: أيْ رب! كيف أعلم ما فيها ؟فجعل له النجوم، وقال: إذا رأيت نجم كذا كان كذا .قال: فكان يعلم ذلك بالنجوم. ثم إن ذلك اشتدّ عليه فشكاه إلى ربّه، فأنزل الله عليه مرآة من السماء فكان يرى بها جميع ما يريده من الأرض. فلما مات آدم عمد شيطان يقال له فقطش (؟) إلى المرآة فكسرها وبنى عليها مدينة بالمشرق يقال لها جابرق (؟ ). فلما كانت أيام سليمان بن داود عليهما السلام كان عملها عنده فسأل عنها فقيل أخذها فقطش فدعاه فسأله عنها. فقال: هي تحت أركان جابرق قال. فأْتني بها.","tags":["الوفاة"],"partial":0,"sp":8,"kind":"prose","spLabel":"وكان في الهديّة قطعةٌ من م… … قال: ومن يهدم تلك الأركان …"},{"id":"b7-32","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣٢","topic":"الغرائب والذخائر","loc":256,"text":"قال: ومن يهدم تلك الأركان ؟فقالوا لسليمان: قل له: أنت تهدمها. فقال له سليمان ذلك. فقال: نعم، ومضى فهدمها وأتاه بها. فكان سليمان يجبر بعضها ببعض، ثم يشدّها من أقطارها بشير، ثم ينظر فيها فيرى ما يريد .فلما هلك سليمان، وثَبَت عليها الشياطين فذهبت بها، وبقيت منها قطعة، فتوارثها بنو إسرائيل حتى صارت إلى رأس الجالوت فأهداها إلى مروان بن محمد بن مروان في أيام حروبه لبني العباس. فكان يحكها ويجعلها على مرآة أُخرى، فيرى ما يكره. فلما طال عليه ذلك، رمي بها، وضرب عنق رأس الجالوت. فأخذتها بعض جواريه فاحتفظت بها. فلما استخلف أبو جعفر المنصور كان خبرها عنده، فسأل عنها فعرف إنها عند جارية لمروان، فطلبها حتى وجدها، فكانت عنده ينظر فيها. ولم تزل في خزائن الخلفاء دهراً، ثم فقدت .","tags":["الرقيق","الذخائر"],"partial":0,"sp":8,"kind":"prose","spLabel":"وكان في الهديّة قطعةٌ من م… … قال: ومن يهدم تلك الأركان …"},{"id":"b7-33","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣٣","topic":"الغرائب والذخائر","loc":257,"text":"وقال يحيى بن البطريق، فتى المأمون بالله، في كتابه المعروف بكتاب (السمومات ودفع مضارها ).: حجر البازهر إذا حُكّ وترك حكه على موضع اللسعة حبس السم وأوقفه وأزاله، وإن تُرك على طعام أو شراب، وكان فيه سمٌّ، عَرِقَ الحجر، والملوك تصنع منه نصب السكاكين للموائد وتترك السكين على المائدة فإذا كان في الطعام سم عرق ذلك النصاب المصطنع من حجر البازهر .","tags":["الجوهر"],"partial":0,"sp":9,"kind":"prose","spLabel":"وقال يحيى بن البطريق، فتى … … ولما فتح قتيبة بن مسلم بيك…"},{"id":"b7-34","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣٤","topic":"الغرائب والذخائر","loc":258,"text":"ولما لقي عبيدُ الله بن زياد الترك ببخارى في سنة أربع وخمسين ومع ملكهم امرأته فتح خاتون. فلما هزمهم الله تعالى أعجلوها عن لبس خفّيْها فلبست احدهما وبقي الأخر، فأصابه المسلمون فقوّموا الجورب بمائتي ألف درهم .","tags":["الرقيق"],"partial":0,"sp":9,"kind":"prose","spLabel":"وقال يحيى بن البطريق، فتى … … ولما فتح قتيبة بن مسلم بيك…"},{"id":"b7-35","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣٥","topic":"الغرائب والذخائر","loc":259,"text":"وقال غير واحد من المؤرّخين: أنفذ أهل هراة إلى واليهم من قبل زياد بن أبي سفيان وهو نافع بن خالد الطاحي بخوان من بأزهر قوائمه منه ليبعث به إلى زياد بالعراق. فأخذ نافع قائمة منه وجعل مكانها قائمة ذهب وبعث بها مع غلامه زيد، فوشي به إلى زياد فحبسه، وكتب عليه كتاباً بثمان مئة ألف عوضاً عنها .","tags":["الرقيق","العراق"],"partial":0,"sp":9,"kind":"prose","spLabel":"وقال يحيى بن البطريق، فتى … … ولما فتح قتيبة بن مسلم بيك…"},{"id":"b7-36","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣٦","topic":"الغرائب والذخائر","loc":260,"text":"ولما فتح قتيبة بن مسلم بيكند مدينة التجار من رستاق سمرقند في سنة سبع وثمانين وجد فيها قدوراً عظاماً من الذهب يُنزل إليها بالسلالم .","tags":[],"partial":0,"sp":9,"kind":"prose","spLabel":"وقال يحيى بن البطريق، فتى … … ولما فتح قتيبة بن مسلم بيك…"},{"id":"b7-37","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣٧","topic":"الغرائب والذخائر","loc":261,"text":"ووجد الحجّاج بن يوسف في أرض فارس في سنة تسع وثمانين صنماً من فضة كهيئة اكبر ما يكون من الرجال. فأرسل به إلى الوليد بن عبد الملك .","tags":["الرقيق"],"partial":0,"sp":10,"kind":"prose","spLabel":"ووجد الحجّاج بن يوسف في أر… … وقيل قد أصاب طارق المائدة …"},{"id":"b7-38","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣٨","topic":"الغرائب والذخائر","loc":262,"text":"ووجد طارق بن زياد، مولى موسى بن نُصير في قلعة فراس على مسيرة يومين من مدينة طُلَيْطَلة حين افتتح الأندلس، في سنة اثنتين وتسعين، مائدة كانت لسليمان بن داود عليهما السلام، حملها من بيت المقدس إلى هناك ملكٌ من ملوك المغرب كان ظهر على بني إسرائيل .","tags":["المجالس","الشعر"],"partial":0,"sp":10,"kind":"prose","spLabel":"ووجد الحجّاج بن يوسف في أر… … وقيل قد أصاب طارق المائدة …"},{"id":"b7-39","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٣٩","topic":"الغرائب والذخائر","loc":263,"text":"وكانت خليطين من ذهب وفضّة، عليها ثلاثة أطواق لؤلؤٍ وياقوت وزبرجد، قيمتها مائتا ألف دينار، فحملها إلى موسى بن نصير مولاه في سنة ثلاث وتسعين فحملها مولاه إلى الوليد .ووُجد للوليد جفنة بلّور كأعظم ما يكون من الجِفان .","tags":["الجوهر"],"partial":0,"sp":10,"kind":"prose","spLabel":"ووجد الحجّاج بن يوسف في أر… … وقيل قد أصاب طارق المائدة …"},{"id":"b7-40","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤٠","topic":"الغرائب والذخائر","loc":264,"text":"وقيل قد أصاب طارق المائدة في أَرْبُونَة، وهي في أقصى ثغر الأندلس، وطُلَيْطُلة النصف فيما بين أربونة وقرطبة .وذكر غير واحد من المؤرخين: أن بيتين وجدا في الأندلس حين فتحها طارق بن زياد مولى موسى ابن نصير مولى لخم في سنة اثنتين وتسعين في مدينة الملك. ففتح أحد البيتين، وهو بيت الملوك، فوجد فيها أربعة وعشرين تاجاً عددَ ملوكهم لا يدري ما قيمة التاج منها، وعلى كل تاج اسم وصاحبه، ومبلغ عمره، وكم ملك من السنين.","tags":["الشعر"],"partial":0,"sp":10,"kind":"prose","spLabel":"ووجد الحجّاج بن يوسف في أر… … وقيل قد أصاب طارق المائدة …"},{"id":"b7-41","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤١","topic":"الغرائب والذخائر","loc":265,"text":"ووجد في البيت بعينه مائدةُ سليمان بن داود عليهما السلام المقدّم ذكرها في باب غرائب الموجوداًت. ووَجد على البيت الآخر أربعة وعشرين قفلاً، كان كلما ملك منهم ملك ضرب عليه قفلاً، ولم يفتحه ولم ينظر ما فيه. فلما ملك اللذريق آخر ملوكهم الذي فُتحت الأندلس في أيامه أرادوه على رسمهم فقال: لا أضع قفلي على شيء حتى أعلم ما هو، ولا بُدَّ لي أن أعلم ما في البيت. وتوهّم أنّ في البيت مالاً. فاجتمعت إليه الأساقفة والشمامسةُ وأعظموا ذلك، وسألوه أن يأخذ بما فعل الملوك من قبله، فأبى ذلك، فقالوا له: انظر ما يخطر على بالك من المال تراه فيه فنحن نجمعه لك وندفعُه إليك ولا تفتحه. فعصاهم وأمر به ففُتح، فإذا في البيت تصاويرُ العرب على خيولهم بعمائمهم ونعالهم وقيسّهم ونبلهم وأسيافهم ومكتوبٌ فيه: إذا فُتح هذا البيت دخل هؤلاء القوم هذا البلد. فدخلت العربُ بلدهم في تلك السنة التي فتح فيها البيت .","tags":["الغرائب","الشعر"],"partial":0,"sp":11,"kind":"prose","spLabel":"ووجد في البيت بعينه مائدةُ… … وذكر أنه شرب في ليلةً وهي …"},{"id":"b7-42","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤٢","topic":"الغرائب والذخائر","loc":266,"text":"وأصاب عبد الرحمن بن عبد الله العكّي في ولايته الأندلس حين غزا الفرنجة في سنة إحدى عشرة ومائة وأظفره الله عليهم فيما أصاب، رجلاً من ذهب مفصّصة بالدّر والياقوت والزبرجد. مع غنائم كثيرة غنمها .ورفع مصعب بن الزبير حين أحسّ بالقتل إلى مولاه زياد فصّاً من ياقوت أحمر، وقال له: انجُ بهذا. فقوّم ذلك الفص بألف ألف درهم فأخذه زياد فدقّه بين حجرين وقال: والله لا انتَفَعَ به أحدٌ بعده .","tags":["الجوهر"],"partial":0,"sp":11,"kind":"prose","spLabel":"ووجد في البيت بعينه مائدةُ… … وذكر أنه شرب في ليلةً وهي …"},{"id":"b7-43","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤٣","topic":"الغرائب والذخائر","loc":267,"text":"وذكر مصعبٌ الزبيريّ أن بعض عمال خراسان في أيام ولاية مصعب بن الزبير العراقيين ظهر على كنزٍ وجد فيه نخلةً كانت لبعض الأكاسرة مصنوعةً من الذهب مرصعة بالجوهر والياقوت أحمر والأصفر والزبرجد، فحملها إلى مصعب، فجمع مَنْ يقوّمها، فبلغت القيمة ألفي ألف دينار. فقال: إلي من أرفعُها ؟فقيل له: إلى نسائك وأهلك. فقال: لا بل إلى رجل قدّم عندنا يداً وأولادنا جميلاً، ادعوا عبد الله بن أبي فروة، يعني كاتبه، فدفعها إليه. فلما قُتل مصعب كاتَبَ ابن أبي فروة عبد الملك بن مروان وبذل له مالا، فتسلم منه ماله وكان أيسر أهل المدينة .ووُجد للوليد بن يزيد بن عبد الملك بعد مقتله في سنة ست وعشرين ومائة جفنة بّلور كأعظم ما يكون من الجفان كان يملأها شراباً .","tags":["الجوهر"],"partial":0,"sp":11,"kind":"prose","spLabel":"ووجد في البيت بعينه مائدةُ… … وذكر أنه شرب في ليلةً وهي …"},{"id":"b7-44","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤٤","topic":"الغرائب والذخائر","loc":268,"text":"وذكر أنه شرب في ليلةً وهي بين يديه، وطلع القمر وهو يشربُ، وندماؤه معه. فقال: أين القمر الليلة ؟فذكر له بعض الأبراج. فقال بعضُ جلسائه: وهو في الجفنة .فقال: والله ما عدوتَ ما في نفسي. وطرب طرباً شديداً .وانتقل إلى بني العباس حين انتقل الأمر إليهم درّةُ بني أُمية العظيمة التي زعم الناس أنّهم لم يروا في عظَمِها، ولم يكن في الضوء والبياض مثلها كذلك. فلما ولى المهدي الخلافة أعطاها لحَسَنَة جاريته فخَرَطَتها فصّين للنرد .","tags":["بني أمية","بني العباس"],"partial":0,"sp":11,"kind":"prose","spLabel":"ووجد في البيت بعينه مائدةُ… … وذكر أنه شرب في ليلةً وهي …"},{"id":"b7-45","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤٥","topic":"الغرائب والذخائر","loc":269,"text":"واشترى المهديُّ بالله سيف عمرو بن معدي كرب الصمصامة من أيوب بن أبي أيوب بن سعد بن عمرو بن سعيد بن أبي العاص بنّيف وثمانين ألفاً .ومن الغرائب الفصّ الذي وجد لأبي مسلم، وكان أنفذ زياد بن صالح إلى الصين فأهداه له، وانتقل إلى المهدي فوهبه للرشيد، فذهب من الرشيد بباطُرُنْجي وهو يتصيد، فسقط الفص منه وما معه أحد، فكُربت الأرضُ على الفص فلم يوجد. فاغتمّ به غماً شديداً. فذكر له فصّ ابتاعه صالح صاحب المصلّي من عون العبادي بعشرين ألف دينار ليس لأحد مثله. فاستحضره ولم يره عوضاً عن فصّه .","tags":["السلاح"],"partial":0,"sp":12,"kind":"prose","spLabel":"واشترى المهديُّ بالله سيف … … ولما فتح خالد بن برمك طبرس…"},{"id":"b7-46","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤٦","topic":"الغرائب والذخائر","loc":270,"text":"ولما فتح هشام بن عمرو التغلبيّ الهند  - جاز بالسند في سنة إحدى وخمسين ومائة في خلافة المنصور بالله حين افتتح القُنْدَهار  - وجد فيها سارية حديد غليظة طولُها مئة ذراع، فسأل عنها أهل القندهار فقالوا: هذه سيوف أبناء فارس أيام أبلوا مع تبّع الحميري، فافتتحوا البلاد، فلما فتحوا القُنْدَهار جمعوا سيوفهم فضربوها جميعاً، وهي هذه السارية، فاليمن نزعم أنّ تبعاً قال :","tags":["فارس","الهند والصين","بني العباس"],"partial":0,"sp":12,"kind":"prose","spLabel":"واشترى المهديُّ بالله سيف … … ولما فتح خالد بن برمك طبرس…"},{"id":"b7-47","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤٧","topic":"الغرائب والذخائر","loc":271,"text":"(ولو نعرت بقُنْدَهار نعرةً ... خرّت صوامعُها وكلُّ عمودِ)","tags":[],"partial":1,"sp":12,"kind":"verse","spLabel":"واشترى المهديُّ بالله سيف … … ولما فتح خالد بن برمك طبرس…","partialRef":null},{"id":"b7-48","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤٨","topic":"الغرائب والذخائر","loc":272,"text":"ولما فتح خالد بن برمك طبرستان ودنباوند في سنة ثلاث وأربعين ومائة وظفر بالإصْبهبذ أخذ ما لا يحصى كثرةً ونفاسةً، وذلك أن الأكاسرة في هربهم من العراق إلى مرو أودعوا هذه المواضع نفيسَ أموالهم وجواهرهم، فوُجد فيها من الذخائر والمناطق والسيوف المكلّلة بالدر والياقوت والزمرّد ما لا يُحصى له قيمة .","tags":["الجوهر","الغرائب"],"partial":0,"sp":12,"kind":"prose","spLabel":"واشترى المهديُّ بالله سيف … … ولما فتح خالد بن برمك طبرس…"},{"id":"b7-49","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٤٩","topic":"الغرائب والذخائر","loc":273,"text":"ووجد في ثقل يعقوب بن الّليث الصفار عند هزيمته من المعتمد وأخيه الموفّق في سنة اثنين وستين ومائتين من طسّوج جازر من أعمال العراق في خزائنه وذخائره سروجٌ صينّيةٌ وأعمدةُ ذهب مكللّةٌ بالجوهر، ومن طرائف السند والهند والصين وفرغانة، من العود الهنديّ والمسك التبّتي وصناديق المال ما لا يوقف على قدره جلالةً ونفاسة .","tags":["الجوهر","الطيب"],"partial":0,"sp":13,"kind":"prose","spLabel":"ووجد في ثقل يعقوب بن الّلي… … ولما ظفر الحسن بن الحسين ب…"},{"id":"b7-50","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥٠","topic":"الغرائب والذخائر","loc":274,"text":"فأما الدّرة المعروفة باليتيمة فإنما سُمّيَت اليتيمة لأنّها لم يوجد لها أختٌ في الدنيا ولا قرينة، فإنّ مسلم بن عبد الله العراقيّ أحد من يجّهز الغاصة إلى طلب اللؤلؤ في خلافة الرشيد بالله حصل بيده درّتان إحداهما اليتيمة والأخرى دونها. فحملها إلى الرشيد.","tags":["الجوهر","الرقيق"],"partial":0,"sp":13,"kind":"prose","spLabel":"ووجد في ثقل يعقوب بن الّلي… … ولما ظفر الحسن بن الحسين ب…"},{"id":"b7-51","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥١","topic":"الغرائب والذخائر","loc":275,"text":"وباع عليه اليتيمة بسبعين ألف دينار، والصغيرة بثلاثين ألف دينار، وانصرف إلى عُمان بمئة ألف دينار فبنى بها داراً عظيمة جليلة، واشترى ضياعاً، واعتقد عقداً. وداره معروفة بعُمان. وبعضُ حيطانه باق إلى هذا الوقت .","tags":["النار"],"partial":0,"sp":13,"kind":"prose","spLabel":"ووجد في ثقل يعقوب بن الّلي… … ولما ظفر الحسن بن الحسين ب…"},{"id":"b7-52","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥٢","topic":"الغرائب والذخائر","loc":276,"text":"ولما ظفر الحسن بن الحسين بن مصعب بن زريق عم عبد الله بن طاهر بمحمد بن قارن المعرف بالمازيار بسارية من أعمال جرجان في سنة أربع وعشرين ومائتين، وجد معه ستة وتسعين ألف دينار عينا وسبع عشرة قطعة زمرد، وست عشر قطعة ياقوت أحمر، وثمانية أحمال سلاسل مجلّدة فيها ألوانُ الثياب، وتاجاً وسيفاً من ذهب، وجوهر، وخنجراً من ذهب مكلّلاً بالجواهر، وحقّاً كبيراً مملوءاً جوهراً، شراءُ جوهره على المازيار ثمانية عشر ألف درهم. فبذل جميع ذلك للحسن بن الحسين على أن يظهر أنه خرج إليه في الأمان ويؤمنه على نفسه وولده وماله. فامتنع من ذلك وأنفذه إلى عبد الله بن طاهر .","tags":["الجوهر"],"partial":0,"sp":13,"kind":"prose","spLabel":"ووجد في ثقل يعقوب بن الّلي… … ولما ظفر الحسن بن الحسين ب…"},{"id":"b7-53","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥٣","topic":"الغرائب والذخائر","loc":277,"text":"ولما ظفر بإبراهيم بن المهديّ في سنة عشر ومائتين كان في يده خاتم فصّه ياقوت أحمر، كان شراؤه على الأمين عشرة آلاف دينار. وكان وهبه لحارس الدرب الذي وُجد فيه ببغداد، فلما نمّ عليه استعاده منه. وانتقل هذا الفصّ فيما حدثني به من أثقُ به بقوله، إلى خزائن الدولة الفاطمية .ومن أغرب ما وجده الناس من الياقوت الفصّ الذي انتقل إلى عيسى بن أبي جعفر المنصور بالله.","tags":["الجوهر","الذخائر"],"partial":0,"sp":14,"kind":"prose","spLabel":"ولما ظفر بإبراهيم بن المهد… … ووجد بنو العباس في خزائن م…"},{"id":"b7-54","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥٤","topic":"الغرائب والذخائر","loc":278,"text":"وكان ياقوتاً أحمر. ذُكر عنه أنه انصرف ليلة من عند الرشيد وفي أصابعه خاتم فيه هذا الفص الأحمر، فسقط الفص منه فلم يوجد، فأمر غلمانه بإِطفاء الشمع فلما أظلمت الطريق أضاءَ كالنار فأخذه .","tags":["الجوهر","السفر"],"partial":0,"sp":14,"kind":"prose","spLabel":"ولما ظفر بإبراهيم بن المهد… … ووجد بنو العباس في خزائن م…"},{"id":"b7-55","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥٥","topic":"الغرائب والذخائر","loc":279,"text":"ولما هرب ابن نفيس إلى بلاد الروم حين خُلع المقتدر بالله في سنة سبع عشرة ثلاث مئة نُهبت داره، وكان فيما نُهب منها قبة جزع يمانيّ كانت لهشام بن عبد الملك نُقلت من دار السلطان إليه في جهاز بنت فاطمة النحويّة القهرمانة .","tags":["الرقيق","الغرائب"],"partial":0,"sp":14,"kind":"prose","spLabel":"ولما ظفر بإبراهيم بن المهد… … ووجد بنو العباس في خزائن م…"},{"id":"b7-56","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥٦","topic":"الغرائب والذخائر","loc":280,"text":"ووجد بنو العباس في خزائن مروان بن محمد حين ظفر به بمصر بمائدة جزع أرضها بيضاء، وفيها خطوط سودٌ وحمرٌ، سعتها ثلاث أشبار، وغلظها أصبعان، وأرجلها من ذهب، وجام زجاج فرعونيّ غلظه أصبعٌ وفتحه شبر ونصف، في وسطه صورة أسد نابت، وأمامه رجل قد برك على ركبتيه وقد أعرق السهم في القوس، ولم يزل في خزائنهم إلى خلافة المأمون، فأهداهما وغيرهما إلى دهمي ملك الهند. وإن هذه المائدة صنعت على شكل المشتري فمن أكل عليها لم يشبع .","tags":[],"partial":0,"sp":14,"kind":"prose","spLabel":"ولما ظفر بإبراهيم بن المهد… … ووجد بنو العباس في خزائن م…"},{"id":"b7-57","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥٧","topic":"الغرائب والذخائر","loc":281,"text":"وكان للمتوكّل على الله فصٌّ أحمر يسمى الجبل، وزنه مثقال ونصف. فلما حكّوه حتى استوت جوانبه ونقش صار وزنه مثقالاً وربعاً. شراؤه ثمانون ألف دينار، وفصٌّ يسمى المنقار وزنه ثلاثة عشر مثقالاً، شراؤه عشرة آلاف دينار، وفصٌّ أحمر يسمى المطلبي وزنه ستة قراريط، شراؤه ستة آلاف دينار. وسبحة فيها مئة حبّة، وزن كلّ حبّة مثقال، شراء كلّ حبّة ألف دينار، فلما قتل المتوكل تخطفت، فلم يزل الموفّق يطلبها حتى جمعها كلها، فلما انتقلت الخلافة إلى أحمد المستعين بالله أخرج من خزانة الخلافة الفص الياقوت الأحمر المسمى بالجبل.","tags":["الجوهر"],"partial":0,"sp":15,"kind":"prose","spLabel":"وكان للمتوكّل على الله فصّ… … وقال محمد بن داود بن الجرّ…"},{"id":"b7-58","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥٨","topic":"الغرائب والذخائر","loc":282,"text":"وكانت بنو العباس تصونه إعظاماً له. وكان الرشيد اشتراه بثمانين ألف دينار في حياة أبيه، فنقش عليه اسمه أحمد فوضع ذلك من قدره .","tags":["النار"],"partial":0,"sp":15,"kind":"prose","spLabel":"وكان للمتوكّل على الله فصّ… … وقال محمد بن داود بن الجرّ…"},{"id":"b7-59","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٥٩","topic":"الغرائب والذخائر","loc":283,"text":"وقال أبو بكر الصولي في كتاب الأوراق: كان المهديّ اشترى الجبل بثلاث مئة ألف دينار، وذكر أنّ هذا الفصّ تداولته ملوك الأكاسرة. وقد كان نقش في قديم الزمان، ولم ينقشه ملكٌ إلاّ مات مقتولاً، فإذا جلس الملك بعده محاه، فتحاماه الناس ومن علم أمره من الملوك، وغبا أمره عن المستعين بالله، وظهر هذا الفصّ في أيام المقتدر بالله ثم خفي أمره إلى الآن .","tags":["بني العباس"],"partial":0,"sp":15,"kind":"prose","spLabel":"وكان للمتوكّل على الله فصّ… … وقال محمد بن داود بن الجرّ…"},{"id":"b7-60","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦٠","topic":"الغرائب والذخائر","loc":284,"text":"وقال محمد بن داود بن الجرّاح في كتابه المعروف (بالوزراء) إن هارون الرشيد اشترى الفصّ الياقوت المعروف بالجبل. وكانت بنو العباس تصونه في أيام أبيه.","tags":["الجوهر","الكتب"],"partial":0,"sp":15,"kind":"prose","spLabel":"وكان للمتوكّل على الله فصّ… … وقال محمد بن داود بن الجرّ…"},{"id":"b7-61","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦١","topic":"الغرائب والذخائر","loc":285,"text":"وكان هارون الرشيد شديد المحبة للجوهر. فلما ولى الخلافة أخوه موسى الهادي بالله انتزع منه جاريته وطالبه بالخاتم الذي فيه الفصّ المعروف بالجبل فلم يدفعه إلى رسوله، وركب به إليه. فلما صار في وسط الجسر أخرج الخاتم ودعا برسول الهادي فأداه إيّاه ثم قذف به في دجلة ورجع فاضطغن ذلك موسى عليه. فلما أفضت الخلافة إلى هارون الرشيد دعا بالغوّاصين فاستخرجه بعضهم من دجلة .","tags":["الجوهر"],"partial":0,"sp":16,"kind":"prose","spLabel":"وكان هارون الرشيد شديد الم… … قال محمد بن الفضل: فحدّثني…"},{"id":"b7-62","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦٢","topic":"الغرائب والذخائر","loc":286,"text":"وقال أبو جعفر محمد بن جرير الطبريّ: لما صار الرشيد إلى كرسي الجسر دعا بالغواصين فقال: كان المهدي وهب لي خاتماً شراؤه مئة ألف دينار يسمى الجبل. فدخلت على أخي وهو في يدي، فلحقني سليمان الأسود على الكرسي فقال لي: أمير المؤمنين يأمرك أن تعطيني هذا الخاتم. فرميت به في هذا الموضع، فغاصوا فأخرجوه فسُرّ به غاية المسّرة .وحدّثني أبو منصور عبد المحسن بن محمد بن علي البغدادي قال: ثنا القاضي أبو القاسم علّى بن المحّسن التنوخي، قال ثنا أبو عمرو محمد بن العباس بن حيويه، قال: نا أبو بكر محمد بن القاسم الأَنباري قال: نا محمد ابن أحمد المقدّمي، قال: نا أبو محمد التميمي، قال نا محمد بن الفضل بن العبّاس قال حدثني أبي قال: كان عند الرشيد خاتم فصّه ياقوت أحمر مجنبذ مصُوغ على ذهب، كانت الخيزران تَتَخَتّم به. فلما قلد المهدي الرشيد ولاية العهد بعد موسى وهبت له الخيزران ؟أشياء منها هذا الخاتم. فلما مات المهدي وجه موسى إلى الرشيد: أن وجه إلى الخاتم، فقال للرسول: أنا لا أسلمه إليك ولكني أصير به إلى أمير المؤمنين. ثم ركب مع الرسول والخاتم معه، فلما صار على الجسر قال له: أتعرفُ هذا الخاتم ؟قال: نعم.","tags":["الجوهر"],"partial":0,"sp":16,"kind":"prose","spLabel":"وكان هارون الرشيد شديد الم… … قال محمد بن الفضل: فحدّثني…"},{"id":"b7-63","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦٣","topic":"الغرائب والذخائر","loc":287,"text":"قال: فنظر إليه ما أصنع به. ثم رمى به بين سفينتين من سفن الجسر. ومضيا على موسى، فسبقه الرسول فأخبر موسى الخبر، وعنده العباس بن محمد. فهّم بقتل الرشيد، فقال له العباس: والله يا أمير المؤمنين لو قتلت رجلا من العامّة بسبب الخاتم لتسرّع الناس إليك بالّلائمة، فكيف تفعل هذا بأخيك وابن أبويك وولّي العهد من بعدك ؟ولم يزل يسكّنه حتى هدأ، أمر بردّ الرشيد إلى منزله. فلما مات موسى ركب الرشيد صبيحة اليوم الذي دفنه فيه فصار إلى الجسر وأمر بجمع الغّواصين وعدّ سبع عشرة سفينة وقال للغواصين: انزلوا بين هاتين السفينتين .","tags":["المجالس","الوفاة"],"partial":0,"sp":16,"kind":"prose","spLabel":"وكان هارون الرشيد شديد الم… … قال محمد بن الفضل: فحدّثني…"},{"id":"b7-64","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦٤","topic":"الغرائب والذخائر","loc":288,"text":"قال محمد بن الفضل: فحدّثني زربال الغوّاص، وكان يعبر دجلة غوصاً ويمشي على الأرض في قرارها قال: لما انتهينا إلى القرار جلستُ وتربّعتُ وقد ضاقت علي الأنفاس، وأَيس أصحابي من الخروج فخرجوا، وضربتُ بيدي إلى ما بين يدّي فلم أجد شيئاً، فضربت برجلي فأحسست شيئاً فأخذته. فإذا هو الخاتم فصعدت والرشيد واقف، فقال لي: ما وراءك ؟فقلت: خير، وأريته الخاتم. فأخذه وأمر لي بعشرة آلاف درهم .","tags":[],"partial":0,"sp":16,"kind":"prose","spLabel":"وكان هارون الرشيد شديد الم… … قال محمد بن الفضل: فحدّثني…"},{"id":"b7-65","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦٥","topic":"الغرائب والذخائر","loc":289,"text":"قال أبو محمد الفرغاني في (تاريخه ): وأصاب المأمون بالله بخراسان كانوناً من ذهب مرصّعاً بجوهر كثير، قيل إنه كان ليزدجرد بن شهريار الفارسي لا تعرف قيمته لكثرتها. فقال ذو الرئاستين الفضل بن سهل بن الصولت: يا أمير المؤمنين الرأي أن تجعله في الكعبة يوقدُ عليه العودُ والندُّ بالليل والنهار. فقال المأمون: أفعلُ، وأمر بحمله إلى مكة. واتصل الخبر بيزيد بن هارون المحدّث فأمر مستلميه أن يقف يوم الخميس عند اجتماع الناس وأصحاب الحديث فيشكر المأمون ويدعو له ويخبر بخبر الكانون. ففعل المستملى ذلك. فلما سمع يزيد كلامه صاح وانتهره وقال له: ويلك! اسكت، إن أمير المؤمنين أجلّ قدراً وأعلم بالله عزّ وجلّ من أن يجعل بيته بيت نار. فكتب أصحابُ البريد إلى المأمون فأمر بكسر الكانون، وبطل ما كان دّبره ذو الرئاستين .","tags":["الجوهر"],"partial":0,"sp":17,"kind":"prose","spLabel":"قال أبو محمد الفرغاني في (… … وأصاب يعقوبُ بن الّليث بفا…"},{"id":"b7-66","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦٦","topic":"الغرائب والذخائر","loc":290,"text":"وكانت قيمةُ الجوهر الذي سلم من النهب ببغداد بعد ما فرّقه محمد الأمين ووهبه وقدمتْ به جمرة العطارة صاحبة خزانة الجوهر على المأمون بمرو بعد فتنة الأمين على ما ثبت في الرقاع الموجودة عليه  - ألف أَلف أَلف ومائة ألف ألف وستة عشر ألف ألف درهم .","tags":["الجوهر"],"partial":0,"sp":17,"kind":"prose","spLabel":"قال أبو محمد الفرغاني في (… … وأصاب يعقوبُ بن الّليث بفا…"},{"id":"b7-67","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦٧","topic":"الغرائب والذخائر","loc":291,"text":"ولما عُرض على المأمون وهبه للفضل بن سهل، فاستعفاه من قبوله، ولم يزل يكّلمه في قبول بعضه وهو يمتنع من ذاك إلى أن أكرهه على أخذ عقد واحد قيمتُه ألف ألف دينار .","tags":["النار"],"partial":0,"sp":17,"kind":"prose","spLabel":"قال أبو محمد الفرغاني في (… … وأصاب يعقوبُ بن الّليث بفا…"},{"id":"b7-68","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦٨","topic":"الغرائب والذخائر","loc":292,"text":"وأصاب يعقوبُ بن الّليث بفارس في قلعة محمد ابن واصل، في سنة إحدى وستين ومائتين، ما قيمته أربعون ألف ألف درهم .ولما قُتل عمران بن يحيى بن موسى بن خالد بن برمك بالسند في ذي الحجة سنة سبع وعشرين ومائتين في خلافة الواثق وأتي خبرُ قضائه إليه، وجه في قبض أمواله بمدينة السلام والبصرة وسيراف. فأُخذ بذلك ابنه محمد بن عمران وأختٌ له كانت تقوم بعياله وبأموره ببغداد، فحُبسا عند إبراهيم بن مصعب نحواً من سنتين، فكُلّم الواثق فيهما فأُطلقا، وقبض على وكلائه فحُمِلوا إلى سرّ من رأي فأدّوا إلى السلطان ما كان في أيديهم من أمواله، فوصل إليه من ذلك ما قيمته خمسة آلف آلف ونحوٌ من ألفي سفط عود، ومالا يوقف عليه من الآلة والأمتعة.","tags":["العراق","فارس"],"partial":0,"sp":17,"kind":"prose","spLabel":"قال أبو محمد الفرغاني في (… … وأصاب يعقوبُ بن الّليث بفا…"},{"id":"b7-69","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٦٩","topic":"الغرائب والذخائر","loc":293,"text":"وكان أكثر ما أدوا النقر الذهب. واتخذ الواثقُ من ذلك الذهب المائدة التي اتخذها وصحافها وجميع آلتها من ذهب. وكان عمران قد وجّه إلى الواثق بالله من سَبْي الهند نحواً من ألفي رأس، ومن الهدايا وأمتعة السند وطُرَفها وفأر المسك والعنبر والعود الهنديّ وآنية الذهب والفضة والسيوف الهندية، والأسَِّرة، والكراسي من العود الهندي، والتيجان المكلّلة بالجواهر والذهب، والنقرة الفضة بقيمة ألفي ألف وأكثر من ذلك، ووجه إليه ببغوثة وبُبُور وغير ذلك من الوحش والطير المستظرفة التي لا تكون إلا هُناك. ووجه إلى جُلّة القواد كإسحاق بن إبراهيم، ومحمد بن عبد الملك، وأحمد ابن أبي دؤآد وغيرهم بهدايا جليلة القدر، وكان الموجّه إليهم بذلك مع كاتب له، فلما ورد على الواثق خبر البغوثة والببور والطيور والوحش تطلّع إلى ذلك وسُرّبه وأمر بالكتاب في تعجيله، فوجّه في ذلك رسولاً قاصداً حتى تلقّاه وأورده، فاستظرفه وحسُن منه موقعه. ثم وردت الهدايا عليه في إِثره .","tags":[],"partial":0,"sp":18,"kind":"prose","spLabel":"وكان أكثر ما أدوا النقر ال… … ولما سلّم أبو علّي محمد بن…"},{"id":"b7-70","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧٠","topic":"الغرائب والذخائر","loc":294,"text":"ووجد لعمران بن موسى لما قُتل سبع مئة نصل هندي عتيق مدفونة في بيت شرابه، مقّير عليها، إلى الدروع السابرية، والطرخونية المرتفعة، والجواشن التبّتّية والحديدة (؟) التبّتية إلى السواعد والسوق والخوذ وتجافيف الخيل وما شاكل ذلك ما لا حدّ له .","tags":["الخيل","السلاح","الكنوز"],"partial":0,"sp":18,"kind":"prose","spLabel":"وكان أكثر ما أدوا النقر ال… … ولما سلّم أبو علّي محمد بن…"},{"id":"b7-71","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧١","topic":"الغرائب والذخائر","loc":295,"text":"ووجد أبو الحسن أحمد بن محمد بن المدّبر حين أمره المتوكل بمصادرة علّي بن عيسى بن يزداد في داره بعد ما أخذ من رحله، مئة جبة سعديّة قيمة كلّ ثوب منها من مائتي دينار إلى مئة وعشرين ديناراً إلى ثمانين ديناراً، وجميعها موبّر بجميع الوبر، وتحت كلّ جبّة منها قميص، وفوقها مِبْطَنة. ومعها كساء قومسيّ، وعمامة، وشاشية فما رُؤي مثل اجتماعها وحُسنها سوي ما وُجد من صنوف الحلي، والكسي، والآلات .","tags":["المجالس"],"partial":0,"sp":18,"kind":"prose","spLabel":"وكان أكثر ما أدوا النقر ال… … ولما سلّم أبو علّي محمد بن…"},{"id":"b7-72","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧٢","topic":"الغرائب والذخائر","loc":296,"text":"ولما سلّم أبو علّي محمد بن إلياس قلعة كرمان إلى ولده أبي المظفر اليسع وسار إلى خراسان في سنة ست وخمسين وثلاث مئة دفع إلى والده اليسع قبل انفصاله عنها ثلاث مئة بدرة، وأخرج من جُملة ما فيها مما حمله صحبته إلى خراسان وصانَعَ ولده عليه ثمان مئة وَقَر من بين جمل وبغل من المال والجوهرِ والعنبر وسائرِ الطيب وما يخفّ محمله من حرّ المتاع وفاخر الآلات النفيسة.","tags":["الجوهر","الطيب","الخيل"],"partial":0,"sp":18,"kind":"prose","spLabel":"وكان أكثر ما أدوا النقر ال… … ولما سلّم أبو علّي محمد بن…"},{"id":"b7-73","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧٣","topic":"الغرائب والذخائر","loc":297,"text":"ووجد في القلعة بعد انفصاله عنها، مما يدلّ على نفيس ما حمله منها، عدّة صناديق مملوءَةٌ ذهباً وفضّة صياغة، وخواتيم قد قلعت فصوصّها. ثم أخرج ثيابه وسائر كسواته فأحرق الجميع بالنار، وكانت له صُفّةٌ مذهبةٌ يجلس فيها فأمر بقلع ذهبها.","tags":["الغرائب"],"partial":0,"sp":19,"kind":"prose","spLabel":"ووجد في القلعة بعد انفصاله… … ولما استَتَرَ الوزيرُ أبو …"},{"id":"b7-74","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧٤","topic":"الغرائب والذخائر","loc":298,"text":"وكان له قدر فأخذه وهدم البناء، وعمد إلى سرير له من عود فاخر مكلّل بالجوهر يجلس عليه فقطع الجوهر منه وأحرقه بالنار وسار معه من مماليكه ثلاث مئة غلام، وثلاثون خادما، ومائتا جارية، هذا سوى ما كان له بالصُغد من روقة الدفائن والأموال.","tags":["الجوهر","الرقيق","الكنوز"],"partial":0,"sp":19,"kind":"prose","spLabel":"ووجد في القلعة بعد انفصاله… … ولما استَتَرَ الوزيرُ أبو …"},{"id":"b7-75","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧٥","topic":"الغرائب والذخائر","loc":299,"text":"وسلم إليه ولده من جيّد دوابه ثلاث مئة رأس. وأقام ببخارى. ومنعه صاحب خراسان من النفوذ إلى بلده، وأَخذ جميع ما كان معه وأقام هناك إلى أن مات في سنة سبع وخمسين وثلاث مئة .","tags":["فارس","الوفاة"],"partial":0,"sp":19,"kind":"prose","spLabel":"ووجد في القلعة بعد انفصاله… … ولما استَتَرَ الوزيرُ أبو …"},{"id":"b7-76","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧٦","topic":"الغرائب والذخائر","loc":300,"text":"ولما استَتَرَ الوزيرُ أبو جعفر محمد بن القاسم لكرخي في خلافة الراضي، وفي يوم الاثنين لثمان خلوْن من شوال من سنة أربع وعشرين وثلاث مئةٍ حُمل من داره ومن خزائنه كلّ ما وُجد له وما كان ادّخره أبوه وأخوه أبو عبد الله، وحمل منها أعدالُ خزّ مُعْلَمَة منذ أربعين سنة، لما فُتحت وجدوا ما فيها قد صار مثل الهباء يتناثر لطول المكث، وآنيةُ ذهب وفضّة، وجوهرٌ وفرش مما لا يُحصى كثرةً وعِظَما، وأخذ من داره فيما أخذ اسطوانة عود جعلت على بغل عظيمة، سوى ما أخذه الغلمان وغيرهم.","tags":["الجوهر"],"partial":0,"sp":19,"kind":"prose","spLabel":"ووجد في القلعة بعد انفصاله… … ولما استَتَرَ الوزيرُ أبو …"},{"id":"b7-77","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧٧","topic":"الغرائب والذخائر","loc":301,"text":"ووجد له صناديق فيها بدرٌ وقطع عنبر كبار. وذهب أكثرُ ماله بين الباب والدار، وافتقر، وكانت الوزارة سبب فقره لحرصه عليها ورغبته فيها. ووكله الله إلى نفسه فعطب باختياره .","tags":["الطيب"],"partial":0,"sp":20,"kind":"prose","spLabel":"ووجد له صناديق فيها بدرٌ و… … قال: وكان قد أمرني بشراء ج…"},{"id":"b7-78","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧٨","topic":"الغرائب والذخائر","loc":302,"text":"وقال أبو محمد عبد الله بن أحمد الفرغاني: لما بويع المّتقي لله بعد وفاة الراضي في سنة تسع وعشرين وثلاث مئة كتب أمير الأمراء أبو الحسين بجكم الماكاني، وهو إذ ذاك بواسط، إلى غلامه تكينك المقيم ببغداد يأمر أن ينحدر إلى دار السلطان ويأخذ منها أشياء كان بعضُها يراه بحضرة مولاه إذا حضر إلى الدار وبعضُها بَلَغَه خبرُه فمن ذلك أنّه أخذ الدّرة اليتيمة ونصابين أحدهما زمرد والآخر ياقوت أصفر، وجوهراً فاخراً كان له. وخواتيم فاخرة مثل المنقار وغيره. ومثل ذي الفَقار سيف رسول الله صلى الله عليه وسلم. ثم التمس ستارة كانت في الدار للغناء رآها بحضرة الراضي وكانت عجيبة المعنى. ثم أشياء من بلَّورٍ فاخر، وغير ذلك من خدم صغار. ثم ورد كتاب على تكينك يقول: قد وجّهت إليك جنيّ الخادم في حرّاقة لأخذ المغنيات اللواتي كنت سمعتهن خلف ستارة الراضي فاعرف أخبارها عنّي وقل لها: قد التمستُ هؤلاء الجواري. فإن كن مماليك أزحتُ العلة في الثمن. وإن كنّ أحراراً وأنقذتِ بهنّ إليّ تزوّجتُ بهنّ وأحسنتُ إليهن .","tags":["الجوهر","السلاح","الرقيق"],"partial":0,"sp":20,"kind":"prose","spLabel":"ووجد له صناديق فيها بدرٌ و… … قال: وكان قد أمرني بشراء ج…"},{"id":"b7-79","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٧٩","topic":"الغرائب والذخائر","loc":303,"text":"قال ذكاءُ: وكان الذي التمسه من الجواري ثلاثاً. إحداهُنّ يقال لها فَرْحةُ بيضاء. والأخرى يقال لها رباب صفراء. والأخرى كانت للسيدة. فلما وافي جنيّ إلى بغداد أنفذه تكينك إلى تربة الراضي. فمضى إلى والدته. فأعاد رسالة بجكم عليها والتمس منها الجواري. فقالت له: أمّا الجاريتان اللتان كانتا له فإني أعتقهما له، وأمّا الأخرى فأنا أهديها له. وسلّمتْهُنّ إليه .","tags":["العراق"],"partial":0,"sp":20,"kind":"prose","spLabel":"ووجد له صناديق فيها بدرٌ و… … قال: وكان قد أمرني بشراء ج…"},{"id":"b7-80","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨٠","topic":"الغرائب والذخائر","loc":304,"text":"قال: وكان قد أمرني بشراء جارية كانت لبنت ابن حمدون النديم، فاشُتريت له بثلاثة آلاف دينار .وأَحْدَرَ الجواري كلّهّن إليه. فلما وصلن إليه أفرد لجواري الراضي داراً ودخل إِليهنّ، وسمع غناءَهنّ، واستحسن فرحةَ البيضاء، وأحضر القاضي وتزوّجها، وبقين في خدمته .","tags":["الرقيق","النساء"],"partial":0,"sp":20,"kind":"prose","spLabel":"ووجد له صناديق فيها بدرٌ و… … قال: وكان قد أمرني بشراء ج…"},{"id":"b7-81","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨١","topic":"الغرائب والذخائر","loc":305,"text":"ووجد في دار نحرير الأَرغلي أحد الإخشيديّة بمصر مصطبة فيها سبع مئة نرجسّية فضّة .وكان لمحمود بن سبكتكين صاحب خراسان كنصاب المرأة من الياقوت الأحمر إذا ركب قبض عليه بيمينه وفاضله خارج من أعلى راحته. وأسفلها بقدر أصابع ينظره الناس، وكان لا قيمة له نفاسةً وغرابةً .","tags":["الجوهر","الغرائب"],"partial":0,"sp":21,"kind":"prose","spLabel":"ووجد في دار نحرير الأَرغلي… … وكان قد ورد مع غرس الدولة …"},{"id":"b7-82","bab":7,"sec":"باب الغرائب الموجودات والذخائر المصونات","page":"ج٧ ص٨٢","topic":"الغرائب والذخائر","loc":306,"text":"و
