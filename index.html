مملوءة من سائر أنواع الصواني المدهونة المذهبة التي سَعَة كلّ واحدة من العشرة أشبار إلى ما دونها التي قد جعل في كل واحدة ما دونها في السعة إلى ما سعته دون الدرهم، ومن سائر أنواع الصواني والأطباق الخلنج في هذه السعة وفوق ذلك ودونه، قد حُشيَتْ بطونها بما دونها في السعة إلى ما سعته دون الدينار. ومن الموائد الخشب القوائميّة الكبار والصغار ألوف .","tags":["النار"],"partial":0,"sp":4,"kind":"prose","spLabel":"ووجد صناديق مملوءة أقلاماً… … ووجد خزائف مملوءة من سائر …"},{"id":"b10-17","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١٧","topic":"النفقات","loc":443,"text":"ووجد متارب مملوءة متارب ذهب وفضّة محرقة بالسواد، صغارٌ وكبارٌ بأحسن ما يكون من الصنعة .ووجد في بعض الخزائن حصير ذهبٍ وزنها ثمانية عشر رطلاً، وذكر أنها الحصير التي جليت عليها بوران بنت الحسن بن سهل على المأمون في سنة عشر ومائتين .","tags":[],"partial":0,"sp":5,"kind":"prose","spLabel":"ووجد متارب مملوءة متارب ذه… … ووجد في خزائن السروج خمسة …"},{"id":"b10-18","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١٨","topic":"النفقات","loc":444,"text":"ووجد في خزائن الفضّة ما لا يحدُّ كثرة مما يقارب ألف ألف درهم وأكثر من الآلات المصوغة من الفضّة المجري جميعها بالذهب من سائر ما يستعمل كثيرة وقليله، التي يكون في القطعة منها خمسة آلاف درهم وفوقها ودونها، الغريبة النقش والصنعة، من سائر الأصناف التي تساوي خمسة دراهم بدينار. وأن جميعه بيع عشرين درهماً بدينار، خارجاً عما أخذ مثل ذلك وأضعافه .","tags":["الغرائب"],"partial":0,"sp":5,"kind":"prose","spLabel":"ووجد متارب مملوءة متارب ذه… … ووجد في خزائن السروج خمسة …"},{"id":"b10-19","bab":10,"sec":"باب النفقات","page":"ج١٠ ص١٩","topic":"النفقات","loc":445,"text":"ووجد من الشطرنج والنرد المعمولة من سائر أنواع الجواهر والحجارة والذهب والفضّة والعاج والأبنوس برقاع الحرير الخسرواني والدبيقي الطميم المذّهب وغيره المعمول على مثال بيوت الشطرنج والنرد ، ومن فصوص النرد المخطوطة من سائر أنواع الجوهر والحجارة والذهب والفضة وغير ذلك من العاج وما سواه ما لا يُحدّ كثرة ونفاسة .","tags":["الجوهر"],"partial":0,"sp":5,"kind":"prose","spLabel":"ووجد متارب مملوءة متارب ذه… … ووجد في خزائن السروج خمسة …"},{"id":"b10-20","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢٠","topic":"النفقات","loc":446,"text":"ووجد في خزائن السروج خمسة آلاف سرجٍ كان أبو سعد إبراهيم بن سهل التستري دخره له فيها، وتقدم بحفظها، وولي شراءها وصياغتها وترصيعها، كلّ سرج منها يساوي من سبعة آلاف دينار إلى ألف، وما بين الجملتين، على أنّ الدون منها قليل، والأكثر الغالي القيمة، وأنه سبك جميعها وفرّقه في الأتراك، وأنه أخذ من خزائن السيدة والدته أربعة آلاف سرج مثلها ودونها .","tags":["الخيل","الذخائر"],"partial":0,"sp":5,"kind":"prose","spLabel":"ووجد متارب مملوءة متارب ذه… … ووجد في خزائن السروج خمسة …"},{"id":"b10-21","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢١","topic":"النفقات","loc":447,"text":"ووجد من آلات الذهب والفضّة عدّةٌ كثيرة من صواني الذهب المجري بالمينا وغيره، المنقوشة بغرائب النقوش والصنعة، ملئت جميعها جوهراً فاخراً من سائر أنواعه وألوانه وبديعه، وأربعة آلاف نرجسيّة فضة محرقة بالذهب، وألف بنفسجية كذلك، سوى باقي الآلات المحتاج إليها .","tags":["الجوهر"],"partial":0,"sp":6,"kind":"prose","spLabel":"ووجد من آلات الذهب والفضّة… … فأما ما وهبه المستنصر فإنّ…"},{"id":"b10-22","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢٢","topic":"النفقات","loc":448,"text":"ووجد في خزائن الطرائف والفضة ستة وثلاثون ألف قطعة من محكم وبلّور مجرود من سائر أنواعه .ووجد من تماثيل العنبر اثنان وعشرون ألف قطعة، كلّ تمثال منها وزنه اثنا عشر منا. وأكبره ما جاوز ذلك، وإلى ما فوق ذلك ودونه .","tags":["الطيب","الذخائر"],"partial":0,"sp":6,"kind":"prose","spLabel":"ووجد من آلات الذهب والفضّة… … فأما ما وهبه المستنصر فإنّ…"},{"id":"b10-23","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢٣","topic":"النفقات","loc":449,"text":"ووجد من تماثيل الكافور ما لا يُحدّ كثرة، وإن من جملتها ثمان مئة بطيخة كافور وغيرها .ووجد في خزانة الفرش أربعة آلاف رزمة خسروانيّ مذهبٍ، في كلّ رزمة فرش مجلس بُبُسطِه وتعاليقه وسائر آلاته، منسوجة باقية على حالها لم تُمَسّ .","tags":["الطيب","المجالس"],"partial":0,"sp":6,"kind":"prose","spLabel":"ووجد من آلات الذهب والفضّة… … فأما ما وهبه المستنصر فإنّ…"},{"id":"b10-24","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢٤","topic":"النفقات","loc":450,"text":"فأما ما وهبه المستنصر فإنّه وهب في سنة إحدى وستين وأربع مئة لفخر العرب وتاج الملوك الكّلوتة المرصّعة بالجوهر، وكانت من غريب ما في القصر ونفيسه، وذكر أن قيمتها ثلاثون ومائة ألف دينار وكان وزن ما فيها من الجوهر سبعة عشر رطلاً .","tags":[],"partial":0,"sp":6,"kind":"prose","spLabel":"ووجد من آلات الذهب والفضّة… … فأما ما وهبه المستنصر فإنّ…"},{"id":"b10-25","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢٥","topic":"النفقات","loc":451,"text":"ووجد قطعة بلخش وزنها ثلاثة وعشرون مثقالاً، وحبات درًّ وزن كلّ حبّةٍ ثلاثة مثاقيل، وكان عدّتُها نحواً من مئة حبّة .ووجد في خزائن الطيب خمسة صواري عود هندي، طول كلّ واحد منها من تسعة أذرع إلى عشرة، وكافور فنصوري وزن كلّ حبّة منها خمسة مثاقيل إلى ما دونها لم يُر مثله، وقطع عنبر تزن القطعة ثلاثة آلاف مثقال وحواليها .","tags":["الجوهر","الطيب","الذخائر"],"partial":0,"sp":7,"kind":"prose","spLabel":"ووجد قطعة بلخش وزنها ثلاثة… … ووجد طاووس ذهب مرصّع بنفيس…"},{"id":"b10-26","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢٦","topic":"النفقات","loc":452,"text":"ووجد عدّة قطع يشب، وبازهر، من جملتها جامٌ سعته ثلاثة أشبار ونصف، وعمقه شبرٌ واحد .ووجد قطعة من منديل زغب ريش سمندل، وهو طائر معروف، ينسج من زغب ريشه مناديل للفم لا تحترق بالنار، طولها تسعة أشبار.","tags":["الجوهر","النار"],"partial":0,"sp":7,"kind":"prose","spLabel":"ووجد قطعة بلخش وزنها ثلاثة… … ووجد طاووس ذهب مرصّع بنفيس…"},{"id":"b10-27","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢٧","topic":"النفقات","loc":453,"text":"وكانت من جملة ما بيع من ذخائر القصر. اشتراها بعض التجار المسافرين بثمن يسير، فطلبت فلم يقدر عليها بوجه ولا سبب .وصار إلى ناصر الدولة قاطرميز بلّور، وفيه صورٌ نابتةٌ عن جسمه. يسع من الشراب سبعة عشر رطلاً، ودكوجة بلّور مجرود تَسَعُ عشرين رطلاً ، وقيصريّة يشب كبيرة جداً، وعدة كاسات يصب .","tags":["الذخائر","الروم"],"partial":0,"sp":7,"kind":"prose","spLabel":"ووجد قطعة بلخش وزنها ثلاثة… … ووجد طاووس ذهب مرصّع بنفيس…"},{"id":"b10-28","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢٨","topic":"النفقات","loc":454,"text":"ووجد طاووس ذهب مرصّع بنفيس الجوهر، عيناه من ياقوت أحمر، وريشه من الزجاج المينا المجري بالذهب على ألوان ريش الطاووس. وديكٌ من الذهب على مثل صفته أيضاً له عرف مفترق كأكبر ما يكون من أعراف الديوك، مرصّعٌ بسائر ألوان الدرّ والجوهر، وعيناته من الياقوت الأحمر.","tags":["الجوهر","الغرائب"],"partial":0,"sp":7,"kind":"prose","spLabel":"ووجد قطعة بلخش وزنها ثلاثة… … ووجد طاووس ذهب مرصّع بنفيس…"},{"id":"b10-29","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٢٩","topic":"النفقات","loc":455,"text":"وغزالٌ على مثل صفتهما في مثل لون الغزال وهيئته، مرصّع أيضاً بنفس الدرّ والجوهر، وقيل لي إن بطنه أبيض دون سائر جسده على لون بطون الغزلان، منظوم من درّ رائع .","tags":["الجوهر","السفر"],"partial":0,"sp":8,"kind":"prose","spLabel":"وغزالٌ على مثل صفتهما في م… … ووجد سرير الملك وفيه من ال…"},{"id":"b10-30","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٣٠","topic":"النفقات","loc":456,"text":"ووجد مجمع سكارج مخروط من قطعة بلّور بغطائه، وفيه سكارج بلور تخرج منه وتعود إليه. فتحه أربعة أشبار في مثلها، مليح الصنعة في غلاف خيزران مذهب. فامتنع من أخذه فخر العرب احتقاراً له .","tags":[],"partial":0,"sp":8,"kind":"prose","spLabel":"وغزالٌ على مثل صفتهما في م… … ووجد سرير الملك وفيه من ال…"},{"id":"b10-31","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٣١","topic":"النفقات","loc":457,"text":"ووجد بطيخة كافور في شباك ذهب مرصّعة. وزنها خالصة سبعون منّاً، وقطعة عنبر تسمي الخسروف وزنها خالصة سوى ما يمسكها من الذهب ثمانون منّاً .وحدّث فخر العرب أن الأتراك طلبوا نفقة فماطلهم، فهجموا على تربة أجداده فأخذوا ممّا فيها من قناديل، ومداخن، ومجامر ، وحلى المحاريب، وغير ذلك خمسين ألف دينار .وصار إلى تاج الملوك مائدة يصب كبيرة واسعة قوائمها منها. وبيضةٌ كبيرة بلخش وزنها سبعة وعشرون مثقالاً، أشدّ جوهراً وصفاءً من الياقوت الأحمر. ومائدة جزع يقعد عليها جماعة قوائمها مخروطة منها، لا قدر لها ولا قيمة عظماً .وصار إلى ناظر الجيوش منه ما قيمته ألف ألف دينار. منها نخلة ذهب مكلّلة بالجوهر، وبديع الدّر، في إجّانة من ذهب بجميع الطلع والبلح وسائر ألوان البسر، والرطب، بشكله ولونه على صفته وهيئته ومثاله من ألوان الجوهر لا قيمة لها .وصار إليه على صفة كيزان الزير المعمولة من النحاس بلّورٌ مجرودٌ مقبضه مستخرجٌ منه، يحمل عشرة أرطال من الماء بالمصري، وستوره مكلّلة جميعها بحبّ لؤلؤ نفيس أسفلها ما وزن الحبّة منه مثقال وأعلاها ما وزنه مثقالان سوى الياقوت .","tags":["الجوهر"],"partial":0,"sp":8,"kind":"prose","spLabel":"وغزالٌ على مثل صفتهما في م… … ووجد سرير الملك وفيه من ال…"},{"id":"b10-32","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٣٢","topic":"النفقات","loc":458,"text":"ووجد سرير الملك وفيه من الذهب الإبريز الخالص مئة ألف مثقال وعشرة آلاف مثقال، وأنه رصع بألف وخمس مئة وستين قطعة جوهر من سائر ألوانه .","tags":["الجوهر"],"partial":0,"sp":8,"kind":"prose","spLabel":"وغزالٌ على مثل صفتهما في م… … ووجد سرير الملك وفيه من ال…"},{"id":"b10-33","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٣٣","topic":"النفقات","loc":459,"text":"ووجد مدهن ياقوت أحمر وزنه سبعةٌ وثلاثون درهماً ونصف درهم . وقيل إن هذا المدهن سرقه اليازوري من موجود السيّدة العمدة عبدة بنت المعزّ .","tags":["الجوهر","الرقيق"],"partial":0,"sp":9,"kind":"prose","spLabel":"ووجد مدهن ياقوت أحمر وزنه … … وكان في جملته سيفُ جده الق…"},{"id":"b10-34","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٣٤","topic":"النفقات","loc":460,"text":"ووجد قطع ياقوت أزرق زنة القطعة سبعون درهماً، ومن الزمرد ما وزنه ثمانون درهماً كلّ قطعة .وأنّ عدّة خزائن الكتب أربعون خزانة من جملتها ثمانية عشر ألف كتاب في العلوم القديمة، وأنّ الموجود فيها من جملة الكتب ألفان وأربع مئة ختمه قرآن في ربعاتٍ بخطوط منسوبة زائدة الحسن، محلاّة بذهب وفضّة وغيرهما. هذا سوى ما كان في خزائن دار العلم بالقاهرة .وحدّثني خطير الملك وأمينه ذو الرئاستين محمّد ابن سيد الوزراء اليازوري أنّه أخرج من بعض خزائن القصر في جملة ما أخرج بيضة كبيرة كأكبر ما يكون من بيض النعام محلاة بذهب، وأن المستنصر بالله أخذها وقال للحاضرين: هذه بيضة نعامة ولا قدر لها، فتغافل من حضر من الأتراك عنها وأخذوا النفائس من الذخائر وانصرفوا، فلم يهتم بشيء مما أخذوه.","tags":[],"partial":0,"sp":9,"kind":"prose","spLabel":"ووجد مدهن ياقوت أحمر وزنه … … وكان في جملته سيفُ جده الق…"},{"id":"b10-35","bab":10,"sec":"باب النفقات","page":"ج١٠ ص٣٥","topic":"النفقات","loc":461,"text":"وكان في جملته سيفُ جده القائم وغيره. فقال له بعض الخدم: يا أمير المؤمنين. لم تهتم بما أخذوا من نفيس الذخائر وعمدت إلى بيضة نعامة فأخذتها، فقال: يا جاهل ما هي بيضة نعامة ولكن هي بيضة حّية، كان بعض الملوك أهداها إلى جدي القائم بأمر الله، وكان محتفظاً بها في خزائنه، ثم انتقلت إلينا واحداً واحداً. وهذه الرقعة بخط القائم بأمر الله باسم مهديها، والسنة التي أهديت فيها .هذا آخر ما اخترناه مما وجد من كتاب الهدايا والتحف .","tags":[],"partial":0,"sp":9,"kind":"prose","spLabel":"ووجد مدهن ياقوت أحمر وزنه … … وكان في جملته سيفُ جده الق…"},{"id":"b11-1","bab":11,"sec":"الفهرس","page":"ج١١ ص١","topic":"الفهرس","loc":462,"text":"1 - الغلاف\n2 - الذخائر والتحف\n3 - باب الهدايا\n4 - باب النفقات في الولائم المشهورة\n5 - باب الأعذارات الموصوفة والحذاقات المعروفة\n6 - باب الأيام المشهودة والاجتماعات\n7 - باب الغرائب الموجودات والذخائر المصونات\n8 - باب المغانم في الفتوحات\n9 - باب ذكر الكنوز والدفائن والمطالب القديمة\n10 - باب النفقات\n11 - الفهرس","tags":["الولائم","الأعذارات"],"partial":0,"sp":1,"kind":"index","spLabel":"1 - الغلاف 2 - الذخائر وال… … 1 - الغلاف 2 - الذخائر وال…"});</script>
<script>
/* الذخائر والتحف — Kashkol app (no dependencies) */
const BOOK = window.__BOOK__ || [];
const TAGS = window.__TAGS__ || {};
const APP_ID = 'al-dhakhair-wal-tuhaf';
const STORE_KEY = APP_ID + '-v1';
const TOKEN_KEY = APP_ID + '-token';
const BOOK_TITLE = 'الذخائر والتحف';
const EDITION = 'v1';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const normalizeAr = s => String(s||'').replace(/[\u064B-\u0652\u0640]/g, '');
const arNum = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
let toastT = null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }

window.addEventListener('error', e => { const el=$('#err'); if(el){ el.style.display='block'; el.textContent='تعذر عرض جزء من الصفحة: '+(e.message||'خطأ غير متوقع'); } });

/* ---------- state ---------- */
const DATA_KEYS = ['fav','favV','mem','memV','highs','edits','benefits','bm','history','readCards','pathsDone'];
function defaultState(){ return {
  fav:{}, favV:{}, mem:{}, memV:{}, highs:{}, edits:{}, benefits:{},
  bm:null, history:[], readCards:{}, pathsDone:{},
  page:'', font:'Readex Pro', size:19, hl:'#fde68a', focus:false, hideAjz:false,
  tagFilter:[]
}; }
let state = defaultState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s.notes && !s.benefits){ s.benefits=s.notes; delete s.notes; }
    Object.keys(defaultState()).forEach(k=>{ if(s[k]!==undefined) state[k]=s[k]; });
  }catch(e){ console.warn('load state',e); }
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ toast('تعذر حفظ الحالة في المتصفح'); } }
function mergeUserData(remote){
  DATA_KEYS.forEach(k=>{
    if(!remote[k]) return;
    if(['fav','favV','mem','memV','highs','edits','benefits','readCards','pathsDone'].includes(k)) state[k]=Object.assign({},remote[k],state[k]);
    else if(k==='history'){ const seen=new Set(); state.history=[...(remote[k]||[]),...(state.history||[])].filter(x=>{const q=x.page||x.loc; if(seen.has(q))return false; seen.add(q); return true;}).slice(-5); }
    else if(state[k]==null) state[k]=remote[k];
  });
  if(remote.notes && !remote.benefits) state.benefits=Object.assign({},remote.notes,state.benefits);
}
loadState();

/* ---------- pages ---------- */
let pages=[], pageMap=new Map(), byId=new Map();
BOOK.forEach(c=>byId.set(c.id,c));
function pageKey(t,s,sp){ return t+'|'+s+'|'+sp; }
function keyOf(c){ return pageKey(c.topic,c.sec,c.sp); }
function buildPages(){
  const m=new Map();
  BOOK.forEach(c=>{ const k=keyOf(c); if(!m.has(k)) m.set(k,{key:k,topic:c.topic,sec:c.sec,sp:c.sp,label:c.spLabel||'',cards:[]}); m.get(k).cards.push(c); });
  pages=Array.from(m.values()); pages.forEach((p,i)=>p.idx=i);
  pageMap=new Map(pages.map(p=>[p.key,p]));
}
buildPages();
if(!pageMap.has(state.page)) state.page = pages.length ? pages[0].key : '';
const PATHS = [
  {tag:'الطيب', title:'هدايا الطيب والعود', why:'من مشاهير الهدايا في الكتاب: المسك والعنبر والكافور وعود الهند.'},
  {tag:'الجوهر', title:'الجوهر والياقوت والزمرد', why:'أكثر ما تتكرر في الكتاب ذخائرُ الجوهر وأصنافُ الحليّ النفيسة.'},
  {tag:'الولائم', title:'ولائم الخلفاء ودعواتهم', why:'باب الولائم يعرض مظاهر البذخ في الدعوات والإملاك.'},
  {tag:'الذخائر', title:'خزائن الذخائر المصونة', why:'باب الغرائب يجمع ما حفظته الخزائن من عجائب الصنع.'},
  {tag:'المغانم', title:'غنائم الفتوحات', why:'باب المغانم يرصد ما أصابه المسلمون في الفتوحات'},
  {tag:'الكنوز', title:'الكنوز والدفائن', why:'باب الكنوز يروي ما وُجد من دفائن الأمم السابقة.'}
];
PATHS.forEach(p=>{ p.cards=BOOK.filter(c=>c.tags&&c.tags.includes(p.tag)).slice(0,5); });

/* ---------- helpers ---------- */
function getText(c){ return (state.edits[c.id]!==undefined ? state.edits[c.id] : c.text)||''; }
function parseVerse(line){
  const m = String(line).match(/^\((.*?)\s*\.{3,}\s*(.*)\)$/);
  return m ? {sadr:m[1],ajz:m[2]} : null;
}
function markHighs(raw,c){
  let out=esc(raw); const hs=(state.highs[c.id]||[]);
  hs.forEach((h,i)=>{
    const t=esc(h.text||''); if(t.length<2) return;
    out=out.split(t).join('<mark class="hl'+(h.note?' hl-has-note':'')+'" data-h="'+i+'" style="background:'+esc(h.color||'var(--hl-color)')+'">'+t+'</mark>');
  });
  return out;
}
function firstLine(c){ const l=getText(c).split('\n').find(x=>x.trim()); return l?l.trim():'(بدون نص)'; }
function teaser(c){ const l=firstLine(c); const v=parseVerse(l); return v?v.sadr:l; }
function applyFont(){
  document.documentElement.style.setProperty('--font-family',"'"+state.font.replace(/'/g,'')+"',sans-serif");
  document.documentElement.style.setProperty('--font-size',state.size+'px');
  document.documentElement.style.setProperty('--hl-color',state.hl||'#fde68a');

}
applyFont();
function statVals(){
  const pagesRead=new Set();
  Object.keys(state.readCards).forEach(id=>{ const c=byId.get(id); if(c) pagesRead.add(keyOf(c)); });
  let highs=0; Object.values(state.highs).forEach(a=>highs+=(a||[]).length);
  const pathsDone=PATHS.filter(p=>p.cards.length&&p.cards.every(c=>state.readCards[c.id])).length;
  return {pages:pagesRead.size,mem:Object.values(state.mem).filter(v=>v===2).length,fav:Object.keys(state.fav).filter(k=>state.fav[k]).length,
    benefits:Object.values(state.benefits).filter(v=>String(v||'').trim()).length, pathsDone, paths:PATHS.length, highs};
}
function statsHTML(){ const s=statVals();
  return '<span>صفحات مقروءة: '+arNum(s.pages)+'</span><span>محفوظ: '+arNum(s.mem)+'</span><span>مختارات: '+arNum(s.fav)+'</span><span>فوائد: '+arNum(s.benefits)+'</span><span>مسارات: '+arNum(s.pathsDone)+'/'+arNum(s.paths)+'</span><span>تظليلات: '+arNum(s.highs)+'</span>';
}
function fallbackCard(c){ return '<div class="card"><div class="chead"><span class="sec">'+esc(c.sec)+'</span><button class="locbadge">📍 الموقع '+arNum(c.loc)+'</button></div><p class="card-text">'+esc(getText(c))+'</p></div>'; }

function firstVisibleSid(){

function markPosition(sid){

function renderHistory(){

function renderBanner(p){

  strip.innerHTML=topics.map(t=>'<button class="pill'+(t.name===p.topic?' on':'')+'" data-topic="'+esc(t.name)+'">'+esc(t.name)+' <small>('+arNum(t.count)+')</small></button>').join('');

function cardActions(c){

  const memLabel=['للحفظ؟','أحفظه','حفظته ✓'][mem]||'للحفظ؟';

function benefitBox(c){

function nearCards(c){

  if(!pool.length) return '';
  return '<div class="near">بطاقات قريبة:'+pool.map(x=>'<a href="#" data-act="jump" data-id="'+x.id+'">'+arNum(x.loc)+' — '+esc(teaser(x).slice(0,42))+'…</a>').join('')+'</div>';

function renderCard(c){
  try{
    const text=getText(c), lines=text.split('\n');
    let html='', verses=[], prose=[];
    const flushV=()=>{ if(verses.length){ html+='<div class="verse-frame">'+verses.map(v=>'<div class="verse-row"><div class="verse-sadr">'+markHighs(v.sadr,c)+'</div><div class="verse-ajz">'+markHighs(v.ajz,c)+'</div></div>').join('')+'</div>'; verses=[]; } };
    const flushP=()=>{ if(prose.length){ html+='<p>'+prose.map(l=>markHighs(l,c)).join('<br>')+'</p>'; prose=[]; } };
    lines.forEach(line=>{ const v=parseVerse(line); if(v){ flushP(); verses.push(v); } else { flushV(); prose.push(line); } });
    flushV(); flushP();
    let body=html;
    if(c.bab===11){
      body='<div class="index-list">'+lines.filter(l=>/^\d+\s*-/.test(l)).map(l=>{const m=l.match(/^(\d+)\s*-\s*(.+)$/);return '<button data-act="index" data-bab="'+m[1]+'">'+esc(l)+'</button>';}).join('')+'</div>';
    }
    const ben=String(state.benefits[c.id]||'').trim();
    return '<article class="card" id="card-'+c.id+'" data-cid="'+c.id+'">'+
      '<div class="chead"><span class="sec">'+esc(c.sec)+(state.edits[c.id]!==undefined?' <span class="badge badge-edited">معدَّل</span>':'')+'</span>'+
      '<button class="locbadge" data-act="loc" data-id="'+c.id+'">📍 الموقع '+arNum(c.loc)+'</button></div>'+
      '<div class="card-text">'+body+'</div>'+
      (ben?'<div class="benefit-strip">'+esc(ben)+'</div>':'')+
      cardActions(c)+benefitBox(c)+editBox(c)+
      (state.focus?'':nearCards(c))+
      '</article>';
  }catch(e){
    console.error('renderCard',c.id,e);
    return fallbackCard(c);
  }
}
function renderRead(){
  const p=pageMap.get(state.page)||pages[0]; if(!p) return;
  state.page=p.key; renderBanner(p);
  $('#readCards').innerHTML=p.cards.map(renderCard).join('');
  p.cards.forEach(c=>state.readCards[c.id]=1); saveState();

}
function gotoPage(key,sid){
  if(!pageMap.has(key)) return;
  if(sid && keyOf(byId.get(sid))!==key) key=keyOf(byId.get(sid));
  state.page=key; saveState();
  setTab('read'); renderRead();
  markPosition(sid||null);
  if(sid){
    requestAnimationFrame(()=>{ const el=document.getElementById('card-'+sid); if(el) el.scrollIntoView({behavior:'instant',block:'start'}); });
  } else window.scrollTo({top:0,behavior:'instant'});
}
function stepPage(dir){
  const p=pageMap.get(state.page); const i=p?p.idx+dir:0;
  if(i<0||i>=pages.length){ toast(dir<0?'هذه أول صفحة':'هذه آخر صفحة'); return; }
  gotoPage(pages[i].key);
}
function goSearch(){
  readReturn={page:state.page,sid:firstVisibleSid(),scrollY:window.scrollY,loc:pageMap.get(state.page)?.cards[0]?.loc||0};
  setTab('search'); $('#searchReturn').innerHTML='<div class="ctrl"><button class="btn-soft" id="searchBack">← العودة إلى القراءة</button></div>';
  $('#searchBack').onclick=restoreRead; renderSearch();
}
function restoreRead(){
  setTab('read');
  if(readReturn){ state.page=readReturn.page; saveState(); renderRead(); const y=readReturn.scrollY;
    setTimeout(()=>{ window.scrollTo({top:y,behavior:'instant'}); requestAnimationFrame(()=>{ if(Math.abs(window.scrollY-y)>2) window.scrollTo({top:y,behavior:'instant'}); }); },60);
  }
  $('#returnBar').innerHTML='<div class="ctrl" style="margin-bottom:2px"><button class="btn-soft" id="backToRead">← رجوع إلى موضع القراءة</button></div>';

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast('نُسخ النص')).catch(()=>fallbackCopy(t)); } else fallbackCopy(t);
}
function fallbackCopy(t){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy');toast('نُسخ النص');}catch(e){toast('تعذر النسخ');} a.remove(); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==='jump'){ e.preventDefault(); const c=byId.get(id); if(c) gotoPage(keyOf(c),id); return; }
  if(act==='index'){ const n=parseInt(b.dataset.bab,10); const c=BOOK.find(x=>x.id.startsWith('b'+n+'-')); if(c) gotoPage(keyOf(c),c.id); else toast('لا توجد بطاقة في هذا الباب'); return; }
  if(act==='loc'){ const c=byId.get(id); if(c) openLocAt(c.loc); return; }
  if(act==='full'){ const c=byId.get(id); if(c){ readReturn=null; gotoPage(keyOf(c),id); const v=byId.get(id); setTimeout(()=>{const el=document.getElementById('card-'+id); if(el){el.style.outline='2px solid var(--accent)'; setTimeout(()=>el.style.outline='',1400);}},120);} return; }
  const c=byId.get(id); if(!c) return;
  if(act==='fav'){ state.fav[id]=!state.fav[id]; saveState(); renderRead(); }
  else if(act==='favV'){ state.favV[id]=!state.favV[id]; saveState(); renderRead(); }
  else if(act==='mem'){ state.mem[id]=((state.mem[id]||0)+1)%3; if(state.mem[id]===0)delete state.mem[id]; saveState(); renderRead(); }
  else if(act==='copy'){ copyText(getText(c)); }
  else if(act==='benefit'){ const box=document.getElementById('ben-'+id); if(box) box.hidden=!box.hidden; }
  else if(act==='benSave'){ saveState(); toast('حُفظت الفائدة'); }
  else if(act==='edit'){ const box=document.getElementById('edit-'+id); if(box) box.hidden=!box.hidden; }
  else if(act==='editSave'){ const ta=document.querySelector('[data-edit="'+id+'"]'); if(ta){ if(ta.value.trim()===c.text.trim()) delete state.edits[id]; else state.edits[id]=ta.value; saveState(); renderRead(); toast('حُفظ التصحيح'); } }
  else if(act==='editCancel'){ const box=document.getElementById('edit-'+id); if(box) box.hidden=true; }
  else if(act==='editReset'){ delete state.edits[id]; saveState(); renderRead(); toast('استرجع النص الأصلي'); }
});

let pendingRange=null, pendingCid=null;
document.addEventListener('selectionchange',()=>{
  const s=window.getSelection();
  if(!s||s.isCollapsed||!s.rangeCount){ $('#hlFloat').classList.remove('on'); return; }
  const node=s.anchorNode&&s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode?.parentElement;

$('#hlFloat').onclick=()=>{
  const s=window.getSelection(); const text=s?s.toString().trim():'';
  if(!text||!pendingCid){ $('#hlFloat').classList.remove('on'); return; }
  const cid=pendingCid; $('#hlFloat').classList.remove('on'); s.removeAllRanges();
  openHighlight(cid,text,-1);
};
function openHighlight(cid,text,idx){
  const hs=state.highs[cid]||[]; const h=idx>=0?hs[idx]:{text:text,note:'',color:state.hl};
  const colors=['#fde68a','#fbcfe8','#bbf7d0','#bfdbfe','#e9d5ff'];
  const body='<div class="quote">'+esc(h.text)+'</div>'+
    '<label style="font-size:12px;color:var(--muted)">ملاحظة على التظليل</label><textarea id="hlNote" style="width:100%;min-height:80px;border:1px solid var(--border);border-radius:8px;padding:8px;background:#fff">'+esc(h.note||'')+'</textarea>'+
    '<div class="row">'+colors.map(c=>'<button class="sw '+((h.color||state.hl)===c?'on':'')+'" data-hlcolor="'+c+'" style="background:'+c+'"></button>').join('')+'</div>'+
    (idx>=0?'<button class="btn-soft" id="hlDel">حذف التظليل</button>':'');
  showModal('✎ تظليل المحدد',body,()=>{
    const obj={text:h.text,note:$('#hlNote').value,color:(window.__hlPick||h.color||state.hl)};
    if(idx>=0) hs[idx]=obj; else hs.push(obj);

  },()=>{window.__hlPick=null;});
  $$('[data-hlcolor]').forEach(b=>b.onclick=()=>{ window.__hlPick=b.dataset.hlcolor; $$('[data-hlcolor]').forEach(x=>x.classList.toggle('on',x===b)); });
  const del=$('#hlDel'); if(del) del.onclick=()=>{ hs.splice(idx,1); state.highs[cid]=hs; saveState(); $('#modal').classList.remove('on'); renderRead(); toast('حُذف التظليل'); };
}

/* ---------- daily & paths ---------- */
function seedRand(){ let seed=0; const d=new Date(); const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); for(let i=0;i<key.length;i++)seed=(seed*31+key.charCodeAt(i))>>>0; return ()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }; }
function renderDaily(){
  const rnd=seedRand();
  let pool=BOOK.filter(c=>getText(c).split('\n').some(l=>parseVerse(l))&&(state.fav[c.id]||state.mem[c.id]));
  if(pool.length<3) pool=BOOK.filter(c=>getText(c).split('\n').some(l=>parseVerse(l)));
  const picks=[]; const cp=pool.slice();
  while(picks.length<Math.min(3,cp.length)){ picks.push(cp.splice(Math.floor(rnd()*cp.length),1)[0]); }
  let html='<div class="row"><button class="btn-soft" id="hideAjz">'+(state.hideAjz?'👁️ إظهار العجز':'🙈 إخفاء العجز للاستظهار')+'</button></div>';
  picks.forEach(c=>{
    const vs=getText(c).split('\n').map(parseVerse).filter(Boolean);
    html+='<div class="card"><div class="chead"><span class="sec">'+esc(c.sec)+'</span><button class="locbadge">📍 '+arNum(c.loc)+'</button></div><div class="verse-frame">'+
      vs.slice(0,3).map(v=>'<div class="verse-row"><div class="verse-sadr">'+esc(v.sadr)+'</div><div class="verse-ajz"'+(state.hideAjz?' style="filter:blur(5px);cursor:pointer"':'')+'>'+esc(v.ajz)+'</div></div>').join('')+
      '</div><div class="acts"><a href="#" data-act="jump" data-id="'+c.id+'">اقرأ في موضعها ←</a></div></div>';
  });
  $('#daily').innerHTML=html;
  $('#hideAjz').onclick=()=>{ state.hideAjz=!state.hideAjz; saveState(); renderDaily(); };
  $$('#daily .verse-ajz').forEach(el=>el.onclick=()=>{ el.style.filter='none'; });
  const sv=statVals();
  $('#paths').innerHTML=(sv.pathsDone>=PATHS.length&&!state.pathsShowDone?'<div class="row"><button class="btn-soft" id="showDonePaths">إظهار المسارات المكتملة</button></div>':'')+PATHS.filter(p=>p.cards.length&&(!p.done||state.pathsShowDone)).map(p=>{
    const done=p.cards.filter(c=>state.readCards[c.id]).length;
    p.done=done===p.cards.length;
    if(p.done&&!state.pathsShowDone) return '';
    return '<div class="path"><h4>'+esc(p.title)+'</h4><p>'+esc(p.why)+'</p><div class="teaser">'+p.cards.slice(0,2).map(c=>esc(teaser(c))).join('<br>')+'</div>'+
      '<div class="progress"><i style="width:'+Math.round(100*done/p.cards.length)+'%"></i></div>'+

function renderSearch(){
  const q=normalizeAr($('#q').value).trim();

  $('#tagChips').innerHTML=top.map(t=>'<button class="tag '+(tags.includes(t)?'on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+' ('+arNum(TAGS[t])+')</button>').join('');
  const authors=Object.keys(TAGS).filter(t=>/الرشيد|المأمون|المتوكل|المعتصم|الأغالبة|البرامكة|بني أمية|بني العباس|الخلفاء|الملوك|النساء/.test(t));
  $('#authorIdx').innerHTML=authors.map(t=>'<button class="tag '+(tags.includes(t)?'on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+' ('+arNum(TAGS[t])+')</button>').join('');
  const out=[];
  for(const c of BOOK){
    if(tags.length && !(c.tags||[]).some(t=>tags.includes(t))) continue;

    if(q && normalizeAr(text).indexOf(q)<0) continue;

      esc(firstLine(c).slice(0,260))+(firstLine(c).length>260?'…':'')+
      (ben?'<div class="benefit-strip">'+esc(ben.slice(0,200))+'</div>':'')+
      ((c.tags||[]).length?'<div class="tags">'+c.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'')+'</div>');
    if(out.length>=120) break;
  }
  $('#results').innerHTML='<div class="section-title">النتائج <small>'+arNum(out.length)+' (بحد أقصى 120)</small></div>'+(out.join('')||'<p style="font-size:13px;color:var(--muted)">لا نتائج مطابقة.</p>');
}

/* ---------- exports ---------- */
function stamp(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function download(name,content,type){
  const blob=(content instanceof Blob)?content:new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function envelope(){ return {app:'arabic-kashkol',bookId:APP_ID,bookTitle:BOOK_TITLE,edition:EDITION,exportedAt:new Date().toISOString(),state:state}; }
function exportJSON(){ download(APP_ID+'-'+stamp()+'.json',JSON.stringify(envelope(),null,2),'application/json;charset=utf-8'); toast('صُدّرت نسخة JSON'); }
function mdExport(){
  const lines=['# '+BOOK_TITLE,'','> bookId: '+APP_ID+' · edition: '+EDITION+' · تصدير: '+stamp(),''];
  BOOK.forEach(c=>{
    lines.push('## '+c.topic+' — '+c.sec+' · الموقع '+c.loc+' ('+c.page+')');
    lines.push('');
    lines.push(getText(c)); lines.push('');
    if((c.tags||[]).length) lines.push('الوسوم: '+c.tags.join('، '));
    const ben=String(state.benefits[c.id]||'').trim(); if(ben) lines.push('الفائدة: '+ben);
    (state.highs[c.id]||[]).forEach(h=>lines.push('تظليل: «'+h.text+'»'+(h.note?' — '+h.note:'')));
    lines.push('');

  return lines.join('\n');
}
function ankiExport(){
  let out='#separator:Tab\n#html:true\n#tags:Col3\n';
  BOOK.forEach(c=>{
    const ben=String(state.benefits[c.id]||'').trim();
    const hs=state.highs[c.id]||[];
    if(!ben&&!hs.length) return;
    const front='<b>'+esc(c.sec)+'</b><br>'+esc(firstLine(c).slice(0,180));
    const back=[ben?('<div>'+esc(ben).replace(/\n/g,'<br>')+'</div>'):'',...hs.map(h=>'<div>«'+esc(h.text)+'»'+(h.note?' — '+esc(h.note):'')+'</div>')].join('');

function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d&&d.bookId){
        if(d.bookId!==APP_ID){ toast('هذه النسخة من كتاب آخر — لم تُستورد'); return; }
        mergeUserData(d.state||{}); saveState(); renderRead(); toast('استُوردت النسخة بنجاح'); return;
      }
      if(confirm('ملف قديم بلا معرّف كتاب. هل تريد استيراده؟')){
        if(d.notes&&!d.benefits){d.benefits=d.notes;delete d.notes;}
        mergeUserData(d); saveState(); renderRead(); toast('استُوردت النسخة القديمة');
      }
    }catch(e){ toast('ملف JSON غير صالح'); }
  };
  r.readAsText(file);
}

/* tiny store-only ZIP writer for EPUB */
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;} return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc=new TextEncoder(); const parts=[],central=[]; let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array(30+name.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true); dv.setUint16(28,0,true); lh.set(name,30);
    parts.push(lh,data);
    const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true); ch.set(name,46); central.push(ch);
    offset+=lh.length+data.length;
  });
  const cdSize=central.reduce((a,b)=>a+b.length,0), eocd=new Uint8Array(22), ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  return new Blob([...parts,...central,eocd],{type:'application/epub+zip'});
}
function xesc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function exportEPUB(){
  const enc=new TextEncoder(), f=n=>({name:n,data:enc.encode('')});
  const files=[{name:'mimetype',data:enc.encode('application/epub+zip')}];
  files.push({name:'META-INF/container.xml',data:enc.encode('<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>')});
  const topics=[]; pages.forEach(p=>{ if(!topics.includes(p.topic)) topics.push(p.topic); });
  const chNames=topics.map((t,i)=>'ch'+(i+1)+'.xhtml');
  const manifest=topics.map((t,i)=>'<item id="ch'+(i+1)+'" href="'+chNames[i]+'" media-type="application/xhtml+xml"/>').join('');
  const opf='<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid" dir="rtl"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>'+xesc(BOOK_TITLE)+'</dc:title><dc:language>ar</dc:language><dc:identifier id="uid">urn:uuid:'+APP_ID+'</dc:identifier></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>'+manifest+'</manifest><spine>'+topics.map((t,i)=>'<itemref idref="ch'+(i+1)+'"/>').join('')+'</spine></package>';
  files.push({name:'OEBPS/content.opf',data:enc.encode(opf)});
  files.push({name:'OEBPS/nav.xhtml',data:enc.encode('<?xml version="1.0" encoding="UTF-8"?><html xmlns="http://www.w3.org/1999/xhtml" dir="rtl"><head><meta charset="utf-8"/></head><body><nav epub:type="toc" xmlns:epub="http://www.idpf.org/2007/ops"><ol>'+topics.map((t,i)=>'<li><a href="'+chNames[i]+'">'+xesc(t)+'</a></li>').join('')+'</ol></nav></body></html>')});
  files.push({name:'OEBPS/style.css',data:enc.encode('body{font-family:Amiri,serif;line-height:2;max-width:40em;margin:auto;padding:1em}h2{color:#8a5a2b}.v{background:#faf4e8;padding:.6em;border-radius:8px}.ben{background:#f8f2e7;padding:.4em;border-right:3px solid #8a5a2b}')});
  topics.forEach((t,i)=>{
    const cards=BOOK.filter(c=>c.topic===t);
    let body='<?xml version="1.0" encoding="UTF-8"?><html xmlns="http://www.w3.org/1999/xhtml" dir="rtl" lang="ar"><head><meta charset="utf-8"/><link rel="stylesheet" href="style.css"/><title>'+xesc(t)+'</title></head><body><h1>'+xesc(BOOK_TITLE)+'</h1><h2>'+xesc(t)+'</h2>';
    cards.forEach(c=>{
      body+='<div><p style="font-size:.8em;color:#6e6154">'+xesc(c.sec)+' · الموقع '+c.loc+'</p><div class="v">'+getText(c).split('\n').map(l=>'<p>'+xesc(l)+'</p>').join('')+'</div>';
      const ben=String(state.benefits[c.id]||'').trim(); if(ben) body+='<div class="ben">'+xesc(ben).replace(/\n/g,'<br/>')+'</div>';
      body+='</div>';
    });
    body+='</body></html>';
    files.push({name:'OEBPS/'+chNames[i],data:enc.encode(body)});
  });
  const blob=zipStore(files);
  const sig=new Uint8Array(await blob.slice(0,4).arrayBuffer());
  const eocd=new Uint8Array(await blob.slice(blob.size-22,blob.size).arrayBuffer());
  const entryCount=new DataView(eocd.buffer).getUint16(8,true);
  const ok=sig[0]===0x50&&sig[1]===0x4b&&sig[2]===0x03&&sig[3]===0x04&&entryCount===files.length;
  if(!ok){ toast('تعذر التحقق من ملف EPUB'); return; }
  download(APP_ID+'-'+stamp()+'.epub',blob,'application/epub+zip');
  toast('صُدّر EPUB — '+arNum(entryCount)+' ملفاً داخل الأرشيف');
}

/* ---------- gist sync (optional) ---------- */
async function gistSync(pull){
  const token=localStorage.getItem(TOKEN_KEY); if(!token) return;
  const headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
  try{
    let list=await fetch('https://api.github.com/gists?per_page=100',{headers}).then(r=>r.json());
    if(!Array.isArray(list)) return;
    let g=list.find(x=>x&&x.description&&x.description.indexOf('kashkol:'+APP_ID)===0);
    if(!g){
      g=await fetch('https://api.github.com/gists',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},headers),body:JSON.stringify({description:'kashkol:'+APP_ID+' — '+BOOK_TITLE,public:false,files:{'kashkol_state.json':{content:'{}'}}})}).then(r=>r.json());
    }
    const f=g.files&&g.files['kashkol_state.json'];
    if(pull&&f){
      const raw=await fetch(f.raw_url,{headers}).then(r=>r.text()); const d=JSON.parse(raw);
      if(d&&d.bookId===APP_ID) mergeUserData(d.state||{});
      saveState(); renderRead();
    }else if(!pull){
      await fetch('https://api.github.com/gists/'+g.id,{method:'PATCH',headers:Object.assign({'Content-Type':'application/json'},headers),body:JSON.stringify({files:{'kashkol_state.json':{content:JSON.stringify(envelope())}}})});
    }
  }catch(e){ console.warn('gist sync',e); }
}
document.addEventListener('visibilitychange',()=>{
  const token=localStorage.getItem(TOKEN_KEY); if(!token) return;
  if(document.visibilityState==='hidden') gistSync(false);
  else if(document.visibilityState==='visible') gistSync(true);
});

/* ---------- boot ---------- */
renderHistory(); renderRead(); renderSettings();
